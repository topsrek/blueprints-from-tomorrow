# Blueprints from Tomorrow – technology tree fragment: Warfare, security & deterrence.
# Schema: see the header of techtree/core.yaml.

technologies:

  # ------------------------------------------------------------ before gunpowder
  - id: close_order_infantry
    name: Disciplined close-order infantry (phalanx, legion)
    category: military
    requires: []
    helps: [bloomery_iron, standing_army_logistics]
    explain: >
      Men who keep rank and act on command beat a larger number of brave individuals,
      because each man is covered by his neighbours and the formation can be moved,
      relieved and rallied. This needs constant drill, a clear chain of small units
      with their own officers and standards (the Roman century and cohort), and a
      reserve line that is held back. In many accounts of ancient battles, the heaviest losses occurred after
      one side broke and ran, so cohesion matters more than weapons.
    pitfalls:
      - "Believing better weapons decide battles; drill, cohesion and reserves decided most of them"
      - A deep rigid phalanx is strong in front on level ground but helpless on broken ground or when taken in the flank
      - Expecting film-style duels; men in formation push, fence and rest, and the rout does the killing
      - Drill without pay, food and reliable officers does not last
    history:
      mesopotamia: "c. 2450 BC – Stele of the Vultures (Lagash) shows a shielded spear formation"
      greece: "7th c. BC – hoplite phalanx; c. 350 BC – Macedonian pike (sarissa) phalanx under Philip II"
      rome: "4th–3rd c. BC – manipular legion in three lines; c. 100 BC – cohort legion, the army of Caesar in 50 BC"
      china: "5th–3rd c. BC – Warring States mass infantry armies with crossbows; 210 BC – terracotta army shows Qin formations"
      africa: "c. 1816–1828 – Zulu regiments under Shaka, drilled close-combat formations"
      europe: "14th–15th c. – Swiss pike squares revive drilled infantry"
    sources:
      - "Polybius, Histories VI.19–42 and XVIII.28–32"
      - "Adrian Goldsworthy, The Complete Roman Army (2003)"
      - "John Keegan, The Face of Battle (1976)"

  - id: cavalry_chariot
    name: Horse warfare (chariot, cavalry, horse archers)
    category: military
    requires: []
    helps: [stirrup_saddle, spoked_wheel_suspension_carriage, selective_breeding]
    explain: >
      The horse gives speed for scouting, raiding, pursuit and a shock or missile
      strike on a flank. The light two-wheeled chariot with spoked wheels came first
      as a mobile platform for an archer; once horses were bred larger and men learned
      to ride and shoot, cavalry replaced it because a rider needs no vehicle, no
      level ground and half the horses. Horse archers who refuse close combat can
      destroy heavy infantry in open country (Carrhae, 53 BC), but cavalry cannot
      break steady infantry frontally and cannot take walls.
    pitfalls:
      - "The stirrup is not needed for shock cavalry; Macedonian, Parthian and Roman horsemen charged with lances from treed or horned saddles without it"
      - "The claim that the stirrup caused feudalism (Lynn White, 1962) is rejected by most historians"
      - Horses will not ride into a solid line of men with spears; charges succeed when the infantry flinches first
      - A horse eats about 10 kg of fodder a day, so cavalry armies are tied to grass and season
      - Scythed chariots were a spectacular failure against disciplined troops
    history:
      global: "c. 2000 BC – early spoked-wheel chariot burials on the Eurasian steppe (Sintashta, southern Urals)"
      mesopotamia: "c. 1800–1600 BC – chariot warfare in the Near East; 9th c. BC – Assyrian cavalry"
      egypt: "c. 1650–1550 BC – chariot arrives with the Hyksos; 1274 BC – Kadesh, a major chariot battle described in Egyptian royal inscriptions"
      india: "c. 1500 BC onwards – chariots in the Rigveda; war elephants and cavalry by the 4th c. BC"
      china: "c. 1200 BC – chariots at Anyang (Shang); 307 BC – King Wuling of Zhao adopts mounted archery and nomad dress"
      greece: "4th c. BC – Macedonian Companion cavalry as the decisive arm of Philip II and Alexander"
      rome: "1st c. BC – legions rely on Gallic, German and Numidian allied cavalry; 53 BC – Crassus destroyed by Parthian horse archers at Carrhae"
      americas: "1493 – Spanish expedition brings horses to Hispaniola; 1519 – Cortés brings horses to Mexico; 17th–18th c. – Plains peoples become horse nations"
      africa: "from c. 14th c. – cavalry states of the Sahel (Mali, Songhai, Bornu)"
    sources:
      - "David W. Anthony, The Horse, the Wheel, and Language (2007)"
      - "Robert Drews, Early Riders: The Beginnings of Mounted Warfare in Asia and Europe (2004)"
      - "Xenophon, On Horsemanship (c. 355 BC)"

  - id: crossbow_longbow
    name: Bows of war (composite bow, crossbow, longbow)
    category: military
    requires: []
    helps: [bloomery_iron, lost_wax_casting]
    explain: >
      A bow stores the archer's muscle work in bent limbs. The composite bow glues
      horn (resists compression) on the belly and sinew (resists stretching) on the
      back of a wooden core, giving a short, powerful bow for horsemen. The crossbow
      holds the drawn string on a trigger nut, so it can be spanned with both legs, a
      lever or a windlass, aimed at leisure and used after weeks of training, at the
      price of a slow rate of fire. The longbow is a simple yew stave as tall as the
      man with a draw weight of 45 kg and more; it shoots six or more arrows a minute
      but needs archers trained from boyhood.
    pitfalls:
      - "The longbow's secret is the archer, not the wood; without years of practice nobody can draw a war bow"
      - Composite bows come apart in damp climates because the glue softens
      - "The crossbow trigger is the hard part; the Chinese bronze lock needs precise casting"
      - Arrows rarely pierced good plate armour at Agincourt; mud, crowding and wounded horses did the work
      - The papal ban of 1139 did not stop anyone using crossbows
    history:
      mesopotamia: "c. 2250 BC – stele of Naram-Sin is often read as showing a composite bow (disputed); common in the 2nd millennium BC"
      egypt: "c. 1650–1550 BC – composite bow arrives with the Hyksos"
      china: "by 5th–4th c. BC – crossbow with bronze trigger lock in mass use; Han armies issue it as the standard weapon"
      greece: "c. 399 BC – belly bow (gastraphetes) at Syracuse, forerunner of the catapult"
      rome: "4th c. AD – hand crossbows (arcuballista) mentioned by Vegetius"
      europe: "c. 3300 BC – unfinished yew bow stave of the Iceman; 11th c. – crossbow widespread; 1139 – Second Lateran Council bans it against Christians; 1346 Crécy and 1415 Agincourt – English massed longbows"
      americas: "the bow spreads at different dates in Arctic, western and eastern North America; spear-throwers persist in some regions"
    sources:
      - "Matthew Strickland & Robert Hardy, The Great Warbow (2005)"
      - "Joseph Needham & Robin D. S. Yates, Science and Civilisation in China, vol. 5 part 6: Military Technology: Missiles and Sieges (1994)"

  - id: torsion_artillery_trebuchet
    name: Mechanical artillery (torsion catapult, trebuchet)
    category: military
    requires: []
    helps: [lever_mechanics_statics, crossbow_longbow, block_and_tackle]
    explain: >
      Greek and Roman catapults store energy in two tightly twisted bundles of sinew
      or hair rope, each with a wooden arm thrust through it; a slider, winch and
      trigger do the rest. All dimensions are multiples of the spring diameter, and
      Alexandrian engineers gave a formula for it from the weight of the shot. The
      trebuchet is simpler: a long beam on an axle with a sling on the long arm,
      pulled down on the short arm by a crew (traction) or by a box of several tonnes
      of earth or stone (counterweight). The counterweight machine throws 50 to 100 kg
      about 200 m and hits the same spot again and again, which is what breaks a wall.
    pitfalls:
      - "Drawing a medieval trebuchet for the Romans or a torsion catapult for the Middle Ages; the two belong to different eras"
      - "Leaving out the sling, which roughly doubles the range of a trebuchet"
      - Sinew springs go slack when wet and must be re-tensioned evenly on both sides
      - "Mechanical artillery kills defenders and smashes battlements; it rarely breaches a thick wall quickly"
      - A fixed counterweight without wheels or a hinged box wastes much of its energy
    history:
      greece: "399 BC – catapults developed at Syracuse for Dionysius I; c. 350 BC – torsion springs (Macedon); c. 270 BC – calibration formula worked out at Alexandria"
      rome: "1st c. BC – scorpions and ballistae standard in Caesar's legions; 4th c. AD – one-armed onager"
      china: "c. 4th c. BC – traction trebuchet described in the Mozi; 1272–1273 – counterweight trebuchets built by Muslim engineers break Xiangyang for the Mongols"
      islamic: "7th c. – traction trebuchets in the Arab conquests; c. 1187 – al-Tarsusi writes the first clear description of a counterweight trebuchet for Saladin"
      europe: "late 6th c. – traction trebuchet reaches the Mediterranean with the Avars; 12th c. – counterweight trebuchet, origin (Byzantine or Islamic) disputed; still in use beside bombards in the 15th c."
    sources:
      - "E. W. Marsden, Greek and Roman Artillery: Historical Development (1969)"
      - "Paul E. Chevedden, The Invention of the Counterweight Trebuchet: A Study in Cultural Diffusion, Dumbarton Oaks Papers 54 (2000)"
      - "Tracey Rihll, The Catapult: A History (2007)"

  - id: oared_galley_ram
    name: Oared war galley and ram tactics
    category: military
    requires: []
    helps: [copper_bronze]
    explain: >
      A long, light hull rowed by many men is independent of the wind and can ram or
      board. The trireme packs 170 oarsmen on three levels into a hull about 37 m
      long and drives a bronze-sheathed ram at the waterline of the enemy at 8 to 9
      knots. Such ships are built light, hauled ashore almost nightly to dry out and
      to feed and water the crew, and cannot stay at sea in bad weather. Rome won at
      sea by turning sea fights into infantry fights with boarding bridges and
      grapnels.
    pitfalls:
      - "Galley slaves chained to benches are a film image; ancient rowers were mostly free paid citizens or allies, and convict rowers belong to the 16th–18th c."
      - Galleys carry water for only a few days and need friendly beaches, so sustained blockades depend on bases and provisioning
      - Ramming needs highly trained crews; an untrained fleet should board instead
      - "The ram splits planking, it does not spear the ship; a rammed galley floats waterlogged rather than sinking"
    history:
      greece: "c. 700–650 BC – triremes at Corinth according to Thucydides (Phoenician priority possible); 480 BC – Salamis"
      rome: "260 BC – boarding bridge (corvus) at Mylae; 31 BC – Actium; 1st c. BC fleets mix heavy quinqueremes and light Liburnians"
      china: "2nd c. BC – Han tower ships (louchuan) for river and coastal war; 12th c. – Song paddle-wheel warships"
      islamic: "655 – Battle of the Masts, first major Arab fleet victory; 16th c. – Ottoman galley fleets"
      europe: "c. 1500 – heavy guns mounted in the bows of galleys; 1571 – Lepanto, a major battle of Mediterranean galley fleets"
    sources:
      - "J. S. Morrison, J. F. Coates & N. B. Rankov, The Athenian Trireme (2nd ed. 2000)"
      - "Lionel Casson, Ships and Seamanship in the Ancient World (1971)"
      - "John F. Guilmartin, Gunpowder and Galleys (1974)"

  - id: incendiaries_greek_fire
    name: Incendiary weapons and Greek fire
    category: military
    requires: []
    helps: [distillation, petroleum_refining, piston_pump]
    explain: >
      Byzantine Greek fire was a naval incendiary associated with the defence of
      Constantinople. Chroniclers describe burning liquid projected from ships and its
      frightening effect on crews. Earlier armies had used burning projectiles and
      vessels, and later Islamic and Chinese sources describe distinct incendiary
      traditions. The Byzantine fleet's advantage depended on trained crews,
      specialised ships and state supply. Petroleum is a plausible component, but the
      composition and equipment cannot be recovered with certainty from the texts.
    pitfalls:
      - Water spreads burning oil; sand, earth, vinegar-soaked hides and felt were the historical defences
      - "Greek fire was not gunpowder and contained no saltpetre as far as the evidence shows"
      - "The popular idea that it ignited on contact with water (quicklime) is not supported by the Byzantine sources"
      - A heated, pressurised vessel of petroleum on a wooden ship is as dangerous to the user as to the enemy
      - Treating a modern experimental reconstruction as a measurement of the historical weapon
    history:
      mesopotamia: "9th c. BC – Assyrian reliefs show fire arrows and torches against siege engines"
      greece: "424 BC – Boeotians use a bellows-driven flame tube against the wooden wall at Delium (Thucydides IV.100); c. 672–678 – Greek fire, credited to Kallinikos of Heliopolis, saves Constantinople"
      india: "c. 1st c. BC – 3rd c. AD – Arthashastra lists incendiary mixtures and fire arrows"
      china: "919 – petrol flame-thrower (fierce fire oil) recorded; 1044 – Wujing Zongyao describes its double-acting piston pump"
      islamic: "8th–9th c. – corps of naphtha throwers (naffatun) in Abbasid armies; 12th c. – naphtha grenades against the Crusaders"
    sources:
      - "J. R. Partington, A History of Greek Fire and Gunpowder (1960)"
      - "John Haldon, 'Greek Fire' Revisited: Recent and Current Research, in E. Jeffreys (ed.), Byzantine Style, Religion and Civilization (2006)"
      - "Adrienne Mayor, Greek Fire, Poison Arrows & Scorpion Bombs (2003)"

  - id: field_fortification
    name: Field fortification (marching camp, wagon fort, entrenchment)
    category: military
    requires: []
    helps: [surveying_triangulation, handguns_muskets]
    explain: >
      A ditch, the bank made from its spoil and a palisade or line of chained wagons
      turn open ground into a fortress within hours. It stops surprise, stops
      cavalry, gives missile troops time to shoot and gives a beaten army somewhere
      to rally. The Roman army dug a standard camp every night on the march, always
      to the same plan so that every man knew his place in the dark. Firearms made
      the method decisive: slow-loading gunners behind a ditch or wagons defeat
      charging cavalry and pikes.
    pitfalls:
      - "Treating digging as cowardice or as work for slaves; Roman legionaries dug their own camp daily"
      - An entrenched army can be starved or bypassed if it has no water, food and line of retreat
      - A wagon fort is helpless against field artillery, which ended the Hussite method
      - A ditch that cannot be swept by the defenders' own missiles is cover for the attacker
    history:
      rome: "by 2nd c. BC – daily marching camp described by Polybius; 52 BC – Caesar's double ring of 15 and 21 km at Alesia"
      china: "2nd–1st c. BC – Han frontier walls, watchtowers and fire signals; 16th c. – Qi Jiguang's war wagons against the Mongols"
      europe: "1420s – Hussite wagon forts (Jan Žižka) with handguns and light cannon; 1503 – Cerignola, arquebusiers behind a ditch defeat French cavalry and Swiss pikes"
      islamic: "1440s – Ottomans adopt the wagon fort (tabur cengi) from the Hungarians; used at Chaldiran 1514 and Mohács 1526"
      india: "1526 – Babur's carts and guns at Panipat on the Ottoman model"
      americas: "1864–1865 – trench lines at Petersburg foreshadow 1914–1918"
    sources:
      - "Polybius, Histories VI.27–42"
      - "Gábor Ágoston, Guns for the Sultan (2005)"
      - "Bert S. Hall, Weapons and Warfare in Renaissance Europe (1997)"

  # ------------------------------------------------------------ gunpowder age
  - id: gunpowder
    name: Gunpowder (black powder)
    category: military
    requires: [saltpetre_production]
    helps: []
    explain: >
      Black powder originated in China. Saltpetre acts as an oxidiser, allowing the
      fuel to burn rapidly even in confinement. Burning produces gases and solid
      residues, which account for both its propulsive effect and its conspicuous smoke.
      Chinese sources document incendiaries before bombs and guns. Later European
      powder mills developed corned powder, which was easier to transport consistently
      than loose meal powder. Access to saltpetre, skilled mill workers and reliable
      state supplies shaped the spread of firearms. Fire and explosion were persistent
      hazards throughout the industry.
    pitfalls:
      - "Taking one modern composition as typical of all historical powders. Early Chinese texts describe materials with different purposes."
      - "Treating corning as the invention of gunpowder. It altered the physical form of an existing material."
      - "Assuming a state that knew of gunpowder could supply it in quantity. Access to saltpetre, transport and specialised mills mattered."
      - "Believing that the Chinese used powder only for fireworks. Chinese armies employed incendiaries, bombs, rockets and guns."
    history:
      china: "c. 850 – Daoist text warns that saltpetre, sulphur and honey burn violently; 1044 – Wujing Zongyao gives the first written formulas (low-nitrate incendiaries); 13th c. – explosive high-nitrate powder and iron bombs"
      islamic: "c. 1240 – Ibn al-Baytar calls saltpetre 'snow of China'; c. 1280 – Hasan al-Rammah gives recipes and the purification of saltpetre with wood ash"
      india: "13th–14th c. – arrives, probably with the Mongols; widespread in the 15th c."
      east_asia: "1377 – Korean powder office founded on the initiative of Choe Mu-seon"
      europe: "c. 1267 – Roger Bacon describes firecrackers (the famous coded formula attributed to him is doubtful); c. 1300 – recipes in the Liber ignium; c. 1400–1430 – corned powder"
    sources:
      - "Joseph Needham et al., Science and Civilisation in China, vol. 5 part 7: Military Technology: The Gunpowder Epic (1986)"
      - "J. R. Partington, A History of Greek Fire and Gunpowder (1960)"
      - "Tonio Andrade, The Gunpowder Age (2016)"

  - id: cannon_artillery
    name: Cannon and artillery
    category: military
    requires: [gunpowder]
    helps: [copper_bronze, blast_furnace_cast_iron, boring_machine, lost_wax_casting, ballistics_gunnery]
    explain: >
      A strong tube closed at one end, a powder charge, a wad and a ball that fits
      the bore closely, fired through a small touch hole. Early bombards were built
      like barrels from wrought-iron staves and hoops and threw huge stone balls a
      few times a day. The decisive design, complete in France and Burgundy by the
      1490s, is a long bronze gun cast in one piece like a bell, firing cast-iron
      balls (three times as dense as stone, so a smaller, thicker-walled gun hits
      harder), with trunnions cast on its sides so that it pivots for elevation on a
      two-wheeled carriage drawn by horses. Such guns keep up with an army and open a
      medieval curtain wall in hours instead of weeks.
    pitfalls:
      - "Reloading without swabbing out smouldering remains with a wet sponge and stopping the vent; the new charge fires in the loader's face"
      - "Cast-iron guns burst without warning, bronze guns bulge first; early cast iron needs far thicker walls"
      - A ball that fits loosely wastes the gas and bounces down the bore; a ball that jams bursts the gun
      - "Forgetting the carriage, the draught animals and the powder supply, which are most of the system"
      - "Claiming cannon ended fortification; within fifty years the bastioned trace restored the advantage of the defence"
    history:
      china: "late 13th c. – Heilongjiang gun associated by context with events of 1287–88; the Xanadu gun bears a date equivalent to 1298; 14th c. – cast-iron cannon"
      europe: "1326 – first picture (Walter de Milemete) and first record (Florence orders cannon and iron balls); 15th c. – great bombards; 1450s–1470s – trunnions and wheeled carriages; 1494 – Charles VIII's train of about 40 mobile bronze siege guns in Italy; in 1490 Italian states still use slow stone-throwing bombards hauled by oxen"
      islamic: "1360s – Mamluk cannon securely attested (claims for 1260 are disputed); 1453 – Ottoman bombards breach the walls of Constantinople; 1683 – the Ottoman army before Vienna brings mostly light and medium guns and has to rely on mining"
      east_asia: "1370s – Korean cannon against pirates; 1592 – Korean naval guns defeat Japanese fleets"
      india: "15th c. – guns in the Deccan and Gujarat; 1526 – Babur's field guns at Panipat"
    sources:
      - "Bert S. Hall, Weapons and Warfare in Renaissance Europe (1997)"
      - "Carlo M. Cipolla, Guns and Sails in the Early Phase of European Expansion, 1400–1700 (1965)"
      - "Tonio Andrade, The Gunpowder Age (2016)"

  - id: ballistics_gunnery
    name: Ballistics and scientific gunnery
    category: military
    requires: [cannon_artillery]
    helps: [falling_bodies, trigonometry, laws_of_motion, calculus]
    explain: >
      A shot follows a curve set by its muzzle speed, the elevation of the barrel,
      gravity and air resistance. In a vacuum the path is a parabola with greatest
      range at 45 degrees, but at gun speeds air resistance is many times the weight
      of the ball, so real ranges are far shorter and the best elevation is lower.
      Robins measured muzzle speed by firing into a heavy pendulum and reading its
      swing, and showed that a spinning ball curves sideways. Practical gunnery needs
      a quadrant to set elevation, range tables made by trial for each gun and
      charge, and balls and charges of constant weight.
    pitfalls:
      - "Teaching the vacuum parabola as if it were true for guns; it overestimates range several times over"
      - "Tartaglia's and Aristotle's picture of a straight flight followed by a sudden drop is wrong"
      - Range tables are useless if powder strength and ball size vary from shot to shot
      - A smoothbore ball leaves the muzzle with random spin, so no theory makes it accurate at long range
    history:
      europe: "1537 – Tartaglia, Nova scientia, gunner's quadrant and the 45 degree rule; 1638 – Galileo's parabola; 1742 – Benjamin Robins, ballistic pendulum; 1745 – Euler's German edition with mathematical commentary; 1753 – Euler's equations for flight with air resistance"
      china: "1044 – Wujing Zongyao gives empirical ranges for trebuchets and crossbows; 17th c. – Jesuit-taught gunnery at the Ming and Qing courts"
      islamic: "16th c. – Ottoman gunners use quadrant and sight empirically"
    sources:
      - "Benjamin Robins, New Principles of Gunnery (1742)"
      - "A. R. Hall, Ballistics in the Seventeenth Century (1952)"
      - "Brett D. Steele, Muskets and Pendulums: Benjamin Robins, Leonhard Euler, and the Ballistics Revolution, Technology and Culture 35 (1994)"

  - id: handguns_muskets
    name: Handguns and muskets (matchlock, flintlock)
    category: military
    requires: [gunpowder]
    helps: [cannon_artillery, bloomery_iron, wire_drawing]
    explain: >
      A wrought-iron tube forged round a mandrel and welded along the seam, closed
      by a screwed breech plug, mounted on a wooden stock shaped to the shoulder. In
      the matchlock a pivoted arm lowers a smouldering cord, soaked in saltpetre,
      into a small pan of fine priming powder beside the touch hole when the trigger
      is squeezed, so the firer can keep both hands on the gun and his eye on the
      target. The flintlock replaces the match with a flint striking a hinged steel
      plate, which also uncovers the pan. A smoothbore musket hits a man reliably at
      50 to 80 m and fires two or three rounds a minute, so it works only in massed,
      drilled volleys.
    pitfalls:
      - "A lit match near loose powder; matchlock men blew themselves and their neighbours up regularly"
      - "Describing a flintlock as easy; its springs and hardened steel face need a skilled locksmith"
      - "Expecting accuracy from a smoothbore; early guns won because a recruit learns them in weeks and the ball pierces armour, not because they outshot the bow"
      - Rain and wind put out match and priming
      - A badly welded barrel splits at the seam
    history:
      china: "1132 – fire lances at the siege of De'an (a 10th c. painting from Dunhuang may show one); c. 1288 – metal hand cannon; 1548–1558 – matchlocks copied from Portuguese and Japanese models"
      europe: "14th c. – hand cannon on a pole; c. 1411 – first picture of a serpentine match holder; c. 1470s – matchlock arquebus with sprung lock and shoulder stock, the state of the art in 1490; c. 1500 – wheel lock; c. 1610 – true flintlock (Marin le Bourgeoys); by 1700 flintlock replaces matchlock; in 1683 most infantry still carry matchlocks"
      islamic: "mid 15th c. – Janissaries carry arquebuses; 16th c. – Ottoman gunsmiths spread the matchlock from Morocco to Sumatra"
      east_asia: "1543 – Portuguese matchlocks reach Tanegashima, Japan; mass production within a decade"
      india: "1526 – Babur's matchlock men at Panipat"
    sources:
      - "Bert S. Hall, Weapons and Warfare in Renaissance Europe (1997)"
      - "Kenneth Chase, Firearms: A Global History to 1700 (2003)"

  - id: pike_and_shot_drill
    name: Pike and shot, volley fire and drill
    category: military
    requires: [handguns_muskets]
    helps: [close_order_infantry, standing_army_logistics, printing_press]
    explain: >
      Slow-loading guns give continuous fire only if the men shoot by ranks in turn:
      the front rank fires and files to the rear to reload while the next steps up
      (the countermarch), which needs six to ten ranks and endless practice. Loading
      is broken into numbered motions done on a word of command, taught from
      illustrated manuals, in small companies with many officers. Pikemen stand
      beside the shot to keep cavalry off while they reload. Drill also turns
      recruits into a unit that obeys under fire, which matters as much as the fire
      itself.
    pitfalls:
      - "Crediting Maurice of Nassau with inventing volley fire; Chinese texts describe earlier rotating fire, while the precise drill used at Nagashino is disputed"
      - Volley fire without pikes, a ditch or wagons is ridden down by cavalry during reloading
      - Drill takes months and permanent paid units; it cannot be improvised with levies before a battle
      - "The story of three neat rotating ranks at Nagashino (1575) comes from later accounts and is doubted"
    history:
      china: "8th–11th c. – rotating crossbow volleys described in Tang and Song manuals; c. 1560 – Qi Jiguang describes arquebus volley drill"
      east_asia: "1575 – Nagashino, massed Japanese arquebus fire from behind palisades"
      islamic: "1526 – Janissary ranks fire in turn at Mohács according to some accounts; documented in the war of 1593–1606"
      europe: "1476–1477 – Swiss pikes destroy Burgundy; 1503 – Cerignola; 1530s – Spanish tercio; 1594 – William Louis of Nassau proposes the countermarch to Maurice from Roman models; 1607 – Jacob de Gheyn's illustrated drill book; 1630s – Gustavus Adolphus; 1683 – imperial infantry before Vienna still mixes pikes and matchlocks"
    sources:
      - "Geoffrey Parker, The Military Revolution (1988)"
      - "Jacob de Gheyn, Wapenhandelinghe van Roers, Musquetten ende Spiessen (1607)"
      - "Tonio Andrade, The Gunpowder Age (2016)"

  - id: socket_bayonet
    name: Socket bayonet
    category: military
    requires: [handguns_muskets]
    helps: [pike_and_shot_drill]
    explain: >
      A blade on a sleeve that slips over the muzzle and locks on a stud, with the
      blade offset to one side so the musket can still be loaded and fired. Every
      musketeer becomes his own pikeman, the pike disappears, and the whole infantry
      can both fire and stand against cavalry in thin lines of three or four ranks.
      The earlier plug bayonet, jammed into the muzzle, stopped the gun firing.
    pitfalls:
      - "Describing the plug type, which blocks the barrel at the moment the enemy charges"
      - Barrels and sockets must be made to one size or the bayonets do not fit
      - "Thinking bayonets did much killing; their effect was that one side ran before contact"
    history:
      europe: "1640s – plug bayonets in French service (name from Bayonne); 1671 – issued to French fusiliers; 1683 – not yet general, pikes still in use at Vienna; 1687–1689 – Vauban presses for the socket bayonet and France adopts it; 1689 – Killiecrankie, troops with plug bayonets overrun; c. 1700–1705 – pikes abolished in western armies"
      china: "17th c. – plug bayonets appear in late Ming military manuals"
    sources:
      - "David Chandler, The Art of Warfare in the Age of Marlborough (1976)"
      - "John A. Lynn, Giant of the Grand Siècle: The French Army 1610–1715 (1997)"

  - id: bastion_fortification
    name: Bastioned fortification (trace italienne)
    category: military
    requires: [cannon_artillery]
    helps: [geometry_proof, surveying_triangulation, perspective_technical_drawing, field_fortification]
    explain: >
      High thin medieval walls are easy targets for cannon. The answer is a low,
      very thick rampart of rammed earth faced with brick or stone, sunk behind a
      wide ditch so that only its top shows above a long gentle outer slope (glacis).
      At every corner an arrow-shaped bastion projects, with guns in its flanks that
      fire along the ditch and along the faces of the neighbouring bastions. The
      plan is drawn so that no foot of wall is unseen by a flanking gun: there is no
      dead ground. An attacker can no longer storm a breach quickly and must dig his
      way forward for weeks.
    pitfalls:
      - "Round towers leave dead ground at their foot where miners can work unseen; the bastion's straight faces remove it"
      - Building high to look strong; height is what cannon destroy
      - "Earth absorbs shot, masonry shatters; an earth rampart thrown up in weeks is better than a stone wall"
      - "The system costs fortunes and needs a large garrison and many guns; several Italian states ruined themselves on it (Siena, 1550s)"
      - A fortress only delays; without a relief army it falls in the end
    history:
      europe: "c. 1450 – Alberti recommends angled, saw-toothed walls; 1480s – Francesco di Giorgio's and Giuliano da Sangallo's experiments (Poggio Imperiale begun 1488), so in 1490 the idea exists but almost every town still has medieval walls; 1501–1503 – Nettuno; 1515 – Civitavecchia; 1530s – Sanmicheli at Verona; 1530s–1560s – Vienna refortified with bastions after the siege of 1529; 1667–1707 – Vauban"
      islamic: "16th–17th c. – Ottomans besiege bastioned fortresses (Malta 1565, Candia 1648–1669, Vienna 1683) but build few themselves"
      india: "16th c. – Portuguese bastioned forts at Diu and Goa"
      china: "ancient to Ming – rammed-earth city walls 10 to 20 m thick were already largely cannon-proof, which may explain the slower development of siege guns there (Andrade)"
      east_asia: "1864 – the magistrate's office moves into Goryokaku, the star fort at Hakodate, Japan"
      americas: "1672–1695 – Castillo de San Marcos, Florida"
    sources:
      - "Christopher Duffy, Siege Warfare: The Fortress in the Early Modern World 1494–1660 (1979)"
      - "Geoffrey Parker, The Military Revolution (1988)"
      - "J. R. Hale, The Early Development of the Bastion: An Italian Chronology c. 1450–c. 1534, in Europe in the Late Middle Ages (1965)"

  - id: siegecraft_mining
    name: Siegecraft, mining and counter-mining
    category: military
    requires: []
    helps: [gunpowder, surveying_triangulation, torsion_artillery_trebuchet, cannon_artillery, coal_mining]
    explain: >
      A siege is methodical work: cut the place off with a ring of entrenchments,
      push covered approaches forward, and open the wall by ram, battery or mine. The
      classical mine is a timbered gallery dug under the foundation; the props are
      burnt and the wall falls. With gunpowder, a sealed chamber under the wall is
      packed with barrels and the gallery behind it blocked solid so that the blast
      goes upwards. The defender listens (a drum with dried peas or a bowl of water
      shows the vibration of digging), digs counter-galleries to break in, and
      fights, floods or smokes the miners out. Against bastions the attacker
      zigzags trenches forward so that they cannot be raked, joined by parallel
      trenches that hold troops and batteries (Vauban).
    pitfalls:
      - "A gallery driven straight at the wall without survey ends short or in the ditch; direction and distance must be measured"
      - "A powder chamber that is not tamped blows back down the gallery and kills the miners"
      - Mines flood below the water table and suffocate their diggers without ventilation
      - "Forgetting the outer line against a relief army; the Ottomans at Vienna in 1683 did not fortify their rear and were routed"
      - "Time decides: disease, hunger and the season usually threaten the besieger as much as the besieged"
    history:
      mesopotamia: "9th–7th c. BC – Assyrian reliefs show rams, ramps, sappers and scaling (Lachish 701 BC)"
      china: "c. 4th c. BC – Mozi's siege chapters describe counter-mines, listening jars sunk in wells and bellows pumping smoke into enemy tunnels"
      greece: "c. 350 BC – Aeneas Tacticus on detecting mines with a bronze shield; 305 BC – siege of Rhodes"
      rome: "52 BC – Caesar's ramp at Avaricum and circumvallation at Alesia; 49 BC – mines and counter-mines at Massilia; AD 256 – mine and counter-mine preserved at Dura-Europos"
      europe: "1487 – gunpowder mine tried at Sarzanello with little effect; 1495 – mine at Castel Nuovo, Naples (Francesco di Giorgio), often called the first effective one; 1503 – Pedro Navarro at Castel dell'Ovo; 1673 – Vauban's parallels at Maastricht"
      islamic: "1453 – Ottoman mines at Constantinople defeated by counter-mines; 1648–1669 – Candia, the school of Ottoman miners; 1683 – Vienna, 14 July to 12 September, mines wreck the ravelin and the Burg and Löbel bastions while the garrison counter-mines until the relief army arrives"
      india: "1567–1568 – Akbar's covered approaches and powder mines at Chittor"
    sources:
      - "Christopher Duffy, Siege Warfare: The Fortress in the Early Modern World 1494–1660 (1979)"
      - "John Stoye, The Siege of Vienna (1964)"
      - "Caesar, De bello Gallico VII"

  - id: naval_gunnery_line_of_battle
    name: Broadside gunnery and the line of battle
    category: military
    requires: [cannon_artillery]
    helps: [ship_design_caravel_carrack, blast_furnace_cast_iron, ballistics_gunnery]
    explain: >
      Heavy guns on wheeled truck carriages stand on the lower decks of a strong
      sailing ship and fire through hinged ports cut in the side, low down so the
      ship stays stable. Because nearly all the guns point sideways, a fleet fights
      in a single line ahead, each ship following the next, so that every broadside
      bears and no ship masks another. This turns the ship from a platform for
      boarders into a floating battery and lets a few hundred men defeat much larger
      forces on galleys or junks, which is what carried European power overseas.
    pitfalls:
      - "Gunports close to the waterline left open in a turn; the Mary Rose (1545) and Vasa (1628) sank that way"
      - Heavy guns high up capsize the ship
      - "The rigid line avoids defeat but rarely gives decisive victory; that needed breaking the enemy's line (1782, 1805)"
      - Guns are useless without trained crews and standard shot that fits
    history:
      europe: "c. 1500 – lidded gunports (the usual credit to Descharges of Brest, 1501, is unverified); 1502 – Portuguese squadron fights in line off Malabar; 1588 – Armada campaign fought with guns, not boarding; 1653 – English Fighting Instructions order the line ahead; 1805 – Trafalgar"
      east_asia: "1592 – Yi Sun-sin's cannon-armed Korean fleet defeats Japanese boarding tactics"
      china: "1520s – Ming copy Portuguese breech-loading ship guns (folangji)"
      islamic: "1571 – Lepanto, galleys with bow guns; 17th c. – Ottomans build sailing warships"
      india: "1509 – Diu, Portuguese gunned ships defeat a Mamluk-Gujarati fleet"
    sources:
      - "N. A. M. Rodger, The Command of the Ocean: A Naval History of Britain 1649–1815 (2004)"
      - "Carlo M. Cipolla, Guns and Sails in the Early Phase of European Expansion, 1400–1700 (1965)"
      - "John F. Guilmartin, Gunpowder and Galleys (1974)"

  - id: war_rockets
    name: War rockets
    category: military
    requires: [gunpowder]
    helps: [bloomery_iron, laws_of_motion]
    explain: >
      A rocket carries its own source of propulsion and gains momentum as gas escapes
      backwards. Chinese texts use the expression 'fire arrow' for more than one kind of
      projectile, making claims about the first rocket difficult to date. Iron-cased
      rockets became a distinctive feature of Mysore's forces under Haidar Ali and Tipu
      Sultan. British encounters with them helped inspire William Congreve's programme.
      Early military rockets were conspicuous and difficult to aim consistently. Their
      historical significance lies as much in the transmission of technology from South
      Asia to Europe as in their battlefield effects.
    pitfalls:
      - "Counting every reference to a fire arrow as evidence of a self-propelled rocket."
      - "Attributing the military rocket to Congreve without accounting for earlier Chinese, Korean and Mysorean examples."
      - "Treating spectacular contemporary accounts as measured evidence of accuracy or effectiveness."
    history:
      china: "13th c. – rockets certain (earlier 'fire arrows' from the 10th c. were mostly incendiary arrows shot from bows; the date of the first true rocket is disputed); 14th c. – multiple launchers in the Huolongjing"
      islamic: "c. 1280 – Hasan al-Rammah describes rockets as 'Chinese arrows'"
      east_asia: "1448–1451 – Korean singijeon rockets and the hwacha multiple launcher"
      india: "1780–1799 – iron-cased Mysore rockets of Haidar Ali and Tipu Sultan"
      europe: "1380 – rockets reported at Chioggia; 1405 – Kyeser's Bellifortis; 1805–1807 – Congreve rockets copied from Mysore, used at Boulogne and Copenhagen; 1844 – Hale's spin-stabilised rocket"
    sources:
      - "Joseph Needham et al., Science and Civilisation in China, vol. 5 part 7: Military Technology: The Gunpowder Epic (1986)"
      - "Frank H. Winter, The First Golden Age of Rocketry (1990)"
      - "Roddam Narasimha, Rockets in Mysore and Britain, 1750–1850 A.D. (Bangalore lecture, 2 April 1985)"

  # ------------------------------------------------------------ armies and their upkeep
  - id: standing_army_logistics
    name: Standing army, pay and supply
    category: military
    requires: []
    helps: [coinage, public_debt_bonds, census_vital_registration, paved_roads_macadam, canning]
    explain: >
      A permanent, regularly paid force that the state feeds, clothes and arms obeys
      in peace and war and can be drilled; an army that lives by plunder dissolves or
      turns on its employer. The arithmetic rules everything: a man needs about 1 kg
      of bread or grain a day, a horse about 10 kg of fodder, a wagon team eats its
      own load in a few weeks, so an army beyond a few days from a river, a port or
      stocked magazines must keep moving to fresh country or starve. Regular taxes,
      muster rolls that are actually checked, and depots laid out before the campaign
      are the invention, more than any weapon.
    pitfalls:
      - "Planning marches without counting fodder; animals, not men, are the larger part of the supply problem"
      - "Unpaid troops mutiny or sack friendly towns (Rome 1527, Antwerp 1576)"
      - Muster rolls padded with dead or invented men unless inspected by someone who does not profit
      - A standing army is also a danger to the government that keeps it
      - "Thinking armies could be supplied from home over long distances by cart before railways; water transport was the only bulk carrier"
    history:
      mesopotamia: "c. 745 BC – Tiglath-Pileser III of Assyria creates a permanent royal army"
      china: "3rd c. BC – Qin and Han state arsenals, granaries and frontier garrisons"
      india: "c. 300 BC – Mauryan standing army with a war office described by Megasthenes"
      rome: "107 BC – Marius enrols the propertyless (the scale of his 'reforms' is now disputed); 1st c. BC – long-service legions loyal to their generals; AD 6 – Augustus funds discharge pay from a military treasury"
      islamic: "14th c. – Ottoman Janissaries, paid standing infantry, with a road and depot system that carried the army to Vienna in 1683"
      europe: "1445 – French compagnies d'ordonnance; 1490 – Italian states still hire condottieri by contract; 1660s – magazines and intendants under Le Tellier and Louvois"
      americas: "15th c. – Inca storehouses (qollqa) and roads supply armies on the march"
    sources:
      - "Martin van Creveld, Supplying War: Logistics from Wallenstein to Patton (1977)"
      - "Donald W. Engels, Alexander the Great and the Logistics of the Macedonian Army (1978)"
      - "Jonathan P. Roth, The Logistics of the Roman Army at War (1999)"

  - id: mercenaries_citizen_militia
    name: Mercenaries, militias and the loyalty of armed men
    category: military
    requires: []
    helps: [standing_army_logistics, conscription_mass_army, banking_credit]
    explain: >
      Whoever pays and commands the soldiers holds the state. Hired captains
      (in Italy the condottieri, who served under a written contract, the condotta)
      are skilled but serve for pay: they prolong wars, change sides, and can seize
      power, as Francesco Sforza did in Milan in 1450. Citizen militias are loyal
      but, without training and experienced officers, are beaten by professionals.
      The lasting solution is a force raised from the ruler's own subjects, trained
      and paid by the state, with officers appointed and promoted by the state and
      not owning their units.
    pitfalls:
      - "Repeating Machiavelli's claim that condottieri fought bloodless sham battles; Mallett showed their wars were real and their skill high"
      - "Machiavelli's own militia ran at Prato in 1512; enthusiasm does not replace training"
      - Late-paid mercenaries are more dangerous than the enemy
      - "Late republican Rome shows the same problem with citizens: soldiers who expect land from their general follow him against the state"
    history:
      greece: "401 BC – the Ten Thousand, Greek mercenaries in Persian service (Xenophon)"
      africa: "241–238 BC – Carthage nearly destroyed by its own unpaid mercenaries"
      rome: "88 BC – Sulla marches on Rome; 49 BC – Caesar crosses the Rubicon with an army loyal to him personally"
      islamic: "9th c. – Abbasid slave soldiers (mamluks); 1250 – Mamluks take power in Egypt"
      china: "755 – An Lushan, frontier general of a professional army, rebels against the Tang"
      europe: "14th–15th c. – condottieri in Italy; 1506 – Machiavelli's Florentine militia; 1527 – unpaid imperial troops sack Rome; 1620s–1630s – Wallenstein, the greatest military contractor"
    sources:
      - "Niccolò Machiavelli, Il Principe, chapters 12–13 (written 1513, printed 1532)"
      - "Michael Mallett, Mercenaries and Their Masters: Warfare in Renaissance Italy (1974)"
      - "David Parrott, The Business of War (2012)"

  - id: conscription_mass_army
    name: Conscription and the mass army
    category: military
    requires: []
    helps: [census_vital_registration, standing_army_logistics, railway, universal_schooling]
    explain: >
      Every fit man owes military service for a fixed term, is trained in peacetime
      and then passes to a reserve that can be called up. This gives armies of
      hundreds of thousands at low cost and ties the population to the state. It
      needs a register of who exists, a way to feed, arm and officer the numbers, and
      a population that accepts the duty, which usually means that service brings
      rights, land or citizenship. The reserve system matters most: a short-service
      army with trained reserves outnumbers a long-service professional army several
      times on mobilisation.
    pitfalls:
      - "Raising numbers that cannot be fed, armed or led; untrained masses are slaughtered"
      - "Substitutes and exemptions for the rich destroy acceptance"
      - Conscripts desert in thousands when forced to serve far from home without pay
      - "Believing the French levy of 1793 was the first; Qin and Han China and republican Rome ran universal levies two thousand years earlier"
    history:
      china: "4th–3rd c. BC – universal male service in Qin after Shang Yang's reforms, continued under the Western Han"
      rome: "by 3rd c. BC – annual levy (dilectus) of propertied citizens described by Polybius; by 50 BC legally in force but largely replaced by volunteers"
      americas: "15th c. – Inca rotational labour service (mit'a) includes army duty"
      islamic: "1820s – Muhammad Ali conscripts Egyptian peasants"
      europe: "1620s – Swedish allotment levy; 1733 – Prussian canton system; 1793 – French levée en masse; 1798 – Jourdan law; 1814 – Prussian universal service with reserves"
      east_asia: "1873 – Japanese conscription law"
    sources:
      - "Polybius, Histories VI.19–26"
      - "William H. McNeill, The Pursuit of Power (1982)"
      - "Alan Forrest, Conscripts and Deserters: The Army and French Society during the Revolution and Empire (1989)"

  - id: military_camp_hygiene
    name: Camp hygiene and army health
    category: military
    requires: []
    helps: [sanitation_sewerage, boiled_water, typhus_lice, contagion_theory, scurvy_citrus, quarantine]
    explain: >
      In many pre-industrial campaigns disease killed more soldiers than combat, above all dysentery, typhoid and typhus, and above all in sieges and
      standing camps. Dig latrines downhill and downstream, well away from the water
      point and the kitchens, and cover the waste with earth daily; draw drinking
      water upstream and boil it; move camp before the ground is fouled; keep men,
      clothes and bedding clean and free of lice; separate the sick; do not camp
      beside marshes.
    pitfalls:
      - "Blaming smell alone; a camp can smell clean and still drink its own sewage"
      - Staying on one site for weeks, as besiegers must, without moving the latrines
      - Crowding the sick together with the healthy in tents and transports
      - "Thinking wounds were the main risk; disease mortality could exceed combat mortality, and the proportions varied by campaign"
    history:
      global: "ancient Levant – Deuteronomy 23:12–14 orders latrines outside the camp and burial of excrement"
      india: "c. 1st c. BC – 3rd c. AD – Arthashastra places physicians with instruments and medicines behind the battle line"
      rome: "1st c. BC onwards – planned camps with latrines, drains and later hospitals (valetudinaria); c. AD 400 – Vegetius III.2 on water, camp sites and moving camp"
      islamic: "1683 – dysentery in the crowded Ottoman camp and in besieged Vienna alike"
      europe: "1752 – John Pringle, Observations on the Diseases of the Army; 1850s – Crimean War sanitary reforms"
      east_asia: "1904–1905 – Japanese army in the Russo-Japanese War cited as an early case of fewer deaths from disease than from battle"
    sources:
      - "Vegetius, Epitoma rei militaris III.2"
      - "John Pringle, Observations on the Diseases of the Army (1752)"
      - "Hans Zinsser, Rats, Lice and History (1935)"

  - id: military_engineering_roads_bridges
    name: Military engineering (roads, bridges, pioneers)
    category: military
    requires: []
    helps: [surveying_triangulation, paved_roads_macadam, arch_bridge_truss, block_and_tackle, hydraulic_cement]
    explain: >
      An army moves only as fast as its roads and river crossings allow, so a corps
      of trained builders with tools belongs to it. Core techniques: an all-weather
      road on a drained, cambered bed of graded stone; a bridge of boats anchored
      upstream, decked with planks; a trestle bridge on piles driven by a drop
      weight from a raft, braced against the current. Caesar bridged the Rhine,
      some 400 m wide, in ten days. Roads and bridges built for the army then serve
      trade and government.
    pitfalls:
      - "A road without drainage is destroyed by one wet season; the ditches and the camber matter more than the paving"
      - Pile bridges without upstream fenders are broken by floating timber, which the enemy will send down
      - "Roman roads were built for marching men and pack animals; their gradients are often too steep for heavy wagons"
      - A bridge is a bottleneck and a hostage; it must be guarded at both ends
    history:
      mesopotamia: "c. 500 BC – Persian Royal Road from Susa to Sardis with relay stations"
      greece: "480 BC – Xerxes' two boat bridges over the Hellespont (Herodotus VII.36)"
      rome: "312 BC – Via Appia; 55 BC – Caesar's Rhine bridge; AD 105 – Apollodorus' bridge over the Danube for Trajan"
      china: "c. 212 BC – Qin 'straight road' to the northern frontier; 214 BC – Lingqu canal built to supply an army"
      americas: "15th c. – Inca road system of some 40,000 km with rope suspension bridges"
      islamic: "1566 – Suleiman's timber bridge of about 8 km across the Drava marshes at Osijek, used again by the army marching on Vienna in 1683"
      europe: "1690s – Vauban forms a corps of engineers in France; 1748 – engineering school at Mézières"
    sources:
      - "Caesar, De bello Gallico IV.17–18"
      - "J. G. Landels, Engineering in the Ancient World (1978)"
      - "John Hyslop, The Inka Road System (1984)"

  - id: strategy_theory
    name: Strategy as a subject of study
    category: military
    requires: []
    helps: [alphabet_writing, printing_press, game_theory]
    explain: >
      War is a tool of policy and not an end: the aim is a better peace, and force
      must be measured against that aim (Clausewitz). The best victory breaks the
      enemy's plan or alliances without battle; know the enemy and yourself; strike
      where he is unprepared (Sun Tzu). Real war is ruled by friction, chance and
      fear, so simple plans and reserves beat clever ones; the defence is the
      stronger form of war; every offensive weakens as it advances and has a
      culminating point. These ideas can be taught from recorded cases, and states
      that study past wars systematically make fewer of the old mistakes.
    pitfalls:
      - "Quoting Sun Tzu's maxims as recipes; they are reminders, and the opponent has read them too"
      - "Reading Clausewitz as a prophet of total war; his point is that politics limits and directs war"
      - Confusing tactics (winning the fight) with strategy (using fights for the purpose of the war)
      - Planning on what the enemy will probably do instead of what he can do
    history:
      china: "c. 5th–4th c. BC – Sunzi bingfa (author and date debated; text known from a tomb copy of c. 140–118 BC); 1080 – Seven Military Classics made the examination canon"
      india: "c. 1st c. BC – 3rd c. AD – Arthashastra, books 9–13 on campaigns (traditionally ascribed to Kautilya, c. 300 BC)"
      greece: "c. 400 BC – Thucydides analyses strategy and policy; c. 350 BC – Aeneas Tacticus, the oldest surviving Greek military manual"
      rome: "c. AD 84–96 – Frontinus, Stratagems; c. AD 400 – Vegetius, the most read military book of medieval and Renaissance Europe"
      islamic: "14th c. – Mamluk furusiyya manuals"
      europe: "c. 600 – Byzantine Strategikon attributed to Maurice; 1521 – Machiavelli, Arte della guerra; 1832 – Clausewitz, Vom Kriege; 1838 – Jomini; 1890 – Mahan on sea power"
    sources:
      - "Sun Tzu, The Art of War (tr. Samuel B. Griffith, 1963)"
      - "Carl von Clausewitz, On War (1832; tr. Michael Howard & Peter Paret, 1976)"
      - "Lawrence Freedman, Strategy: A History (2013)"

  - id: general_staff_war_college
    name: General staff and war college
    category: military
    requires: [standing_army_logistics]
    helps: [strategy_theory, railway, electric_telegraph, map_projection_charts, wargaming_operations_research]
    explain: >
      A permanent body of specially selected and schooled officers that, in
      peacetime, maps the theatres of war, studies past campaigns, prepares
      mobilisation and transport plans and tests them in map exercises and staff
      rides. In war each commander gets a trained chief of staff who shares his
      responsibility, so that the army does not depend on one genius. Orders state
      the aim and leave the method to the man on the spot. Selection is by
      examination, not birth, and honest criticism after every exercise and war is
      a duty.
    pitfalls:
      - "A staff is not the commander's clerks and couriers; its core is planning and independent judgement"
      - "Plans do not survive contact with the enemy (Moltke); the staff's product is officers who can improvise to a common doctrine"
      - "A staff that answers to no civilian authority makes policy by its plans, as the German mobilisation schedule did in 1914"
      - Promotion by seniority or purchase defeats the purpose
    history:
      china: "702 – Tang military examinations; 1080 – Song military academy curriculum fixed on the Seven Military Classics"
      europe: "1796 – Berthier's staff for Napoleon; 1807–1814 – Scharnhorst and Gneisenau create the Prussian General Staff; 1810 – Berlin war school (later Kriegsakademie); 1857–1888 – Moltke, railway mobilisation, victories of 1866 and 1870"
      east_asia: "1878 – Japanese general staff on the Prussian model"
      americas: "1884 – US Naval War College; 1903 – US Army general staff"
    sources:
      - "Walter Goerlitz, History of the German General Staff 1657–1945 (1953)"
      - "Trevor N. Dupuy, A Genius for War: The German Army and General Staff 1807–1945 (1977)"

  - id: wargaming_operations_research
    name: War games and operations research
    category: military
    requires: []
    helps: [probability_statistics, general_staff_war_college, map_projection_charts, game_theory]
    explain: >
      Two methods to test decisions without paying in lives. In a war game two teams
      move units on a true map under an umpire who uses tables from real experience
      and dice for chance, so plans meet a thinking opponent and time and space are
      honest. Operations research treats operations as an experiment: count what
      actually happened and work out the best use of what you have. Example: British
      analysts found in 1942–1943 that convoy losses depended on the number of
      attackers and escorts and hardly on convoy size, so fewer, larger convoys lost
      a smaller share of ships.
    pitfalls:
      - "Umpires who let the home side win; the Japanese re-floated their sunk carriers in the war game before Midway"
      - "Survivorship bias: armour belongs where the returning bombers show no holes (Wald), because those hit there did not come back"
      - Measuring what is easy to count instead of what decides the outcome
      - A model is only as good as the data from real operations fed into it
    history:
      india: "c. 6th c. AD – chaturanga, a board game of the four arms of an army, ancestor of chess"
      china: "ancient – weiqi (go) used as a metaphor and training of strategic thought"
      europe: "1824 – Reisswitz's Kriegsspiel adopted by the Prussian army; 1916 – Lanchester's equations of combat; 1940–1943 – Blackett's groups apply operational research to radar, anti-submarine war and convoys"
      americas: "1942 – US Navy anti-submarine operations research group (Morse); 1943 – Abraham Wald's survivability studies"
    sources:
      - "Philip M. Morse & George E. Kimball, Methods of Operations Research (1951)"
      - "Stephen Budiansky, Blackett's War (2013)"
      - "Peter P. Perla, The Art of Wargaming (1990)"

  - id: military_intelligence_codebreaking
    name: Military intelligence and codebreaking
    category: military
    requires: []
    helps: [cryptography, probability_statistics, electromagnetic_waves_radio, programmable_computer]
    explain: >
      Decisions should rest on organised knowledge of the enemy: scouts, prisoners,
      deserters, merchants, paid agents and intercepted letters, collected by a
      permanent office, compared with each other and reported honestly to the
      commander. Simple substitution ciphers are broken by counting letter
      frequencies, so any long message in such a cipher must be assumed read. One's
      own messages need a better cipher and frequent changes of key. A broken enemy
      cipher is worth more than an army only while the enemy does not know, so the
      results must be used sparingly and with a cover story.
    pitfalls:
      - "Telling the ruler what he wants to hear; most intelligence failures are failures of judgement, not of collection"
      - "Acting on decrypts so openly that the enemy changes his cipher"
      - "Trusting one's own cipher because it looks complicated (German confidence in Enigma)"
      - "Crediting Turing alone with Enigma; Polish mathematicians first broke it in 1932 and handed over their methods in 1939"
      - A single agent's report is a rumour until confirmed from an independent source
    history:
      china: "c. 5th–4th c. BC – Sun Tzu, chapter 13, five kinds of spies"
      india: "c. 1st c. BC – 3rd c. AD – Arthashastra describes a state network of stationary and roving agents"
      greece: "5th c. BC – Spartan scytale (whether it was a cipher device is disputed)"
      rome: "1st c. BC – Caesar's shift cipher (Suetonius, Julius 56) and his systematic use of scouts and exploratores"
      islamic: "9th c. – al-Kindi describes frequency analysis; 1683 – both sides at Vienna use couriers and spies through the lines (the messenger Kolschitzky)"
      europe: "c. 1467 – Alberti's cipher disc; 1506 – Venice appoints Giovanni Soro cipher secretary; 17th–18th c. – black chambers in Paris, London and Vienna; 1917 – Zimmermann telegram; 1932 – Rejewski breaks Enigma; 1939–1945 – Bletchley Park"
      americas: "1940 – US breaks the Japanese Purple cipher; 1942 – naval decrypts help the US fleet anticipate the Japanese attack at Midway"
    sources:
      - "David Kahn, The Codebreakers (1967)"
      - "Christopher Andrew, The Secret World: A History of Intelligence (2018)"
      - "Sun Tzu, The Art of War, chapter 13 (tr. Samuel B. Griffith, 1963)"

  # ------------------------------------------------------------ industrial warfare
  - id: rifling_minie_breechloader
    name: Rifled firearms (rifling, Minié ball, breech-loader)
    category: military
    requires: [handguns_muskets]
    helps: [lathe_screw_cutting, interchangeable_parts, ballistics_gunnery]
    explain: >
      Spiral grooves cut inside the barrel grip the bullet and spin it, and a
      spinning bullet flies point-first without swerving, so accuracy rises from
      about 80 m to several hundred. The old difficulty was loading: a bullet tight
      enough to take the grooves had to be hammered down the muzzle. The Minié
      bullet is a pointed lead cylinder with a hollow base, dropped in loose and
      swelled into the grooves by the gas. Loading at the breech with a cartridge
      that carries bullet, powder and primer together then lets a man fire lying
      down, several times faster.
    pitfalls:
      - "Thinking the spin adds force; it only stabilises"
      - "A breech that leaks hot gas into the firer's face; the seal was solved by the expanding brass cartridge case"
      - Black powder fouling clogs grooves within a few dozen shots
      - "A slow rifle bullet drops steeply, so range must be judged well; much of the theoretical gain was lost in battle"
      - Cutting uniform grooves needs a rifling bench with a guide; it cannot be filed by hand
    history:
      europe: "c. 1500 – rifled barrels in south Germany and Austria (the names and dates usually given for an inventor are legend); 18th c. – hunting and Jäger rifles; 1742 – Robins explains why spin steadies the ball; 1777 – Ferguson breech-loading rifles in British service; 1841 – Prussia adopts the Dreyse needle gun; 1849 – Minié bullet; 1860s – metallic cartridges"
      americas: "18th c. – Pennsylvania long rifle; 1861–1865 – rifle muskets general in the Civil War"
      east_asia: "1860s – Japan imports Minié and breech-loading rifles in the Boshin War era"
    sources:
      - "Benjamin Robins, New Principles of Gunnery (1742)"
      - "Earl J. Hess, The Rifle Musket in Civil War Combat: Reality and Myth (2008)"

  - id: smokeless_powder_high_explosive_shell
    name: Smokeless powder and high-explosive shells
    category: military
    requires: [nitric_acid, sulphuric_acid]
    helps: [nitroglycerin_dynamite, rifling_minie_breechloader, synthetic_dyes]
    explain: >
      Nineteenth-century chemists developed smokeless propellants that left much less
      smoke and solid residue than black powder. French service adoption in the 1880s
      was an important step. High-explosive shell fillings were a separate development.
      A propellant burns rapidly to produce expanding gas, while a high explosive
      detonates with a shock wave. The two innovations changed battlefield visibility
      and the effects of artillery. Factory disasters and the deterioration of stored
      materials accompanied the expansion of these industries.
    pitfalls:
      - "Early guncotton decomposed and blew up factories for forty years; safe manufacture was the invention, and it is industrial chemistry, not workshop craft"
      - Confusing burning (propellants) with detonation (bursting charges); a detonating charge in a gun barrel destroys the gun
      - Smokeless propellants need stronger steel barrels than black powder
      - "Assuming it can be made in an early modern setting; it needs concentrated acids in bulk and close temperature control"
    history:
      europe: "1846 – Schönbein's guncotton; 1884 – Vieille's Poudre B, used in the Lebel rifle of 1886; 1887 – Nobel's ballistite; 1889 – British cordite; late 19th c. – picric acid shell fillings adopted in France (melinite) and later Britain (lyddite); 1897 – French 75 mm quick-firing gun; 1902 – Germany adopts TNT for shells"
      east_asia: "1890s – Japanese Shimose powder (picric acid) used in 1904–1905"
      global: "1914–1918 – artillery with high-explosive shells causes the majority of battle casualties"
    sources:
      - "G. I. Brown, The Big Bang: A History of Explosives (1998)"
      - "Jack Kelly, Gunpowder: Alchemy, Bombards, and Pyrotechnics (2004)"

  - id: machine_gun
    name: Machine gun
    category: military
    requires: [rifling_minie_breechloader]
    helps: [smokeless_powder_high_explosive_shell, interchangeable_parts, machine_tools]
    explain: >
      An automatic machine gun uses energy from firing to continue its cycle. A
      hand-cranked Gatling gun depends on an operator turning the crank. Maxim
      demonstrated his automatic gun in the 1880s. Smokeless ammunition later reduced
      smoke and fouling. Early machine guns varied in weight and cooling system and
      required crews and substantial ammunition supplies. In the First World War they
      contributed to the strength of entrenched defences alongside artillery,
      fieldworks and wire.
    pitfalls:
      - "Hand-cranked multi-barrel guns (Gatling) are not automatic; the automatic principle is Maxim's"
      - Without cooling the barrel overheats and wears out within minutes
      - "Treating it as a kind of artillery placed far back, as armies did before 1914, instead of an infantry weapon firing across the front"
      - It consumes ammunition by the cartload and so needs industrial supply
    history:
      europe: "1718 – Puckle's revolving flintlock gun, a curiosity; 1884 – Hiram Maxim's recoil-operated gun; 1914–1918 – dominates the battlefield"
      africa: "1898 – machine guns used at Omdurman in Sudan"
      americas: "1862 – Gatling's hand-cranked gun patented"
      east_asia: "1904–1905 – both sides use machine guns on a large scale in the Russo-Japanese War"
    sources:
      - "John Ellis, The Social History of the Machine Gun (1975)"

  - id: ironclad_warship
    name: Ironclad and steel warships
    category: military
    requires: [cannon_artillery]
    helps: [steamship_screw_propeller, puddling_wrought_iron, bessemer_steel, naval_gunnery_line_of_battle]
    explain: >
      Guns firing explosive shells set wooden ships on fire, so ships were given a
      belt of thick wrought-iron plate over timber backing and steam engines to
      carry the weight. An armoured ship is practically immune to a wooden fleet.
      A contest of gun against armour followed: heavier rifled guns in a few
      rotating turrets, steel armour, and finally the all-big-gun turbine battleship
      of 1906. Fleets became a measure of industrial capacity, and each new type
      made existing fleets obsolete, which drove naval arms races.
    pitfalls:
      - "Iron plates do not make a ship sink; a ship floats by displacing its weight of water, whatever it is made of"
      - "The iron cladding of the Korean turtle ships of 1592 is not in the contemporary Korean sources and is doubted"
      - Armour high up without matching beam makes the ship unstable
      - "Monitor and Virginia (1862) were not the first ironclads; France had armoured floating batteries at Kinburn in 1855 before launching the ocean-going Gloire in 1859"
    history:
      east_asia: "1592 – Korean turtle ships with a covered, spiked deck (iron plating disputed)"
      europe: "1820s – Paixhans' shell guns; 1853 – shells destroy a wooden Turkish squadron at Sinope; 1855 – French armoured floating batteries at Kinburn; 1859 – Gloire; 1860 – iron-hulled HMS Warrior; 1906 – HMS Dreadnought"
      americas: "1862 – USS Monitor against CSS Virginia, first fight between ironclads"
    sources:
      - "James Phinney Baxter, The Introduction of the Ironclad Warship (1933)"

  - id: submarine_torpedo
    name: Submarine and torpedo
    category: military
    requires: [buoyancy_hydrostatics]
    helps: [internal_combustion_engine, dynamo_electric_motor, electric_battery, steamship_screw_propeller]
    explain: >
      A sealed hull dives by letting water into ballast tanks until it weighs as
      much as the water it displaces, steers in depth with horizontal rudders, and
      surfaces by blowing the tanks with compressed air. It needs an engine that
      uses no air under water, which in practice meant electric motors on batteries
      charged by a combustion engine at the surface. Its weapon is the torpedo, a
      small self-propelled craft that holds a set depth by a pressure sensor and
      pendulum and strikes below the waterline. Cheap submarines can sink the
      merchant ships a sea power lives on; the answer was to sail merchant ships in
      escorted convoys.
    pitfalls:
      - "Neutral buoyancy is unstable; without depth rudders and trim tanks the boat either pops up or keeps sinking"
      - "Air for the crew and exhaust for any engine; hand-cranked boats suffocated or exhausted their crews"
      - "Before 1866 'torpedo' meant a mine or a charge on a pole, Hunley was lost after its attack in 1864, and the cause remains disputed"
      - "Hunting submarines with patrols instead of convoying the targets; Britain nearly lost the war that way in early 1917"
    history:
      europe: "c. 1620–1624 – Drebbel's oared submersible on the Thames; 1866 – Whitehead's self-propelled torpedo at Fiume (Rijeka); 1915–1918 – German U-boat campaigns; 1917 – convoy system"
      americas: "1776 – Bushnell's Turtle; 1864 – H. L. Hunley sinks USS Housatonic and is lost; 1897–1900 – John Holland's petrol-electric boat, accepted by the US Navy"
    sources:
      - "Edwyn Gray, The Devil's Device: The Story of Robert Whitehead, Inventor of the Torpedo (1975)"
      - "Richard Compton-Hall, Submarine Boats: The Beginnings of Underwater Warfare (1983)"

  - id: tank_combined_arms
    name: Tank and combined-arms warfare
    category: military
    requires: [internal_combustion_engine]
    helps: [electromagnetic_waves_radio, machine_gun, military_aviation, general_staff_war_college]
    explain: >
      The First World War tank brought tracks, armour and a combustion engine together
      in a vehicle able to cross some forms of broken ground. Early machines were slow,
      mechanically unreliable and demanding to supply. At Cambrai in 1917 and Amiens in
      1918, tanks took part in battles involving infantry, artillery and aircraft.
      Combining different arms was an ancient practice. Engines and radio changed how
      quickly commanders could coordinate them. The 1940 campaign in France illustrates
      the consequences of differences in organisation and communications even when both
      sides possess substantial armoured forces.
    pitfalls:
      - "Believing Germany won in 1940 with more or better tanks; the Allies fielded many tanks, including armoured divisions; organisation, communications and command decisions contributed to the outcome"
      - "'Blitzkrieg' was not an official German doctrine but a later label"
      - Tanks without infantry are destroyed in towns and woods; range varies by vehicle and terrain, and shortages of fuel or spare parts can immobilise a formation
      - Early tanks broke down more often than they were knocked out
    history:
      greece: "4th c. BC – Alexander combines phalanx, light troops and cavalry (ancient combined arms)"
      europe: "c. 1487 – Leonardo's sketch of an armoured car (unworkable); 1916 – first tanks at Flers-Courcelette; 1917 – massed tanks at Cambrai; 1918 – Amiens, tanks with artillery, infantry and aircraft; 1920s–1930s – theories of Fuller, Tukhachevsky and Guderian; 1940 – fall of France"
      global: "1939–1945 – armoured combined-arms formations decide land campaigns from Poland to Manchuria"
    sources:
      - "Jonathan M. House, Combined Arms Warfare in the Twentieth Century (2001)"
      - "Karl-Heinz Frieser, The Blitzkrieg Legend: The 1940 Campaign in the West (2005)"

  - id: military_aviation
    name: Military aviation and air defence
    category: military
    requires: []
    helps: [glider_aeroplane, hot_air_hydrogen_balloon, radar, electromagnetic_waves_radio, internal_combustion_engine]
    explain: >
      Aircraft first of all see: reconnaissance and artillery spotting can reveal preparations on the ground. To deny the enemy that view one must control the air,
      which produced the fighter. Bombers attack armies, ships, transport and
      industry; aircraft from carriers replaced the battleship's guns. Defence
      against air attack is a system and not only an aeroplane: early warning (including British radar stations before 1940), a central plotting room and radio control of fighters. Bombing
      of cities proved far less decisive and far more costly than its prophets
      claimed.
    pitfalls:
      - "Douhet's prediction that bombing cities would quickly break civilian morale and end wars was wrong in 1940–1945"
      - "'The bomber will always get through' ignored radar and fighters"
      - Level bombing from height was grossly inaccurate until late in the Second World War
      - "Air power needs airfields, fuel, spares and trained crews in depth; aircraft numbers alone mislead"
    history:
      china: "ancient to medieval – kites used for signalling and measuring distance in war"
      europe: "1794 – French observation balloon at Fleurus; 1911 – Italian aircraft reconnoitre and drop bombs in Libya; 1914–1918 – reconnaissance, fighters, bombers; 1921 – Douhet, Il dominio dell'aria; 1940 – Battle of Britain, radar-directed air defence"
      east_asia: "1941 – Japanese carrier strike on Pearl Harbor"
      americas: "1942 – Midway, a fleet battle in which US carrier aircraft sank four Japanese carriers; Japanese submarine I-168 torpedoed Yorktown and sank Hammann"
    sources:
      - "Giulio Douhet, Il dominio dell'aria (1921; English The Command of the Air, 1942)"
      - "Richard Overy, The Bombing War: Europe 1939–1945 (2013)"
      - "John Buckley, Air Power in the Age of Total War (1999)"

  - id: chemical_weapons
    name: Poison gas and its prohibition
    category: military
    requires: []
    helps: [chlorine_bleach, siegecraft_mining, laws_of_war, arms_control]
    explain: >
      Smoke and choking fumes appear in ancient accounts of sieges. The industrial
      powers of the First World War produced chemical weapons on a new scale. These
      weapons inflicted deaths, lasting injuries and fear. Protective equipment,
      medical care and the burden of operating in masks became part of soldiers'
      experience. The Geneva Protocol of 1925 prohibited the use of chemical and
      bacteriological methods of warfare for its parties. The prohibition was breached,
      including by Italy in Ethiopia and Japan in China. The later Chemical Weapons
      Convention requires its parties to destroy declared stockpiles under
      international verification.
    pitfalls:
      - "Gas was not a war-winning weapon; it caused well under a tenth of First World War casualties and a small share of deaths"
      - "Assuming protective equipment eliminated casualties or spared soldiers the burden of prolonged exposure"
      - "The 1925 protocol banned use, not possession, and held through deterrence, not law alone"
      - Overlooking chemical warfare outside Europe, including Italian use in Ethiopia and Japanese use in China
    history:
      greece: "429 BC – Spartans burn sulphur and pitch against Plataea (Thucydides II.77)"
      china: "c. 4th c. BC – Mozi describes pumping smoke of burning plants into besiegers' tunnels with bellows"
      rome: "c. AD 256 – Simon James interprets archaeological remains at Dura-Europos as evidence that Sasanian miners killed Roman soldiers with toxic fumes"
      europe: "1899 – Hague declaration against asphyxiating shells; 22 April 1915 – German chlorine cloud at Ypres; 1917 – mustard gas; 1925 – Geneva Protocol bans use of gas and bacteriological weapons"
      global: "1993 – Chemical Weapons Convention opens for signature; 1997 – enters into force"
    sources:
      - "L. F. Haber, The Poisonous Cloud: Chemical Warfare in the First World War (1986)"
      - "Simon James, Stratagems, Combat, and 'Chemical Warfare' in the Siege Mines of Dura-Europos, American Journal of Archaeology 115 (2011)"
      - "Richard M. Price, The Chemical Weapons Taboo (1997)"

  - id: nuclear_weapons
    name: Nuclear weapons
    category: military
    requires: [nuclear_fission]
    helps: [nuclear_reactor, military_aviation, rocket_spaceflight]
    explain: >
      Nuclear fission releases energy from atomic nuclei. Scientists recognised the
      possibility of a rapid chain reaction in 1939–40. Turning that discovery into a
      weapon required a vast wartime industrial programme. The US-led Manhattan Project
      drew on British and Canadian cooperation and the work of researchers from many
      countries. Trinity in July 1945 was the first nuclear test. In August the United
      States used nuclear weapons against Hiroshima and Nagasaki. Blast, fire and
      radiation killed civilians on a massive scale. The subsequent arms race and the
      risk of catastrophic retaliation reshaped international politics.
    pitfalls:
      - "Thinking the secret is a formula; the principle was published in 1945 and the difficulty is industrial"
      - "Natural uranium does not explode; it is nearly all the wrong isotope"
      - "Underrating fire, radiation and fallout, which add greatly to the deaths from blast"
      - "Assuming a monopoly lasts; the first Soviet test in 1949 ended the US monopoly"
      - A player who 'brings the bomb' to an early era brings only an idea that nobody can use, plus the knowledge that it changes diplomacy
    history:
      europe: "1933 – Szilard conceives the neutron chain reaction; 1938–1939 – fission discovered and explained (Hahn, Strassmann, Meitner, Frisch); 1940 – Frisch-Peierls memorandum shows a bomb is feasible; 1949 – first Soviet test; 1952 – first British test"
      americas: "1942–1945 – Manhattan Project; 16 July 1945 – Trinity test; 1952 – first thermonuclear test"
      east_asia: "6 and 9 August 1945 – Hiroshima and Nagasaki, the only use in war"
      china: "1964 – first Chinese test"
      india: "1974 – first Indian test"
    sources:
      - "Richard Rhodes, The Making of the Atomic Bomb (1986)"
      - "Henry DeWolf Smyth, Atomic Energy for Military Purposes (1945)"

  # ------------------------------------------------------------ ideas of security
  - id: security_dilemma_arms_race
    name: Security dilemma and arms races
    category: military
    requires: []
    helps: [game_theory, balance_of_power, deterrence]
    explain: >
      Where no authority stands above states, each must provide for its own safety,
      and measures taken for defence can change the balance of power. So what one side
      does to feel safe makes its neighbour less safe; the neighbour answers in
      kind, and both end poorer and no safer, or at war, although neither wanted it.
      Thucydides gave the classic case: the growth of Athenian power and the fear
      this caused in Sparta. The dilemma is sharpest when attack seems to have the
      advantage over defence and when offensive and defensive preparations look
      alike. Remedies are transparency, clearly defensive postures (fortresses, not
      siege trains), agreed limits and reassurance.
    pitfalls:
      - "Not every arms build-up is a misunderstanding; some states do intend conquest, and reassuring them invites attack"
      - "Arms races do not always end in war; the Anglo-German naval race was effectively decided by 1912"
      - Judging the other side by its capabilities while expecting it to judge you by your good intentions
      - "Treating it as a modern idea; Thucydides and the Arthashastra both describe it"
    history:
      greece: "c. 400 BC – Thucydides I.23 on the cause of the Peloponnesian War, and I.90–92 on the dispute over rebuilding Athens' walls"
      india: "c. 1st c. BC – 3rd c. AD – Arthashastra treats every neighbour as a natural enemy whose gain is one's loss"
      china: "5th–3rd c. BC – Warring States competition in armies, walls and reforms until Qin conquers all"
      europe: "1898–1912 – Anglo-German naval race; 1950 – John Herz names the 'security dilemma'; 1951 – Herbert Butterfield; 1978 – Robert Jervis on offence and defence"
    sources:
      - "Thucydides, History of the Peloponnesian War I.23 and I.88–92"
      - "John H. Herz, Idealist Internationalism and the Security Dilemma, World Politics 2 (1950)"
      - "Robert Jervis, Cooperation under the Security Dilemma, World Politics 30 (1978)"

  - id: deterrence
    name: Deterrence
    category: military
    requires: []
    helps: [game_theory, security_dilemma_arms_race, nuclear_weapons, military_intelligence_codebreaking]
    explain: >
      Prevent attack by convincing the opponent beforehand that it will cost more
      than it can gain, either because it will fail (denial) or because retaliation
      will follow (punishment). It works through his mind, so three things are
      needed: the capability, a believable will to use it (credibility), and clear
      communication of what is forbidden, together with the assurance that he will
      be left alone if he refrains. With nuclear weapons the capability must survive
      a first blow (second strike): if both sides can still destroy the other after
      being attacked, neither gains by striking first (mutual assured destruction).
      Credibility is the hard part, above all when protecting an ally; commitments
      are made believable by treaties, troops stationed in harm's way and reputation.
    pitfalls:
      - "Deterrence is not the same as defence or as strength; forces that can be destroyed in a surprise attack invite it"
      - "Threats that are too terrible to carry out are not believed for small provocations, so the opponent advances in small slices"
      - "It assumes the opponent calculates, values survival and understands the signal; it fails through misperception, desperation, accident and false alarm (1962, 1983)"
      - "A threat without an assurance leaves the opponent nothing to lose"
      - "'If you want peace, prepare for war' ignores that preparations can frighten the neighbour into arming or striking first"
      - It gives no way out when it fails, and a long peace does not prove that it was the cause
    history:
      greece: "433 BC – Athens makes a purely defensive alliance with Corcyra to deter Corinth, and fails (Thucydides I.44–55); 427 BC – Diodotus argues that the threat of death does not deter rebels because hope outweighs fear (III.45); 416 BC – Melian dialogue"
      china: "c. 5th–4th c. BC – Sun Tzu: the highest skill is to subdue the enemy without fighting and to make oneself unassailable"
      india: "c. 1st c. BC – 3rd c. AD – Arthashastra: the ruler's coercive power (danda) and visible readiness keep rivals quiet"
      rome: "c. AD 400 – Vegetius III, preface: 'whoever wants peace should prepare for war'; Roman policy of certain and exemplary retaliation"
      europe: "1454 – Italian League deters by promised joint action; 17th–18th c. – fortress belts and 'fleets in being' deter by denial"
      global: "1946 – Bernard Brodie: the chief purpose of armed forces is now to avert wars; 1959 – Wohlstetter on vulnerable deterrent forces; 1960–1966 – Schelling on commitment and credibility; 1960s – assured destruction (McNamara), nicknamed MAD by its critic Donald Brennan; 1962 – Cuban missile crisis"
    sources:
      - "Thucydides, History of the Peloponnesian War I.31–55, III.37–48, V.84–116"
      - "Thomas C. Schelling, Arms and Influence (1966)"
      - "Lawrence Freedman, The Evolution of Nuclear Strategy (1981)"

  - id: balance_of_power
    name: Balance of power
    category: military
    requires: []
    helps: [international_law_sovereignty, deterrence, security_dilemma_arms_race, military_intelligence_codebreaking]
    explain: >
      In a system of several independent states, each is safest when none is strong
      enough to dominate the rest. So states should combine against whichever is
      becoming strongest, whatever its religion or past friendship, and should not
      destroy a beaten rival who may be needed as a counterweight tomorrow. Resident ambassadors helped Italian rulers track shifts in strength. Earlier states also balanced rivals through envoys and shifting alliances. Its aim is the independence of the members, not peace:
      it works through the threat of war and through limited wars.
    pitfalls:
      - "It preserves the great powers, not peace or the small states (Poland was partitioned in its name, 1772–1795)"
      - "Each waits for another to bear the cost of resisting (buck-passing), or all are dragged in by one ally (1914)"
      - "It breaks down when the members invite an outside power into their quarrels, as Milan invited France into Italy in 1494"
      - Power is hard to measure, and miscalculating it causes the wars the system should prevent
      - "It can fail completely: in China it ended in conquest by Qin in 221 BC"
    history:
      mesopotamia: "14th c. BC – Amarna letters show a club of great kings (Egypt, Hatti, Mitanni, Babylon, Assyria) managing parity by gifts and marriage"
      greece: "5th–4th c. BC – Athens, Sparta and Thebes combine in turn against the strongest; c. 150 BC – Polybius I.83 praises Hiero of Syracuse for propping up Carthage against Rome"
      india: "c. 1st c. BC – 3rd c. AD – Arthashastra: circle of states (mandala), where the neighbour is the enemy and the neighbour's neighbour the ally, and six policies from peace to dual policy"
      china: "4th–3rd c. BC – 'vertical' alliances against Qin and Qin's 'horizontal' counter-alliances"
      europe: "1454 – Peace of Lodi between Milan and Venice; 1454–55 – Italian League comes to include Milan, Venice, Florence, Naples and the pope; to 1492 – Lorenzo de' Medici as the balancer, in Guicciardini's account; 1494 – collapse with the French invasion; 1713 – Treaty of Utrecht names the 'just balance of power'; 1752 – Hume's essay; 1815 – Vienna settlement and Concert of Europe"
    sources:
      - "Francesco Guicciardini, Storia d'Italia, book I (written 1537–1540, printed 1561)"
      - "David Hume, Of the Balance of Power (1752)"
      - "Garrett Mattingly, Renaissance Diplomacy (1955)"

  - id: collective_security_alliances
    name: Alliances and collective security
    category: military
    requires: []
    helps: [international_law_sovereignty, balance_of_power, deterrence, representative_government]
    explain: >
      An alliance is a promise of mutual aid against an outside enemy; collective
      security is a promise by all members of a system to act together against any
      member that breaks the peace. Both let weak states pool strength and deter
      attack, and both stand or fall with the belief that the promise will be kept.
      Promises are made binding by precise terms (who must do what, when), by
      standing shared forces and staffs, hostages or stationed troops, regular
      congresses, and the knowledge that a defaulter will find no allies later.
    pitfalls:
      - "Free-riding: each member hopes the others will pay and fight, so common leagues act late or not at all (League of Nations, 1931 and 1935)"
      - "Every ally fears both being abandoned and being dragged into the partner's quarrel"
      - "The leader turns the league into an empire, as Athens did with the Delian League"
      - A rule of unanimity lets one member, usually the aggressor's friend, block action
      - Coalitions break up at the moment of victory when the common enemy is gone
    history:
      mesopotamia: "c. 1259 BC – Egyptian-Hittite treaty of peace and mutual defence"
      china: "7th–6th c. BC – sworn covenants (meng) of states under a hegemon; 546 BC – Xiang Xu's peace conference of the major states"
      greece: "6th c. BC – Peloponnesian League; 478 BC – Delian League; 386 BC – first Common Peace (King's Peace); 337 BC – League of Corinth"
      rome: "493 BC (traditional) – treaty with the Latin League; by 50 BC a web of unequal treaties with allies and client kings"
      americas: "date disputed (12th–16th c.) – Haudenosaunee (Iroquois) confederacy under the Great Law of Peace; 1428 – Aztec Triple Alliance"
      europe: "1454–1455 – Italian League, 25-year mutual guarantee; 1683 – treaty between Emperor Leopold I and John III Sobieski brings the Polish army to the relief of Vienna; 1684 – Holy League; 1815 – Quadruple Alliance and congress system"
      global: "1920 – League of Nations; 1945 – United Nations Charter, chapter VII; 1949 – North Atlantic Treaty, article 5"
    sources:
      - "Thucydides, History of the Peloponnesian War I.96–99 and III.10–11"
      - "Inis L. Claude, Swords into Plowshares (1956)"
      - "Glenn H. Snyder, Alliance Politics (1997)"

  - id: arms_control
    name: Arms control and disarmament agreements
    category: military
    requires: []
    helps: [security_dilemma_arms_race, international_law_sovereignty, game_theory, military_intelligence_codebreaking, deterrence]
    explain: >
      Rivals can both gain by agreeing to limit the number, type or placing of
      weapons, because an unlimited race leaves both poorer and no safer. An
      agreement holds only if each side can check that the other complies
      (inspection, observers, counting what is easy to count such as large ships or
      fortresses) and if cheating would be detected in time to respond. The purpose
      is not friendship but stability: fewer reasons to strike first, less money
      wasted, and lines of contact that work in a crisis.
    pitfalls:
      - "Treating verification as a guarantee of compliance, or assuming an agreement without formal inspections must fail"
      - "Limiting one category shifts the race into the next (cruiser competition after the 1922 treaty, which also limited aircraft-carrier tonnage)"
      - "Bans proclaimed by an authority without means of enforcement are ignored (crossbow ban of 1139)"
      - "Disarmament imposed on the defeated breeds evasion and revenge (Carthage, Germany after 1919)"
      - A weapon that offers a decisive advantage is almost never given up; bans succeed with weapons of doubtful usefulness
    history:
      china: "546 BC – conference of the Spring and Autumn states agrees to cease war, held for some years"
      rome: "201 BC – peace treaty limits Carthage to ten warships and no war elephants; 188 BC – similar terms for the Seleucid kingdom at Apamea"
      europe: "989–1040s – Peace and Truce of God restrict when and against whom knights may fight; 1139 – Second Lateran Council bans crossbows and bows against Christians, without effect; 1868 – St Petersburg Declaration; 1899 and 1907 – Hague conferences"
      east_asia: "1588 – Hideyoshi's sword hunt disarms the Japanese peasantry (internal arms control)"
      americas: "1817 – Rush-Bagot agreement limits armed vessels on the Great Lakes, allowing a small patrol force"
      global: "1922 – Washington Naval Treaty fixes battleship ratios; 1925 – Geneva gas protocol; 1963 – partial nuclear test ban; 1968 – Non-Proliferation Treaty; 1972 – SALT I and ABM Treaty"
    sources:
      - "Thomas C. Schelling & Morton H. Halperin, Strategy and Arms Control (1961)"
      - "Hedley Bull, The Control of the Arms Race (1961)"
      - "Polybius, Histories XV.18"

  - id: laws_of_war
    name: Laws of war (humanitarian law)
    category: military
    requires: []
    helps: [international_law_sovereignty, golden_rule_universal_ethics, human_equality_dignity, written_law_code]
    explain: >
      Rules of war developed in different legal and religious traditions. In modern
      humanitarian law civilians are protected against direct attack unless and for
      such time as they take a direct part in hostilities. Combatants who surrender, or
      who are incapacitated by wounds and refrain from hostile acts and escape, are
      also protected. Wounded people must receive care, and prisoners must be treated
      humanely. These obligations apply even when the other side violates them. In
      earlier periods customs concerning surrender, treatment of captives and protected
      messengers varied. Later treaties, military instruction, prisoner records and
      independent relief organisations gave these protections institutional form.
    pitfalls:
      - "Rules that protect only one's own kind (fellow Greeks, Christians, Muslims) leave everyone else outside"
      - "Whether a war is just and how it is fought are separate questions; a just cause does not license atrocity"
      - "Assuming an enemy violation permits retaliation against prisoners or other protected people"
      - "Until the 19th century custom allowed a town that refused surrender and was stormed to be sacked, which every besieged garrison (Vienna 1683) had to weigh"
      - "Assuming the Geneva Conventions were the first such rules; codes exist in ancient India, China, Greece and early Islam"
    history:
      india: "c. 2nd c. BC – 3rd c. AD – Laws of Manu 7.90–93 forbid poisoned and concealed weapons and killing those who surrender, sleep or are disarmed"
      china: "c. 5th–4th c. BC – Sun Tzu advises treating captives well; Zuozhuan records rules of honourable combat"
      greece: "5th c. BC – inviolable heralds, truces to recover the dead, sacred sites spared (often broken)"
      rome: "by 3rd c. BC – fetial procedure for declaring a just war; 44 BC – Cicero, De officiis I.34–40"
      islamic: "632 – Abu Bakr's instructions to spare women, children, the old, monks and fruit trees; c. 800 – al-Shaybani's treatise on the law of nations (siyar)"
      europe: "5th–13th c. – just war doctrine of Augustine and Aquinas; 1625 – Grotius; 1864 – first Geneva Convention after Dunant's account of Solferino; 1899 and 1907 – Hague Regulations; 1929 – prisoner of war convention; 1945–1946 – Nuremberg trials"
      americas: "1863 – Lieber Code for the Union armies"
      global: "1949 – four Geneva Conventions"
    sources:
      - "Hugo Grotius, De jure belli ac pacis (1625)"
      - "Henry Dunant, Un souvenir de Solférino (1862)"
      - "Geoffrey Best, Humanity in Warfare (1980)"
