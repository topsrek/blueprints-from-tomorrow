# Blueprints from Tomorrow – tech tree fragment: Institutions, law & governance.
# Schema: see header of techtree/core.yaml.

technologies:

  - id: written_law_code
    name: Written, published law code
    category: institutions
    requires: [writing_invention]
    helps: [rule_of_law]
    explain: >
      Rules and penalties are written down, displayed in public and applied to cases
      as written, instead of living in the memory of elders or the will of a judge.
      This makes outcomes predictable, limits arbitrary judgment and lets a subject
      know in advance what is forbidden and what a contract or injury will cost.
      A code that works needs little: cases stated as "if X, then Y", a public copy
      in the language people speak, judges who must cite it, and a way to amend it.
      Fixed fines and compensation in place of blood feud are the usual first gain.
    pitfalls:
      - "Assuming Hammurabi's was the first code: Ur-Namma's is about 350 years older, and Lipit-Ishtar and Eshnunna also precede it"
      - "Assuming Mesopotamian 'codes' were statutes that courts applied: surviving court records almost never cite them, and many scholars read them as royal self-praise or scribal case collections"
      - "Thinking written law is automatically just or equal: most early codes set different penalties by rank (free, commoner, slave)"
      - "Publishing a code nobody can read or that the ruler may ignore: writing limits judges, it does not by itself bind the king"
      - "Believing 'an eye for an eye' was a call to cruelty: it capped revenge, and for lower ranks the same codes used money payments"
    history:
      mesopotamia: "c. 2350 BC – Urukagina of Lagash records reforms (no code survives); c. 2100 BC Code of Ur-Namma, the oldest surviving, mostly money compensation; c. 1930 BC Lipit-Ishtar; c. 1770 BC Eshnunna; c. 1754 BC Hammurabi, 282 provisions on a public stele"
      egypt: "no law code survives from the pharaonic period, though written laws are mentioned; a Demotic legal manual from Hermopolis dates to the 3rd c. BC"
      india: "3rd c. BC – Ashoka publishes royal instructions and moral exhortations on rocks and pillars; dharma texts (Dharmasutras, later Manu, c. 2nd c. BC–2nd c. AD) are learned treatises rather than enacted codes"
      china: "536 BC – Zichan of Zheng has penal laws cast on bronze vessels, criticised at the time for making people argue from the text; 217 BC Qin statutes on the Shuihudi bamboo slips; 653 Tang Code with commentary, the model for East Asia"
      east_asia: "701 – Taiho Code in Japan, modelled on Tang law; Korea and Vietnam adopt Tang-style codes"
      greece: "c. 650 BC – inscribed law at Dreros (Crete), the oldest Greek law on stone; 621/620 BC Draco at Athens; 594 BC Solon; c. 450 BC Gortyn code"
      rome: "451–450 BC – Twelve Tables set up in the Forum; AD 529–534 Justinian's Corpus Iuris Civilis"
      islamic: "8th–9th c. – law developed by jurists (fiqh) rather than enacted; 15th–16th c. Ottoman kanun codes (Mehmed II, Suleiman); 1869–1876 Mecelle civil code"
      europe: "c. 500 – Germanic codes (Lex Salica); 1804 Napoleon's Code civil, the model of modern codification"
    sources:
      - "Martha T. Roth, Law Collections from Mesopotamia and Asia Minor (1995)"
      - "Raymond Westbrook (ed.), A History of Ancient Near Eastern Law (2003)"

  - id: rule_of_law
    name: Rule of law and separation of powers
    category: institutions
    requires: []
    helps: [written_law_code, independent_judiciary_judicial_review]
    explain: >
      The ruler and his officials are bound by the same known, general laws as
      everyone else. Officials need lawful authority to collect taxes or detain a person,
      and people must be able to challenge official action before an impartial tribunal.
      Dividing power can make those limits effective: an assembly can refuse new taxes
      and judges secure in office can order a prisoner’s release. The argument that convinces rulers is credit and
      investment: people lend to, trade in and stay in a state that cannot rob them.
    pitfalls:
      - "Confusing rule of law with rule by law: Chinese Legalists wanted strict, published law applied to all ranks, but as the ruler's tool, with the ruler above it"
      - "Telling a king he is under the law without any body able to make that stick: Magna Carta worked because the barons had armies and the king needed their money"
      - "Treating Montesquieu's neat three-way separation as a description of England: real systems are overlapping powers that check each other, not sealed compartments"
      - "Proposing it as an abstract right at a court: questioning the prince's prerogative is treason; it has to be framed as binding bad officials and securing the prince's credit"
    history:
      mesopotamia: "c. 1754 BC – Hammurabi presents the king as guarantor of justice for the weak; the king himself is not bound"
      greece: "4th c. BC – Aristotle, Politics III: it is better that law should rule than any one citizen; Athens distinguishes laws from decrees and prosecutes unlawful proposals"
      rome: "c. 150 BC – Polybius (Histories VI) explains Rome's stability by a mixed constitution of consuls, senate and people checking each other; under the emperors the princeps is held to be freed from the laws"
      china: "4th–3rd c. BC – Shang Yang and Han Feizi: uniform published law and fixed punishments regardless of rank, serving the ruler; Confucians preferred rule by virtuous men"
      india: "c. 3rd c. BC onwards – dharma texts hold that the king is subject to dharma and may be resisted if he violates it; no institution enforces this"
      islamic: "8th–9th c. – sharia is held to be above the ruler and is worked out by independent jurists; judges (qadis) are nevertheless appointed and dismissed by the ruler"
      europe: "1215 – Magna Carta, cl. 39–40: no free man imprisoned or dispossessed except by lawful judgement of his peers or by the law of the land; 1689 English Bill of Rights; 1701 judges hold office during good behaviour; 1748 Montesquieu"
      americas: "1787 – United States Constitution builds separation of powers and checks into a written frame"
    sources:
      - "Montesquieu, De l'esprit des lois (1748)"
      - "Tom Bingham, The Rule of Law (2010)"
      - "Francis Fukuyama, The Origins of Political Order (2011)"

  - id: independent_judiciary_judicial_review
    name: Independent judges and judicial review
    category: institutions
    requires: [rule_of_law]
    helps: [written_constitution]
    explain: >
      Judges are appointed for life or a long fixed term, paid a salary that cannot be
      cut, and cannot be removed for the way they decide; they give public reasons.
      A judge who cannot be punished by the ruler can rule against him. Judicial review
      goes one step further: a court may refuse to apply an order or statute that
      contradicts a higher law (constitution, charter). Hamilton's argument: the court
      is the least dangerous branch because it commands neither army nor treasury, so
      giving it the last word on legality costs little and protects everyone.
    pitfalls:
      - "Forgetting that a court has no force of its own: its rulings hold only if officials and the army obey, so it needs allies and a habit of compliance"
      - "Thinking judicial review is written into the US Constitution: the Supreme Court inferred it in Marbury v. Madison (1803)"
      - "Offering it to a monarch who is himself the highest judge: it removes a core royal power and will be read as an attack"
      - "Ignoring the opposite failure: irremovable judges can become a closed caste or a political actor, and whoever controls appointments controls the court"
    history:
      greece: "c. 415 BC – Athenian graphe paranomon: any citizen may indict a decree as contrary to the laws before a jury court; 403 BC laws ranked above decrees"
      rome: "from 5th c. BC – tribunes may veto magistrates' acts; no court could annul a law"
      china: "from Qin/Han – censors may impeach officials and remonstrate with the emperor; magistrates combined administration and judging and were never independent"
      islamic: "8th c. onwards – qadis judge by a law the ruler did not make, and stories of caliphs appearing as ordinary litigants set the ideal; in practice rulers appointed, dismissed and bypassed them"
      europe: "1610 – Coke in Bonham's Case claims common law can control an Act of Parliament (not followed in England); 1701 Act of Settlement gives judges tenure during good behaviour; 1920 Austrian Constitutional Court designed by Kelsen"
      americas: "1803 – Marbury v. Madison: the US Supreme Court declares a statute void"
      india: "1950 – Supreme Court with power of review; 1973 it holds that even amendments may not destroy the constitution's basic structure"
    sources:
      - "Alexander Hamilton, The Federalist No. 78 (1788)"
      - "Mauro Cappelletti, Judicial Review in the Contemporary World (1971)"

  - id: habeas_corpus_fair_trial
    name: Habeas corpus and fair trial
    category: institutions
    requires: []
    helps: [rule_of_law, written_law_code]
    explain: >
      Nobody may be held without being brought promptly before a judge who is told the
      charge and must release him if there is no lawful ground (habeas corpus). At
      trial the accuser must prove the case with witnesses and evidence heard in
      public; the accused may answer, call witnesses and is not forced to confess;
      neutral judges or a jury of ordinary people decide. Torture is excluded because
      pain produces whatever the questioner wants, not the truth. The convincing
      argument: every rule protects the innocent man the ruler's enemies might accuse,
      and a confession under torture names more innocents.
    pitfalls:
      - "Thinking Magna Carta created trial by jury or habeas corpus: both grew later; the Habeas Corpus Act is 1679"
      - "Assuming pre-modern courts were lawless: Roman, Islamic and Chinese law had detailed rules of evidence, burden of proof and review of death sentences"
      - "Attacking judicial torture head-on: Roman-canon procedure required a confession or two eyewitnesses for conviction, so abolishing torture means first allowing conviction on circumstantial evidence"
      - "Believing juries were always impartial judges of fact: early English juries were neighbours expected to know the case already"
      - "Forgetting the gaoler: the writ is useless unless a named officer is personally fined or punished for ignoring it"
    history:
      mesopotamia: "c. 1754 BC – Hammurabi §§1–5: an accuser who cannot prove a capital charge is put to death; judges who alter a sealed verdict are removed"
      greece: "5th–4th c. BC – Athenian jury courts of 201 to 501 or more citizens chosen by lot, voting by secret ballot, with equal timed speeches"
      rome: "2nd c. AD – the burden of proof lies on the one who asserts (Digest 22.3.2); Trajan: better that the guilty go unpunished than the innocent be condemned (Digest 48.19.5)"
      india: "c. 3rd c. BC–3rd c. AD – Arthashastra and dharma texts set rules for witnesses, documents and judges, and limits on torture"
      china: "653 – Tang Code regulates interrogation, penalises false accusation and requires repeated review of death sentences by the throne; conviction still normally needs a confession"
      islamic: "7th–9th c. – proof lies on the claimant and the oath on the denier; fixed penalties are to be averted in case of doubt; no jury"
      europe: "1166 – Assize of Clarendon, juries of presentment; 1215 Magna Carta cl. 39; 1679 Habeas Corpus Act; 1764 Beccaria against torture and secret accusation; torture abolished in Prussia 1740–1754, Austria 1776, France 1780–1788"
      americas: "1791 – US Bill of Rights, Amendments 4–8"
    sources:
      - "Cesare Beccaria, Dei delitti e delle pene (1764)"
      - "John H. Langbein, Torture and the Law of Proof (1977)"
      - "Paul D. Halliday, Habeas Corpus: From England to Empire (2010)"

  - id: representative_government
    name: Representative government (elected assembly)
    category: institutions
    requires: []
    helps: [rule_of_law, secret_ballot, peaceful_transfer_of_power, public_accounts_audit]
    explain: >
      Eligible voters choose delegates for a term. The electorate has ranged from a few
      property holders to nearly all adult citizens. A representative
      assembly must consent to taxes and laws, can question ministers, and can be
      voted out. It solves two problems: a state too large for everyone to meet, and
      a ruler who needs money but cannot be trusted. The ruler gains too, because
      taxes that have been consented to are paid with less resistance and lenders
      trust a debt the assembly has voted. Minimum design: regular sessions the ruler
      cannot skip, control of the purse, free speech inside the chamber, and
      re-election so members stay answerable.
    pitfalls:
      - "Treating elections as the essence: historically consent to taxation and the right to refuse came first, and the vote was limited to property holders for centuries"
      - "Elections without a secret ballot, a voter roll and a loser who accepts the result produce bought votes and civil war"
      - "Calling Athens a representative democracy: Athenians voted in person and filled most offices by lot; they regarded election as aristocratic"
      - "Assuming assemblies were a European invention: Indian republics, the Old Assyrian city assembly, Carthage and many African and American polities governed by councils"
      - "An assembly the ruler summons only when he likes (French Estates General, not called 1614–1789) is no check at all"
    history:
      mesopotamia: "c. 1900 BC – the city assembly of Assur and its annually chosen eponym official share power with the ruler (Kanesh letters); Jacobsen's wider 'primitive democracy' thesis is disputed"
      india: "c. 6th–4th c. BC – gana-sangha republics such as the Vajji/Licchavi governed by assemblies of clan heads; c. 920 Uttaramerur inscriptions set rules for Chola village committees"
      greece: "508/507 BC – Cleisthenes' reforms at Athens: assembly of all citizens and a council of 500; direct, not representative"
      rome: "509 BC (traditional) – Republic with popular assemblies electing magistrates, voting by groups weighted towards the rich"
      africa: "Carthage (by 4th c. BC) elected suffetes with senate and assembly, praised by Aristotle; councils and age-set assemblies among Igbo, Oromo and others in later centuries"
      islamic: "7th c. – consultation (shura) is a principle but no elected body follows; the 1876 constitution provides for a parliament, which first meets in 1877"
      europe: "930 – Icelandic Althing; 1188 Cortes of León with elected townsmen; 1265 Montfort's parliament and 1295 Model Parliament in England; 1689 Parliament supreme over taxation"
      americas: "Haudenosaunee (Iroquois) Grand Council of clan-appointed chiefs, founded between the 12th and 16th c. (date disputed); 1619 Virginia House of Burgesses; 1789 US Congress"
      china: "1909 – first elected provincial assemblies"
    sources:
      - "Bernard Manin, The Principles of Representative Government (1997)"
      - "David Stasavage, The Decline and Rise of Democracy (2020)"
      - "John Stuart Mill, Considerations on Representative Government (1861)"

  - id: sortition
    name: Selection of officials by lot (sortition)
    category: institutions
    requires: []
    helps: [secret_ballot, public_accounts_audit]
    explain: >
      Offices and juries are filled by drawing lots among all qualified citizens for
      short terms, usually one year and not repeatable. A fair draw gives eligible
      citizens a chance to serve and reduces the value of campaigning. A small
      sample can still leave groups unrepresented. It works when tasks are done by
      boards rather than one man, candidates are vetted before and audited after
      office, and posts that need skill (generals, treasurers, engineers) are still
      elected. Athens, a city of some 30,000 citizens, filled most of its offices
      this way for nearly two centuries.
    pitfalls:
      - "Using lot for jobs that need rare skill: Athens elected its generals and financial officers"
      - "Lot without scrutiny before office and audit after it invites the incompetent and corrupt"
      - "Idealising Athens: women, slaves and resident foreigners, the large majority, had no part"
    history:
      greece: "c. 487 BC – Athenian archons chosen by lot; 5th–4th c. BC council of 500, most magistrates and all juries drawn by lot, later with the kleroterion allotment machine"
      india: "c. 920 – Uttaramerur (Chola) inscriptions: village committee members drawn by a child from a pot of palm-leaf tickets (kudavolai), with property, age and learning qualifications and a ban on recent holders and their kin"
      rome: "Republic – lot decides the order of voting units and the allocation of provinces, not who holds office"
      europe: "1268 – Venice elects its doge through alternating rounds of lot and vote; 1328 Florence draws the priors from bags of approved names (tratte) for two-month terms"
    sources:
      - "Mogens Herman Hansen, The Athenian Democracy in the Age of Demosthenes (1991)"
      - "Aristotle, Athenaion Politeia (Constitution of the Athenians), c. 330 BC"
      - "Bernard Manin, The Principles of Representative Government (1997)"

  - id: citizen_assembly
    name: Direct democracy (citizen assembly voting on laws)
    category: institutions
    requires: []
    helps: [sortition, secret_ballot]
    explain: >
      The assembled citizens vote on laws themselves, in person, instead of choosing
      representatives to do it for them. Athens ran a city of some 30,000 citizens
      this way for nearly two centuries, alongside offices filled by lot.
    pitfalls:
      - "Idealising Athens: women, slaves and resident foreigners, the large majority, had no part"
      - "Assuming it scales: a face-to-face assembly works for a city, not a kingdom"
    history:
      greece: "508/507 BC – Cleisthenes' reforms at Athens: assembly of all citizens and a council of 500; direct, not representative"
    sources:
      - "Mogens Herman Hansen, The Athenian Democracy in the Age of Demosthenes (1991)"
      - "Aristotle, Athenaion Politeia (Constitution of the Athenians), c. 330 BC"

  - id: secret_ballot
    name: Secret ballot
    category: institutions
    requires: []
    helps: [alphabet_writing, printing_press]
    explain: >
      Each voter marks his choice unseen and drops it in a sealed box, so nobody
      can know how he voted. A bribe or a threat is then wasted, because the buyer or
      landlord cannot check that he got what he paid for. The working design: one
      uniform official ballot listing all candidates, a screened booth, a list of
      voters ticked off once, a sealed box, and a count in public watched by all
      sides. For the illiterate, use tokens, balls or symbols.
    pitfalls:
      - "Ballots printed by the parties in different colours or sizes are not secret: observers see which one goes in"
      - "Keeping the vote secret but also the count: the count must be public, or the counters decide"
      - "No voter list means stuffed boxes and repeat voters"
      - "Applying it to representatives: voters need secrecy, legislators' votes should be public so they can be held to account"
      - "Expecting easy agreement: many serious thinkers, J. S. Mill among them, held that open voting was a public duty"
    history:
      greece: "5th–4th c. BC – Athenian jurors vote with pebbles and later bronze ballots with hollow or solid hubs, held so that the choice is hidden; ostracism by inscribed potsherds"
      india: "c. 4th–3rd c. BC – the Buddhist monastic code (Vinaya, Cullavagga IV) describes voting with wooden tickets (salaka) by secret, whispered or open method"
      rome: "139 BC – lex Gabinia introduces written ballots for elections, extended to trials and legislation 137–107 BC; Cicero complains that it weakened the nobility's control"
      europe: "1268 – Venice elects the doge with balls (ballotte, the origin of the word ballot); 1795 French constitution requires secret voting; 1872 British Ballot Act"
      global: "1856 – the Australian colonies of Tasmania, Victoria and South Australia enact the government-printed ballot and polling booth (Tasmania's act is dated February, Victoria's March); adopted by most democracies by 1900"
      americas: "1888 – Massachusetts and Louisville adopt the Australian ballot"
    sources:
      - "Malcolm Crook & Tom Crook, Reforming Voting Practices in a Global Age: The Making and Remaking of the Modern Secret Ballot in Britain, France and the United States, c.1600–c.1950, Past & Present 212 (2011)"
      - "Mogens Herman Hansen, The Athenian Democracy in the Age of Demosthenes (1991)"

  - id: peaceful_transfer_of_power
    name: Peaceful transfer of power and loyal opposition
    category: institutions
    requires: []
    helps: [representative_government, rule_of_law, secret_ballot]
    explain: >
      Office belongs to a term, not to a person: at its end the holder steps down and
      the loser of a contest accepts defeat. This holds only when losing is safe.
      The loser keeps life, property and the chance to win next time, and the winner
      cannot use office to destroy him; then waiting for the next round is better for
      both than fighting. Fixed terms, term limits, an army sworn to the office rather
      than the man, and a recognised opposition are the supports. The test is not the
      first election but the first time a government loses and leaves.
    pitfalls:
      - "Raising the stakes: where the loser faces prosecution, confiscation or death, nobody can afford to lose (Caesar crossed the Rubicon partly to escape trial)"
      - "Dismissing hereditary monarchy as pure folly: its function was to settle succession without a war, and elective monarchies (Poland, Holy Roman Empire, Mamluk Egypt) were often less stable"
      - "Believing a constitution's text secures it: it rests on the expectation that others will also comply"
      - "Ignoring the guards: whoever controls the capital's troops decides a contested succession (praetorians, janissaries)"
    history:
      greece: "5th c. BC – Athens: annual offices, audit on leaving; ostracism (from 487 BC) removes a dangerous leader for ten years without loss of property or honour"
      rome: "509 BC (traditional) – two consuls for one year; 180 BC lex Villia sets minimum ages and intervals; the system collapses in civil wars 133–27 BC"
      china: "c. 1046 BC onwards – the Mandate of Heaven justifies a change of dynasty after the fact; no rule for peaceful replacement of a ruler"
      islamic: "632–661 – the first four caliphs are chosen by consultation or designation and three die by violence; later rule is dynastic, the Ottomans legalising fratricide in the 15th c."
      africa: "by 16th c. – Oromo gadaa system hands leadership to the next age-set every eight years"
      europe: "1172–1797 – Venice elects doges for life under tight councils, with no coup succeeding; after 1688 British ministries change with the parliamentary majority; the phrase 'His Majesty's Opposition' dates from 1826"
      americas: "1797 – Washington retires after two terms; 1801 first handover between rival parties (Adams to Jefferson)"
    sources:
      - "Adam Przeworski, Democracy and the Market (1991)"
      - "Karl Popper, The Open Society and Its Enemies (1945)"

  - id: written_constitution
    name: Written constitution
    category: institutions
    requires: [writing_invention]
    helps: [rule_of_law, representative_government, printing_press]
    explain: >
      One public document, adopted by a special procedure, states who holds which
      power, how office-holders are chosen and removed, and what government may never
      do. It ranks above ordinary law and can be changed only by a harder procedure
      than ordinary law, so that a passing majority or a ruler cannot rewrite the
      rules for itself. Because everyone can read the same text, everyone can see when
      it is broken, which lets opponents coordinate resistance. Keep it short: organs,
      their powers, terms, a list of rights, and the amendment rule.
    pitfalls:
      - "Believing the paper does the work: most constitutions ever written were ignored within a generation; it needs courts, an assembly and armed forces that obey it"
      - "Making it impossible to amend (it gets broken instead) or as easy as ordinary law (it protects nothing)"
      - "Calling older documents constitutions: Shotoku's 17 articles (604) are moral maxims and Magna Carta a list of baronial grievances"
      - "Letting the sitting ruler or assembly write it: a body that drafts its own powers takes too many; use a separate convention and ratification"
    history:
      greece: "4th c. BC – Aristotle's school compiles descriptions of 158 city constitutions; a city's 'constitution' meant its arrangement of offices, not one document"
      islamic: "c. 622 – the so-called Constitution of Medina, a written pact between the Muslim emigrants, the clans of Medina and Jewish groups (text in Ibn Ishaq; generally accepted as authentic, unity and date of its parts disputed); 1861 Tunisia; 1876 Ottoman constitution"
      east_asia: "604 – Shotoku's Seventeen Articles in Japan, ethical precepts for officials; 1889 Meiji Constitution"
      europe: "1600 – statutes of San Marino; 1634 Swedish Instrument of Government; 1653 Cromwell's Instrument of Government; 1755 Corsica (Paoli); 1791 Poland (3 May) and France"
      americas: "1639 – Fundamental Orders of Connecticut; 1776 US state constitutions; 1780 Massachusetts, drafted by a convention and ratified by the towns; 1787 US Constitution; 1805 Haiti"
      africa: "1847 – Liberia; the Manden Charter attributed to 1236 is oral tradition first written down in the 20th c."
      india: "1950 – Constitution of India, the longest national constitution"
    sources:
      - "Hamilton, Madison & Jay, The Federalist Papers (1788)"
      - "Linda Colley, The Gun, the Ship and the Pen (2021)"

  - id: federalism_subsidiarity
    name: Federalism and subsidiarity
    category: institutions
    requires: []
    helps: [written_constitution, independent_judiciary_judicial_review]
    explain: >
      Several self-governing states or cities form one union that handles only what
      they cannot do separately: defence, foreign affairs, a common currency and
      free trade among members. Everything else stays with the smallest unit able to
      do it (subsidiarity). The union lets small states be as safe as a large one
      without losing local self-rule. It works only if the centre can tax and command
      individuals directly rather than beg contributions from the members, if a
      written pact lists who does what, and if an arbiter settles disputes between
      the levels.
    pitfalls:
      - "A league that needs unanimity or cannot tax is paralysed (US Articles of Confederation, the Dutch Republic's provinces, Poland's liberum veto)"
      - "Leaving open who decides a conflict between the union and a member, and whether members may leave: that question is then settled by war (Sonderbund 1847, United States 1861)"
      - "Assuming local rule means freedom: it can also shelter local oppression"
      - "Equal votes for unequal members breeds resentment; the Lycian League gave cities one, two or three votes by size"
    history:
      greece: "280 BC – Achaean League refounded: common citizenship, assembly, elected general and coinage; Lycian League (by 2nd c. BC) with votes proportional to city size (Strabo XIV.3), a model cited by Montesquieu and Madison"
      india: "c. 6th–4th c. BC – the Vajji confederacy of clans in north Bihar; 1950 federal constitution"
      islamic: "Ottoman religious communities exercise varying authority over worship, schooling and family affairs; 19th-c. reforms formalise communal institutions"
      africa: "c. 1701 – Asante union of states under the Asantehene and a council of chiefs"
      americas: "Haudenosaunee Confederacy of five (later six) nations with a council of fifty chiefs deciding by consensus, founded between the 12th and 16th c. (date disputed); 1787 United States"
      europe: "1291 – Swiss confederation begins as a defensive league; 1579 Union of Utrecht; 1603 Althusius' theory of federal union; 1848 Swiss federal state; 1931 the word subsidiarity appears in the encyclical Quadragesimo anno"
    sources:
      - "Hamilton, Madison & Jay, The Federalist Papers (1788)"
      - "J. A. O. Larsen, Greek Federal States (1968)"
      - "Johannes Althusius, Politica methodice digesta (1603)"

  - id: international_law_sovereignty
    name: Treaties, diplomacy and international law
    category: institutions
    requires: []
    helps: [alphabet_writing, postal_system, balance_of_power]
    explain: >
      States treat each other as equals that keep written treaties, do not harm
      envoys, and accept common rules for war, trade and the sea even without a
      ruler above them. It works through reciprocity and reputation: a state that
      kills ambassadors or breaks treaties finds nobody will deal with it. The tools
      are permanent resident ambassadors with immunity, treaties in agreed duplicate
      texts, arbitration by a third party, safe-conducts for merchants, and the
      principle that each ruler is master in his own territory and may not be
      attacked over his religion.
    pitfalls:
      - "Expecting enforcement: there is no court with an army; rules hold where breaking them costs reputation or invites a coalition"
      - "Repeating the story that the Peace of Westphalia (1648) founded sovereign equality: the treaties say little of the kind, and the idea is a later reading"
      - "Thinking diplomacy and treaties are modern or European: the Amarna letters, the Egyptian-Hittite treaty, Chinese interstate covenants and Islamic siyar are all older"
      - "Sending envoys without credentials, gifts and knowledge of protocol: in most eras a breach of form is an insult and can cost the envoy's life"
    history:
      mesopotamia: "c. 2350 BC – treaty between Ebla and Abarsal, the oldest surviving treaty text; c. 2450 BC Lagash-Umma border settlement on the Stele of the Vultures"
      egypt: "c. 1350 BC – Amarna letters: Egypt, Babylon, Mitanni, Hatti and Assyria correspond as 'brothers' in Akkadian; c. 1259 BC Egyptian-Hittite peace treaty after Kadesh, surviving in both versions"
      china: "7th–5th c. BC – sworn covenants (meng) among the Spring and Autumn states; 546 BC peace conference at Song"
      india: "c. 3rd c. BC–3rd c. AD – Arthashastra: circle of states, six policies, inviolability of envoys"
      greece: "5th–4th c. BC – heralds, proxenoi (resident representatives), interstate arbitration, common peace treaties"
      rome: "Republic – fetial rites for declaring just war; ius gentium as law common to all peoples"
      islamic: "c. 800 – al-Shaybani's Siyar, a systematic law of war, treaties and safe-conduct (aman) for foreigners"
      europe: "c. 1450s – permanent resident ambassadors among the Italian states after the Peace of Lodi (1454); 1625 Grotius; 1648 Peace of Westphalia; 1815 Congress of Vienna fixes diplomatic ranks"
      americas: "wampum belts record treaties among and with the Haudenosaunee (17th–18th c.)"
    sources:
      - "Hugo Grotius, De jure belli ac pacis (1625)"
      - "Garrett Mattingly, Renaissance Diplomacy (1955)"
      - "Mario Liverani, International Relations in the Ancient Near East, 1600–1100 BC (2001)"

  - id: property_rights_land_registry
    name: Secure property rights and land registry
    category: institutions
    requires: []
    helps: [surveying_triangulation, written_law_code, alphabet_writing]
    explain: >
      Every parcel of land is surveyed, mapped and entered in a public register with
      its owner and any mortgage; a sale or loan counts only once it is entered, and
      the state guarantees the entry. An owner who cannot be dispossessed by a
      stronger neighbour or the ruler will drain, plant and build; land with a clear
      title can be sold to whoever uses it best and pledged for credit; and the land
      tax can be assessed on measured area and quality instead of bargaining. Minimum
      design: parcel map, register of owners and charges, public access, and a court
      that follows the register.
    pitfalls:
      - "Registering only the claims of the powerful or the literate dispossesses everyone with customary, shared or seasonal rights (English enclosure, colonial titling)"
      - "A register that is not updated at every sale and inheritance is fiction within a generation (the Ming fish-scale registers were soon out of date)"
      - "Forgetting that people see a cadastre as a tax trap: they hide land, bribe surveyors or riot"
      - "Promising that titles alone create credit and growth: the evidence for de Soto's claim is mixed; courts, lenders and markets must exist too"
      - "Proposing private freehold where land belongs to lineage, village, temple or crown: it attacks the social order, not just a law"
    history:
      mesopotamia: "c. 2600 BC – sale documents for fields on clay and stone; c. 14th–12th c. BC Kassite kudurru boundary stones record royal land grants"
      egypt: "pharaonic land surveys after each flood for tax; c. AD 70 Roman Egypt's bibliotheke enkteseon, a public archive of title and mortgages in each district"
      rome: "surveyed land grids (centuriation) with bronze maps; AD 77 cadastre of Orange"
      china: "4th c. BC – Qin registers households and land; 1387 Ming fish-scale map registers (yulin tuce) of every plot"
      east_asia: "1582–1598 – Hideyoshi's cadastral survey (Taiko kenchi) measures Japan's fields by assessed yield"
      india: "1570s–1580s – Todar Mal's survey and assessment by measured area and crop under Akbar"
      islamic: "15th–16th c. – Ottoman tahrir survey registers of land, households and revenues; 1858 Ottoman Land Code and title registry"
      europe: "1086 – Domesday Book; c. 1130 Cologne's Schreinsbücher record urban property transfers; 1427 Florentine catasto; 1718–1760 Milanese mapped cadastre; 1807 Napoleonic cadastre"
      global: "1858 – Torrens system in South Australia: title by registration, guaranteed by the state"
    sources:
      - "Roger J. P. Kain & Elizabeth Baigent, The Cadastral Map in the Service of the State (1992)"
      - "James C. Scott, Seeing Like a State (1998)"
      - "Hernando de Soto, The Mystery of Capital (2000)"

  - id: commercial_law_contract_enforcement
    name: Contracts, notaries and merchant courts
    category: institutions
    requires: []
    helps: [alphabet_writing, written_law_code, standard_weights_measures]
    explain: >
      Long-distance trade needs a way to make a stranger keep his word. The proven
      package: a written contract, witnessed and sealed or registered with a public
      notary whose record counts as proof; a merchant court that judges fast by the
      custom of traders, with merchants as judges; and a community that shuts out a
      proven cheat everywhere its members trade. The threat of losing all future
      business makes honesty pay even where no state can reach. Add an agent's duty
      to keep accounts and joint responsibility of a town for its merchants' debts,
      and credit can travel across borders.
    pitfalls:
      - "Assuming trade needs a strong state first: Old Assyrian, Maghribi and Hanseatic traders enforced contracts through their own communities and reputation"
      - "Ordinary courts are too slow and formal for travelling merchants: fair courts settled cases between tides or before the fair closed"
      - "Oral agreements between distant partners cannot be proved after one of them dies; write, witness and keep duplicates"
      - "Reputation networks work only inside a closed group, which then excludes outsiders and resists newcomers"
    history:
      mesopotamia: "c. 1900 BC – Old Assyrian merchants at Kanesh (Anatolia) use sealed tablets, witnesses, partnership contracts and their own colony court; some 23,000 tablets survive"
      greece: "4th c. BC – Athens creates fast monthly maritime suits (dikai emporikai) open to foreigners, requiring a written contract"
      rome: "ius gentium and the peregrine praetor (242 BC) for cases involving foreigners; the Rhodian sea law on jettison"
      india: "guild (shreni) rules recognised as binding law in dharma texts and the Arthashastra"
      china: "Tang (7th–9th c.) – written sale and loan contracts with guarantors and witnesses, preserved at Turfan and Dunhuang"
      islamic: "7th c. – Quran 2:282 orders debts to be written and witnessed; 11th c. Maghribi Jewish traders of the Cairo Geniza police agents through reputation"
      europe: "12th c. – Italian public notaries (Genoa registers from 1154); 12th–13th c. Champagne fair courts and law merchant; 1283 Consulate of the Sea in Valencia"
    sources:
      - "Avner Greif, Institutions and the Path to the Modern Economy (2006)"
      - "Mogens Trolle Larsen, Ancient Kanesh: A Merchant Colony in Bronze Age Anatolia (2015)"

  - id: patents
    name: Patent law
    category: institutions
    requires: []
    helps: [rule_of_law, printing_press]
    explain: >
      Anyone who brings a new and useful device or process gets the sole right to
      make and sell it for a short fixed term (10 to 20 years), on condition that he
      files a description full enough for a skilled craftsman to copy it. This
      answers the inventor's dilemma: an invention costs time and money to perfect
      but can be copied at once, so without protection he either does not invent or
      keeps it secret and it dies with him. Minimum design: open to all, novelty
      test, fixed term, public register of descriptions, right to sell or license,
      and a court that stops copiers.
    pitfalls:
      - "Confusing patents with royal monopolies over existing trades (salt, soap, playing cards): those enrich favourites, raise prices and discredit the whole idea"
      - "Granting the right without a full written description: the public then gets nothing when the term ends"
      - "Terms that are too long or too broad block the next improvement (Watt's patent held back high-pressure steam until 1800)"
      - "Proposing free entry for inventors in a guild town: it attacks the guilds' right to control who practises a craft"
      - "Claiming patents caused the Industrial Revolution: historians disagree; most inventors of the time earned little from them"
    history:
      greece: "c. 500 BC – Sybaris is said to have given cooks a one-year monopoly on a new dish (anecdote in Athenaeus, citing Phylarchus)"
      china: "no pre-modern equivalent: techniques were kept in families or state workshops; 1898 first patent regulations, short-lived"
      east_asia: "1885 – Japan's Patent Monopoly Ordinance"
      europe: "1421 – Florence grants Brunelleschi a three-year monopoly for a cargo barge; 1474 Venetian statute (novelty, registration, 10 years); 1624 English Statute of Monopolies (14 years, true and first inventor); written specifications become the rule in England in the 18th c.; 1791 France"
      americas: "1790 – United States Patent Act"
    sources:
      - "Christine MacLeod, Inventing the Industrial Revolution: The English Patent System, 1660–1800 (1988)"
      - "Joel Mokyr, The Lever of Riches (1990)"

  - id: copyright
    name: Copyright for authors
    category: institutions
    requires: []
    helps: [printing_press, woodblock_printing, patents]
    explain: >
      The author of a book, map, engraving or piece of music has the sole right to
      print and sell it for a limited term, after which anyone may reprint it. Before
      printing, copying was slow and nobody needed the rule; after it, a printer who
      pays an author is undercut at once by one who does not, so careful new works
      go unpaid. A workable law vests the right in the author (who may sell it to a
      printer), sets a term of some 14 to 28 years, requires registration and deposit
      of a copy, and leaves ideas and facts free.
    pitfalls:
      - "Granting a perpetual right to a printers' guild: this is a censorship tool and a monopoly on old books, as with the London Stationers' Company"
      - "Trying to protect ideas, facts or methods rather than the particular text or image"
      - "Forgetting that it stops at the border: Dutch, Irish and American printers freely reprinted foreign works until the Berne Convention (1886)"
    history:
      china: "c. 1190s – Song printed books carry notices that the work is registered with the authorities and reprinting is forbidden; protection by case-by-case petition, no general law"
      europe: "1469 – Venice gives John of Speyer a five-year monopoly on printing; 1486 first known privilege to an author (Sabellico, Venice); 1557 Stationers' Company charter; 1710 Statute of Anne: 14 years, renewable once, vested in authors; 1886 Berne Convention"
      americas: "1790 – US Copyright Act, 14 years renewable once"
    sources:
      - "Adrian Johns, Piracy: The Intellectual Property Wars from Gutenberg to Gates (2009)"
      - "Mark Rose, Authors and Owners: The Invention of Copyright (1993)"

  - id: standard_weights_measures
    name: Standard weights and measures
    category: institutions
    requires: []
    helps: [metric_system_units, precision_measurement]
    explain: >
      One legal set of units for length, volume and weight, defined by master
      standards kept by the authority, with verified and stamped copies in every
      market and inspectors who test traders' measures and fine false ones. Where
      every town has its own bushel and the buyer's measure differs from the seller's,
      each sale is a dispute and long-distance trade and fair taxation are crippled.
      Make the standards hard to tamper with (stone, bronze), tie units together
      (a volume of water defines a weight), use simple ratios, and keep the reference
      set in a temple or town hall where anyone may check.
    pitfalls:
      - "Decreeing units without distributing copies and inspectors changes nothing; France needed until 1840 to make the metric system stick"
      - "Old measures encode rents, dues and wages (a heaped or a level bushel): changing them shifts income, so lords and peasants both resist"
      - "Defining a unit by something not reproducible (the king's foot, a grain of barley) lets it drift; use a made standard or a natural constant that can be re-measured"
      - "Thinking uniform measures began with the metric system: Indus weights show widespread standardisation, and Qin decrees explicitly required uniform measures"
    history:
      india: "c. 2600–1900 BC – Indus cities use cubical chert weights in a fixed series (doubling from about 0.87 g; a common unit near 13.7 g) across the whole civilisation"
      mesopotamia: "c. 2100 BC – Ur-Namma claims to have standardised the mina and the sila measure; inscribed royal stone weights survive from Shulgi's reign"
      egypt: "c. 2700 BC – royal cubit of about 52.4 cm, with master rods and working copies"
      china: "344 BC – Shang Yang's bronze standard measure; 221 BC Qin Shi Huang imposes uniform weights, measures and axle gauge, with inscribed standards sent to all commanderies"
      greece: "5th–4th c. BC – Athens keeps official standards and appoints metronomoi to inspect market measures"
      rome: "standard weights and measures kept on the Capitol and in temples, with copies in provincial towns (measuring tables survive at Pompeii)"
      islamic: "8th–9th c. – the muhtasib (market inspector) checks weights, measures and coin; glass weights stamped by the governor in Egypt"
      americas: "15th c. – Inca officials use standard units of length and volume for state storehouses and labour dues"
      europe: "1215 – Magna Carta cl. 35 demands one measure of wine, ale and corn; 1795–1799 metric system; 1875 Metre Convention"
    sources:
      - "Witold Kula, Measures and Men (1986)"
      - "Ken Alder, The Measure of All Things (2002)"

  - id: census_vital_registration
    name: Census and registration of births and deaths
    category: institutions
    requires: []
    helps: [alphabet_writing, paper, probability_statistics]
    explain: >
      Count every person on one fixed day, by name and household, with the same few
      questions (sex, age, occupation, place), and keep a running register of every
      birth, marriage and death with date, age and cause. The state then knows how
      many people it has to feed, tax and defend; and the registers show what kills
      people, where and when, which is the raw material for life tables, insurance
      and finding the source of epidemics. Use paid enumerators working from printed
      or ruled forms, total the returns twice independently, and keep the count
      separate from the tax roll if you want honest answers.
    pitfalls:
      - "A count used for tax or conscription is evaded: people hide sons and households merge on paper (Chinese registered population stayed implausibly flat for centuries)"
      - "Counting hearths or taxpayers and multiplying by a guessed household size"
      - "Recording deaths without age and cause, or with causes nobody has defined, yields nothing to analyse"
      - "Religious fear of numbering the people (David's census, 2 Samuel 24) was real: it helped defeat a British census bill in 1753"
      - "Collecting registers and never tabulating them: London's bills of mortality ran for decades before Graunt analysed them"
    history:
      egypt: "c. 2500 BC – regular counts of cattle and later of households for tax and labour service"
      mesopotamia: "c. 1800 BC – census of men liable for service at Mari, recorded on tablets"
      china: "4th c. BC – Qin household registration; AD 2 Han census records 12,233,062 households and 59,594,978 persons, the oldest surviving near-complete national count"
      india: "c. 3rd c. BC–3rd c. AD – the Arthashastra prescribes registers of households, occupations, livestock and travellers"
      rome: "from 5th c. BC – five-yearly census of citizens and property by the censors; 28 BC and AD 14 Augustus' counts of over four million citizens"
      east_asia: "670 – Japan's first nationwide household register (koseki), on the Tang model"
      islamic: "c. 640 – the caliph Umar's diwan registers soldiers and pensioners; 15th–16th c. Ottoman survey registers of taxable households"
      americas: "15th c. – Inca officials record population by age-grade and sex on knotted cords (khipu); 1790 first US federal census"
      europe: "1086 – Domesday survey; 1538 English parish registers; 1662 Graunt's analysis of the London bills; 1703 Iceland, first complete census by name; 1749 Sweden's continuous population statistics; 1801 British census; 1837 civil registration in England with cause of death"
    sources:
      - "John Graunt, Natural and Political Observations Mentioned in a Following Index, and Made upon the Bills of Mortality (1662)"
      - "Andrew Whitby, The Sum of the People: How the Census Has Shaped Nations (2020)"
      - "Ian Hacking, The Taming of Chance (1990)"

  - id: public_accounts_audit
    name: Public accounts, audit and budget
    category: institutions
    requires: []
    helps: [double_entry, arabic_numerals, representative_government]
    explain: >
      Everyone who handles public money must keep written accounts and present them
      at fixed dates to auditors who are independent of him, can demand receipts, and
      can charge him personally for what is missing. Next step: income and planned
      spending are set out in one yearly budget, approved in advance, and the
      accounts are published. Theft and waste are then visible, the ruler learns what
      he can afford, and lenders and taxpayers can see where the money goes. The
      separation of the one who orders a payment, the one who pays and the one who
      checks is the core rule.
    pitfalls:
      - "Auditors who depend on the people they audit find nothing"
      - "Auditing honesty but not purpose: accounts can balance while the money is wasted"
      - "Publishing flattering figures: Necker's Compte rendu (1781) showed a surplus by leaving out war spending and helped ruin French credit when the truth came out"
      - "Accusing a minister of theft at court without proof and protection is a quick way to be destroyed by him"
    history:
      mesopotamia: "c. 2100–2000 BC – Ur III state archives balance receipts and issues of grain, silver and labour per official, with yearly balanced accounts"
      greece: "5th–4th c. BC – every Athenian magistrate undergoes audit (euthyna) by boards of accountants on leaving office; public accounts cut in stone"
      india: "c. 3rd c. BC–3rd c. AD – Arthashastra describes a records and audit office, yearly closing of accounts and fines for officials who under-report revenue"
      china: "Qin and Han – yearly accounts sent up from every county (shangji) and checked by the chancellery; censors investigate officials"
      islamic: "c. 780 – Abbasid diwan al-zimam, a bureau that controls the accounts of the other departments"
      americas: "15th c. – Inca khipu-keepers account for storehouse contents and labour dues, checked by inspectors"
      europe: "c. 1110–1130 – English Exchequer audits sheriffs twice a year on a chequered counting cloth (oldest pipe roll 1130); c. 1320 French Chambre des comptes; 1689 Parliament votes supply yearly; 1861–1866 British Public Accounts Committee and Comptroller and Auditor General"
    sources:
      - "Jacob Soll, The Reckoning: Financial Accountability and the Rise and Fall of Nations (2014)"
      - "Richard FitzNigel, Dialogus de Scaccario (c. 1179)"

  - id: merit_civil_service
    name: Merit-based civil service (examinations)
    category: institutions
    requires: []
    helps: [paper, woodblock_printing, universal_schooling]
    explain: >
      Officials are recruited by open written examination, promoted on record, paid a
      fixed salary, moved between posts, and barred from serving in their home
      district. This breaks the hold of hereditary nobles and office-buyers and gives
      the ruler servants who owe their place to competence. To make the examination
      fair, cover the candidates' names, have clerks recopy the papers so handwriting
      cannot be recognised, use several examiners, and search candidates at the gate.
      Test what the work needs: law, accounts, drafting, practical problems.
    pitfalls:
      - "Examining literary polish instead of useful knowledge: China's eight-legged essay selected for memory and style for centuries"
      - "'Open to all' is not equal: preparation took years of leisure, so most graduates came from families that could afford it"
      - "Low salaries turn examined officials into bribe-takers"
      - "Where offices are sold (France, the papal court), each office is someone's purchased property and a source of crown revenue: abolishing sale means buying the holders out"
      - "Telling nobles that birth should not count is an attack on their livelihood and honour"
    history:
      china: "165 BC – Emperor Wen sets written policy questions to recommended candidates; 124 BC Imperial Academy trains officials; c. 600 Sui introduce degrees by written examination; under the Song (960–1279) examinations expand alongside family privilege; names are concealed, and from 1015 palace and metropolitan scripts are recopied to disguise handwriting; abolished 1905"
      east_asia: "958 – Goryeo Korea adopts the examinations (gwageo); 1075 Vietnam; Japan tried them briefly in the 8th c. and reverted to heredity"
      india: "c. 3rd c. BC–3rd c. AD – Arthashastra advises testing candidates' integrity by secret trials; 1853–1855 open competition for the Indian Civil Service"
      islamic: "15th–16th c. – Ottoman palace school trains recruited boys (devshirme) and promotes by ability, a merit system within a slave household rather than open examination"
      europe: "18th c. – Prussia develops qualifying examinations for higher state service; 1854 Northcote–Trevelyan Report proposes open competition in Britain (general from 1870)"
      americas: "1883 – Pendleton Act in the United States"
    sources:
      - "Benjamin A. Elman, A Cultural History of Civil Examinations in Late Imperial China (2000)"
      - "John W. Chaffee, The Thorny Gates of Learning in Sung China (1985)"
      - "Stafford Northcote & Charles Trevelyan, Report on the Organisation of the Permanent Civil Service (1854)"

  - id: universal_schooling
    name: Universal elementary schooling
    category: institutions
    requires: []
    helps: [alphabet_writing, printing_press, vernacular_translation, paper]
    explain: >
      Every child, girls included, is taught reading, writing and arithmetic in the
      spoken language for a few years, free of charge and by obligation. Literacy pays
      off for the whole society (soldiers who read orders, farmers who read almanacs,
      craftsmen who calculate) but not enough for a poor family to give up a child's
      labour, so it has to be compulsory, free and fitted around the farming year.
      What is needed: a school within walking distance, a paid and trained teacher, a
      cheap printed primer, local funding by a fixed tax, and inspection. Where
      teachers are scarce, let older pupils teach younger ones (monitorial method).
    pitfalls:
      - "Decreeing schools without teachers, pay or books: Prussia's 1717 edict and the Ming order of 1375 were patchily obeyed for generations"
      - "Teaching in Latin, classical Chinese or another learned language instead of the mother tongue"
      - "Ignoring that parents need children's work: allow harvest holidays and half-days or the benches stay empty"
      - "Expecting the powerful to welcome it: many landlords, employers and clergy held that literate peasants and servants become insolent"
      - "Promising quick wealth: the returns take a generation"
    history:
      china: "124 BC – Imperial Academy for future officials; 1375 the Hongwu emperor orders community schools (shexue) in every village, with uneven results"
      india: "village schools (pathshalas) and monastic teaching existed for centuries; state mass schooling only from the 19th–20th c."
      greece: "Sparta's compulsory state upbringing of boys (agoge); Hellenistic cities such as Teos (3rd c. BC) fund teachers for all free children"
      rome: "c. AD 64 – Joshua ben Gamla is credited with ordering teachers for children in every Judaean town (Talmud, Bava Batra 21a)"
      islamic: "from 7th–8th c. – Quran schools (kuttab) teach boys reading and writing widely, by fee or endowment, without compulsion"
      americas: "15th c. – Mexica (Aztec) boys and girls of all ranks are expected to attend a school (telpochcalli or calmecac); coverage in practice uncertain; 1647 Massachusetts requires towns to keep schools"
      europe: "1524 – Luther urges town councils to found schools for boys and girls; 1559 Württemberg school ordinance; 1592 Pfalz-Zweibrücken makes schooling compulsory for both sexes; 1717 and 1763 Prussia; 1774 Austria; 1881–1882 France free, compulsory and secular"
      east_asia: "17th–19th c. – Japanese temple schools (terakoya) give wide literacy without compulsion; 1872 compulsory schooling decreed"
    sources:
      - "James Van Horn Melton, Absolutism and the Eighteenth-Century Origins of Compulsory Schooling in Prussia and Austria (1988)"
      - "Carlo M. Cipolla, Literacy and Development in the West (1969)"

  - id: university
    name: University (self-governing body of teachers and students)
    category: institutions
    requires: []
    helps: [codex_book, paper, charitable_endowment_waqf]
    explain: >
      Teachers and students form a legal corporation with a charter: it governs
      itself, elects its head, owns property, is exempt from local courts, sets a
      fixed curriculum and examines candidates for degrees that are recognised
      elsewhere. The corporate form is the invention. Learning no longer depends on
      one famous teacher or one patron, a degree certifies competence to strangers,
      and the body can defend itself against town and bishop by threatening to leave.
      Method: lecture on a set text, then public disputation in which a thesis is
      attacked and defended by argument.
    pitfalls:
      - "Expecting a modern research university: teaching dominated, but university scholars also made original contributions, including work on motion at medieval Oxford and Paris"
      - "Arguing about 'the first university' without a definition: Nalanda, al-Qarawiyyin, al-Azhar and Bologna are different kinds of institution"
      - "Believing medieval universities taught a flat earth: the standard textbook, Sacrobosco's Sphere (c. 1230), teaches a round one"
      - "Proposing free inquiry in theology or contradicting Aristotle in a formal disputation can end in a heresy charge; philosophical questions were debated 'hypothetically'"
    history:
      china: "124 BC – Imperial Academy (Taixue), a state school for officials with tens of thousands of students by the 2nd c. AD"
      india: "c. 5th c. AD – Nalanda, a Buddhist monastic centre of learning with entrance tests, thousands of residents and foreign students (Xuanzang, 7th c.); destroyed c. 1200"
      greece: "c. 387 BC – Plato's Academy; philosophical schools as private associations; AD 425 imperial school at Constantinople with salaried chairs"
      islamic: "859 – al-Qarawiyyin mosque in Fez founded (its status as a 'university' from that date is disputed); c. 970 al-Azhar; 1067 opening of the Nizamiyya madrasa in Baghdad, endowed colleges of law granting personal licences to teach (ijaza)"
      africa: "14th–16th c. – Sankore and other mosque schools of Timbuktu"
      europe: "c. 1088 (traditional date) – Bologna's law schools, organised as a student corporation in the late 12th c.; c. 1150–1215 Paris, a masters' corporation; Oxford by 1167; 1810 Berlin, Humboldt's union of teaching and research"
      americas: "1551 – royal charters for universities in Lima and Mexico City; 1636 Harvard College"
    sources:
      - "Hilde de Ridder-Symoens (ed.), A History of the University in Europe, vol. 1: Universities in the Middle Ages (1992)"
      - "George Makdisi, The Rise of Colleges: Institutions of Learning in Islam and the West (1981)"

  - id: scientific_academy
    name: Scientific society or academy
    category: institutions
    requires: []
    helps: [scientific_method, reproducibility_open_publication, scientific_journal, postal_system]
    explain: >
      A chartered society of investigators that meets on fixed days to watch
      experiments performed, records them in minutes, corresponds with others abroad,
      and prints what it finds. Nothing is accepted on authority (the Royal Society's
      motto: nullius in verba); claims are shown before witnesses and can be repeated.
      A dated register of communications settles who was first, which removes the
      main reason for secrecy. To survive it needs a patron's charter, members' dues
      or a royal salary, a paid secretary and experimenter, and a firm rule to keep
      religion and politics out of its meetings.
    pitfalls:
      - "Depending on one patron: the Accademia del Cimento lasted ten years and died when its Medici sponsors lost interest (1667)"
      - "A talking club of gentlemen with no experiments, instruments or publication produces nothing"
      - "Shutting out craftsmen, instrument makers and physicians, who hold most of the practical knowledge"
      - "Allowing theological debate invites suppression (the first Lincei faded after Galileo's condemnation and its founder's death)"
      - "Picturing Baghdad's House of Wisdom as an academy of sciences: the sources show a palace library with translators and astronomers attached; its scale is debated"
    history:
      greece: "c. 387 BC – Plato's Academy; c. 335 BC Aristotle's Lyceum organises collective research"
      egypt: "c. 280 BC – the Museum of Alexandria: salaried scholars, a library and common meals, funded by the Ptolemies"
      china: "c. 318 BC – Jixia academy in Qi, where the state housed and paid scholars of rival schools; 8th c. Hanlin Academy, a body of court scholars"
      india: "14th–16th c. – the Kerala school of astronomy and mathematics, a teacher-pupil lineage without formal charter"
      islamic: "c. 800–830 – the caliphal library (Bayt al-Hikma) at Baghdad with associated translators and astronomers under al-Ma'mun; 1259 Maragha and c. 1420 Samarkand observatories with staffs of scholars"
      europe: "1603 – Accademia dei Lincei, Rome; 1657 Accademia del Cimento, Florence; 1660 Royal Society (charter 1662); 1666 Académie royale des sciences, with salaried members; 1700 Berlin; 1724 St Petersburg"
      americas: "1743 – American Philosophical Society, Philadelphia"
    sources:
      - "Thomas Sprat, The History of the Royal Society of London (1667)"
      - "Michael Hunter, Establishing the New Science: The Experience of the Early Royal Society (1989)"
      - "Dimitri Gutas, Greek Thought, Arabic Culture (1998)"

  - id: industrial_research_lab
    name: Organised industrial research laboratory
    category: institutions
    requires: [scientific_method]
    helps: [patents, university, systematic_invention, joint_stock_company]
    explain: >
      A firm or state employs trained scientists and craftsmen full time, in one
      building with shared instruments and workshops, to work on problems chosen for
      their value to the enterprise. Invention becomes a planned, budgeted activity
      instead of the luck of a lone genius. What makes it work: a mix of theorists,
      experimenters and model-makers in daily contact, a steady income that tolerates
      projects lasting years, laboratory notebooks signed and dated, patents to
      capture results, and a clear path from laboratory to factory.
    pitfalls:
      - "Expecting results in months: Bell Labs' solid-state work ran for a decade before the transistor"
      - "Hiring scientists but keeping them apart from the workshops and from the people who know the practical problems"
      - "Directing every step from above, or the opposite, leaving researchers with no problem that matters to anyone"
      - "Crediting Edison alone with the idea: German dye firms and university teaching laboratories set the pattern"
    history:
      china: "Song to Qing – state workshops and bureaus (arsenals, porcelain, the astronomical bureau) concentrate skilled staff on set tasks, without experimental research as a goal"
      islamic: "1259 – Maragha observatory: a funded staff, instruments and library on a long programme"
      europe: "1576 – Tycho Brahe's Uraniborg, a staffed research establishment; 1826 Liebig's teaching laboratory at Giessen; 1870s–1880s in-house laboratories at BASF, Hoechst and Bayer; 1887 Physikalisch-Technische Reichsanstalt, Berlin"
      americas: "1876 – Edison's Menlo Park 'invention factory'; 1900 General Electric Research Laboratory; 1925 Bell Telephone Laboratories"
      east_asia: "1917 – RIKEN founded in Japan"
    sources:
      - "Jon Gertner, The Idea Factory: Bell Labs and the Great Age of American Innovation (2012)"
      - "Leonard S. Reich, The Making of American Industrial Research: Science and Business at GE and Bell, 1876–1926 (1985)"

  - id: public_library_museum
    name: Public library and museum
    category: institutions
    requires: []
    helps: [library_catalogue, codex_book, printing_press, charitable_endowment_waqf]
    explain: >
      A collection of books, specimens, instruments and works of art kept at public
      or endowed expense and open to any reader without fee. One copy then serves
      hundreds, a craftsman or student with no money can reach the best knowledge,
      and objects are preserved and compared instead of scattered at an owner's
      death. It needs a permanent income, a keeper, a catalogue, fixed opening hours,
      a reading room, and rules against theft and fire. Lending is optional; access
      is the point.
    pitfalls:
      - "Calling Alexandria or Ashurbanipal's library public: both served a court and its scholars"
      - "No catalogue and no keeper means the books cannot be found and soon vanish"
      - "A single great collection is one fire away from loss; copies distributed among many libraries are what preserve texts"
      - "Repeating that Caesar or the Arabs destroyed the Library of Alexandria in one blaze: it declined over centuries of neglect, war and lost funding"
    history:
      mesopotamia: "7th c. BC – Ashurbanipal's palace library at Nineveh, some 30,000 tablets and fragments, systematically collected and labelled"
      egypt: "c. 280 BC – royal Library of Alexandria attached to the Museum"
      rome: "39 BC – Asinius Pollio opens Rome's first public library; by the 4th c. the city lists 28"
      china: "26 BC – the Han imperial library is collated and catalogued; great private libraries such as the Tianyi Ge (1561) admitted few; public libraries from the 1900s"
      india: "5th–12th c. – the monastic libraries of Nalanda, for residents and visiting monks"
      islamic: "1005 – the Dar al-Ilm in Cairo, open to all with free ink and paper (al-Maqrizi); endowed mosque and madrasa libraries with lending"
      europe: "1444 – library of San Marco, Florence, open to scholars; 1602 Bodleian; 1683 Ashmolean Museum, Oxford, open to paying public; 1759 British Museum opens free; 1793 Louvre; 1850 British Public Libraries Act"
      americas: "1731 – Franklin's subscription Library Company; 1833 Peterborough, New Hampshire, tax-supported; 1854 Boston Public Library opens"
    sources:
      - "Lionel Casson, Libraries in the Ancient World (2001)"
      - "Matthew Battles, Library: An Unquiet History (2003)"

  - id: free_press
    name: Freedom of the press
    category: institutions
    requires: []
    helps: [printing_press, woodblock_printing, freedom_of_speech_thought, rule_of_law, habeas_corpus_fair_trial]
    explain: >
      Anyone may print without asking a censor first; a writer answers only
      afterwards, before an ordinary court and jury, under a known law of libel in
      which truth is a defence. A government that cannot silence critics hears about
      its errors, corrupt officials and coming famines early and cheaply; and since
      no censor is infallible, suppressing what he thinks false also suppresses
      truths (Milton). The practical minimum is the end of licensing before
      publication. Public access to official records, as in Sweden's 1766 law, makes
      the freedom useful.
    pitfalls:
      - "Proposing it under a Renaissance prince or to the Church: unlicensed printing is sedition or heresy, and the proposer is the first test case"
      - "Believing truth wins by itself: early presses also poured out libels, forgeries, astrology and witch-hunting manuals"
      - "Thinking the end of censorship is enough: stamp taxes, seditious-libel trials and control of paper or the post silence a press as well"
      - "Confusing it with a right to defame private persons; every system that kept a free press also kept a libel law"
    history:
      china: "213 BC – Qin burning of books, the counter-example; from the Song, printing is mostly a private trade punished after the fact, with bans on calendars and state papers and literary inquisitions under the Qing"
      islamic: "1727 – the Ottoman sultan permits Müteferrika's press for non-religious books only; 1860s first private newspapers in Istanbul and Cairo, under press laws"
      india: "1780 – Hicky's Bengal Gazette, suppressed 1782; 1835 Metcalfe ends licensing of the press"
      europe: "1559 – papal Index of Prohibited Books; 1644 Milton's Areopagitica; 1695 England lets the Licensing Act lapse; 1766 Sweden's Freedom of the Press Act, the first such law, with public access to documents; 1770 Denmark-Norway abolishes censorship (restricted again from 1771); 1789 French Declaration, art. 11"
      americas: "1735 – a New York jury acquits the printer Zenger; 1791 First Amendment"
    sources:
      - "John Milton, Areopagitica (1644)"
      - "Fredrick S. Siebert, Freedom of the Press in England, 1476–1776 (1952)"

  - id: abolition_of_slavery
    name: Abolition of slavery
    category: institutions
    requires: []
    helps: [human_equality_dignity, natural_rights, free_press, representative_government]
    explain: >
      No human being can be owned, bought or sold. Abolition took different paths. Some jurisdictions freed people immediately;
      others first banned the trade or freed children born after a specified date.
      Ending ownership in practice required enforcement and protection against
      forced labour under a different name. The arguments that moved people were the
      testimony of the enslaved, the plain moral claim that what you would not suffer
      you may not inflict, and the observation that free workers who gain from their
      effort work better than whipped ones. Freed people need land or wages, or they
      fall into debt bondage.
    pitfalls:
      - "Assuming emancipation on paper secures freedom: owners could retain control through coercive labour contracts, policing and debt"
      - "Forgetting compensation and enforcement: Britain paid owners 20 million pounds (about 40 % of a year's budget) and kept a naval squadron off West Africa for decades"
      - "Freeing people with nothing: without land, tools or wages, sharecropping, 'apprenticeship' and debt peonage follow"
      - "Assuming slavery was dying on its own because it was unprofitable: plantation slavery was profitable until abolished"
      - "Reading the Cyrus Cylinder as abolishing slavery: it presents the king as a restorer of cults and communities after his conquest of Babylon"
    history:
      mesopotamia: "law codes regulate slavery and debt bondage; royal debt-release edicts (from c. 2400 BC) free debt slaves but not chattel slaves"
      greece: "4th c. BC – Alcidamas: 'God has left all men free; nature has made no one a slave' (quoted in a scholion on Aristotle's Rhetoric); no practical consequence"
      rome: "1st c. AD – Stoics such as Seneca (Letter 47) urge humane treatment; c. 379 Gregory of Nyssa condemns owning slaves outright in a sermon; the institution continues"
      china: "AD 9 – Wang Mang forbids the buying and selling of slaves, repealed AD 12; 1720s the Yongzheng emperor frees several hereditary 'mean' status groups; legal abolition 1910"
      east_asia: "1590 – Hideyoshi bans the slave trade in Japan; Korea frees government slaves in 1801 and abolishes hereditary slave status in 1886–1894"
      india: "c. 250 BC – Ashoka's edicts enjoin proper treatment of slaves and servants; 1843 Indian Slavery Act withdraws legal recognition"
      islamic: "7th c. – the Quran commends freeing slaves and the law forbids enslaving free Muslims, without abolition; 1846 Tunisia abolishes slavery; 1847–1857 Ottoman bans on the slave trade; 1962 Saudi Arabia"
      europe: "1256 – Bologna buys the freedom of nearly 6,000 serfs (Liber Paradisus); 1772 Somerset case in England; 1794 France abolishes (restored 1802, final 1848); 1807 British slave trade ban; 1833 British emancipation act; 1861 Russian serfs freed"
      americas: "1542 – Spanish New Laws forbid enslaving Indians, weakly enforced; 1777 Vermont; 1780 Pennsylvania's gradual abolition; 1791–1804 Haitian Revolution, the only slave revolt to found a state; 1865 United States; 1888 Brazil"
      africa: "1807 onwards – suppression of the Atlantic trade; 1981 Mauritania, the last state to abolish slavery in law"
    sources:
      - "Seymour Drescher, Abolition: A History of Slavery and Antislavery (2009)"
      - "Adam Hochschild, Bury the Chains (2005)"
      - "Olaudah Equiano, The Interesting Narrative of the Life of Olaudah Equiano (1789)"

  - id: women_rights_suffrage
    name: Women's legal rights and suffrage
    category: institutions
    requires: []
    helps: [human_equality_dignity, universal_schooling, representative_government]
    explain: >
      Women are full legal persons: they own and inherit property, keep their
      earnings, make contracts, sue, are educated like men, consent to marriage and
      may leave it, and vote and hold office on the same terms. Historically the
      order was property and schooling first, the vote last. The case that convinces
      is practical as well as moral: half of a people's talent is otherwise wasted,
      widows and wives already run farms, shops and regencies competently, and
      educated mothers raise healthier and better-taught children.
    pitfalls:
      - "Assuming women everywhere had no rights before the 19th century: Egyptian, Islamic and late Roman law let women own and manage property, while English coverture took it away on marriage"
      - "Starting with the vote where almost no men vote either; property rights and schooling are the reachable first steps"
      - "Arguing only from abstract equality: opponents cite scripture and nature, so point to existing queens, abbesses, merchants' widows and guild mistresses"
      - "Underrating the danger: Olympe de Gouges was guillotined in 1793, and a woman who speaks in public can be charged with scolding or witchcraft"
    history:
      egypt: "from c. 2500 BC – women own, inherit and bequeath property, make contracts and sue in their own names"
      mesopotamia: "c. 1754 BC – Hammurabi protects dowries and lets certain priestesses (naditu) trade and own property independently"
      india: "early Buddhist order of nuns (c. 5th–4th c. BC); dharma texts recognise women's own property (stridhana); 1950 universal adult suffrage"
      china: "Song law (10th–13th c.) gives daughters dowry and some inheritance shares; property rights narrow under the Ming; 1947–1949 equal suffrage"
      islamic: "7th c. – a wife keeps her own property and dower and can contract; inheritance shares depend on kinship (a daughter sharing with a son receives half his share); women founded many endowments; 1930–1934 Turkey grants the vote"
      americas: "Haudenosaunee clan mothers choose and can depose chiefs; 1776–1807 New Jersey lets propertied women vote; 1848 Seneca Falls declaration; 1869 Wyoming Territory"
      europe: "1405 – Christine de Pizan, The Book of the City of Ladies; 1791 Olympe de Gouges; 1792 Wollstonecraft; 1870–1882 British Married Women's Property Acts; 1906 Finland grants women equal rights to vote and stand for parliament; women elected in 1907; 1971 Switzerland"
      global: "1893 – New Zealand, first self-governing country where all women vote in national elections"
    sources:
      - "Mary Wollstonecraft, A Vindication of the Rights of Woman (1792)"
      - "John Stuart Mill, The Subjection of Women (1869)"
      - "Christine de Pizan, The Book of the City of Ladies (1405)"

  - id: charitable_endowment_waqf
    name: Perpetual endowment (waqf, foundation, trust)
    category: institutions
    requires: []
    helps: [property_rights_land_registry, commercial_law_contract_enforcement]
    explain: >
      An owner gives income-producing property (land, shops, a mill) irrevocably to a
      stated purpose: a school, hospital, bridge, fountain, library or relief of the
      poor. In a waqf, the founder names the beneficiaries and appoints an administrator
      to manage the dedicated assets and distribute their yield. Judges can supervise
      administration; the rules for changing a foundation vary across legal traditions. The service then outlives its founder and does not depend on
      yearly gifts or on the ruler's favour, and because endowed property is
      protected from confiscation and division among heirs, the rich have a strong
      motive to found one.
    pitfalls:
      - "Fixing the purpose forever: needs change, and a deed that cannot be altered leaves ruined schools with rich rents or the reverse; provide a way to redirect it"
      - "No audit of trustees: they lease the property to themselves cheaply"
      - "So much land passing into the 'dead hand' that rulers lose tax and later seize it (English mortmain statutes 1279, the dissolution of the monasteries, 19th c. Ottoman and Egyptian reforms)"
      - "Equating the waqf with the English trust: both can preserve property for beneficiaries, but their legal structures differ and direct influence is disputed"
    history:
      egypt: "c. 2500 BC – Old Kingdom tomb owners endow land to pay priests for perpetual offerings"
      india: "from c. 1st c. AD – inscriptions record perpetual endowments (akshaya-nivi) deposited with guilds and land grants to monasteries and temples"
      rome: "1st–2nd c. AD – private foundations for feasts, schools and child support (Pliny the Younger at Comum); 4th–6th c. Christian piae causae with legal personality"
      islamic: "early Islamic jurists develop waqf doctrine; a hadith relates that Umar retained land at Khaybar and assigned its yield to beneficiaries. Ottoman endowments supported families as well as schools, hospitals and fountains"
      china: "1050 – Fan Zhongyan's charitable estate for his lineage, which lasted into the 20th c.; Buddhist monastery endowments from the 5th c."
      europe: "1264 – Merton College, Oxford, an endowed self-governing college; 13th c. the English 'use' (later trust); 1521 the Fuggerei in Augsburg, endowed housing still operating"
    sources:
      - "Timur Kuran, The Long Divergence: How Islamic Law Held Back the Middle East (2011)"
      - "Monica M. Gaudiosi, The Influence of the Islamic Law of Waqf on the Development of the Trust in England: The Case of Merton College, University of Pennsylvania Law Review 136 (1988)"

  - id: guilds_apprenticeship
    name: Craft guilds and apprenticeship
    category: institutions
    requires: []
    helps: [commercial_law_contract_enforcement, standard_weights_measures]
    explain: >
      A written apprenticeship contract binds a youth to a master for a fixed term
      (often five to seven years): the master gives board and teaches the whole
      craft, the apprentice repays with cheap labour in the later years, and a guild
      or town registers and enforces the contract. This solves the problem that
      skill cannot be bought in a shop and that a master will not teach someone who
      may walk away half-trained. Guilds also set quality marks, inspect goods, and
      support sick members and widows. Understand them as well because every new
      device in a guild town has to pass them.
    pitfalls:
      - "Treating guilds as mere obstacles to remove: they are the town's government, militia and welfare system, and they will ruin a stranger who undersells their members"
      - "Introducing a labour-saving machine without a guild's consent: looms and mills were smashed and inventors expelled (ribbon loom bans from the 16th c.)"
      - "The opposite error of idealising them: guilds restricted entry, excluded women, Jews and outsiders, and kept prices up"
      - "Expecting a master to reveal trade secrets to a visitor: knowledge is his property and the guild's"
    history:
      mesopotamia: "c. 1754 BC – Hammurabi §§188–189 on craftsmen teaching adopted sons; 6th c. BC Babylonian apprenticeship contracts with fixed terms and penalties"
      india: "from c. 5th c. BC – shreni (guilds) of craftsmen and merchants with headmen, rules and seals, which also took deposits and managed endowments"
      rome: "collegia of craftsmen, mainly social and religious; apprenticeship contracts on papyrus from Roman Egypt (1st–3rd c. AD)"
      china: "Tang–Song – trade associations (hang) by street and craft, used by the state for requisitions; native-place guilds (huiguan) from the Ming"
      islamic: "craft organisations in Islamic cities are clear from the 14th–16th c. (earlier existence disputed)"
      europe: "early 10th c. – Byzantine Book of the Eparch regulates trades in Constantinople; 11th–12th c. merchant and craft guilds in Italian, Flemish and Rhenish towns; 1563 English Statute of Artificers fixes seven years; abolished in France 1791"
      africa: "craft guilds and hereditary craft groups in Benin (brass casters) and the Hausa cities"
    sources:
      - "Sheilagh Ogilvie, The European Guilds: An Economic Analysis (2019)"
      - "S. R. Epstein, Craft Guilds, Apprenticeship, and Technological Change in Preindustrial Europe, Journal of Economic History 58 (1998)"

  - id: public_health_board
    name: Permanent public health authority
    category: institutions
    requires: []
    helps: [census_vital_registration, quarantine, epidemiology_mapping, probability_statistics]
    explain: >
      A standing office with legal powers, a budget and its own staff that records
      every death by cause and place, receives compulsory reports of suspect cases
      from physicians, inspects food, water, markets and lodging houses, isolates the
      sick, controls travel in epidemics and keeps streets and wells clean. Its
      strength is routine: deaths are counted every week whether or not there is an
      epidemic, so a rise is seen within days. Give it authority over all ranks and
      over the clergy's processions, and pay those it shuts in, or cases will be
      hidden.
    pitfalls:
      - "A committee formed only when plague has already arrived acts too late and dissolves afterwards"
      - "Powers without compensation: merchants and families conceal cases if isolation means ruin and starvation"
      - "Records that do not note cause and parish in a consistent way cannot show where an outbreak starts"
      - "Acting on miasma theory helps by accident (cleaning, burning bedding) but also wastes effort on perfumes and bonfires and on killing cats and dogs, which removes the rats' enemies"
      - "Challenging religious gatherings in an epidemic without the bishop's backing provokes riot"
    history:
      rome: "Republic and Empire – aediles oversee markets, streets and water; 11 BC a permanent water board (curatores aquarum)"
      china: "1076 – the Song state founds public pharmacies and later relief clinics and paupers' hospitals; epidemic measures remain ad hoc"
      islamic: "from 9th c. – the muhtasib inspects food, markets, baths, street cleanliness and medical practitioners (hisba manuals); no plague magistracy"
      europe: "1348 – Venice and Florence appoint temporary plague committees; c. 1450 Milan has a permanent health office with death registers from 1452; 1486 Venice's Provveditori alla Sanità; 1527 Florence makes its board permanent; 1848 English General Board of Health"
    sources:
      - "Carlo M. Cipolla, Public Health and the Medical Profession in the Renaissance (1976)"
      - "Carlo M. Cipolla, Fighting the Plague in Seventeenth-Century Italy (1981)"

  - id: fire_brigade_police_building_codes
    name: Fire brigade, civil police and building rules
    category: institutions
    requires: []
    helps: [piston_pump, fired_brick_ceramics, insurance]
    explain: >
      Three linked city services. A permanent paid fire watch patrols at night and
      keeps buckets, ladders, hooks for pulling down houses, pumps and hoses ready,
      with authority to demolish in the fire's path. Building rules remove the fuel:
      brick or stone party walls rising above the roof, tile instead of thatch, wide
      streets, safe chimneys and ovens, a height limit. A civil police, in uniform
      but separate from the army, patrols to prevent crime and answers to a court.
      Cities that lacked these burned every generation.
    pitfalls:
      - "Volunteers summoned by bell arrive late and untrained; a standing watch is the point"
      - "Rules without inspectors and penalties are ignored the day after the fire; London kept its 1667 brick rule only because surveyors enforced it"
      - "Nobody dares pull down houses for a firebreak without clear authority and compensation (the Lord Mayor's hesitation in London, 1666)"
      - "Using soldiers or secret informers as police makes the force hated and useless for ordinary crime"
      - "Wooden pipes and hand squirts cannot reach a roof: a force pump with a leather hose is the decisive tool"
    history:
      mesopotamia: "c. 1754 BC – Hammurabi §§229–233: the builder answers with his life or purse if his house collapses"
      egypt: "New Kingdom – the Medjay serve as a police force guarding towns, tombs and frontiers"
      rome: "AD 6 – Augustus founds the vigiles, seven cohorts of freedmen as night watch and firemen; height limits; after the fire of 64 Nero orders wider streets and fire-resistant stone"
      china: "11th–13th c. – Song Kaifeng and Hangzhou have watchtowers, guard posts at intervals and soldier-firemen with buckets, hooks and ladders"
      islamic: "7th–8th c. – the shurta (police) under Umayyad and Abbasid governors; the muhtasib enforces building and market rules"
      east_asia: "1643 – daimyo fire companies in Edo; 1718–1720 townsmen's brigades (machi-bikeshi)"
      europe: "1667 – London Rebuilding Act requires brick and stone; 1667 Paris lieutenant of police; 1672 Jan van der Heyden's fire engine with flexible hose, Amsterdam; 1824 Edinburgh's municipal fire brigade (Braidwood); 1829 London Metropolitan Police (Peel)"
      americas: "1736 – Franklin's volunteer Union Fire Company, Philadelphia"
    sources:
      - "P. K. Baillie Reynolds, The Vigiles of Imperial Rome (1926)"
      - "Clive Emsley, The English Police: A Political and Social History (1991)"

  - id: social_insurance
    name: Social insurance and poor relief
    category: institutions
    requires: []
    helps: [insurance, life_tables_annuities, census_vital_registration, progressive_income_tax]
    explain: >
      Workers and employers pay small regular contributions into a common fund, by
      legal obligation; the fund pays a fixed benefit in sickness, after accidents,
      in old age and to widows and orphans. Compulsion is the key: a voluntary scheme
      attracts mainly those who expect to claim and fails, while a fund covering
      everyone spreads the risk and is cheap per head. It needs registers of members
      and their ages, mortality and sickness tables to set contributions, and funds
      kept apart from the treasury. Where wage records do not exist, begin with
      guild, parish or miners' mutual funds and public granaries.
    pitfalls:
      - "Promising benefits without tables of how many will claim: early schemes went bankrupt or set the pension age beyond most lifetimes"
      - "Saying Bismarck set retirement at 65: the 1889 law paid from age 70; 65 came in 1916"
      - "A fund the ruler can borrow from is spent on war"
      - "Relief that is paid only to the destitute and withdrawn on any earnings discourages work; relief tied to the home parish stops people moving to where work is"
      - "Thinking welfare is a modern invention: Roman grain doles, Islamic zakat, Chinese granaries and Inca storehouses all fed people on a large scale"
    history:
      rome: "123 BC – Gaius Gracchus' subsidised grain for citizens, free from 58 BC; c. AD 100 Trajan's alimenta, loan interest paying for poor children in Italian towns; burial clubs (collegia)"
      china: "54 BC – ever-normal granaries proposed by Geng Shouchang; Song (11th–12th c.) state poorhouses, charity clinics and paupers' cemeteries; 1168 Zhu Xi's community granary"
      india: "c. 250 BC – Ashoka's edicts record medical care, wells and shade trees for people and animals; temple and guild charity"
      islamic: "7th c. – zakat, an obligatory levy on wealth for the poor, debtors and travellers; treasury stipends under Umar; later waqf-funded hospitals and soup kitchens"
      americas: "15th c. – Inca state storehouses (qollqa) feed labourers, the old and the widowed and cover bad harvests"
      europe: "c. 1260 – miners' mutual funds (Knappschaften) in the Harz; 1601 English Poor Law, parish rates for the poor; 18th c. friendly societies; 1883–1889 Bismarck's sickness, accident and old-age insurance; 1911 British National Insurance; 1942 Beveridge Report"
    sources:
      - "E. P. Hennock, The Origin of the Welfare State in England and Germany, 1850–1914 (2007)"
      - "William Beveridge, Social Insurance and Allied Services (1942)"

  - id: trade_unions_collective_bargaining
    name: Trade unions and collective bargaining
    category: institutions
    requires: []
    helps: [free_press, representative_government, social_insurance]
    explain: >
      Workers in one trade or workplace combine, pay dues into a common fund, and
      bargain as a body over wages, hours and safety, with the strike as their last
      resort. One worker who refuses bad terms is replaced; all of them together
      cannot be, so bargaining power becomes roughly equal. The fund that pays
      members during a strike, sickness or unemployment is what holds a union
      together. For lasting results the right to combine must be lawful, agreements
      written and binding, and disputes brought to arbitration before a stoppage.
    pitfalls:
      - "Calling a strike with no fund and no law behind it: for most of history combination was conspiracy, punished by prison, transportation or death"
      - "Breaking machines instead of bargaining over them invites the army (Luddites, 1811–1816)"
      - "Assuming strikes are modern: Egyptian tomb builders stopped work over unpaid rations around 1157 BC"
      - "A union that controls entry to a trade behaves like a guild and shuts out the unskilled, women and newcomers"
    history:
      egypt: "c. 1157 BC – workmen of Deir el-Medina lay down tools over late rations under Ramesses III (Turin Strike Papyrus), the first recorded strike"
      rome: "occasional recorded work stoppages by bakers, builders and mint workers under the Empire"
      china: "Qing (18th c.) – strikes of Suzhou textile workers and stone inscriptions banning them"
      europe: "1378 – revolt of the Ciompi, Florence's unorganised wool workers; 14th–18th c. journeymen's associations; 1799–1800 British Combination Acts ban unions, repealed 1824; 1871 Trade Union Act legalises them"
      americas: "1842 – Commonwealth v. Hunt (Massachusetts) holds unions lawful; 1935 Wagner Act"
    sources:
      - "Sidney Webb & Beatrice Webb, The History of Trade Unionism (1894)"
      - "E. P. Thompson, The Making of the English Working Class (1963)"
