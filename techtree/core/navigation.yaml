# Blueprints from Tomorrow – tech tree fragment: Navigation, transport & exploration
# Schema: see header of techtree/core.yaml

technologies:

  # ------------------------------------------------------------ the world and its winds
  - id: world_geography
    name: The real layout of the world (continents, oceans, sea routes)
    category: navigation
    requires: [round_earth_size]
    helps: [wind_systems_ocean_currents, latitude_astrolabe_quadrant, map_projection_charts]
    explain: >
      In Florence in 1490 educated readers know the Earth is spherical. Dias rounded
      southern Africa in 1488, and Florentine maps by Henricus Martellus soon reflected
      his voyage. Indian Ocean pilots already link East African, Arabian and Indian
      ports by the monsoon. No Iberian ship has yet sailed round the Cape to India or
      crossed from the Canaries to the Caribbean. Columbus underestimates the globe and
      extends Asia too far east. One reconstruction puts his Cipangu (Japan) about 2,400
      nautical miles west of the Canaries. For comparison, from La Gomera (17° W) west
      to the meridian of central Japan (140° E) spans 203° of longitude. At 28° N that
      arc is about 10,750 nautical miles (203 × 60 × cos 28°). It crosses land and ends
      south of the main Japanese islands. There is no direct westward sailing distance
      through the Americas. The Bahamas lie roughly 3,000 nautical miles west of the
      Canaries. Farther west, the American mainland separates the Atlantic from the
      Pacific. A narrow isthmus joins North and South America at Panama. Cape Horn lies
      near 56° S. In the eastern hemisphere the Cape of Good Hope lies near 34° S, west
      of Africa’s southernmost point at Cape Agulhas. Beyond it, ports such as Kilwa and
      Malindi trade across the Indian Ocean. Calicut is on India’s west coast, while the
      clove-producing Moluccas lie far beyond India and the Strait of Malacca.
    pitfalls:
      - "Saying Columbus proved the Earth round or that his opponents thought it flat; they thought it too big to cross, and they were right"
      - "Quoting a distance to Japan without specifying the endpoints, direction and route, or treating a reconstruction of Columbus's estimate as his measured mileage"
      - "Putting the Pacific as narrow or the Americas as a single small island; or placing the Asian sources of cloves and nutmeg in the Caribbean"
      - "Telling Florentines nobody knew of Africa's southern tip; Dias rounded it in 1488 and Martellus in Florence drew it c. 1490"
      - "Mixing nautical, Roman and Arabic miles and Spanish or Portuguese leagues; always state the unit"
    history:
      greece: "c. 240 BC – Eratosthenes measures the Earth; 2nd c. AD Ptolemy's Geography (Eurasia 180° wide, too wide)"
      islamic: "9th–12th c. – al-Khwarizmi, al-Biruni, al-Idrisi (1154) map the known world; Arab and Persian ships know the Indian Ocean coast to Sofala (c. 20° S)"
      china: "1405–1433 – Zheng He's seven voyages reach Calicut, Hormuz, Aden and the East African coast; a detached party travels from Calicut to Jeddah and Mecca"
      east_asia: "1402 – Korean Kangnido world map shows Africa as a southward-pointing triangle"
      europe: "c. 1000 – Norse at L'Anse aux Meadows, Newfoundland (wood felled 1021); Greenland colonies abandoned by c. 1450; 1474 Toscanelli's letter on the westward route; 1488 Dias rounds the Cape; 1492 Columbus in the Caribbean; 1497–98 da Gama to Calicut; 1497 Cabot reaches northeastern North America (landfall disputed); 1500 Cabral to Brazil; c. 1503–04 Vespucci's Mundus Novus calls it a new world; 1519–22 Magellan and Elcano circumnavigate"
      global: "Pacific – Polynesians settle Hawaii, Rapa Nui and New Zealand c. 1000–1300 AD; genetic evidence supports pre-European contact with Indigenous Americans, without fixing the direction or landfall of a voyage"
      africa: "by 1490 – Swahili city-states (Kilwa, Mombasa, Malindi) in Indian Ocean trade with Arabia, India and China"
    sources:
      - "Chet Van Duzer, Henricus Martellus’s World Map at Yale (c. 1491): Multispectral Imaging, Sources, and Influence (2019)"
      - "Samuel Eliot Morison, Admiral of the Ocean Sea: A Life of Christopher Columbus (1942)"
      - "Felipe Fernández-Armesto, Pathfinders: A Global History of Exploration (2006)"
      - "Amerigo Vespucci, Mundus Novus (c. 1503–04)"

  - id: wind_systems_ocean_currents
    name: Global wind belts and ocean currents (trade winds, westerlies, volta do mar, monsoon)
    category: navigation
    requires: []
    helps: [world_geography, ship_design_caravel_carrack, latitude_astrolabe_quadrant]
    explain: >
      In 1490 Portuguese pilots know the North Atlantic volta do mar. On the return from
      West Africa they stand offshore and gain latitude until westerlies can carry them
      towards Portugal. The north-east trades and westward-flowing North Equatorial
      Current favour a passage from the Canaries towards the Caribbean. For the return,
      stand north towards the belt of westerlies around the latitude of the Azores
      before turning east. Columbus demonstrates this circuit in 1492–93. South of the
      seasonally migrating equatorial convergence zone lie the south-east trades.
      Southbound ships near southwestern Africa face headwinds and the north-flowing
      Benguela Current. In 1497 da Gama sails well offshore in the South Atlantic before
      turning back towards southern Africa. His exact open-ocean track is unknown. Off
      southeastern Africa the Agulhas Current flows southwest and steep seas form when
      wind opposes it. In the Arabian Sea the summer south-west monsoon (roughly
      June–September) favours passages towards India and the winter north-east monsoon
      the reverse. Pilots there knew these sailing seasons long before 1490. The
      subtropical gyres circulate clockwise in the north and anticlockwise in the south.
      The later trans-Pacific return from the Philippines likewise sought westerlies
      farther north.
    pitfalls:
      - "Sailing straight from Spain to the west at 40° N as though the prevailing westerlies there favoured the outward passage"
      - "Hugging the African coast south of Guinea; coastal calms, the north-flowing Benguela Current and south-east trades can hinder progress"
      - "Treating the winds as seasonal luck; prevailing winds describe averages, the convergence zone migrates and storms can interrupt a favourable passage"
      - "Explaining the trade winds as 'the Earth spinning under the air'; the driver is hot air rising at the equator (Hadley 1735), turned by the Earth's rotation"
      - "Assuming a return route exists across the Pacific along the outbound latitude; the Spaniards lost ships for forty years before the eastward crossings of 1565"
    history:
      india: "by the 1st c. BC – Indian, Arab and Greek ships cross the Arabian Sea with the monsoon (the 1st-c. AD Periplus of the Erythraean Sea records the seasonal route)"
      islamic: "c. 1490 – Ibn Majid's Kitab al-Fawa'id gives monsoon sailing seasons for the whole Indian Ocean"
      china: "1405–1433 – Zheng He's fleets leave Fujian in winter with the north-east monsoon and return with the south-west"
      europe: "1430s–1440s – Portuguese volta do mar via the Azores; 1492–93 Columbus's outbound and return routes; 1497 da Gama's wide South Atlantic arc; 1513 Alaminos notes the Gulf Stream; 1565 Arellano and Urdaneta reach New Spain independently; Urdaneta's documented crossing helps establish the Manila–Acapulco route; 1686 Halley's trade-wind map; 1735 Hadley's explanation; 1770 Franklin–Folger Gulf Stream chart"
      global: "Pacific – Polynesian navigators sail east against the trades, often in westerly spells, so they can run home if they find nothing"
    sources:
      - "Edmond Halley, An Historical Account of the Trade Winds, and Monsoons, Observable in the Seas between and near the Tropicks, Philosophical Transactions 16 (1686)"
      - "Alfred W. Crosby, Ecological Imperialism: The Biological Expansion of Europe, 900–1900 (1986)"
      - "J. H. Parry, The Discovery of the Sea (1974)"

  # ------------------------------------------------------------ position finding
  - id: magnetic_compass
    name: Magnetic compass
    category: navigation
    requires: []
    helps: [dead_reckoning_log_line, map_projection_charts]
    explain: >
      A steel needle stroked with a lodestone (natural magnetite) and floated on
      straw or balanced on a pin turns to point roughly north–south, in any weather
      and out of sight of land. For a ship's compass glue the needle under a card
      marked with 32 points, pivot it on a brass pin in a bowl with a lubber's line
      fixed to the ship's axis, hang it in gimbals, and keep iron away from it;
      re-magnetise the needle on the lodestone when it weakens. It tells the heading,
      not the position: it must be combined with speed and time (dead reckoning).
    pitfalls:
      - "Thinking the needle points to true north everywhere; the difference (variation) is several degrees and changes from place to place"
      - "Storing iron tools, cannon or nails next to the binnacle"
      - "Crediting Flavio Gioia of Amalfi (a later myth) or claiming the compass 'gave' longitude"
      - "Thinking the Han Chinese lodestone 'south-pointing spoon' was a ship's instrument; its use and date are disputed, and the sea compass is Song"
    history:
      china: "1044 – Wujing zongyao describes a magnetised iron 'fish'; 1088 Shen Kuo describes the needle and its deviation; c. 1117 Zhu Yu's Pingzhou ketan reports compasses on ships at Guangzhou (late 1090s)"
      europe: "c. 1190 – Alexander Neckam describes the needle at sea; 1269 Petrus Peregrinus describes a pivoted needle with scale; c. 1300 dry pivoted compass with card in the Mediterranean (independent invention or transmission is disputed)"
      islamic: "1232 – al-Awfi describes a fish-shaped compass; c. 1282 Baylak al-Qibjaqi describes a floating needle used at sea"
    sources:
      - "Petrus Peregrinus, Epistola de magnete (1269)"
      - "Joseph Needham, Science and Civilisation in China, vol. 4 part 1: Physics (1962)"
      - "Amir D. Aczel, The Riddle of the Compass (2001)"

  - id: magnetic_declination
    name: Magnetic variation (declination) and deviation
    category: navigation
    requires: [magnetic_compass]
    helps: [map_projection_charts, dead_reckoning_log_line]
    explain: >
      The needle aligns with the local horizontal magnetic field. At each
      place it is off true north by an angle (variation) that differs from place to
      place and slowly changes over the years. Measure it by comparing the compass
      with the true north given by the Pole Star or by the Sun's bearing at rising and
      setting (the bisector of equal-altitude bearings defines the meridian), then correct
      every course; a few degrees uncorrected over a 5,000 km crossing puts you
      hundreds of kilometres off. Iron aboard adds its own error (deviation), which
      changes with the ship's heading.
    pitfalls:
      - "Assuming variation is fixed forever; it drifts several degrees per century (Gellibrand 1635)"
      - "Hoping to find longitude from variation, a 16th–18th c. dream that never worked reliably"
      - "Correcting in the wrong direction (after correcting shipboard deviation, add easterly variation to a magnetic bearing to obtain true bearing)"
    history:
      china: "1088 – Shen Kuo notes the needle points slightly east of south"
      europe: "15th c. – Nuremberg portable sundials mark the local declination; 13–17 Sept 1492 Columbus notices the variation change in mid-Atlantic; 1538–41 João de Castro measures it systematically; 1635 Gellibrand shows secular change; 1701 Halley's isogonic chart; c. 1801–03 Flinders studies ship's iron deviation"
    sources:
      - "Edmond Halley, A New and Correct Chart Shewing the Variations of the Compass in the Western & Southern Oceans (1701)"
      - "E. G. R. Taylor, The Haven-Finding Art: A History of Navigation from Odysseus to Captain Cook (1956)"

  - id: dead_reckoning_log_line
    name: Dead reckoning (course, speed, time; log line and traverse table)
    category: navigation
    requires: []
    helps: [magnetic_compass, magnetic_declination, map_projection_charts]
    explain: >
      For each leg, advance from the last position in the estimated direction of travel
      by speed multiplied by elapsed time. Keep a compass course, time the watches with
      half-hour sandglasses, and measure speed with a log line: throw a wooden board
      (the chip) over the stern on a line knotted at regular intervals and count the
      knots running out while a small sandglass runs (for a 28-second glass about 14.4 m
      between knots gives speed in nautical miles per hour, 'knots'). Add every leg on
      the chart or with a table (the Venetian toleta de marteloio, 1436) and correct
      whenever a latitude or a landfall is known; errors grow by several per cent of the
      distance run because currents and leeway are invisible.
    pitfalls:
      - "Ignoring current and leeway; the Gulf Stream or Canary Current can move a ship 50–100 km a day without anyone noticing"
      - "Forgetting the compass variation in every leg"
      - "Assuming medieval pilots had no way of judging speed; pilots estimated it by eye, with errors that accumulated over a crossing"
      - "Using knots per hour (a knot already is a speed)"
    history:
      europe: "c. 1270–1300 – Mediterranean pilots reckon with compass and chart; 1338 first image of a sandglass (Lorenzetti, Siena); 1436 Andrea Bianco's toleta de marteloio; 1574 William Bourne describes the log and line in print"
      china: "c. 1100 – Song pilots steer by compass and keep rutters of courses and distances"
      global: "Pacific – Polynesian and Micronesian navigators track progress mentally against star and island bearings (etak)"
    sources:
      - "William Bourne, A Regiment for the Sea (1574)"
      - "E. G. R. Taylor, The Haven-Finding Art: A History of Navigation from Odysseus to Captain Cook (1956)"

  - id: latitude_astrolabe_quadrant
    name: Latitude from Pole Star and noon Sun (quadrant, astrolabe, cross-staff, kamal)
    category: navigation
    requires: []
    helps: [world_geography, map_projection_charts, trigonometry]
    explain: >
      Latitude is the signed altitude of the celestial pole. North of the equator,
      measure Polaris with a quadrant and plumb line. In 1490 the star circles roughly
      3.5° from the pole, so pilots use the orientation of nearby stars to correct the
      reading. At local apparent noon measure the Sun's altitude by its shadow and take
      its solar declination for the date (north positive). The zenith distance is 90°
      minus the altitude. If the Sun culminates south of the observer, add the zenith
      distance to the declination. If it culminates north, subtract it. At the zenith
      latitude equals declination. A quadrant measures altitude against a plumb line. On
      a mariner’s astrolabe, the sighting rule turns against a graduated vertical disc.
      A one-degree error means about 60 nautical miles north or south. Portuguese
      navigators had tried solar observations in Guinea by 1485. Zacuto's astronomical
      tables existed in manuscript by 1478, and the printed Almanach perpetuum followed
      in 1496. A suspended instrument works better ashore than on a pitching deck.
      Reaching a known latitude and following it east or west can guide a landfall
      without giving longitude.
    pitfalls:
      - "Forgetting the Sun's declination, which swings between +23.4° and −23.4° over the year; without the table the noon method is useless"
      - "Taking the Pole Star as exactly at the pole in 1490 (3.5° off then, about 0.7° today)"
      - "Expecting minute accuracy from a rolling deck; at sea 1° was good with quadrant or astrolabe, and the plumb line swings (Columbus's readings in Cuba were wildly wrong)"
      - "Using the Pole Star south of the equator; it is invisible there, the noon Sun and suitable southern stars give alternatives"
      - "Looking straight into the Sun with a cross-staff; use the backstaff (Davis 1594) or the astrolabe's shadow pinholes"
    history:
      islamic: "c. 1490 – Ibn Majid gives star altitudes in finger units (isba, about 1.6°) measured with the kamal, a wooden board on a knotted cord"
      china: "early 15th c. – Zheng He's charts give star altitudes in 'fingers' measured with star-boards (qianxing ban)"
      europe: "c. 1460 – Portuguese pilots measure the Pole Star with the quadrant; 1485 José Vizinho measures noon Sun latitudes in Guinea; 1496 Zacuto's Almanach perpetuum; mariner's astrolabes in Portuguese navigation by the late 1480s (Sodré astrolabe dated c. 1496–1501, recovered from a 1503 wreck); c. 1509 printed Regimento do astrolábio; cross-staff at sea from c. 1514"
      global: "Pacific – Polynesian navigators use zenith stars passing overhead to know the latitude of an island"
    sources:
      - "David L. Mearns, Jason M. Warnett and Mark A. Williams, An Early Portuguese Mariner's Astrolabe from the Sodré Wreck-site, Al Hallaniyah, Oman (2019)"
      - "Abraham Zacuto, Almanach perpetuum (1496)"
      - "David W. Waters, The Art of Navigation in England in Elizabethan and Early Stuart Times (1958)"
      - "G. R. Tibbetts, Arab Navigation in the Indian Ocean before the Coming of the Portuguese (1971)"

  - id: reflecting_octant_sextant
    name: Reflecting instruments (octant, sextant)
    category: navigation
    requires: []
    helps: [glass_mirrors, latitude_astrolabe_quadrant, telescope]
    explain: >
      Two mirrors bring the image of a star or the Sun down onto the horizon, so both
      are seen at once and the observer can judge coincidence despite the ship's motion;
      an angle doubles on the scale (a 60° arc measures 120°), and with a small
      telescope altitudes are good to a minute of arc.
    pitfalls:
      - "Measuring the Sun without shade glasses (eye damage)"
      - "Proposing it in 1490 as a ready tool: instruments accurate to about a minute of arc are more than 250 years away"
    history:
      europe: "1731 – John Hadley's octant (also Thomas Godfrey, Philadelphia); 1757 Campbell's sextant"
    sources:
      - "John Hadley, The Description of a New Instrument for Taking Angles, Philosophical Transactions 37 (1731)"
      - "Derek Howse, Greenwich Time and the Discovery of the Longitude (1980)"

  - id: longitude_lunar_distances
    name: Longitude by lunar distances
    category: navigation
    requires: [reflecting_octant_sextant]
    helps: [latitude_astrolabe_quadrant, logarithms]
    explain: >
      The Moon moves about its own width (half a degree) per hour against the stars,
      so it is a clock in the sky: measure its angle to a bright star, look up in a
      printed almanac at what Greenwich time that angle occurs, and the difference
      from local time gives longitude (four minutes of time equal one degree). The
      method needs very accurate lunar tables (Mayer, from Newtonian theory) and about
      half an hour of calculation, and gives longitude to about half a degree.
    pitfalls:
      - "Proposing lunar distances in 1490: the instruments and the tables, both accurate to about a minute of arc, are more than 250 years away"
      - "Forgetting to correct for refraction, parallax of the Moon and the height of the eye; uncorrected the result is degrees off"
      - "Crediting Vespucci or Columbus with real longitudes; Vespucci's 1499 Moon–Mars conjunction and Columbus's eclipse timings (1494, 1504) gave errors of many degrees"
    history:
      europe: "1499 – Vespucci times a Moon–Mars conjunction; 1514 Johannes Werner proposes the lunar-distance method; 1755 Tobias Mayer's lunar tables; 1767 Maskelyne's first Nautical Almanac"
    sources:
      - "Nevil Maskelyne, The British Mariner's Guide (1763)"
      - "Derek Howse, Greenwich Time and the Discovery of the Longitude (1980)"

  - id: longitude_chronometer
    name: Longitude by marine chronometer
    category: navigation
    requires: [mechanical_clock]
    helps: [latitude_astrolabe_quadrant, precision_measurement]
    explain: >
      The Earth turns 15° an hour, so longitude is a time difference: carry a clock that
      keeps home-port time and compare it with local time from the Sun (noon, or a timed
      altitude); convert apparent solar time to mean time using the equation of time
      before comparing the readings; every four minutes of difference is one degree,
      every second about 460 m at the equator. To be useful the clock must keep a known
      rate to a few seconds a day through months of rolling, heat and cold; pendulums
      fail at sea, so it uses a balance wheel with temperature compensation (bimetal
      strips) and a detached escapement. Harrison's H4 lost only about five seconds on a
      voyage of 81 days to Jamaica (1761–62); Kendall's copy went round the world with
      Cook.
    pitfalls:
      - "Using a pendulum clock at sea"
      - "Thinking one perfect clock is enough; carry two or three and log each one's daily rate"
      - "Crediting the method to Harrison; Gemma Frisius proposed it in 1530, the problem was building the clock"
      - "Saying the chronometer replaced lunar distances at once; chronometers were expensive and both methods coexisted until the mid-19th c."
    history:
      europe: "1530 – Gemma Frisius proposes the clock method; 1714 Longitude Act offers £20,000; 1761–62 Harrison's H4 trial; 1772–75 Kendall's K1 on Cook's second voyage; 1780s Arnold and Earnshaw make affordable chronometers; Le Roy and Berthoud in France"
    sources:
      - "Rupert T. Gould, The Marine Chronometer: Its History and Development (1923)"
      - "Dava Sobel, Longitude (1995)"
      - "William J. H. Andrewes (ed.), The Quest for Longitude (1996)"

  - id: map_projection_charts
    name: Nautical charts and map projections (portolans, Ptolemy, Mercator)
    category: navigation
    requires: []
    helps: [round_earth_size, world_geography, latitude_astrolabe_quadrant, magnetic_compass, trigonometry]
    explain: >
      A chart is a calculating tool: portolan charts draw coasts with a web of compass
      lines (rhumbs) from wind roses, so a pilot reads the course with a ruler and
      the distance with dividers, which works in the Mediterranean but distorts large
      oceans because they ignore the curve of the Earth. On a sphere the meridians
      converge, so one degree of longitude shrinks with the cosine of latitude (111 km
      at the equator, 56 km at 60°); Mercator (1569) spaces the parallels ever wider
      towards the poles so that every line of constant true bearing is straight,
      at the price of making high latitudes look huge. For the player in Florence:
      Ptolemy's grid of latitude and longitude was revived here (Latin translation by
      Jacopo Angeli, c. 1406–10), and Martellus' world map of c. 1490 already shows
      Dias's Cape.
    pitfalls:
      - "Using a flat plane chart over thousands of kilometres; east–west distances at 40° are overstated by about 30 per cent"
      - "Reading areas on a Mercator map (Greenland is not the size of Africa)"
      - "Thinking a straight line on a Mercator chart is the shortest route; it is a constant course (rhumb line), the shortest is a great circle"
      - "Assuming medieval maps were all symbolic T-O maps; portolan charts of c. 1300 are remarkably accurate for the Mediterranean"
    history:
      china: "3rd c. – Pei Xiu's grid principles; 1136 Yu ji tu, a grid map carved in stone; Zheng He's route chart survives in the Wubei zhi (1621)"
      greece: "c. 150 AD – Ptolemy's Geography with latitude, longitude and two projections"
      islamic: "1154 – al-Idrisi's world map for Roger II of Sicily; 1513 Piri Reis map with the Atlantic coasts"
      europe: "c. 1275 – Carta Pisana, oldest surviving portolan; 1406–10 Ptolemy in Latin (Florence); 1477 and 1482 printed Ptolemies (Bologna, Ulm, Florence); c. 1490 Martellus; 1492 Behaim's globe; 1500 Juan de la Cosa's chart with America; 1507 Waldseemüller names America; 1569 Mercator; 1599 Edward Wright gives the mathematics"
    sources:
      - "J. B. Harley and David Woodward (eds), The History of Cartography, vol. 1 (1987)"
      - "Mark Monmonier, Rhumb Lines and Map Wars: A Social History of the Mercator Projection (2004)"
      - "Edward Wright, Certaine Errors in Navigation (1599)"

  - id: sounding_lead_pilotage
    name: Sounding lead, rutters and coastal pilotage
    category: navigation
    requires: []
    helps: [dead_reckoning_log_line, map_projection_charts, tides_tide_tables]
    explain: >
      Near land the depth and the kind of bottom tell where you are: a lead weight on
      a line marked in fathoms (about 1.8 m) is thrown ahead, and a hollow in its base
      filled with tallow brings up sand, shell, mud or gravel to compare with the
      written sailing directions (rutters, routiers, periploi), which list depths,
      bottoms, landmarks, courses and tides harbour by harbour. Sound continuously at
      night and in fog when approaching a coast, and anchor when the depth shoals
      unexpectedly.
    pitfalls:
      - "Relying on deep-sea lines near cliffs; many coasts drop straight to great depth, so no bottom does not mean safety"
      - "Trusting a rutter from another season or tide state"
      - "Dismissing pilotage as primitive; in the North Sea and Channel it was the main method well into the 18th c."
    history:
      greece: "5th c. BC – Herodotus reports sounding a day's sail off Egypt (11 fathoms, mud)"
      europe: "c. 1250–1296 – Compasso da navigare (Mediterranean rutter); 15th c. Low German Seebuch; written 1483–84 Pierre Garcie's routier for Atlantic coasts"
      islamic: "c. 1490 – Ibn Majid's rahmani (rutters) for the Indian Ocean"
      china: "15th–16th c. – Shunfeng xiangsong rutter of compass courses"
    sources:
      - "Herodotus, Histories II.5"
      - "David W. Waters, The Rutters of the Sea: The Sailing Directions of Pierre Garcie (1967)"

  - id: tides_tide_tables
    name: Tides and tide tables
    category: navigation
    requires: []
    helps: [universal_gravitation, sounding_lead_pilotage]
    explain: >
      At a port with predominantly semidiurnal tides, successive high waters are about
      12 hours 25 minutes apart on average. Other ports have one high water a day or
      two of unequal height. The Moon and Sun both contribute tidal forces. Around new
      and full moon their effects reinforce one another, giving spring tides. Near the
      quarters the range is usually smaller. The shape and depth of a basin affect both
      height and timing. Repeated local observations establish a port's usual delay
      after lunar transit and the variation through the lunar month. A rough harbour
      table is possible centuries before a gravitational theory. Many Mediterranean
      ports have a small range, whereas the Bay of Fundy can reach about 16 m.
    pitfalls:
      - "Treating Mediterranean experience as valid outside; Italian crews get caught out on Atlantic and Channel coasts"
      - "Inferring the number or timing of local tides directly from the Moon overhead; basins respond differently"
      - "Applying one port's timing to another harbour along the coast"
    history:
      greece: "c. 325 BC – Pytheas links tides to the Moon; 2nd c. BC Seleucus notes the daily inequality"
      china: "c. 770 – Dou Shumeng describes a graphical method for predicting tides; surviving Qiantang tables date to AD 1056"
      islamic: "c. 850 – Abu Ma'shar discusses tides and the Moon"
      europe: "725 – Bede notes that high water comes at different times at different ports; 13th c. tide table 'flod at London brigge'; 1687 Newton's gravitational explanation; 1872 Kelvin's tide-predicting machine"
    sources:
      - "Bede, De temporum ratione (725), ch. 29"
      - "Yang Zuosheng et al., Historical Development and Use of Thousand-Year-Old Tide-Prediction Tables, Limnology and Oceanography 34 (1989), 953–957"
      - "David Edgar Cartwright, Tides: A Scientific History (1999)"

  - id: polynesian_wayfinding
    name: Polynesian and Micronesian wayfinding
    category: navigation
    requires: []
    helps: [world_geography, wind_systems_ocean_currents]
    explain: >
      Without instruments, navigators steer by the rising and setting points of
      memorised stars on the horizon (a 'star compass' of about 32 houses), by the
      direction of the long ocean swells felt through the hull, by sun and wind, and
      they expand a small island into a wide target using signs: land birds such as
      terns and noddies fly out up to 30–50 km at dawn and return at dusk, clouds pile
      up and turn greenish over lagoons, swells bend around islands. Double-hulled
      canoes 15–20 m long with crab-claw sails carried families, plants and animals
      over thousands of kilometres, often sailing upwind first so that home lay
      downwind.
    pitfalls:
      - "Calling the settlement of the Pacific accidental drift; computer simulations and the 1976 Hokule'a voyage Hawaii–Tahiti without instruments refute that"
      - "Dating it too early or too late; East Polynesia was settled quickly c. 1000–1300 AD after a long pause"
      - "Assuming the methods transfer to a European ship with a crew that has not learned them from childhood"
    history:
      global: "Pacific – c. 1200–900 BC Lapita voyagers reach Fiji, Tonga, Samoa; c. 1000–1300 AD Hawaii, Rapa Nui, New Zealand; pre-European contact with Indigenous Americans supported by genetic evidence; Marshall Islands stick charts of swell patterns; 1769 Tupaia draws a chart of some 70 islands for Cook; 1976 Hokule'a (Mau Piailug)"
    sources:
      - "David Lewis, We, the Navigators: The Ancient Art of Landfinding in the Pacific (1972)"
      - "Ben Finney, Voyage of Rediscovery: A Cultural Odyssey through Polynesia (1994)"
      - "J. Víctor Moreno-Mayar et al., Ancient Rapanui genomes reveal resilience and pre-European contact with the Americas, Nature 633 (2024)"
      - "Janet M. Wilmshurst et al., High-precision radiocarbon dating shows recent and rapid initial human colonization of East Polynesia, PNAS 108 (2011)"

  # ------------------------------------------------------------ ships
  - id: ship_design_caravel_carrack
    name: Ocean-going ships (carvel hull, sternpost rudder, mixed square and lateen rig)
    category: navigation
    requires: []
    helps: [wind_systems_ocean_currents]
    explain: >
      In 1490 Iberian pilots already use both caravels and larger cargo ships called
      naus or naos. A typical caravel used on the African coast has shallow draught and
      lateen sails, useful for exploring anchorages and working to windward by tacking.
      A square-rigged caravel can carry square canvas forward and a lateen aft. The
      larger carrack has capacity for stores and freight, usually with square sails on
      the fore and main masts and a lateen mizzen to help balance the helm. In a carvel
      hull the planks meet edge to edge. This describes the planking, while frame-first
      describes the order of construction. A sternpost rudder gives the helmsman
      control while water flows past it. On the 1492 voyage the Santa María is a nao,
      the Pinta and Niña caravels. Their size and rig have to be reconstructed from
      incomplete records.
    pitfalls:
      - "Thinking Columbus's ships were primitive or tiny for their task; Santa María, Pinta and Niña were working sailing vessels whose exact dimensions and carrying capacities are uncertain, and caravels were the explorers' choice"
      - "Saying sails let ships sail straight into the wind"
      - "Assuming ocean crossings require carvel planking; Norse clinker-built ships had crossed the North Atlantic centuries earlier"
      - "Overloading the castles; top weight reduces stability; flooding through open gunports contributed to the losses of Mary Rose in 1545 and Vasa in 1628"
    history:
      china: "Han period – stern-mounted steering oar or rudder on a Han pottery ship model; Song–Ming multi-masted junks with balanced rudders"
      islamic: "from the 1st millennium AD – lateen-rigged sewn-plank dhows in the Indian Ocean"
      europe: "c. 1180–1240 – sternpost rudder on northern cogs; 14th–15th c. three-masted carrack; c. 1440 Portuguese caravel for the Africa voyages; by 1500 the full-rigged ship"
      rome: "1st c. BC–4th c. AD – large mortise-and-tenon shell-built merchantmen; the shift to frame-first building is complete in the Mediterranean by c. 1000"
    sources:
      - "Richard W. Unger, The Ship in the Medieval Economy, 600–1600 (1980)"
      - "Roger C. Smith, Vanguard of Empire: Ships of Exploration in the Age of Columbus (1993)"
      - "Lincoln P. Paine, The Sea and Civilization: A Maritime History of the World (2013)"

  - id: chinese_junk_treasure_ships
    name: Chinese junk and Zheng He's treasure fleets
    category: navigation
    requires: []
    helps: [watertight_bulkheads, ship_design_caravel_carrack]
    explain: >
      The Chinese junk had flat transverse bulkheads that divide the hull into
      watertight compartments, a large stern rudder that can be raised in shallow
      water, and sails stiffened with bamboo battens that are reefed in seconds by
      lowering them, hold their shape upwind and survive tears. With such ships Zheng
      He led seven voyages (1405–1433) with up to some 250–300 vessels and about 27,000
      men to India, Arabia and East Africa, decades before the Portuguese
      reached India; the Ming court then stopped them and restricted private sea trade.
    pitfalls:
      - "Repeating the 120–135 m length for the largest treasure ships as fact; the large dimensions come from texts of disputed reliability, and smaller modern reconstructions are estimates too"
      - "Repeating Gavin Menzies' claim that the Chinese reached America in 1421; it has no evidence"
      - "Thinking junks were primitive; in 1490 they were in several ways ahead of European ships"
    history:
      china: "Tang – compartmented boats (Rugao find); c. 1277 Quanzhou wreck with 13 compartments; 1405–1433 Zheng He's voyages; from 1371 and again after 1433 Ming maritime prohibitions"
      europe: "c. 1298 – Marco Polo describes compartmented Chinese ships"
    sources:
      - "Sally K. Church, Zheng He: An Investigation into the Plausibility of 450-ft Treasure Ships, Monumenta Serica 53 (2005), 1–43"
      - "Ma Huan, Ying-yai Sheng-lan: The Overall Survey of the Ocean's Shores (tr. J. V. G. Mills, 1970)"
      - "Edward L. Dreyer, Zheng He: China and the Oceans in the Early Ming Dynasty, 1405–1433 (2007)"
      - "Joseph Needham, Science and Civilisation in China, vol. 4 part 3: Civil Engineering and Nautics (1971)"

  - id: watertight_bulkheads
    name: Watertight bulkheads
    category: navigation
    requires: []
    helps: [ship_design_caravel_carrack, steamship_screw_propeller]
    explain: >
      Divide the hull with strong transverse walls into separate compartments, caulked
      tight, so local damage can be confined and enough buoyancy retained to stay afloat; the
      walls also stiffen the hull. They must reach high enough above the waterline
      that water cannot spill over from one compartment to the next when the ship
      trims down by the head.
    pitfalls:
      - "Bulkheads that stop short of the upper deck (Titanic 1912): water spills over and floods them one by one"
      - "Cutting doors through them for convenience and leaving them open"
      - "Ignoring the cost of subdivision in an open cargo hold; walls and openings affect how cargo can be loaded"
    history:
      china: "Tang (618–907) – boat from Rugao with nine compartments; standard in Song and Ming junks"
      europe: "1785 – Benjamin Franklin recommends the Chinese practice; 1790s Samuel Bentham; 1843 Brunel's SS Great Britain; general in iron ships from the mid-19th c."
    sources:
      - "Joseph Needham, Science and Civilisation in China, vol. 4 part 3: Civil Engineering and Nautics (1971)"
      - "Benjamin Franklin, A Letter from Dr. Benjamin Franklin, to Mr. Alphonsus Le Roy ... Containing Sundry Maritime Observations, Transactions of the American Philosophical Society 2 (1786), 294–329"

  - id: copper_sheathing_shipworm
    name: Shipworm and copper sheathing
    category: navigation
    requires: [copper_bronze]
    helps: [ship_design_caravel_carrack, electrolysis]
    explain: >
      In warm seas the shipworm (Teredo, a boring clam, not a worm) riddles oak
      planks in months, and weed and barnacles slow a ship by a third. Nail thin
      copper sheets over the underwater hull: copper is poisonous to the larvae and to
      fouling, so ships stay fast and sound for years. Fasten the copper with copper or
      bronze bolts, never iron, because iron touching copper in seawater corrodes away
      (galvanic action). Cheaper stopgaps: an extra layer of sacrificial planking over
      tar and hair, charring, and regular careening and burning off the growth.
    pitfalls:
      - "Iron bolts under copper sheathing; they dissolve and ships founder (the Royal Navy's lesson of the 1770s–80s)"
      - "Lead sheathing as a cure-all; it is heavy, soft and also eats iron fastenings"
      - "Calling the shipworm a worm and expecting it in cold northern waters only; it thrives in warm water (Columbus's fourth-voyage ships were eaten through and beached in Jamaica, 1503)"
    history:
      rome: "1st c. AD – lead sheathing on the Nemi ships and some merchantmen"
      china: "Song–Ming – hulls coated with a lime, tung oil and hemp putty"
      europe: "16th c. – Spanish ships lead-sheathed; 1761 HMS Alarm trial with copper; by 1781 most of the Royal Navy coppered, copper-alloy bolts patented 1783–84; 1824 Davy's zinc protectors (cathodic protection)"
    sources:
      - "J. R. Harris, Copper and Shipping in the Eighteenth Century, Economic History Review 19 (1966)"
      - "Lincoln P. Paine, The Sea and Civilization: A Maritime History of the World (2013)"

  - id: ship_provisioning_long_voyages
    name: Provisioning and keeping crews alive on long voyages
    category: navigation
    requires: []
    helps: [scurvy_citrus, food_preservation, distillation, boiled_water]
    explain: >
      Allow drinking and cooking water for the whole crew, extra for heat and heavy
      work, and a reserve for delays and leaking casks. Historical wine or beer
      allowances were separate from water requirements. Typical stores included
      twice-baked biscuit, salt meat or fish, dried peas and beans, oil, vinegar,
      cheese. Water in casks can become contaminated, so clean and char the casks,
      refill at every chance and catch rain in the sails. After about six to twelve
      weeks without fresh food scurvy begins: gums bleed, old wounds reopen, men die;
      stop at every landfall for fruit and greens and carry citrus or its juice. Keep
      the ship dry and ventilated and the biscuit sealed against damp and weevils.
    pitfalls:
      - "Counting on fishing or rain to feed a crew in mid-ocean; both are too irregular"
      - "Boiling lime juice down or keeping it in copper; vitamin C is destroyed (a 19th c. Royal Navy failure)"
      - "Distilling sea water as the main water supply; it is possible but needs much fuel for small yields"
      - "Underestimating the toll: Magellan sailed with about 240–270 men, 18 came home on the Victoria in 1522"
    history:
      china: "1405–1433 – provisioning the large crews of the Ming voyages depends on supplies carried aboard and replenished in port"
      europe: "1497–99 – da Gama loses perhaps half his men, mostly to scurvy; 1519–22 Magellan; 1601 Lancaster's lemon juice on an East India Company ship; 1753 Lind; 1768–80 Cook's voyages with sauerkraut, fresh greens and strict hygiene"
    sources:
      - "Kenneth J. Carpenter, The History of Scurvy and Vitamin C (1986)"
      - "Stephen R. Bown, Scurvy (2003)"

  - id: steamship_screw_propeller
    name: Steamship and screw propeller
    category: navigation
    requires: []
    helps: [rotative_steam_engine, high_pressure_steam, separate_condenser, watertight_bulkheads]
    explain: >
      A steam engine turning paddle wheels or a screw frees ships from the wind and
      lets them run on schedule upstream and against headwinds. The screw (a twisted
      blade turning under the stern) is more efficient than paddles at sea, is not
      lifted out of the water as the ship rolls, and leaves the sides free for guns.
      The limit is coal: early engines burned several kilograms per horsepower-hour,
      so ocean steamers carried sail and needed coaling stations until compound and
      triple-expansion engines (1860s–1880s) made long routes pay.
    pitfalls:
      - "Ignoring the trade-off between coal and paying cargo; the wooden Great Western made scheduled Atlantic passages"
      - "Ignoring boiler explosions and fires, the main killers of early steamboats"
      - "Saying Fulton invented the steamboat; several had run before his North River Steamboat (1807)"
    history:
      europe: "1783 – Jouffroy d'Abbans' Pyroscaphe on the Saône; 1803 Symington's Charlotte Dundas; 1836 screw patents by Francis Pettit Smith and John Ericsson; 1838 Sirius and Great Western cross the Atlantic under steam; 1843 Brunel's iron screw ship Great Britain; 1845 Rattler beats the paddle Alecto in a tug of war"
      americas: "1787 – John Fitch on the Delaware; 1807 Fulton's North River Steamboat on the Hudson"
    sources:
      - "Stephen Fox, Transatlantic: Samuel Cunard, Isambard Brunel, and the Great Atlantic Steamships (2003)"
      - "L. T. C. Rolt, Isambard Kingdom Brunel (1957)"

  # ------------------------------------------------------------ harbours, coasts, underwater
  - id: lighthouse_buoys
    name: Lighthouses and buoys
    category: navigation
    requires: []
    helps: [glass_mirrors, refraction_optics, hydraulic_cement]
    explain: >
      Mark dangers and harbour entrances so ships can navigate at night and in poor
      visibility: a tower with a fire or lamps visible from 20–30 km, ideally with a
      distinctive pattern so each light can be identified, and floating buoys
      anchored to mark channels and shoals. A lamp behind a polished concave mirror,
      or better a lens built of concentric glass rings (Fresnel, 1822), sends the
      light out in a beam many times brighter than a bare flame. Towers on wave-swept
      rocks need interlocking stone courses set in hydraulic mortar (Smeaton's
      Eddystone, 1759).
    pitfalls:
      - "Putting the light too low; range depends on height (a 30 m tower is seen about 20 km off at sea level)"
      - "Identical lights on neighbouring headlands, which leads ships onto the wrong one"
      - "Unmaintained or unpaid lights; a dark lighthouse is worse than none"
    history:
      egypt: "c. 280 BC – Pharos of Alexandria"
      rome: "1st–2nd c. AD – Tower of Hercules at A Coruña and lights at Ostia and Dover"
      europe: "1128 – lighthouse at Genoa (rebuilt 1543); c. 1295 buoys in the Guadalquivir to Seville (Compasso da navigare); 1611 Cordouan; 1759 Smeaton's Eddystone; 1823 first Fresnel lens at Cordouan"
    sources:
      - "D. Alan Stevenson, The World's Lighthouses before 1820 (1959)"

  - id: diving_bell
    name: Diving bell and underwater work
    category: navigation
    requires: []
    helps: [atmospheric_pressure, gas_laws, buoyancy_hydrostatics]
    explain: >
      Lower a heavy, open-bottomed bell evenly into the water: the trapped air lets
      people breathe and work on the bottom, but the water compresses it (to half its
      volume at 10 m, a third at 20 m), so fresh air must be sent down (Halley used
      weighted barrels; later a pump) and stale air vented. Long exposure to pressure
      can require staged decompression.
    pitfalls:
      - "Forgetting that the air is compressed by depth and runs out (and fills with carbon dioxide) quickly without resupply"
      - "Holding your breath while rising from depth with compressed air in the lungs; the lungs can burst"
      - "Long work at depth followed by a fast ascent: decompression sickness (the bends, 'caisson disease' of 19th c. bridge builders)"
      - "Using a long snorkel tube from the surface below about 1 m; the chest cannot breathe against the water pressure"
    history:
      greece: "4th c. BC – Aristotelian Problemata mentions a cauldron lowered to give divers air"
      europe: "1535 – Guglielmo de Lorena dives on the Roman ships of Lake Nemi; c. 1500 Leonardo sketches breathing apparatus; 1690s–1716 Halley's bell resupplied with air barrels; 1789 Smeaton's air-pumped bell; 1840s caissons for bridges"
    sources:
      - "Edmond Halley, The Art of Living Under Water, Philosophical Transactions 29, no. 349 (1716), 492–499, doi:10.1098/rstl.1714.0063"

  # ------------------------------------------------------------ inland transport
  - id: canal_locks
    name: Canals and pound locks
    category: navigation
    requires: []
    helps: [surveying_triangulation, hydraulic_cement]
    explain: >
      A pound lock is a chamber with a gate at each end: the boat enters, the gate
      behind it closes, sluices let water in or out until the level matches the next
      stretch, the gate ahead opens. Water moves from the upper reach to the lower one
      in a lock cycle. A summit reach needs a reliable supply, supplied by streams,
      reservoirs or pumps. Mitre gates, two leaves meeting at an angle pointing
      upstream, are pressed shut by the water itself. A horse that can pull about 1
      tonne on a road tows 30 tonnes or more in a canal boat.
    pitfalls:
      - "Forgetting the summit water supply; many canals failed because they ran dry in summer"
      - "Gates pointing downstream, which the water pushes open"
      - "Crediting Leonardo with inventing the lock; pound locks existed in Milan decades before him (his mitre-gate design is real but its first use is disputed)"
    history:
      china: "214 BC – Lingqu canal with navigation weirs; 605–610 Sui Grand Canal; 984 Qiao Weiyue's pound lock on the Grand Canal"
      europe: "1373 – chamber lock at Vreeswijk (Netherlands); 1438–39 original Conca di Viarenna, Milan (rebuilt at a different site in the 16th c.); 1497 Martesana connected to Milan's inner canal ring; c. 1500 Leonardo's mitre gates; 1681 Canal du Midi; 1761 Bridgewater Canal"
    sources:
      - "Joseph Needham, Science and Civilisation in China, vol. 4 part 3: Civil Engineering and Nautics (1971)"
      - "Charles Hadfield, World Canals: Inland Navigation Past and Present (1986)"

  - id: paved_roads_macadam
    name: Engineered roads (Roman roads to macadam)
    category: navigation
    requires: []
    helps: [surveying_triangulation, lime_burning, spoked_wheel_suspension_carriage]
    explain: >
      The secret of a road is a dry foundation: raise and camber it, dig side ditches,
      and the subsoil will carry the load. McAdam's cheap method: a 25 cm layer of
      small, broken, angular stones no larger than 5 cm (each under about 170 g), laid
      in thin courses on drained ground; traffic crushes them into a hard, watershedding
      crust. The Romans used thick layered beds and paving slabs, durable but very
      expensive.
    pitfalls:
      - "Using round river gravel; it does not interlock"
      - "Mixing soil or clay into the stone layer, which turns to mud in the rain"
      - "Neglecting drainage; no surface survives a waterlogged base"
      - "Thinking medieval Europe had no roads; it had many, mostly unpaved and maintained by local obligation"
    history:
      mesopotamia: "6th–5th c. BC – Persian Royal Road from Susa to Sardis (about 2,500 km)"
      rome: "312 BC – Via Appia; about 80,000 km of main roads by the 2nd c. AD"
      china: "3rd c. BC – Qin straight roads and standardised axle widths"
      americas: "15th c. – Inca road network (Qhapaq Ñan), about 40,000 km with suspension bridges"
      europe: "1764 – Trésaguet in France; 1800s Telford; 1816 McAdam; 1902 tarmac patent (Hooley)"
    sources:
      - "John Loudon McAdam, Remarks on the Present System of Road Making (1816)"
      - "M. G. Lay, Ways of the World: A History of the World's Roads and of the Vehicles That Used Them (1992)"

  - id: spoked_wheel_suspension_carriage
    name: Spoked wheels, pivoting axles and sprung carriages
    category: navigation
    requires: []
    helps: [bloomery_iron, horse_collar_harness, ball_bearings]
    explain: >
      A light spoked wheel with a hot-shrunk iron tyre is strong yet light; dish the
      wheel (spokes slightly conical) so it resists sideways shocks. Pivot the front
      axle on a kingpin so the wagon can turn, and hang the body on leather straps
      or, better, steel leaf springs so road shocks do not reach the passengers or
      break the load. Grease the axles; friction and bad roads, not the horse, are
      usually the limit.
    pitfalls:
      - "Suggesting wheeled vehicles to the Americas as a missing idea; wheels were known on toys, but the Inca had extensive roads for people and pack llamas, and wheeled haulage had different terrain and traction requirements"
      - "Thinking a rigid wagon body on bare axles is acceptable for passengers or glass"
      - "Assuming all spoked wheels need dishing or iron tyres; early chariot wheels used other constructions"
    history:
      mesopotamia: "c. 3500–3200 BC – solid wheels (also Central Europe, Ljubljana wheel c. 3150 BC)"
      global: "c. 2000 BC – spoked chariot wheels in the Sintashta culture (southern Urals steppe)"
      egypt: "c. 1600 BC – chariots arrive with the Hyksos"
      china: "c. 1200 BC – chariots at Anyang"
      americas: "1st millennium AD – wheeled figurines in Mesoamerica (Veracruz), no wheeled transport"
      europe: "1st millennium BC – archaeological evidence for pivoting front axles on European wagons; 15th c. – coach (kocsi) associated with Kocs, Hungary; 1804 Elliott's elliptic springs"
    sources:
      - "David W. Anthony, The Horse, the Wheel, and Language (2007)"
      - "M. G. Lay, Ways of the World: A History of the World's Roads and of the Vehicles That Used Them (1992)"

  - id: stirrup_saddle
    name: Saddle, stirrups and horseshoes
    category: navigation
    requires: []
    helps: [cavalry_chariot, bloomery_iron]
    explain: >
      A treed saddle spreads the rider's weight over the horse's back; paired stirrups
      give the rider a firm stance to mount, stand, shoot and strike without being
      unseated; nailed iron shoes protect hooves on hard and wet ground. Together they
      let riders travel far and fight from the saddle. In 1490 all three are familiar in
      Florence; their use elsewhere varies with riding traditions and local conditions.
    pitfalls:
      - "Repeating Lynn White's thesis that the stirrup created mounted shock combat and feudalism; most historians reject it"
      - "Thinking riders without stirrups could not fight on horseback; Roman four-horned saddles held riders very well"
      - "Shoeing an unshod horse badly; misplaced nails lame it"
    history:
      india: "2nd c. BC – toe stirrups on Sanchi reliefs"
      china: "c. 302 AD – single mounting stirrup on a Changsha tomb figure; paired stirrups by c. 322 AD (Nanjing) and 415 (Feng Sufu tomb)"
      east_asia: "5th c. – stirrups in Korea (Goguryeo) and Japan"
      europe: "late 6th c. – Avars bring stirrups; c. 600 Strategikon recommends them; nailed horseshoes common by the 10th c."
      rome: "1st c. BC onward – four-horned saddle"
    sources:
      - "Lynn White Jr., Medieval Technology and Social Change (1962)"
      - "Bernard S. Bachrach, Charles Martel, Mounted Shock Combat, the Stirrup, and Feudalism, Studies in Medieval and Renaissance History 7 (1970)"

  - id: arch_bridge_truss
    name: Bridges (arch, truss, suspension)
    category: navigation
    requires: []
    helps: [lever_mechanics_statics, geometry_proof, hydraulic_cement, lime_burning]
    explain: >
      A well-shaped masonry arch carries its load mainly in compression and so can be
      built of stone without tension, but it pushes outward and needs strong abutments
      and a temporary timber centring until the keystone is set; a flatter segmental
      arch (Zhaozhou, Ponte Vecchio) spans further with fewer piers, and open spandrels
      save weight and let floods through. A truss is a frame of triangles, which cannot
      deform without a member changing length, so timber or iron bars make long, light
      spans. A suspension bridge hangs the deck from cables or chains in tension
      anchored at both ends.
    pitfalls:
      - "Removing the centring before the mortar has set or before the arch is complete"
      - "Narrow piers with no protection against floods and scour (the commonest cause of collapse)"
      - "Rectangular timber frames without diagonals; they rack and fail"
      - "Light suspension decks in wind; they can oscillate and tear apart (Tacoma Narrows 1940)"
    history:
      rome: "62 BC – Pons Fabricius, Rome; c. 106 AD Alcántara"
      china: "c. 595–605 – Li Chun's Zhaozhou bridge, open-spandrel segmental arch of 37 m; iron chain suspension bridges by the Ming"
      americas: "15th c. – Inca grass-rope suspension bridges"
      europe: "1345 – Ponte Vecchio, Florence; 1567–69 Ponte Santa Trinita (Ammannati); 1570 Palladio's timber trusses; 1779 Iron Bridge, Coalbrookdale; 1826 Telford's Menai suspension bridge; 1883 Brooklyn Bridge"
    sources:
      - "Andrea Palladio, I quattro libri dell'architettura (1570), book III"
      - "David P. Billington, The Tower and the Bridge: The New Art of Structural Engineering (1983)"

  - id: railway
    name: Railways (rails, flanged wheels, gauge)
    category: navigation
    requires: []
    helps: [puddling_wrought_iron, bessemer_steel, surveying_triangulation]
    explain: >
      Wheels running on smooth rails roll with very little friction, so one horse
      pulls about ten times as much on rails as on a road; flanged wheels on a fixed
      axle keep the wagon on the track. Lay rails to a constant gauge on sleepers and
      ballast, and keep gradients gentle (about 1 in 100 or less for locomotives),
      using cuttings, embankments and long curves. Wooden rails worn by iron wheels
      need iron strips, then cast and finally wrought-iron or steel rails.
    pitfalls:
      - "Steep gradients; smooth iron wheels slip on steep rails"
      - "Cast-iron rails for heavy locomotives; they are brittle and snap"
      - "Different gauges on connecting lines"
    history:
      greece: "c. 600 BC – Diolkos at Corinth, a paved trackway for hauling ships"
      europe: "16th c. – wooden mine wagonways in Central Europe (Agricola 1556); 1603–04 Wollaton wagonway, England; 1767 cast-iron rail plates at Coalbrookdale; 1820 Birkinshaw's wrought-iron rails; 1825 Stockton and Darlington; 1830 Liverpool and Manchester"
    sources:
      - "M. J. T. Lewis, Early Wooden Railways (1970)"
      - "Georgius Agricola, De re metallica (1556)"

  - id: steam_locomotive
    name: Steam locomotive
    category: navigation
    requires: [high_pressure_steam, railway]
    helps: [crank_connecting_rod, coal_mining]
    explain: >
      A high-pressure boiler on wheels drives pistons that turn the wheels directly
      through cranks; exhaust steam blown up the chimney (blastpipe) draws the fire, and
      many fire tubes through the boiler raise steam fast (Stephenson's Rocket, 1829).
      Early engines ran on cast iron, whose brittle rails could break under the load.
      Heavier traffic favoured wrought iron and later steel. Fuel, water stops and
      braking limited practical service.
    pitfalls:
      - "A low-pressure Watt engine on wheels; it is far too heavy for its power"
      - "Boilers without safety valves and fusible plugs"
      - "Assuming smooth wheels will not grip rails; they do, with moderate gradients and enough weight on the driving wheels"
    history:
      europe: "1804 – Trevithick's Penydarren locomotive; 1813 Puffing Billy; 1825 Stephenson's Locomotion; 1829 Rocket at the Rainhill trials"
    sources:
      - "Samuel Smiles, The Life of George Stephenson (1857)"
      - "L. T. C. Rolt, George and Robert Stephenson: The Railway Revolution (1960)"

  - id: bicycle
    name: Bicycle
    category: navigation
    requires: []
    helps: [ball_bearings, rubber_vulcanisation, bessemer_steel, gears_gear_trains]
    explain: >
      A two-wheeled frame stays up because the rider steers into any lean, much as
      one balances a stick on a finger; the forward-raked fork makes the front wheel
      partly self-steering. The modern safety bicycle has two equal wheels, a chain
      drive to the rear wheel with a larger front sprocket, a diamond frame of steel
      tube and air-filled tyres. Even Drais's wooden running machine without pedals
      (1817) ran 13–15 km/h.
    pitfalls:
      - "Citing Leonardo's 'bicycle' sketch from the Codex Atlanticus; it is generally considered a modern addition (published 1974, contested since)"
      - "Thinking balance needs speed alone or gyroscopes; steering geometry and rider correction matter most"
      - "Direct-drive front wheels without gearing: the wheel has to be huge (penny-farthing) and dangerous"
    history:
      europe: "1817 – Drais's running machine, Mannheim; 1860s pedal velocipede in Paris (Michaux, Lallement); 1870s high-wheeler; 1885 Starley's Rover safety bicycle; 1888 Dunlop's pneumatic tyre"
    sources:
      - "David V. Herlihy, Bicycle: The History (2004)"

  - id: automobile
    name: Automobile
    category: navigation
    requires: []
    helps: [internal_combustion_engine, petroleum_refining, rubber_vulcanisation, gears_gear_trains, ball_bearings, paved_roads_macadam]
    explain: >
      In an early petrol car a light, fast-running engine on liquid fuel drives the rear
      wheels through a clutch, a gearbox (the engine has a narrow speed range) and a
      differential that lets the outer wheel turn faster on curves; steering by pivoting
      the front wheels on separate kingpins (Ackermann geometry), pneumatic tyres and
      good brakes. Mass production on assembly lines made it cheap (Model T introduced
      in 1908, moving assembly line in 1913).
    pitfalls:
      - "A single fixed axle with both wheels locked together; it scrubs and tips in corners"
      - "Forgetting the gearbox and clutch; the engine cannot start under load"
      - "Exhaust fumes in closed spaces (carbon monoxide)"
    history:
      europe: "1769 – Cugnot's steam carriage; 1886 Benz Patent-Motorwagen; 1886 Daimler and Maybach's motor carriage"
      americas: "1908 – Ford Model T; 1913 moving assembly line"
    sources:
      - "James J. Flink, The Automobile Age (1988)"

  # ------------------------------------------------------------ air and space
  - id: hot_air_hydrogen_balloon
    name: Hot-air and hydrogen balloons
    category: navigation
    requires: []
    helps: [gas_laws, sulphuric_acid, buoyancy_hydrostatics]
    explain: >
      A balloon floats because the gas inside is lighter than the air it displaces
      (Archimedes). At sea level, air heated from about 20 °C to 100 °C lifts roughly
      0.25 kg per cubic metre, so a 1,000 m³ envelope of varnished linen or paper-lined
      silk lifts about 250 kg; hydrogen (from iron filings and sulphuric acid) lifts
      about 1.1 kg per cubic metre, four times more, but is explosive. It goes where the
      wind goes; height is controlled by heat or ballast and valving gas.
    pitfalls:
      - "Thinking smoke, not hot air, does the lifting (the Montgolfiers' own error)"
      - "Open fire under a hydrogen balloon"
      - "Expecting to steer it; without an engine it drifts with the wind"
    history:
      china: "unmanned paper sky lanterns (traditionally attributed to the 3rd c.; date uncertain)"
      europe: "1709 – Bartolomeu de Gusmão demonstrates a small hot-air model in Lisbon; 4 June 1783 Montgolfier brothers' public ascent at Annonay; 21 Nov 1783 first manned flight (Pilâtre de Rozier and d'Arlandes); 1 Dec 1783 Charles and Robert's hydrogen balloon"
    sources:
      - "Charles Coulston Gillispie, The Montgolfier Brothers and the Invention of Aviation, 1783–1784 (1983)"
      - "Richard Holmes, Falling Upwards: How We Took to the Air (2013)"

  - id: parachute
    name: Parachute
    category: navigation
    requires: []
    helps: [textile_fibres, hot_air_hydrogen_balloon]
    explain: >
      An open canopy presents a large area to the airflow. Drag increases with descent
      speed until it balances the weight of the person and equipment. For a given
      canopy a heavier load descends faster. Venting and the porosity of the fabric
      affect oscillations. Leonardo drew a linen pyramid on a rigid frame around 1485.
      In 2000 Adrian Nicholas descended under a reconstruction, then separated from
      the frame and landed under a modern parachute.
    pitfalls:
      - "Canopies too small; descent speed depends on total mass, air density, canopy area and drag; even a fully opened canopy can land hard"
      - "Jumping from too low a height for the canopy to open"
      - "Crediting the idea to Leonardo alone; a Sienese manuscript of the 1470s already shows a conical parachute"
    history:
      europe: "1470s – conical parachute in a Sienese manuscript (British Library Add. MS 34113); c. 1485 Leonardo's pyramid design; c. 1615–16 Faust Vrančić's Homo volans; 1783 Lenormand's jump from a tower in Montpellier; 1797 Garnerin jumps from a balloon over Paris"
    sources:
      - "Fausto Veranzio, Machinae novae (Venice, c. 1615–16)"
      - "Lynn White Jr., The Invention of the Parachute, Technology and Culture 9, no. 3 (1968), 462–467"

  - id: glider_aeroplane
    name: Glider and aeroplane
    category: navigation
    requires: []
    helps: [internal_combustion_engine, laws_of_motion, lever_mechanics_statics]
    explain: >
      Separate lift from propulsion (Cayley 1799): a fixed, slightly cambered wing
      meeting the air at a small angle gives lift that grows with wing area and the
      square of speed, a tailplane and fin keep it stable, and control in three axes
      (pitch, yaw and roll, by warping the wings or ailerons) lets the pilot balance
      and turn. A hang glider of willow and cotton, 12–15 m² of wing, carries a man
      from a hill (Lilienthal, about 2,000 flights). Powered flight needs an engine of
      about 10 kW weighing under about 100 kg and efficient propellers; human muscle
      is far too weak for flapping wings.
    pitfalls:
      - "Building Leonardo-style flapping ornithopters powered by muscle"
      - "Assuming camber or a tail alone guarantees stability; wing incidence, weight distribution and control matter"
      - "Ignoring roll control; Lilienthal shifted his body weight and was killed in 1896"
      - "Testing far from the ground before learning control in short low hops"
    history:
      islamic: "9th c. – Abbas ibn Firnas' gliding attempt in Córdoba (reported centuries later)"
      europe: "11th c. – Eilmer of Malmesbury; c. 1485–1505 Leonardo's flight studies; 1799–1853 Cayley; 1891–1896 Lilienthal"
      americas: "17 Dec 1903 – Wright brothers' powered flights at Kitty Hawk after their own wind-tunnel tests (1901)"
    sources:
      - "Otto Lilienthal, Der Vogelflug als Grundlage der Fliegekunst (1889)"
      - "Tom D. Crouch, The Bishop's Boys: A Life of Wilbur and Orville Wright (1989)"
      - "John D. Anderson Jr., A History of Aerodynamics and Its Impact on Flying Machines (1997)"

  - id: jet_engine
    name: Jet engine (gas turbine)
    category: navigation
    requires: []
    helps: [steam_turbine, glider_aeroplane, laws_of_motion]
    explain: >
      A rotary compressor squeezes air, fuel burns continuously in it, the hot gas
      drives a turbine that turns the compressor, and the remaining gas leaves at high
      speed through a nozzle, pushing the aircraft forward by reaction. It is light
      for its power and works best at high speed and altitude; the hard part is
      turbine blades that survive red heat under huge centrifugal loads (nickel
      alloys).
    pitfalls:
      - "Thinking the jet 'pushes against the air behind it'; thrust is the reaction to accelerating the gas"
      - "Ignoring the turbine temperature limit; ordinary steels creep and fail within minutes"
      - "Confusing it with the rocket, which carries its own oxidiser and works in vacuum"
    history:
      europe: "1930 – Frank Whittle's patent; 1937 his engine runs; 27 Aug 1939 Heinkel He 178 (von Ohain) first jet flight; 1944 Me 262 and Gloster Meteor in service"
    sources:
      - "Frank Whittle, Jet: The Story of a Pioneer (1953)"
      - "Edward W. Constant II, The Origins of the Turbojet Revolution (1980)"

  - id: rocket_spaceflight
    name: Rockets and spaceflight
    category: navigation
    requires: []
    helps: [laws_of_motion, universal_gravitation, war_rockets]
    explain: >
      A rocket is pushed by the reaction of the gas it throws backwards and needs no
      air, so it works in space. The speed gained equals the exhaust speed times the
      natural logarithm of the ratio of full to empty mass (Tsiolkovsky), so reaching
      orbit (about 7.8 km/s sideways, beyond the air) needs high exhaust speeds
      (liquid fuels such as kerosene or hydrogen with liquid oxygen), multiple stages
      that drop their empty tanks, and guidance. An orbiting craft is falling around
      the Earth all the time, like Newton's cannonball.
    pitfalls:
      - "Saying a rocket needs air to push against"
      - "Thinking getting to space means going high; orbit is about speed sideways"
      - "Ignoring re-entry heating; returning craft need heat shields"
    history:
      china: "13th c. – gunpowder rockets ('fire arrows') in Song and Jin warfare (the date of the first true rocket is disputed)"
      india: "1780s–1790s – iron-cased Mysore rockets of Hyder Ali and Tipu Sultan, which inspired Congreve's"
      europe: "1903 – Tsiolkovsky's rocket equation; 1923 Oberth; 1944 the V-2 is the first object to reach space; 1957 Sputnik; 1961 Gagarin"
      americas: "16 March 1926 – Goddard's liquid-fuel rocket; 1969 Apollo 11 lands on the Moon"
    sources:
      - "Robert H. Goddard, A Method of Reaching Extreme Altitudes (1919)"
      - "Walter A. McDougall, ...the Heavens and the Earth: A Political History of the Space Age (1985)"
