# Blueprints from Tomorrow – technology tree fragment: life sciences.
# Schema: see header of techtree/core.yaml.

technologies:

  - id: microorganisms
    name: Microorganisms (living things too small to see)
    category: biology
    requires: [microscope]
    helps: [clear_glass, heat_sterilisation]
    explain: >
      A drop of pond water, rain water that has stood for some days, or the white
      scraping from between the teeth swarms with living creatures far too small for
      the eye, of many shapes, moving and multiplying. They are seen with a single
      tiny lens of very short focus (a glass bead about 1–2 mm across, set in a hole
      in a metal plate and held close to the eye with the sample lit from behind),
      which can magnify the sample about 200 times. Living pond organisms differ in
      shape and movement. Bacteria are smaller still; the quality of the lens and
      the lighting matter as much as nominal magnification. In later laboratory
      work, separate colonies helped distinguish organisms in mixed samples. A
      colony may start from a clump of cells, so its appearance alone cannot
      establish purity or identify the organism.
    pitfalls:
      - "Trying with spectacle lenses or an early two-lens microscope; until about 1830 the simple bead lens showed far more"
      - "Concluding that because they exist they cause disease; nobody made that case convincingly for 200 years"
      - "Believing all of them are harmful; most are harmless and many are needed (bread, beer, cheese, soil)"
      - "Assuming they arise from the rotting matter in which they are found"
    history:
      europe: "1658 – Kircher claims 'little worms' in plague blood (his microscope could not show bacteria); 1665 Hooke draws a microscopic mould; 1674–1676 Leeuwenhoek (Delft) sees protozoa and bacteria; 1683 bacteria from teeth; 1786 O. F. Müller classifies them; 1881 Koch's solid culture media; agar suggested by Fanny Hesse; 1884 Gram's stain; 1887 Petri's dish"
    sources:
      - "Clifford Dobell, Antony van Leeuwenhoek and His 'Little Animals' (1932)"
      - "Nick Lane, The unseen world: reflections on Leeuwenhoek (1677) 'Concerning little animals', Philosophical Transactions of the Royal Society B (2015)"

  - id: spontaneous_generation_refuted
    name: Life comes only from life (spontaneous generation refuted)
    category: biology
    requires: []
    helps: [microscope, microorganisms, heat_sterilisation]
    explain: >
      Maggots, worms, mould and the tiny creatures in broth do not form from rotting
      matter; each comes from parents or germs of its own kind that got in from
      outside. Two experiments show it. Put meat in two jars and cover one with fine
      gauze: flies lay eggs only where they can reach the meat, and only there do
      maggots appear (Redi). Boil broth in a flask whose neck is drawn out into a long
      downward S-bend: air passes freely, dust settles in the bend, and the broth
      stays clear for years; tilt the flask so the broth touches the bend, or break
      the neck, and it clouds within days (Pasteur). So food, wounds and wine spoil
      because something living enters them, and can be protected.
    pitfalls:
      - "Boiling too briefly; hay and soil carry spores that survive an hour of boiling, which is why honest opponents kept getting growth"
      - "Sealing the flask, which invites the reply that the air was spoiled; the open swan neck answers that"
      - "Claiming to have proved that life can never arise from non-living matter; the experiments show only that it does not happen in broth today"
      - "Presenting Redi as settling it; he still thought gall insects arose from plants, and microbes reopened the dispute"
    history:
      greece: "4th c. BC – Aristotle teaches that some insects, eels and shellfish arise from mud and decay; the influential view in European natural history for centuries"
      china: "antiquity onward – the same assumption, e.g. insects born from rotting grass or damp"
      europe: "1668 – Redi's gauze-covered jars; 1748 Needham claims microbes arise in boiled gravy; 1765 Spallanzani refutes him with longer boiling in sealed flasks; 1837 Schwann; 1859–1864 Pasteur against Pouchet, swan-neck flasks; 1877 Tyndall explains remaining failures by heat-resistant spores"
    sources:
      - "Francesco Redi, Esperienze intorno alla generazione degl'insetti (1668)"
      - "Louis Pasteur, Mémoire sur les corpuscules organisés qui existent dans l'atmosphère (1861)"
      - "John Farley, The Spontaneous Generation Controversy from Descartes to Oparin (1977)"

  - id: fermentation_yeast
    name: Fermentation is the work of living yeast
    category: biology
    requires: []
    helps: [microscope, microorganisms, spontaneous_generation_refuted, thermometer_temperature]
    explain: >
      The scum and sediment in fermenting wine and beer contains living yeast, a
      fungus whose round cells bud and multiply. Even without oxygen, yeast turns
      sugar into alcohol and the gas that makes the froth; alcohol tolerance varies
      with the yeast and conditions. Wine turns to vinegar, beer goes ropy and milk
      sours because other, smaller organisms get in, each making its own product; the
      vinegar organism needs air. So brewers and vintners should scald their vessels,
      start each batch with yeast from a good one, let fermenting vessels vent gas and
      keep finished wine protected from air, and can stop spoilage by heating the
      finished drink in closed vessels to about 60 °C for some minutes, which kills
      the spoilers without cooking the wine.
    pitfalls:
      - "Calling yeast a chemical or dead sediment; Liebig, the leading chemist of 1840, said exactly that and mocked the microscopists"
      - "Boiling wine to preserve it, which ruins it; gentle heat is enough"
      - "Confusing fermentation with distillation; yeast alone cannot make spirits"
      - "Saying Pasteur was simply right: in 1897 Buchner showed that juice pressed from dead yeast still ferments sugar, so Liebig had part of the truth"
    history:
      mesopotamia: "c. 3500–3000 BC – beer residues at Godin Tepe; c. 1800 BC Hymn to Ninkasi describes brewing"
      egypt: "c. 3000 BC onward – large-scale bread and beer making"
      china: "c. 7000 BC – fermented rice, honey and fruit drink at Jiahu; mould starters (qu) for grain wine by the Han period; 12th c. texts describe heating wine to keep it"
      east_asia: "16th c. – Japanese brewers heat sake to preserve it, three centuries before Pasteur"
      europe: "1680 – Leeuwenhoek sees yeast globules; 1837–1838 Cagniard-Latour, Schwann and Kützing independently show yeast is alive; 1857–1860 Pasteur on lactic and alcoholic fermentation; 1866 heating of wine; 1883 Hansen's pure yeast cultures at Carlsberg; 1897 Buchner's cell-free fermentation"
    sources:
      - "Louis Pasteur, Mémoire sur la fermentation alcoolique (1860)"
      - "James A. Barnett, A history of research on yeasts 2: Louis Pasteur and his contemporaries, 1850–1880, Yeast (2000)"
      - "Patrick E. McGovern, Uncorking the Past: The Quest for Wine, Beer, and Other Alcoholic Beverages (2009)"

  - id: cell_theory
    name: Cell theory
    category: biology
    requires: [microscope]
    helps: [microorganisms, synthetic_dyes]
    explain: >
      Plants and animals grow from cells and also contain material secreted by cells.
      Each cell has a boundary and usually a denser kernel (nucleus), and each cell
      comes only from the division of an earlier cell. Growth involves both cell
      enlargement and division; an animal egg is one cell; injured cells can impair a
      whole tissue. To show it: peel the thin skin from inside an onion scale, or
      scrape the inside of the cheek, lay it in a drop of water under a good
      microscope and stain it with a little iodine solution or dye. The box-like plant
      cells and their nuclei are plain to see.
    pitfalls:
      - "Saying Hooke discovered living cells in 1665; he saw the empty walls of dead cork and coined the word"
      - "Repeating Schleiden and Schwann's own error that new cells crystallise out of formless fluid"
      - "Crediting Virchow alone for 'every cell from a cell'; Remak showed it first"
      - "Expecting animal cells to be as easy to see as plant cells; they have no walls and need staining"
    history:
      europe: "1665 – Hooke names 'cells' in cork; 1670s Malpighi and Grew describe plant tissue; 1831 Brown names the nucleus; 1838 Schleiden (plants) and 1839 Schwann (animals) state the theory; 1852–1855 Remak and 1855–1858 Virchow: cells arise only by division; 1870s–1880s Flemming describes chromosomes in dividing cells"
    sources:
      - "Theodor Schwann, Mikroskopische Untersuchungen über die Uebereinstimmung in der Struktur und dem Wachsthum der Thiere und Pflanzen (1839)"
      - "Henry Harris, The Birth of the Cell (1999)"

  - id: viruses
    name: Viruses (disease agents smaller than bacteria)
    category: biology
    requires: [microorganisms, contagion_theory]
    helps: [vaccines_attenuated, fired_brick_ceramics]
    explain: >
      A virus carries genetic material inside a protective coat. It can reproduce only
      by using the machinery of a living cell. Late nineteenth-century work on tobacco
      mosaic showed that an infectious agent could pass filters that retained ordinary
      bacteria. Filtration was evidence about the agent’s size; it could not by itself
      establish what the agent was. Most viruses are too small to resolve with a light
      microscope. Their dependence on host cells helps explain why antibacterial drugs
      do not treat viral disease and why prevention depends on the particular virus
      and its route of spread.
    pitfalls:
      - "Giving antibacterial drugs for virus diseases"
      - "Promising to show the germ of smallpox or influenza under the microscope"
      - "Trying to grow viruses on broth; they need living cells, eggs or animals"
      - "Using 'virus' in a period where the word simply means poison or any contagious matter"
      - "Blaming the 1918 influenza on Pfeiffer's bacillus, as most experts then did"
    history:
      europe: "1884 – Chamberland's porcelain filter; 1892 Ivanovsky (St Petersburg) finds tobacco mosaic passes the filter; 1898 Beijerinck (Delft) concludes it is a new kind of agent; 1898 Loeffler and Frosch, foot-and-mouth disease; 1915–1917 Twort and d'Herelle find viruses of bacteria; 1933 human influenza virus isolated in London; 1939 first electron-microscope picture (Kausche, Pfankuch, Ruska)"
      americas: "1901 – Reed's commission shows yellow fever is filterable; 1911 Rous's chicken tumour virus; 1931 Goodpasture grows viruses in hens' eggs; 1935 Stanley crystallises tobacco mosaic virus; 1949 Enders, Weller and Robbins demonstrate poliovirus growth in human tissue cultures"
    sources:
      - "Martinus W. Beijerinck, Ueber ein Contagium vivum fluidum als Ursache der Fleckenkrankheit der Tabaksblätter (1898)"
      - "A. P. Waterson and Lise Wilkinson, An Introduction to the History of Virology (1978)"
      - "Carl Zimmer, A Planet of Viruses (2011)"

  - id: taxonomy
    name: Systematic classification and naming of living things
    category: biology
    requires: []
    helps: [printing_press, anatomy_dissection, world_geography]
    explain: >
      Give every kind of plant and animal a two-word species name, the genus followed
      by a specific epithet (Homo sapiens, Rosa canina), with a short written
      description and a preserved specimen, and arrange the kinds in nested groups:
      species in genera, genera in families, orders, classes. Group by shared
      structure, not by use, habitat or alphabet: a whale breathes air, is warm, and
      suckles its young, so it belongs with the mammals, and a bat is not a bird. One
      agreed name ends the confusion of local names, so that a healer or farmer in one
      country can know exactly which plant a book from another means. Pressed, dried
      plants glued on paper keep for centuries as the reference.
    pitfalls:
      - "Sorting by use or habitat (herbs, trees, things that swim)"
      - "Treating Linnaeus's plant classes, based on counting stamens, as natural; he knew they were only a finding aid"
      - "Insisting species are fixed and separately created, as Linnaeus did for most of his life"
      - "Saying Linnaeus invented classification or two-word names; Bauhin used them in 1623, and Linnaeus made them consistent and universal"
    history:
      greece: "4th c. BC – Aristotle groups animals by structure and notes that dolphins bear live young; Theophrastus classifies about 500 plants"
      rome: "1st c. AD – Dioscorides, De materia medica, about 600 medicinal plants, the standard for 1,500 years"
      islamic: "9th c. – al-Dinawari, Book of Plants; 13th c. Ibn al-Baytar lists about 1,400 drugs and plants"
      china: "1596 – Li Shizhen, Bencao gangmu: about 1,900 substances in a graded classification"
      americas: "1552 – Aztec herbal (Codex de la Cruz-Badiano) records Nahua plant knowledge and naming"
      europe: "1583 – Cesalpino classifies plants by fruit and seed; 1623 Bauhin's Pinax; 1686 Ray defines species; 1735 Linnaeus, Systema naturae; 1753 Species plantarum; 1758 tenth edition fixes animal names"
    sources:
      - "Carl Linnaeus, Species plantarum (1753)"
      - "Wilfrid Blunt, The Compleat Naturalist: A Life of Linnaeus (1971)"
      - "Carol Kaesuk Yoon, Naming Nature: The Clash Between Instinct and Science (2009)"

  - id: reproduction_fertilisation
    name: Egg, sperm and fertilisation
    category: biology
    requires: []
    helps: [microscope, cell_theory, spontaneous_generation_refuted]
    explain: >
      In human fertilisation, an egg and a sperm unite. Each supplies one set of
      nuclear chromosomes; the egg also supplies the cytoplasm and usually the
      mitochondria. The fertilised egg divides and tissues gradually differentiate, as
      a series of developing chick embryos illustrates. In humans the fertile window
      includes the days before ovulation because sperm can survive several days.
      Ovulation varies between cycles, so counting from the start of bleeding cannot
      reliably exclude pregnancy. In the usual XX/XY pattern, the sperm contributes
      either an X or a Y chromosome.
    pitfalls:
      - "Teaching that the fertile days are around menstruation, as 19th-century doctors did by analogy with animals on heat"
      - "Blaming the mother, her diet or her thoughts for the child's sex or for birthmarks"
      - "The 'little man in the sperm' or in the egg (preformation), held by most naturalists from 1680 to 1800"
      - "Presenting the calendar method as reliable; cycles vary"
    history:
      greece: "4th c. BC – Aristotle watches chick development day by day and argues for gradual formation, but has the male supply form and the female only matter"
      europe: "1651 – Harvey: all animals come from eggs; 1672 de Graaf describes the ovarian follicles; 1677 Leeuwenhoek sees sperm; 1759 Wolff argues for gradual formation; 1780s Spallanzani shows frogs' eggs need contact with semen; 1827 von Baer finds the mammalian egg; 1876 Hertwig sees egg and sperm nuclei fuse in the sea urchin; 1929 Knaus (Austria) studies the timing of ovulation"
      east_asia: "1924 – Ogino Kyusaku (Japan) times ovulation relative to the next period"
      americas: "1905 – Nettie Stevens and E. B. Wilson find the sex chromosomes"
    sources:
      - "Karl Ernst von Baer, De ovi mammalium et hominis genesi (1827)"
      - "Matthew Cobb, The Egg & Sperm Race (2006)"
      - "Clara Pinto-Correia, The Ovary of Eve: Egg and Sperm and Preformation (1997)"

  - id: heredity_genetics
    name: Heredity by discrete factors (Mendel)
    category: biology
    requires: []
    helps: [probability_statistics, selective_breeding, cell_theory, reproduction_fertilisation]
    explain: >
      Traits are passed on by discrete inherited factors (genes) that come in pairs,
      one from each parent; they do not blend like paint. One version can hide the
      other. Cross pure-breeding round-seeded peas with wrinkled-seeded ones: all
      offspring are round. Let those self-pollinate: the wrinkled form reappears
      unchanged in one quarter of the next generation, three round to one wrinkled.
      This needs pure lines, controlled pollination (cut off the anthers, dust with
      chosen pollen, bag the flower) and hundreds of plants counted. For breeders: a
      hidden trait can be carried unseen for generations, two parents showing it
      breed true, and mating close relatives brings hidden defects together.
    pitfalls:
      - "Believing what parents acquire in life (a trained muscle, a docked tail, an injury) is inherited"
      - "Expecting exact 3 to 1 ratios in small numbers"
      - "Treating most human traits (height, skin and eye colour, intelligence, character) as single-factor"
      - "Sliding from heredity to eugenics and the breeding of 'better' people, the historic misuse of this idea"
      - "Saying Mendel was unread because he was obscure; his paper was distributed and cited, but nobody saw what it meant until 1900"
    history:
      mesopotamia: "c. 870 BC – Assyrian reliefs show hand pollination of date palms; practical breeding without theory"
      greece: "c. 400 BC – Hippocratic writers suppose seed is gathered from all parts of both parents' bodies"
      europe: "1760s – Kölreuter's plant hybrids; 1799 Knight reports crossing pea varieties; 1865 Mendel's lectures in Brünn (printed 1866); 1900 rediscovery by de Vries, Correns and Tschermak; 1902 Boveri (and Sutton in America) link factors to chromosomes"
      americas: "1910 – Morgan links white eyes in fruit flies to the X chromosome; 1913 Sturtevant maps the relative positions of linked genes"
    sources:
      - "Gregor Mendel, Versuche über Pflanzen-Hybriden, Verhandlungen des naturforschenden Vereines in Brünn (1866)"
      - "Robin Marantz Henig, The Monk in the Garden (2000)"
      - "Siddhartha Mukherjee, The Gene: An Intimate History (2016)"

  - id: evolution_natural_selection
    name: Evolution by natural selection
    category: biology
    requires: []
    helps: [deep_time_geology, selective_breeding, taxonomy, heredity_genetics, world_geography]
    explain: >
      All living kinds descend, with gradual change, from earlier kinds, and are
      related like branches of one tree. The mechanism needs no purpose: individuals
      of a kind differ; some differences are inherited; far more are born than can
      survive; those whose inherited traits suit the conditions leave more offspring,
      so over many generations the population shifts. Breeders do the same on purpose
      and have made the greyhound and the lapdog from one stock in a few thousand
      years; nature has had hundreds of millions. Evidence: fossils in rock layers
      change in order; a human arm, a bat's wing and a whale's flipper have the same
      bones; useless remnants persist; islands hold their own species resembling those
      of the nearest mainland.
    pitfalls:
      - "Saying humans descend from today's monkeys; they share ancestors"
      - "Describing animals as striving or needing to change (the giraffe stretching its neck); selection acts on variation that is already there"
      - "Presenting evolution as a ladder of progress with man at the top"
      - "Reading 'survival of the fittest' as 'might is right' and applying it to nations or classes"
      - "Forgetting that Darwin could not explain inheritance or variation, the weak point his critics attacked"
    history:
      greece: "5th c. BC – Empedocles imagines unfit forms dying out; speculation without mechanism of descent"
      islamic: "9th c. – al-Jahiz describes the struggle for existence among animals; modern claims that he or Ibn Khaldun had a theory of evolution are overstated"
      europe: "1809 – Lamarck's transformation by use and disuse; 1831 Matthew states selection in an appendix on timber; 1858 Darwin and Wallace's joint papers; 1859 On the Origin of Species; 1930s–1940s synthesis with genetics"
      east_asia: "1858 – Wallace writes his selection essay at Ternate in the Moluccas"
    sources:
      - "Charles Darwin, On the Origin of Species (1859)"
      - "Peter J. Bowler, Evolution: The History of an Idea (1984)"
      - "Jonathan Weiner, The Beak of the Finch (1994)"

  - id: dna_structure
    name: DNA is the hereditary material (double helix)
    category: biology
    requires: [heredity_genetics, cell_theory, atomic_theory]
    helps: [xrays, microorganisms]
    explain: >
      Cellular genes are stretches of DNA. In plants and animals most DNA is in the
      nucleus; bacteria have DNA but no nucleus. The thread is two strands wound round
      each other, with sugar and phosphate on the outside and four kinds of bases (A,
      T, G, C) on the inside, where A always pairs with T and G with C. Each strand
      therefore fixes the other: to copy a gene the strands part and each builds a new
      partner. The order of the bases is a code that spells out the order of building
      blocks in proteins, three bases per block. The evidence in order: DNA from dead
      virulent bacteria transforms harmless ones (1944); A equals T and G equals C in
      double-stranded DNA; X-ray patterns of DNA fibres show a helix.
    pitfalls:
      - "Saying Watson and Crick discovered DNA; it was isolated in 1869 and shown to carry heredity in 1944"
      - "Leaving out Rosalind Franklin's and Maurice Wilkins's X-ray data, on which the model rested"
      - "Putting the bases on the outside or three strands, the errors Pauling and the first Watson–Crick model made"
      - "In 1947, asserting it as known: most biologists then still thought genes were proteins"
      - "Speaking of one gene for each trait or of DNA as a simple blueprint"
    history:
      europe: "1869 – Miescher isolates 'nuclein' in Tübingen; 1928 Griffith's transforming principle; 1952 Franklin and Gosling's X-ray photographs (London); 1953 Watson and Crick's model (Cambridge)"
      americas: "1944 – Avery, MacLeod and McCarty show the transforming principle is DNA; 1950 Chargaff's base ratios; 1952 Hershey and Chase; 1958 Meselson and Stahl confirm the copying mechanism; 1961–1966 genetic code solved"
    sources:
      - "Oswald T. Avery, Colin M. MacLeod and Maclyn McCarty, Studies on the chemical nature of the substance inducing transformation of pneumococcal types, Journal of Experimental Medicine (1944)"
      - "James D. Watson and Francis H. C. Crick, Molecular Structure of Nucleic Acids: A Structure for Deoxyribose Nucleic Acid, Nature (1953)"
      - "Horace Freeland Judson, The Eighth Day of Creation (1979)"

  - id: respiration_metabolism
    name: Breathing is slow combustion (respiration and body heat)
    category: biology
    requires: [oxygen_combustion]
    helps: [blood_circulation, air_pump_vacuum, thermometer_temperature]
    explain: >
      Animals take the same part of the air that a flame needs, combine it with the
      carbon and hydrogen of their food, and give back fixed air (carbon dioxide),
      water and heat. Food is fuel; body heat and muscular work come from burning it,
      slowly and throughout the body, with the blood carrying the gases between
      tissues and lungs. Demonstrations: breath blown through clear lime water turns
      it milky, as does the gas from burning charcoal; compare the carbon dioxide in
      exhaled air with that in room air; a candle flame cannot establish whether
      enclosed air is safe to breathe. Practical consequences: crowded closed rooms,
      ships' holds and mines need fresh air, and a charcoal fire in a closed room
      kills silently.
    pitfalls:
      - "Galen's view that breathing cools the heart"
      - "Saying the burning happens in the lungs (Lavoisier's own error); it happens in all tissues"
      - "Thinking breathed-out air has no oxygen left; it still holds about 16 %"
      - "Relying on a candle to test air: it warns of fixed air in wells and cellars but not of the poisonous gas from smouldering charcoal"
    history:
      islamic: "c. 1242 – Ibn al-Nafis: blood is mixed with air in the lungs"
      europe: "1660s – Boyle and Hooke: animals die in the air pump; Hooke keeps a dog alive by blowing air through its lungs; 1669 Lower: blood turns bright red by contact with air in the lungs; 1674 Mayow's 'nitro-aerial' part of air; 1750s Black finds fixed air in breath; 1783 Lavoisier and Laplace measure a guinea pig's heat and gas output in an ice calorimeter; 1789–1790 Lavoisier and Seguin: oxygen use rises with work, food and cold; 1837 Magnus finds both gases in blood; 1870s Pflüger places respiration in the tissues"
      americas: "1890s – Atwater's human calorimeter confirms energy balance for food and work"
    sources:
      - "Antoine Lavoisier and Pierre-Simon Laplace, Mémoire sur la chaleur (presented 1783)"
      - "Frederic Lawrence Holmes, Lavoisier and the Chemistry of Life (1985)"

  - id: photosynthesis_plant_nutrition
    name: Plants are built from air, water and light (photosynthesis and mineral nutrition)
    category: biology
    requires: [oxygen_combustion]
    helps: [mineral_fertiliser, measurement_quantification, manure_compost_night_soil]
    explain: >
      A plant does not eat soil. Its dry substance comes almost entirely from carbon
      dioxide taken from the air through the leaves and from water, joined in the
      green parts by the energy of sunlight, with oxygen given off. Grow a tree in a
      weighed tub for five years: the gain in tree mass far exceeds the small loss of
      soil. A sprig of mint under a sealed jar in sunlight restores air in which a
      candle has gone out. From the soil the plant takes only water and a small weight
      of dissolved minerals, including nitrogen, phosphorus and potassium compounds.
      Ash retains much of the phosphorus and potassium, while burning drives off most
      nitrogen. The scarcest of these limits the harvest, however plentiful the
      others, and whatever the crop carries away must be put back.
    pitfalls:
      - "The humus theory, that plants feed on decayed plant matter as such"
      - "Van Helmont's own conclusion from the tub experiment, that the tree is made of water only"
      - "Saying plants purify air at all times; in the dark they use oxygen like animals"
      - "Liebig's errors: that plants get enough nitrogen from the air, so his first patent fertiliser left it out and failed"
      - "Adding more of a nutrient that is not the limiting one, or so much that it burns the crop"
    history:
      europe: "1648 – van Helmont's willow experiment published; 1727 Hales suggests leaves take nourishment from air; 1771 Priestley finds plants restore burnt air; 1779 Ingenhousz: only green parts, only in light; 1782 Senebier: fixed air is used; 1804 de Saussure's weighed balance of carbon dioxide and water; 1828 Sprengel and 1840 Liebig: mineral nutrients and the law of the minimum; 1843 Lawes and Gilbert begin field trials at Rothamsted; 1862 Sachs shows starch forms in lit leaves"
    sources:
      - "Jan Ingenhousz, Experiments upon Vegetables (1779)"
      - "Justus Liebig, Die organische Chemie in ihrer Anwendung auf Agricultur und Physiologie (1840)"
      - "Oliver Morton, Eating the Sun: How Plants Power the Planet (2007)"

  - id: nitrogen_fixation_biology
    name: Legumes fix nitrogen from the air (root nodule bacteria)
    category: biology
    requires: []
    helps: [legumes_green_manure, crop_rotation, microorganisms, photosynthesis_plant_nutrition]
    explain: >
      Grain crops take their nitrogen, the nutrient that most limits yield, from the
      soil and exhaust it. Peas, beans, lentils, vetch, clover and lucerne carry small
      swellings on their roots filled with bacteria that take nitrogen from the air
      and pass it to the plant. A legume crop therefore grows on poor soil and leaves
      it richer, most of all if it is grazed or ploughed in green rather than carried
      off. Working nodules are pink inside when cut. If a legume new to a district
      grows poorly and has no nodules, scatter soil from a field where it thrives, or
      coat the seed in a slurry of that soil. Free-living microbes and lightning also
      fix nitrogen; decomposition recycles nitrogen already present in manure and
      plant remains.
    pitfalls:
      - "Supposing all plants can do this, or that legume leaves absorb nitrogen directly"
      - "Harvesting the whole crop and expecting the field to be enriched; most of the nitrogen leaves with the seed and hay"
      - "Taking the nodules for a disease and selecting against them"
      - "Using soil from the wrong legume; each group has its own bacteria"
      - "Heavy manuring of the legume, which makes the plant stop feeding its nodules"
    history:
      greece: "c. 300 BC – Theophrastus notes that beans renew the soil"
      rome: "2nd c. BC – 1st c. AD – Cato, Varro and Columella recommend lupins, beans and vetch ploughed in"
      china: "1st c. BC – Fan Shengzhi's manual; c. 540 Qimin yaoshu ranks green manures and rotations with beans"
      americas: "from c. 1000 BC – maize grown together with beans in Mesoamerica"
      europe: "1838 – Boussingault shows legumes gain nitrogen that cereals do not; 1886–1888 Hellriegel and Wilfarth prove the nodules do it; 1888 Beijerinck isolates the bacteria; 1890 Winogradsky isolates nitrifying bacteria; 1896 Nobbe and Hiltner sell cultures for inoculating seed"
    sources:
      - "Hermann Hellriegel and Hermann Wilfarth, Untersuchungen über die Stickstoffnahrung der Gramineen und Leguminosen (1888)"
      - "G. J. Leigh, The World's Greatest Fix: A History of Nitrogen and Agriculture (2004)"
      - "Vaclav Smil, Enriching the Earth: Fritz Haber, Carl Bosch, and the Transformation of World Food Production (2001)"

  - id: nervous_system_brain
    name: The brain and nerves (seat of thought, electrical signalling)
    category: biology
    requires: []
    helps: [anatomy_dissection, electric_battery, microscope, natural_causes]
    explain: >
      Thought, feeling, sensation and the command of movement sit in the brain, not in
      the heart, and reach the body through the nerves, which are cords of signalling
      fibres, not hollow tubes carrying a spirit. Damage to a motor nerve weakens the
      muscles it supplies; sensory nerve damage can cause numbness. A stroke on one
      side of the brain can impair movement on the opposite side. The pattern of loss
      helps locate the injury. The signal is electrical: a frog's leg twitches when
      its nerve is touched with two different metals joined together, or with the
      wires of a battery. It travels at speeds ranging from under one metre a second
      in thin, unmyelinated fibres to over 100 in large, myelinated ones. Different
      parts of the brain do different work.
    pitfalls:
      - "The Aristotelian view that the heart thinks and the brain cools the blood"
      - "Placing the mind in the fluid-filled cavities of the brain, a widespread medieval teaching"
      - "Phrenology: reading character from bumps on the skull"
      - "Modern myths such as 'we use only 10 % of the brain' or strict left-brain and right-brain personalities"
      - "Supposing nerves conduct like copper wires"
    history:
      egypt: "c. 1600 BC – Edwin Smith papyrus links head wounds to paralysis and loss of speech; c. 300 BC Herophilus in Alexandria separates nerves from tendons and traces them to the brain"
      greece: "c. 450 BC – Alcmaeon of Croton places sensation in the brain; c. 400 BC the Hippocratic 'On the Sacred Disease' calls epilepsy a natural brain disease; 4th c. BC Aristotle prefers the heart"
      rome: "2nd c. AD – Galen silences a squealing pig by tying the nerves to its voice box"
      islamic: "11th c. – Ibn Sina and others assign faculties to the brain's cavities"
      europe: "1664 – Willis, anatomy of the brain; 1791 Galvani's animal electricity; 1811–1822 Bell and Magendie separate sensory and motor nerve roots; 1850 Helmholtz measures the speed of the nerve signal; 1861 Broca locates a speech area; 1888 Ramón y Cajal shows nerve cells are separate units; 1929 Berger's recordings of brain waves"
    sources:
      - "Luigi Galvani, De viribus electricitatis in motu musculari commentarius (1791)"
      - "Stanley Finger, Origins of Neuroscience: A History of Explorations into Brain Function (1994)"
      - "Matthew Cobb, The Idea of the Brain (2020)"
      - "Dale Purves et al. (eds.), Neuroscience (2nd ed., 2001), Increased Conduction Velocity as a Result of Myelination"
