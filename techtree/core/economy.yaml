# Blueprints from Tomorrow – tech tree fragment: Economy & finance.
# Schema: see header of techtree/core.yaml.

technologies:

  - id: coinage
    name: Coinage (stamped metal money)
    category: economy
    requires: []
    helps: [standard_weights_measures, copper_bronze]
    explain: >
      A coin is a piece of metal of fixed weight and fineness stamped by an authority
      that guarantees both, so it can be counted at a glance instead of weighed and
      assayed at every sale. The stamp transfers trust: people accept the coin because
      the issuer stands behind it and takes it back in taxes and fines. Minimum design
      that functions: one fixed weight per denomination, a fixed alloy checked by assay,
      dies that are hard to copy, a mint monopoly with harsh penalties for forgers and
      clippers, and plenty of small base-metal change for daily purchases. Round,
      full-struck flans and later milled (reeded) edges stop clipping.
    pitfalls:
      - "Debasing the coin to pay the ruler's debts: people notice within months, hoard the old good coins and prices rise (Gresham's law: when bad and good coin must be accepted at the same face value, the good coin disappears)"
      - "Fixing a gold-to-silver ratio by decree far from the market ratio: the undervalued metal is melted or exported"
      - "Believing coins invented money: Mesopotamia and Egypt ran on weighed silver, copper and barley and on written credit for some two thousand years before coins"
      - "Minting only valuable coins: a silver piece worth a day's wage is useless for buying bread, and the chronic shortage of small change hurt every pre-modern economy"
      - "Assuming coin value is just its metal: tax acceptance and the issuer's credit let good coins circulate above metal value, and that premium is exactly what tempts rulers to debase"
    history:
      mesopotamia: "c. 2500 BC onwards – silver weighed by the shekel (about 8.3 g) is the standard of value and of payment, often as cut rings and scraps (hacksilver); true coins only arrive with Achaemenid and Greek rule"
      egypt: "New Kingdom – prices reckoned in weighed units (deben of about 91 g of copper, silver shat) without coins; coinage only under Persian and Ptolemaic rule (4th–3rd c. BC)"
      greece: "c. 630–600 BC – first coins of electrum (gold-silver alloy) in Lydia and the Ionian cities of western Anatolia (Ephesus Artemision deposit); c. 550 BC separate pure gold and silver coins, traditionally credited to Croesus though some scholars date them to the early Persian period; Aegina, Athens and Corinth strike silver from the 6th c. BC"
      china: "by c. 6th–5th c. BC – cast bronze spade and knife money, an independent invention (exact start disputed); 221 BC Qin imposes the round coin with a square hole (banliang); 118 BC Han wuzhu coin, standard for some seven centuries"
      india: "c. 6th–4th c. BC – punch-marked silver coins (karshapana), probably an independent development; dating disputed"
      rome: "c. 211 BC – silver denarius; 3rd c. AD debasement of the silver coinage to a few per cent silver; 309 Constantine's gold solidus (1/72 Roman pound, about 4.5 g), stable for some seven centuries in Byzantium"
      africa: "c. AD 270 – Aksum (Ethiopia) strikes gold, silver and bronze coins"
      islamic: "696–698 – Abd al-Malik's reform: purely inscribed gold dinar (about 4.25 g) and silver dirham replace Byzantine and Sasanian types; muhtasib inspectors check coin in markets"
      europe: "c. 755–794 – Carolingian silver penny and the reckoning 1 pound = 20 shillings = 240 pence; 1252 Florence gold florin and Genoa genovino; 1284 Venetian ducat; 1550s screw-press minting in Paris; 1662 machine-milled coinage in England"
    sources:
      - "David M. Schaps, The Invention of Coinage and the Monetization of Ancient Greece (2004)"
      - "Thomas J. Sargent & François R. Velde, The Big Problem of Small Change (2002)"
      - "Glyn Davies, A History of Money from Ancient Times to the Present Day (1994)"

  - id: double_entry
    name: Double-entry bookkeeping
    category: economy
    requires: []
    helps: [arabic_numerals]
    explain: >
      Each transaction has equal total debits and credits across at least two accounts (receiving 100 florins from Piero: debit Cash 100,
      credit Piero 100). Keep a dated journal of all transactions and a ledger with one
      page per person, good, cash and the owner's capital. Because every entry has
      two equal sides, total debits must equal total credits; a trial balance that
      does not agree shows an error at once. At year end the accounts are closed into a
      profit-and-loss account and a balance, which tells the owner his profit per
      venture, what he owes and is owed, and lets a partner or auditor check a distant
      agent.
    pitfalls:
      - "Taking balanced books for honest books: an omitted transaction or a fraud entered on both sides balances perfectly"
      - "Saying Pacioli invented it: he described in print (1494) a Venetian practice already some two centuries old"
      - "Reading debit and credit as bad and good, or as minus and plus everywhere: their sign depends on the kind of account"
      - "Mixing the owner's household spending with the business, or valuing stock differently each year, makes the profit figure meaningless"
      - "Claiming double entry created capitalism (Sombart): historians such as Yamey argue merchants decided without it and many prospered with single entry"
    history:
      mesopotamia: "c. 2100–2000 BC – Ur III scribes balance receipts against issues for each official, a careful single-entry control, not double entry"
      china: "Song onwards – 'four pillars' (sizhu) method: opening balance plus receipts minus issues equals closing balance; Qing merchants' longmen zhang is sometimes called double entry, the claim is disputed"
      islamic: "Abbasid to Ilkhanid state accounting kept elaborate balanced registers (al-Mazandarani's manual, 1363); claims that true double entry began in the Islamic or Cairo Geniza world are disputed"
      europe: "c. 1300 – earliest surviving double-entry ledgers of Tuscan firms (Farolfi company, 1299–1300); 1340 Genoa's communal treasury (massari) ledgers in full double entry; 1458 Cotrugli's manuscript Della mercatura describes it (printed 1573); 1494 Luca Pacioli's Summa, first printed treatise"
      east_asia: "Kaesong merchants of Korea used a four-element double-entry system (sagae chibubeop); its origin before the 18th c. is unproven"
    sources:
      - "Luca Pacioli, Summa de arithmetica, geometria, proportioni et proportionalita (1494)"
      - "Jacob Soll, The Reckoning: Financial Accountability and the Rise and Fall of Nations (2014)"
      - "B. S. Yamey, Scientific Bookkeeping and the Rise of Capitalism, Economic History Review 1 (1949)"

  - id: interest_loans_collateral
    name: Interest-bearing loans, pledges and limits on debt bondage
    category: economy
    requires: []
    helps: [alphabet_writing, written_law_code, compound_interest_exponential_growth]
    explain: >
      A lender hands over grain, seed or silver for a fixed term and is paid back with
      an agreed extra (interest), under a written, witnessed contract secured by a
      pledge (land, goods) or a guarantor. Interest pays for waiting, for the risk of
      default and for what the lender gives up. Charitable and religious lenders also made
      interest-free loans.
      Mesopotamian law fixed customary maxima of 20 % a year on silver and 33⅓ % on
      barley. What keeps a credit system from wrecking society is a limit on what
      default can take: no enslavement of the debtor's person (or only for a short
      fixed time), a protected minimum of tools and land, and an orderly way to cancel
      unpayable debts (debt-release edicts, later bankruptcy law).
    pitfalls:
      - "Banning interest outright: lending goes underground or is disguised (bills of exchange, sale-and-buy-back, rent charges), and the hidden rate is higher because the risk is higher"
      - "Letting creditors seize the debtor's body or family: debt bondage built up until Solon had to cancel debts (594 BC) and Mesopotamian kings issued release edicts"
      - "Fixing a low legal maximum rate by decree: lenders simply stop lending to the poor"
      - "Forgetting compounding: a 33 % yearly debt left unpaid triples in under four years"
      - "Assuming medieval Christians or Muslims did no lending: bans changed the form of finance, not its existence"
    history:
      mesopotamia: "c. 2400 BC – Enmetena of Lagash proclaims a release of debts; temples and palaces lend barley and silver, alongside private lenders (how far temples dominated is debated); c. 1754 BC Hammurabi caps interest at 20 % on silver and 33⅓ % on grain and limits debt servitude to three years (§117); c. 1646 BC Ammi-saduqa's release edict"
      egypt: "Ptolemaic law caps interest at 24 % a year"
      india: "c. 2nd c. BC–2nd c. AD – the Laws of Manu (8.140) fix 1¼ % a month on secured loans as the fair rate, higher by caste and risk"
      greece: "594 BC – Solon cancels debts secured on persons and forbids loans on the body (seisachtheia)"
      rome: "c. 450 BC – Twelve Tables cap interest; 326 BC (traditional) lex Poetelia ends nexum bondage for debt; Justinian caps ordinary interest at 6 %"
      china: "Han–Tang – written loan contracts with guarantors survive at Dunhuang and Turfan; 1069 Wang Anshi's 'green sprouts' state loans to farmers, attacked as forced lending"
      islamic: "7th c. – riba forbidden; trade-based credit (murabaha, deferred-price sale) and profit-sharing partnership finance develop instead"
      europe: "1179 and 1311 – church councils condemn usury; 1462 first Monte di Pietà (Perugia), cheap pawn loans to the poor; 1545 England permits interest up to 10 %"
    sources:
      - "Michael Hudson & Marc Van De Mieroop (eds.), Debt and Economic Renewal in the Ancient Near East (2002)"
      - "Sidney Homer & Richard Sylla, A History of Interest Rates (2005)"

  - id: banking_credit
    name: Deposit banking and bills of exchange
    category: economy
    requires: []
    helps: [coinage, double_entry, interest_loans_collateral, postal_system]
    explain: >
      A bank keeps deposits and lends out most of them, holding only a reserve,
      because depositors rarely all withdraw at once; it pays from one account to
      another by a book entry, so coin need not move. To pay at a distance, a merchant
      in Florence pays a banker and receives a bill of exchange: a written order on
      the banker's correspondent in Bruges to pay a named person a sum in Bruges money
      on a set date. Bills flow both ways, so the correspondents settle by offsetting
      and only net balances travel as coin. Minimum design: an honest ledger, trusted
      correspondents, the owners' own capital at risk, a reserve sized for bad weeks,
      and loans spread over many borrowers.
    pitfalls:
      - "Lending deposits to one prince: Bardi and Peruzzi of Florence failed in the 1340s after Edward III stopped paying (how much this caused the crash is debated)"
      - "Lending long with money depositors can withdraw tomorrow: the first rumour starts a run that ruins even a sound bank"
      - "Treating a bill of exchange as a mere money transfer: with exchange and re-exchange it was often a disguised interest-bearing loan, which is why theologians fought over it"
      - "Calling fractional reserves a fraud and insisting on 100 % reserve: full reserves against demand deposits still allow fee income and lending from equity or separately raised funds"
      - "Assuming banking began in Renaissance Italy: Babylonian business houses, Athenian trapezitai, Abbasid jahbadhs and Chinese remittance offices all came earlier"
    history:
      mesopotamia: "2nd millennium BC – temples, palaces and merchants take deposits and lend; c. 600–480 BC the Egibi family of Babylon run a multi-generation business of deposits, loans, payment orders and property; 5th c. BC Murashu house at Nippur finances landholders"
      greece: "4th c. BC – Athenian trapezitai (table bankers) such as Pasion take deposits, lend and pay on clients' instructions"
      rome: "argentarii take deposits, lend and keep accounts for clients; transfers by written instruction"
      islamic: "9th–10th c. – jahbadhs (state bankers) in Baghdad; suftaja, a loan repayable in another city, avoids transporting coin; sakk is a written payment instrument. Classical hawala transfers a debt obligation; modern hawala brokers arrange remittances and settle balances between themselves"
      china: "c. 9th c. – Tang feiqian ('flying money'): merchants deposit cash in the capital and redeem the certificate in the provinces; 19th c. Shanxi piaohao remittance banks"
      india: "medieval onwards – hundi, merchant bills for remittance and credit, used across the subcontinent"
      europe: "12th c. – Genoese bankers' deposit accounts; 13th c. bills of exchange at the Champagne fairs; 1397–1494 Medici bank with branches across Europe; 1401 Taula de Canvi of Barcelona; 1407 Casa di San Giorgio, Genoa; 1609 Amsterdam Wisselbank"
    sources:
      - "Raymond de Roover, The Rise and Decline of the Medici Bank, 1397–1494 (1963)"
      - "William N. Goetzmann, Money Changes Everything: How Finance Made Civilization Possible (2016)"
      - "Charles P. Kindleberger, A Financial History of Western Europe (1984)"

  - id: paper_money
    name: Paper money
    category: economy
    requires: [paper]
    helps: [woodblock_printing, banking_credit, quantity_theory_inflation]
    explain: >
      A paper note works as money when its holder can pass it on in payment. Redemption
      in coin or acceptance for taxes can establish demand. The Song state first issued
      Sichuan jiaozi in 1024. The recorded limit per issue was 1,256,340 strings of cash,
      with a prescribed reserve of 360,000 strings (about 29 %). Notes were exchanged
      for new ones at the end of their term. Specify who issues and accepts the notes,
      how the supply is controlled and how holders can recognise genuine notes. Seals,
      patterned printing and distinctive paper make imitation harder.
    pitfalls:
      - "Financing persistent deficits by issuing notes can destroy their purchasing power (late Song and Yuan notes, the Ming baochao by the mid-15th c., Law's notes 1720, Continental dollars, French assignats, Weimar 1923)"
      - "Refusing one's own notes in tax payments: this weakens demand for state notes, especially if holders also cannot redeem them"
      - "Mistaking money for wealth: extra notes do not themselves create goods; the price effect depends on output and demand for money"
      - "Simple printing: easy-to-copy notes invite forgers and destroy trust"
      - "Introducing it where people have never trusted credit or the ruler: the Ilkhanid notes of Tabriz (1294) made markets close and were withdrawn within about two months"
    history:
      china: "9th c. – Tang 'flying money' remittance certificates (not currency); c. 1000 private issuers circulate jiaozi in Sichuan; the Song shi names sixteen wealthy households. The Yizhou bureau is authorised in 1023 and issues state notes in 1024; 1160s Southern Song huizi; 1260 Kublai's zhongtong chao, empire-wide paper currency; 1375 Ming baochao, inconvertible, abandoned in practice in the 15th c."
      islamic: "1294 – Ilkhan Gaykhatu issues paper chao on the Chinese model at Tabriz; trade halts and the experiment ends within weeks"
      india: "1329–1332 – Muhammad bin Tughlaq issues brass and copper token coins at the value of silver; mass forgery forces their redemption, a cautionary case of fiat money without anti-counterfeiting"
      east_asia: "c. 1600 – Yamada hagaki notes of Ise merchants in Japan; 1661 domain notes (hansatsu) of Fukui"
      europe: "1661 – Stockholms Banco (Palmstruch) issues the first European banknotes, fails from over-issue by 1664; 1694 Bank of England notes; 1716–1720 John Law's Banque Royale and its collapse; 1790s French assignats"
      americas: "1685 – New France issues money on playing cards; 1690 Massachusetts Bay issues bills of credit; 1775–1780 Continental dollars lose almost all value"
    sources:
      - "Richard von Glahn, Fountain of Fortune: Money and Monetary Policy in China, 1000–1700 (1996)"
      - "Marco Polo, The Description of the World (c. 1300), book II, on the Great Khan's paper money"
      - "Glyn Davies, A History of Money from Ancient Times to the Present Day (1994)"

  - id: quantity_theory_inflation
    name: Money supply, debasement and inflation
    category: economy
    requires: []
    helps: [coinage, paper_money]
    explain: >
      If money circulates at the same speed and its quantity grows faster than the volume
      of transactions, the average transaction price rises. Written as
      MV = PT: money times the speed it changes hands equals price level times
      transactions. Debasement, new notes and silver inflows can expand the money supply, but output
      and the demand to hold money can also change. Unexpected inflation reduces the
      purchasing power of fixed payments and the real burden of fixed nominal debts.
      Compare England's Great Debasement with paper issues in revolutionary France.
    pitfalls:
      - "Blaming greedy merchants or hoarders for a general price rise caused by the mint or the printing house"
      - "Believing more money makes a country richer: Spain imported vast silver and suffered inflation while productive neighbours gained"
      - "Thinking the relation is exact and immediate: velocity changes with confidence, and if output grows, more money need not raise prices"
      - "Fighting inflation with price ceilings: shortages and black markets follow"
      - "Forgetting the opposite danger: a shortage of money (deflation) strangles trade and ruins debtors"
    history:
      china: "c. 4th–1st c. BC – the Guanzi discusses how the quantity of money and grain the state holds moves prices; 1077 Shen Kuo contrasts coins hoarded in one household with the same coins passing repeatedly among ten households"
      rome: "3rd c. AD – the silver content of the coinage falls to a few per cent and prices rise many times over; 301 Diocletian answers with price controls that fail"
      islamic: "1405 – al-Maqrizi (Ighathat al-umma) blames Egypt's price rise on excessive issue of copper coin"
      europe: "c. 1355–1360 – Nicole Oresme, De moneta, against debasement; 1526 Copernicus' treatise on coinage; 1556 Azpilcueta and 1568 Bodin link the price rise to American silver; 1752 Hume, Of Money; 1911 Irving Fisher's equation of exchange; 1923 German hyperinflation"
      americas: "1545 onwards – Potosí silver feeds a century-long rise in European and Asian prices (the role of population growth is disputed)"
    sources:
      - "Li Tao, Xu Zizhi tongjian changbian (12th c.), juan 283, recording Shen Kuo’s monetary proposals"
      - "Jean Bodin, Response to the Paradoxes of Malestroit (1568)"
      - "Irving Fisher, The Purchasing Power of Money (1911)"
      - "Milton Friedman & Anna J. Schwartz, A Monetary History of the United States, 1867–1960 (1963)"

  - id: partnership_commenda
    name: Risk-sharing partnership (commenda, mudaraba)
    category: economy
    requires: []
    helps: [double_entry, alphabet_writing]
    explain: >
      An investor puts up the capital, a travelling merchant puts in his work; profit
      is split in an agreed share (in Genoa commonly three quarters to the investor,
      one quarter to the traveller), while losses fall on the capital, so the
      traveller risks only his labour. Savers who cannot travel can finance voyages,
      a merchant without money can trade, and an investor can spread his wealth over
      many small ventures. Because it shares profit rather than charging interest, it
      fitted both Islamic and Christian usury rules. The agent must keep accounts and
      return to settle; a written contract registered with a notary or witnesses
      fixes shares, route and duration.
    pitfalls:
      - "Treating it as a loan with interest: if the voyage fails, the investor gets nothing back"
      - "Forgetting the agent problem: a distant partner can hide profits, so accounts, reputation and merchant courts are needed"
      - "Confusing it with a general partnership, where every partner is liable with all his property for the firm's debts"
      - "Expecting it to fund a long-lived enterprise: each commenda ends with one voyage or term, which is why joint-stock companies were later needed"
    history:
      mesopotamia: "c. 1900 BC – Old Assyrian naruqqum ('bag'): a dozen or so investors pool gold for a Kanesh merchant for about ten years, sharing profit"
      islamic: "8th c. – mudaraba (qirad) set out in Hanafi law (al-Shaybani), widely used in Mediterranean and Indian Ocean trade"
      europe: "10th–12th c. – Venetian colleganza and Genoese commenda, recorded in notarial registers from the 1150s; 1408 Florence allows the accomandita, a limited partnership with a passive partner liable only for his stake"
      china: "Ming–Qing – hehuo partnerships pool capital from several investors for a managing partner"
    sources:
      - "Abraham L. Udovitch, Partnership and Profit in Medieval Islam (1970)"
      - "Robert S. Lopez & Irving W. Raymond, Medieval Trade in the Mediterranean World (1955)"
      - "Mogens Trolle Larsen, Ancient Kanesh: A Merchant Colony in Bronze Age Anatolia (2015)"

  - id: joint_stock_company
    name: Joint-stock company and limited liability
    category: economy
    requires: []
    helps: [partnership_commenda, double_entry, rule_of_law, stock_exchange]
    explain: >
      The capital is divided into many equal shares that can be sold to others; the
      company is a legal person that owns property, signs contracts and outlives its
      members; shareholders elect directors and receive dividends out of profit; with
      limited liability a shareholder can lose his stake but no more. This locks
      capital into long ventures (ships, mines, canals, railways) while each investor
      can still get out by selling his share instead of withdrawing money from the
      firm. Minimum design: a charter or general law of incorporation, a share
      register, audited accounts shown to shareholders, and dividends paid only from
      profit.
    pitfalls:
      - "Limited liability without disclosure or audit invites swindles and bubbles (South Sea Company 1720)"
      - "Forgetting that managers spend other people's money (Adam Smith's complaint): owners need votes, accounts and the power to dismiss"
      - "Paying dividends out of capital to keep the share price up: a classic fraud"
      - "Saying the Dutch East India Company was the first company: Roman tax-farming societies and the Toulouse mill companies had shares centuries earlier"
      - "Tying incorporation to a royal monopoly charter: it becomes a favour for courtiers rather than a tool for anyone"
    history:
      rome: "2nd–1st c. BC – societates publicanorum, tax-farming companies with shares (partes) held by outside investors; how freely shares were traded is disputed"
      europe: "12th c. – mill owners at Toulouse hold transferable shares (uchaux), consolidated in 1372 into the Bazacle company, which lasted until 1946; 1407 Genoa's Casa di San Giorgio with tradable shares in public debt; 1555 Muscovy Company charter; 1600 English East India Company; 1602 Dutch VOC with permanent capital (from 1612) and shares traded in Amsterdam; 1720 Bubble Act; 1855–1856 British general limited liability"
      islamic: "1775 – Ottoman esham, shares in the revenue of tax farms sold to the public"
      china: "1872 – China Merchants' Steam Navigation Company pools merchant share capital under official supervision"
      east_asia: "1873 – First National Bank of Japan, founded by Shibusawa Eiichi as a joint-stock company"
      americas: "1811 – New York general incorporation act for manufacturing firms with limited liability"
    sources:
      - "Adam Smith, An Inquiry into the Nature and Causes of the Wealth of Nations (1776), book V ch. 1"
      - "William N. Goetzmann & K. Geert Rouwenhorst (eds.), The Origins of Value (2005)"
      - "John Micklethwait & Adrian Wooldridge, The Company: A Short History of a Revolutionary Idea (2003)"

  - id: insurance
    name: Insurance (marine, fire, life)
    category: economy
    requires: []
    helps: [probability_statistics, life_tables_annuities, double_entry]
    explain: >
      Many people who face the same risk each pay a small premium into a pool, and
      the few who suffer the loss are paid out of it. It works because among many
      independent ships or houses the share lost each year is predictable even though
      no single loss is: the law of large numbers. Premium = expected loss + costs +
      margin, so the insurer needs records of how often ships sink or houses burn.
      Spread each risk among several underwriters, keep reserves, insure no more than
      the true value, and make the insured bear part of the loss so that he still
      takes care (deductible, co-insurance); inspect ships and houses and ask about
      health so that only bad risks are not the ones who buy.
    pitfalls:
      - "Insuring risks that strike all at once (a whole town burning, war, epidemic): the pool fails exactly when needed"
      - "Insuring a ship or house above its value invites scuttling and arson"
      - "Charging everyone the same premium: the young and safe leave, the old and risky stay, and the pool goes bankrupt (adverse selection)"
      - "Allowing policies on strangers' lives: it becomes betting and a motive for murder; require an insurable interest"
      - "Repeating the unsourced claim that Chinese merchants in the 3rd millennium BC insured by spreading cargo over many boats"
    history:
      mesopotamia: "c. 1754 BC – Hammurabi §§100–103: a trading agent robbed on the road swears an oath and is released from repaying the investor, an allocation of risk rather than insurance"
      greece: "4th c. BC – maritime loans (bottomry): repaid with high interest only if the ship arrives, combining credit and insurance"
      rome: "fenus nauticum (sea loan); burial clubs (collegia) pay members' funerals from dues"
      islamic: "the aqila, a kin group sharing blood-money payments, is a mutual liability rule, not commercial insurance; Muslim jurists debated commercial insurance from the 19th c. (Ibn Abidin)"
      europe: "1347 – Genoa, earliest known separate marine insurance contracts (premium paid, no loan); 1435 Barcelona insurance ordinance; c. 1688 Lloyd's coffee house in London; 1676 Hamburg's public fire fund; 1680 Barbon's Fire Office after the 1666 fire; 1762 Equitable Society with age-graded life premiums"
      americas: "1752 – Philadelphia Contributionship fire insurance (Franklin)"
    sources:
      - "Florence Edler de Roover, Early Examples of Marine Insurance, Journal of Economic History 5 (1945)"
      - "Peter L. Bernstein, Against the Gods: The Remarkable Story of Risk (1996)"
      - "Geoffrey Clark, Betting on Lives: The Culture of Life Insurance in England, 1695–1775 (1999)"

  - id: life_tables_annuities
    name: Life tables and the pricing of annuities
    category: economy
    requires: []
    helps: [census_vital_registration, probability_statistics, compound_interest_exponential_growth, insurance]
    explain: >
      Follow a birth cohort, or calculate age-specific death rates using both deaths and
      population exposed at each age. Apply these rates to a hypothetical 1,000 newborns. The table gives the chance that a person of a given
      age lives another year, five, twenty. A life annuity (a yearly payment until
      death) is then worth the sum, over all future years, of the payment times the
      chance of being alive then, discounted at the interest rate. A 60-year-old's
      annuity is worth far less than a 10-year-old's. The same table prices life
      insurance and pensions and shows which ages and places have abnormal mortality.
    pitfalls:
      - "Selling annuities at the same price whatever the buyer's age: governments in England (1690s) and France lost heavily, and Geneva bankers profited by buying them on the lives of carefully chosen healthy young girls"
      - "Reading a life expectancy at birth of 30 as 'people died at 30': high infant mortality drags the average down, and those who survived childhood often reached their sixties"
      - "Building the table from a growing or migrating population as if it were stationary (Halley chose Breslau for that reason)"
      - "Forgetting interest: a payment due in 30 years is worth much less today even if the annuitant is sure to live"
    history:
      rome: "c. AD 220s – a table attributed to Ulpian (Digest 35.2.68) values life annuities by age for inheritance tax, without stated mortality data"
      europe: "1662 – Graunt's rough life table from the London bills of mortality; 1671 Johan de Witt prices Dutch life annuities by probability; 1693 Halley's Breslau table and annuity values; 1725 de Moivre; 1762 Equitable Society; 1815 Milne's Carlisle table"
    sources:
      - "Edmond Halley, An Estimate of the Degrees of the Mortality of Mankind, Philosophical Transactions 17 (1693)"
      - "Ian Hacking, The Emergence of Probability (1975)"
      - "Anders Hald, A History of Probability and Statistics and Their Applications before 1750 (1990)"

  - id: public_debt_bonds
    name: Public debt and government bonds
    category: economy
    requires: []
    helps: [banking_credit, double_entry, representative_government, stock_exchange]
    explain: >
      The state borrows from many lenders at once by issuing standard, transferable
      bonds that pay a fixed interest, with specific taxes pledged to pay it and
      ideally an assembly of taxpayers and lenders that has voted the debt. Because a
      holder can sell his bond to someone else, he does not need to wait for
      repayment, so he accepts a lower rate; perpetual bonds need never be repaid at
      all. A state that always pays can spread the cost of a war over decades instead
      of debasing coin or seizing property. Minimum design: earmarked revenue, an
      office independent of the ruler that collects it and pays the interest, a public
      register of holders, and an unbroken record of paying on time.
    pitfalls:
      - "Treating a royal loan from a banker as public debt: kings who could default at will paid far higher rates than city-republics whose creditors governed"
      - "Borrowing without a pledged revenue: lenders stop lending and the state defaults (Spain under Philip II repeatedly)"
      - "Forced loans or arbitrary cuts in interest destroy the market for decades"
      - "Assuming all debt is ruin: Britain carried a debt above twice its yearly income after 1815 and prospered, because it paid reliably"
      - "Inflating the debt away works once; afterwards lenders demand much higher rates"
    history:
      greece: "4th c. BC – Greek cities borrow from temple treasuries (Delos) and from citizens for specific needs"
      rome: "Republic – loans from citizens in emergencies (210 BC), repaid in instalments; the Empire avoided long-term debt"
      china: "imperial China rarely borrowed, financing by taxes and paper money; 1894–1898 first domestic bond issues, foreign loans after 1860s"
      islamic: "1775 – Ottoman esham, tradeable life shares in tax revenues; 1854 first foreign loan; 1875 default and 1881 Ottoman Public Debt Administration"
      europe: "1262 – Venice consolidates forced loans into the Monte Vecchio, 5 % transferable claims; 1345 Florence's Monte Comune; 1407 Genoa's Casa di San Giorgio; 1522 Paris rentes; 1540s Holland's province bonds; 1693–1694 English national debt and Bank of England; 1751 consols"
      americas: "1790 – Hamilton funds the US federal debt and assumes the states' debts"
    sources:
      - "P. G. M. Dickson, The Financial Revolution in England (1967)"
      - "Douglass C. North & Barry R. Weingast, Constitutions and Commitment, Journal of Economic History 49 (1989)"
      - "James D. Tracy, A Financial Revolution in the Habsburg Netherlands (1985)"

  - id: stock_exchange
    name: Stock exchange (securities market)
    category: economy
    requires: []
    helps: [joint_stock_company, public_debt_bonds, newspapers_periodicals]
    explain: >
      A fixed place and hours where shares and bonds are bought and sold among many
      traders through brokers, with standard settlement days and published prices.
      Its value is liquidity: an investor buys a share in a 20-year venture because he
      knows he can sell it next week, so companies and states can raise long-term money
      cheaply, and the price summarises what traders collectively expect. Minimum
      design: transferable securities with a register of owners, licensed brokers bound
      by rules, a fixed settlement procedure, and printed price lists.
    pitfalls:
      - "Taking the market price for the true value: prices swing with fear and fashion"
      - "Allowing purchases on borrowed money without limits: a fall forces sales and becomes a crash (1720, 1929)"
      - "No disclosure rules: insiders and promoters pump and dump"
      - "Banning short sales or futures: Amsterdam tried in 1610 and trading simply continued informally"
    history:
      europe: "13th–14th c. – Venetian and Genoese public debt claims change hands; 15th c. merchants meet at the van der Beurse inn in Bruges; 1531 Antwerp Bourse building; 1602–1611 VOC shares traded in Amsterdam, Beurs opened 1611, with forwards and options; 1688 de la Vega describes it; 1698 Castaing's price lists in London; 1801 London Stock Exchange"
      east_asia: "1697–1730 – Dojima rice market in Osaka, officially licensed 1730, trades standard rice futures; 1878 Tokyo Stock Exchange"
      americas: "1792 – Buttonwood Agreement founds the New York brokers' exchange"
      india: "1875 – Native Share and Stock Brokers' Association, Bombay"
      islamic: "1866 – Istanbul securities exchange (Dersaadet Tahvilat Borsası)"
      china: "1891 – Shanghai Sharebrokers' Association"
    sources:
      - "Joseph de la Vega, Confusión de confusiones (1688)"
      - "Larry Neal, The Rise of Financial Capitalism (1990)"
      - "Edward Chancellor, Devil Take the Hindmost: A History of Financial Speculation (1999)"

  - id: central_bank
    name: Central bank and lender of last resort
    category: economy
    requires: [banking_credit]
    helps: [paper_money, public_debt_bonds, quantity_theory_inflation]
    explain: >
      One bank holds the government's account and the reserves of the other banks and
      usually has the monopoly of issuing notes. It keeps the money's value steady by
      changing the rate at which it lends (the discount rate) and by buying or selling
      securities. In a panic it is the lender of last resort: following Bagehot's rule
      it lends freely to sound banks against good security at a high rate, so that
      depositors see they can be paid and the run stops, while insolvent banks are
      allowed to fail. It must be shielded from the treasury, or it becomes a printing
      press for deficits.
    pitfalls:
      - "Letting it finance the government's deficits: Law's Banque Royale (1720) and the Reichsbank (1923)"
      - "Standing aside in a panic: sound banks fail with the unsound (United States 1930–1933)"
      - "Rescuing every bank and its owners: they then take ever bigger risks (moral hazard)"
      - "Thinking the early banks were founded as central banks: the Bank of England was set up in 1694 to lend to the king and learned the role over 150 years"
    history:
      europe: "1609 – Amsterdam Wisselbank, a public exchange bank with stable bank money; 1668 Sveriges Riksbank, the oldest still existing; 1694 Bank of England; 1800 Banque de France; 1844 Bank Charter Act; 1866 Overend Gurney crisis and 1873 Bagehot's Lombard Street; 1876 Reichsbank"
      islamic: "1863 – Imperial Ottoman Bank acts as state bank and note issuer"
      east_asia: "1882 – Bank of Japan"
      americas: "1913 – Federal Reserve"
      india: "1935 – Reserve Bank of India"
      china: "1928 – Central Bank of China (Nationalist government)"
    sources:
      - "Walter Bagehot, Lombard Street: A Description of the Money Market (1873)"
      - "Charles Goodhart, The Evolution of Central Banks (1988)"
      - "Charles P. Kindleberger, Manias, Panics, and Crashes (1978)"

  - id: division_of_labour
    name: Division of labour and specialisation
    category: economy
    requires: []
    helps: [price_mechanism_supply_demand]
    explain: >
      Splitting a job into simple steps, each done all day by one person, multiplies
      output: practice makes each worker fast, no time is lost changing tasks and
      tools, and a simple repeated motion is easy to give to a machine. Smith's pin
      workshop: ten workers splitting 18 operations made about 48,000 pins a day,
      where each alone might make twenty. The limit is the size of the market: it pays
      only where goods can be sold in large numbers, so roads, canals and free trade
      widen it. Babbage added that skilled, highly paid workers can then be kept for
      the skilled steps alone.
    pitfalls:
      - "Specialising production before there is a market for the output: the goods pile up unsold"
      - "Ignoring the human cost: Smith himself warned that endlessly repeating one motion makes a worker 'as stupid and ignorant as it is possible'"
      - "Forgetting coordination: one missing step or sick worker stops the whole line"
      - "Treating it as modern: Ur III textile workshops, Han lacquer workshops and the Venetian Arsenal practised it"
      - "Confusing it with hereditary assignment of trades by birth, which blocks people from moving to where they are most productive"
    history:
      mesopotamia: "c. 2100–2000 BC – Ur III state textile workshops employ thousands of women weavers in specialised teams"
      greece: "c. 370 BC – Xenophon (Cyropaedia VIII.2.5) notes that in large cities one man makes only men's shoes and another only women's, and the work is better for it; Plato, Republic II"
      china: "1st c. BC–1st c. AD – Han lacquer cups inscribed with the names of six or more specialised craftsmen and supervisors; Qin standardised crossbow parts"
      islamic: "1377 – Ibn Khaldun (Muqaddimah) explains that cooperation and specialisation produce far more than any person needs, the basis of urban wealth"
      india: "occupational castes (jati) fix trades by birth, a specialisation by heredity rather than choice"
      europe: "15th–16th c. – the Venetian Arsenal fits out galleys on an assembly line; 1776 Smith; 1832 Babbage"
    sources:
      - "Adam Smith, An Inquiry into the Nature and Causes of the Wealth of Nations (1776), book I ch. 1–3"
      - "Charles Babbage, On the Economy of Machinery and Manufactures (1832)"
      - "Ibn Khaldun, Muqaddimah (1377)"

  - id: comparative_advantage_free_trade
    name: Comparative advantage and free trade
    category: economy
    requires: []
    helps: [division_of_labour, positive_sum_cooperation]
    explain: >
      Two countries both gain from trade if each specialises in what it gives up
      least to produce, even if one is better at everything. Ricardo's example:
      Portugal needs 90 men a year for a quantity of cloth and 80 for a quantity of
      wine; England needs 100 and 120. At one unit of wine for one of cloth, Portugal gives up 80 worker-years to obtain
      cloth that would take 90 at home; England gives up 100 to obtain wine that would take 120. The everyday version:
      a lawyer who types faster than her clerk still gains by hiring the clerk. Lower
      tariffs let each country use the cheapest source, raising total income; the
      gains are real but not shared equally, so some producers lose.
    pitfalls:
      - "Confusing comparative with absolute advantage: 'they are better at everything, so we cannot trade' is wrong"
      - "Promising that everyone gains: protected producers lose and may need compensation or time to adjust"
      - "Judging trade by the balance of exports and imports (mercantilism) rather than by what people can consume"
      - "Ignoring transport costs, war and strategic dependence, and the infant-industry argument of Hamilton and List"
      - "Urging free trade on a city or prince whose revenue comes from tolls and customs, without offering another revenue"
    history:
      islamic: "1838 – Treaty of Balta Liman fixes low Ottoman tariffs and abolishes monopolies, under British pressure"
      china: "1757–1842 – Canton system restricts foreign trade to one port; 1842 treaty ports opened by force"
      east_asia: "1858 – treaties impose low tariffs on Japan"
      europe: "1776 – Smith argues for free trade on absolute advantage; 1815 Torrens and 1817 Ricardo state comparative advantage (credit between Ricardo, Torrens and James Mill is debated); 1846 repeal of the Corn Laws; 1860 Cobden–Chevalier treaty"
      americas: "1791 – Hamilton's Report on Manufactures argues for protecting young industries"
      global: "1947 – GATT"
    sources:
      - "David Ricardo, On the Principles of Political Economy and Taxation (1817), ch. 7"
      - "Douglas A. Irwin, Against the Tide: An Intellectual History of Free Trade (1996)"

  - id: price_mechanism_supply_demand
    name: Prices, supply and demand
    category: economy
    requires: []
    helps: [coinage, division_of_labour]
    explain: >
      Where people may buy and sell freely, the price rises when a good is scarce
      relative to buyers and falls when it is plentiful. A high price does two jobs at
      once: it rations what there is among buyers willing and able to pay, and it draws
      in more supply, as merchants bring grain from where it is cheap and farmers sow
      more. A price fixed below the market level empties the shops and stops supply;
      one fixed above it leaves goods unsold. In a famine the best help is to give the
      poor money or work so they can buy, and let the high price pull grain in, while
      the state buys and moves grain itself if traders cannot.
    pitfalls:
      - "Capping prices in a dearth: grain vanishes from the market and suppliers stop coming (Diocletian's edict 301, the French maximum 1793)"
      - "Blaming merchants for a scarcity or for a rise caused by debasement, and so driving away the trade that would end it"
      - "Assuming famines come only from lack of food: many came from collapsing wages or prices of what the poor sell (Sen)"
      - "Believing markets always work: monopoly, collusion, cornering and fraud need rules and inspection"
      - "Preaching a 'just price' fixed by custom while costs change"
    history:
      mesopotamia: "c. 1800 BC – the laws of Eshnunna open with a list of fixed prices, an early attempt to set prices by law"
      china: "c. 4th–1st c. BC – the Guanzi 'light and heavy' chapters analyse how scarcity moves prices and how the state can trade to steady them; c. 90 BC Sima Qian (Shiji ch. 129) argues that high prices draw goods in and low ones send them away"
      rome: "301 – Diocletian's Edict on Maximum Prices, widely ignored and abandoned"
      islamic: "7th c. – a hadith has the Prophet refusing to fix prices; 13th–14th c. Ibn Taymiyya distinguishes unjust price fixing from intervention to secure a fair price when sellers exploit necessity; 1377 Ibn Khaldun on prices, demand and urban wealth"
      europe: "16th c. – Salamanca theologians on prices and money; 1776 Adam Smith; 1838 Cournot's demand function; 1890 Marshall's supply and demand curves"
    sources:
      - "Adam Smith, An Inquiry into the Nature and Causes of the Wealth of Nations (1776)"
      - "Alfred Marshall, Principles of Economics (1890)"
      - "Amartya Sen, Poverty and Famines: An Essay on Entitlement and Deprivation (1981)"

  - id: ever_normal_granary
    name: Public granaries and price stabilisation (ever-normal granary)
    category: economy
    requires: []
    helps: [grain_storage_pest_control, price_mechanism_supply_demand]
    explain: >
      The state buys grain after good harvests, when it is cheap, stores it, and sells
      it at moderate prices after bad ones. Farmers are protected from ruinous gluts,
      town dwellers from famine prices, and the stock largely pays for itself because
      it is bought low and sold higher. It works if the stock is large relative to
      local trade, storage is dry, raised, ventilated and rotated every few years,
      purchases are made at market prices rather than by force, and stocks are counted
      and audited. Release grain early in a dearth and cap the sale price modestly, so
      private trade still has a reason to bring grain.
    pitfalls:
      - "Letting officials report full granaries that are empty or rotten: without audits and rotation the stock exists only on paper"
      - "Forcing farmers to sell to the granary below market price: they hide grain and plant less"
      - "Selling far below market: it drives private merchants out and the granary must then feed everyone"
      - "Building one central store: grain must be near the people who need it, before roads close"
    history:
      egypt: "pharaonic state granaries store tax grain; the Joseph story is literature, not a record"
      china: "c. 400 BC – Li Kui's 'equalising purchases' in the state of Wei; 54 BC Geng Shouchang founds ever-normal granaries (changping cang) under Han Xuandi; Sui–Tang community 'charity granaries'; 18th c. Qing network holding millions of tonnes"
      rome: "2nd c. BC onwards – the annona: public purchase, storage and distribution of grain for the city of Rome"
      americas: "15th c. – Inca storehouses (qollqa) along roads hold maize, chuño and cloth; 1938 US Agricultural Adjustment Act implements an 'ever-normal granary' policy through price-support loans and reserves"
      europe: "14th–16th c. – city grain offices such as Florence's Abbondanza and the Venetian grain office"
    sources:
      - "Pierre-Étienne Will & R. Bin Wong, Nourish the People: The State Civilian Granary System in China, 1650–1850 (1991)"
      - "Amartya Sen, Poverty and Famines: An Essay on Entitlement and Deprivation (1981)"

  - id: progressive_income_tax
    name: Income tax and progressive rates
    category: economy
    requires: []
    helps: [census_vital_registration, double_entry, universal_schooling]
    explain: >
      Each person pays a share of his yearly income from land, trade, wages and
      investments, assessed from his own declaration checked by assessors, and where
      possible deducted at source by the one who pays the income (employer, bank,
      tenant). With marginal tax brackets the higher rate applies only to the part of
      income above each threshold, so a raise never lowers net income. It reaches
      wealth where it is, adjusts to ability to pay, and yields large sums in war. It
      needs written records of wages, rents and dividends, literate taxpayers and
      honest assessors; in a farming society without records, land and excise taxes
      are more practical.
    pitfalls:
      - "Confusing marginal and average rates: believing a higher bracket taxes the whole income at the higher rate"
      - "Relying on self-declaration without withholding or checks: evasion is massive (Pitt's 1799 tax)"
      - "Setting very high rates where capital and people can leave"
      - "Proposing it in a society without paper records and money wages: it cannot be assessed"
      - "Thinking income tax is ancient: tithes and Islamic zakat were levies on produce or wealth, and a general income tax dates from 1799"
    history:
      islamic: "7th c. – zakat, a 2.5 % levy on savings and trade goods above a minimum (nisab), with fixed rates on crops and herds"
      europe: "1427 – Florence's catasto taxes declared wealth with allowances for dependants; 1480–1481 graduated assessment; 1495 flat decima on property income; 1500 the decima scalata is renewed after debate in 1499; 1799 Pitt's income tax with a graduated scale up to 10 %; 1803 Addington's schedules and deduction at source; 1842 Peel; 1891 Prussia's progressive income tax"
      india: "1860 – first income tax in British India"
      east_asia: "1887 – Japan introduces a progressive income tax"
      americas: "1861 – US Civil War income tax; 1913 Sixteenth Amendment"
    sources:
      - "Luciano Pezzolo, Fiscal Tradition and Innovation in Italy, 1350–1650 (2022)"
      - "Nikola Regent, Guicciardini’s La Decima scalata: The First Treatise on Progressive Taxation (2014)"
      - "Martin Daunton, Trusting Leviathan: The Politics of Taxation in Britain, 1799–1914 (2001)"
      - "Kenneth Scheve & David Stasavage, Taxing the Rich (2016)"
      - "Adam Smith, An Inquiry into the Nature and Causes of the Wealth of Nations (1776), book V ch. 2"

  - id: cooperatives_savings_banks
    name: Savings banks, credit and consumer cooperatives
    category: economy
    requires: []
    helps: [banking_credit, double_entry]
    explain: >
      Savings bank: accepts very small deposits from labourers and servants, pays a
      modest safe interest, invests in public bonds, run by unpaid trustees without
      shareholders. Credit cooperative (Raiffeisen): villagers pool savings and lend to
      one another, all members liable for its debts; because neighbours know who is
      reliable and watch how the loan is used, they can lend to the poor without
      collateral. Consumer cooperative (Rochdale 1844): members own the shop, sell
      pure goods at market prices for cash only, and share any surplus in proportion
      to purchases, one member one vote. All three give people of small means credit
      and savings outside the moneylender.
    pitfalls:
      - "Selling below cost or giving credit in a co-op shop: it goes bankrupt"
      - "Letting a savings bank chase high returns with the poor's deposits"
      - "Growing too large for members to know each other: peer monitoring, the whole advantage, disappears"
      - "Thinking micro-credit is a 20th-century invention: rotating savings clubs are old in Asia and Africa"
    history:
      china: "Tang onwards – rotating credit associations (hui) among relatives and neighbours"
      east_asia: "13th c. – tanomoshi-ko and mujin rotating savings groups in Japan; kye in Korea"
      africa: "rotating savings clubs such as Yoruba esusu, of uncertain antiquity, attested by the 19th c."
      europe: "1462 – Monte di Pietà, Perugia (charitable pawnbank); 1778 Hamburg savings fund; 1810 Henry Duncan's Ruthwell Savings Bank; 1844 Rochdale Pioneers; 1850 Schulze-Delitzsch credit unions for artisans; 1864 Raiffeisen's rural credit society at Heddesdorf"
      india: "1904 – Co-operative Credit Societies Act"
    sources:
      - "Timothy W. Guinnane, Cooperatives as Information Machines: German Rural Credit Cooperatives, 1883–1914, Journal of Economic History 61 (2001)"
      - "Johnston Birchall, The International Co-operative Movement (1997)"

  - id: economic_growth_productivity
    name: Wealth as productivity; sustained economic growth
    category: economy
    requires: []
    helps: [division_of_labour, compound_interest_exponential_growth, positive_sum_cooperation, systematic_invention]
    explain: >
      A nation's wealth is what its people can produce and consume per head, not the
      gold and silver it holds. Output per worker rises with better tools and
      machines, more energy (water, wind, coal), skills, specialisation, trade and
      better organisation, and new knowledge keeps the process going. Small rates
      compound: 2 % a year doubles income in 35 years. The convincing comparison is
      16th-century Spain, which received American silver and grew poorer, against the
      Dutch Republic, which had no mines and grew rich by shipping, trade and
      manufactures.
    pitfalls:
      - "Mercantilism: hoarding bullion and forcing export surpluses as the goal of policy"
      - "Zero-sum thinking: assuming one man's or nation's gain must be another's loss"
      - "Dismissing Malthus too quickly: for most of history, gains in output were eaten by population growth; only continuous innovation broke the trap after about 1800"
      - "Confusing rising money income with rising real income"
      - "Promising growth from one invention without the institutions, energy and markets that let it spread"
    history:
      china: "Song period (960–1279) – rapid growth of trade, cities, money and iron output; whether it raised income per head is debated"
      islamic: "1377 – Ibn Khaldun argues that a city's wealth comes from its people's labour and cooperation, and that heavy taxation shrinks it"
      europe: "1690s – Petty's political arithmetic estimates national income; 1776 Smith's Wealth of Nations against mercantilism; 1798 Malthus; c. 1800–1830 sustained growth of income per head begins in Britain and the Netherlands"
      global: "since 1820 – world income per head has risen more than tenfold (Maddison's estimates)"
    sources:
      - "Adam Smith, An Inquiry into the Nature and Causes of the Wealth of Nations (1776)"
      - "Joel Mokyr, The Lever of Riches (1990)"
      - "Angus Maddison, Contours of the World Economy, 1–2030 AD (2007)"

  - id: national_accounts_gdp
    name: National income accounts (GDP)
    category: economy
    requires: []
    helps: [double_entry, census_vital_registration, economic_growth_productivity]
    explain: >
      Measure production inside the territory. Add producers’ output minus intermediate
      inputs, then add taxes less subsidies on products to obtain GDP at market prices.
      Equivalently add household consumption, investment, government consumption and exports less
      imports. The income measure includes operating surplus as well as wages and taxes
      less subsidies on production and imports. Adjust for price changes to compare real
      output over time. GDP measures a flow of production, distinct from the stock of
      wealth or the revenue a government can collect. Counting value added avoids
      counting the wheat in the bread twice.
    pitfalls:
      - "Double counting intermediate goods (wheat, flour and bread all added at full value)"
      - "Comparing money totals across years without removing inflation"
      - "Treating GDP as welfare: it ignores leisure, health, unpaid household work and depletion of resources"
      - "Leaving out subsistence farming, which in pre-industrial economies is most of output"
    history:
      europe: "1665 – William Petty's Verbum Sapienti estimates England's income; 1696 Gregory King's table for 1688; 1941 Meade and Stone's national income white paper for Britain"
      americas: "1934 – Kuznets' national income estimates for the US Senate; 1942 wartime gross national product estimates"
      global: "1953 – UN System of National Accounts"
    sources:
      - "Simon Kuznets, National Income, 1929–1932 (1934)"
      - "Diane Coyle, GDP: A Brief but Affectionate History (2014)"

  - id: aggregate_demand_countercyclical_policy
    name: Fighting slumps by sustaining demand (Keynesian policy)
    category: economy
    requires: []
    helps: [central_bank, public_debt_bonds, national_accounts_gdp]
    explain: >
      In a slump, people and firms cut spending; that cuts others' incomes, so they cut
      spending too, and workers and machines stand idle not for lack of ability but
      for lack of buyers. Each extra coin spent becomes someone's income and is partly
      spent again (the multiplier). So in a slump the state should spend more or tax
      less, financed by borrowing, and the central bank should lower interest rates;
      in a boom it should do the reverse and repay. Cutting wages and balancing the
      budget in a depression deepens it.
    pitfalls:
      - "Running deficits in good years too: the debt grows and there is no room left for the next slump"
      - "Pushing demand when workers and machines are already fully used: the result is inflation, not output"
      - "Staying tied to a fixed gold parity while trying to reflate (1930s): the two cannot both be done"
      - "Starting public works so slowly that they come after the recovery"
    history:
      china: "1050 – during a famine in Zhejiang, Shen Kuo reports that Fan Zhongyan distributed grain in Hangzhou, encouraged boat races and temple works, and employed labourers on granaries and official residences"
      east_asia: "1931–1936 – Takahashi Korekiyo leaves gold and reflates Japan with deficit spending"
      europe: "1931 – Kahn's multiplier; 1930s Stockholm school and Swedish budget policy; 1936 Keynes, General Theory"
      americas: "1933 onwards – New Deal public works; 1946 US Employment Act"
    sources:
      - "John Maynard Keynes, The General Theory of Employment, Interest and Money (1936)"
      - "Shen Kuo, Mengxi bitan (c. 1088), juan 11, on the famine of 1050"
      - "Barry Eichengreen, Golden Fetters: The Gold Standard and the Great Depression, 1919–1939 (1992)"
