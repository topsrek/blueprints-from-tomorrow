# Blueprints from Tomorrow – technology tree fragment: Computing, control & information theory.
# Schema: see the header of techtree/core.yaml.

technologies:

  # ------------------------------------------------ ideas that need only pen and paper
  - id: algorithm_concept
    name: Algorithm (exact step-by-step procedure)
    category: computing
    requires: []
    helps: [arabic_numerals, symbolic_algebra, formal_logic]
    explain: >
      An algorithm is a finite list of exact instructions that a person or machine
      can follow without understanding or judgement, and that always ends with the
      answer, for every input of its kind and not just one example. Classic case:
      for non-negative integers a and b, at least one positive, repeatedly replace (a, b)
      with (b, the remainder of a divided by b) while b is positive. When b is zero, a is
      the greatest common divisor. Its parts are steps in sequence, decisions (if this,
      then that) and
      repetition until a condition holds. Methods differ enormously in the number of
      steps: finding a name in a sorted list of a million by halving takes 20
      comparisons, by reading through takes up to a million.
    pitfalls:
      - "Giving a worked example instead of a rule that covers every case, including zero, equal numbers and empty lists"
      - "Leaving steps that need judgement, such as 'choose a suitable number'"
      - "No guarantee that the procedure stops"
      - "Saying that al-Khwarizmi invented algorithms; the word comes from his name, but written procedures are two and a half thousand years older"
    history:
      mesopotamia: "c. 1800–1600 BC – Old Babylonian tablets give general step-by-step procedures for reciprocals, square roots and quadratic problems"
      egypt: "c. 1550 BC – Rhind papyrus (copy of an older text): multiplication and division by doubling and halving"
      greece: "c. 300 BC – Euclid's Elements VII, largest common divisor; 3rd c. BC sieve of Eratosthenes"
      china: "c. 1st c. AD – Nine Chapters on the Mathematical Art: elimination for systems of linear equations, root extraction"
      india: "499 – Aryabhata's kuttaka (pulveriser) for indeterminate equations"
      islamic: "c. 825 – al-Khwarizmi's book on calculation with Indian numerals; its Latin version (Algoritmi de numero Indorum) gives the word"
      europe: "1843 – Ada Lovelace's table for computing Bernoulli numbers on Babbage's engine; 1936 Turing and Church give the exact definition"
    sources:
      - "Donald E. Knuth, Ancient Babylonian Algorithms, Communications of the ACM 15 (1972)"
      - "Jean-Luc Chabert (ed.), A History of Algorithms: From the Pebble to the Microchip (1999)"
      - "Donald E. Knuth, The Art of Computer Programming, vol. 1: Fundamental Algorithms (1968)"

  - id: binary_numbers
    name: Binary numbers
    category: computing
    requires: [zero_place_value]
    helps: [arabic_numerals]
    explain: >
      Any number can be written with only two digits, 0 and 1, if each place is
      worth twice the one to its right (1, 2, 4, 8, 16 and so on) instead of ten
      times: thirteen is 1101, that is 8 + 4 + 0 + 1. Arithmetic becomes trivial:
      the whole addition table is 0+0=0, 0+1=1, 1+1=10, and multiplication is only
      shifting and adding. The price is length, a little more than three binary
      digits for each decimal digit. Since a digit has only two values, anything
      with two states can hold it: a hole or no hole, a switch open or closed, a
      current on or off, which is why calculating machines built from switches use
      binary.
    pitfalls:
      - "Reading 10 as ten; in binary it is two"
      - "Proposing binary for human bookkeeping; its value lies in machines, for people it is only longer"
      - "Claiming the I Ching contains binary arithmetic; the hexagrams are two-valued patterns, and Leibniz read his own system into them in 1701–1703"
      - "Confusing binary numbers with a code such as Morse, which uses more than two signal elements"
    history:
      egypt: "c. 1550 BC – multiplication by repeated doubling (Rhind papyrus) uses the binary decomposition of a number implicitly"
      india: "c. 3rd–2nd c. BC (date uncertain) – Pingala's Chandahsastra enumerates metres of long and short syllables in a binary scheme"
      china: "c. 9th c. BC onwards – the 64 hexagrams of the I Ching; 11th c. Shao Yong arranges them in what is in effect binary counting order, without arithmetic"
      europe: "c. 1604 – Harriot's unpublished binary arithmetic; 1670 Caramuel; 1679 Leibniz writes a manuscript on binary arithmetic. His separate Explication de l'arithmétique binaire is presented in 1703 and printed in 1705"
      americas: "1937 – Stibitz's relay adder at Bell Labs; 1945 von Neumann's EDVAC report settles on binary for electronic computers"
    sources:
      - "G. W. Leibniz, Explication de l'arithmétique binaire, Mémoires de l'Académie Royale des Sciences for 1703 (printed 1705)"
      - "Lloyd Strickland & Harry Lewis, Leibniz on Binary: The Invention of Computer Arithmetic (2022)"

  - id: boolean_logic
    name: Boolean logic (algebra of true and false)
    category: computing
    requires: []
    helps: [formal_logic, symbolic_algebra, binary_numbers]
    explain: >
      Reasoning with statements can be done as algebra with only two values, true
      (1) and false (0). Three operations are enough: AND (true only if both are
      true), OR (true if at least one is true) and NOT (the opposite). Every
      combination can be listed in a truth table, and expressions can be simplified
      by rules as in ordinary algebra, for example NOT (A AND B) equals (NOT A) OR
      (NOT B). Any yes-or-no decision, however complicated, can be built from these
      three, and even from the single operation NOT-AND.
    pitfalls:
      - "Using the everyday 'or', which often means one or the other but not both; the logical OR includes both"
      - "Reading 'if A then B' as also meaning 'if B then A'"
      - "Assuming 1 + 1 = 2 here; with OR, 1 + 1 = 1"
      - "Thinking Boole had machines in mind; Peirce sketched switches for logical operations in 1886, and a systematic switching algebra appeared in the 1930s"
    history:
      greece: "4th–3rd c. BC – Aristotle's syllogistic; the Stoics (Chrysippus) treat 'and', 'or', 'if' between whole statements"
      india: "c. 2nd c. AD (date uncertain) – Nyaya Sutras set out formal rules of inference"
      europe: "1680s – Leibniz's unpublished algebra of concepts; 1847 Boole, The Mathematical Analysis of Logic, and De Morgan's Formal Logic; 1854 Boole, The Laws of Thought; 1869 Jevons's logic machine"
      americas: "1880–1886 – C. S. Peirce shows that one operation suffices and remarks that logic can be done by electric switches (unpublished); 1913 Sheffer publishes the single-operation result"
    sources:
      - "George Boole, An Investigation of the Laws of Thought (1854)"
      - "Martin Davis, The Universal Computer: The Road from Leibniz to Turing (2000)"

  - id: logic_gates_switching
    name: Switching circuits and logic gates
    category: computing
    requires: [boolean_logic, electromagnetism]
    helps: [binary_numbers, electric_telegraph, vacuum_tube, semiconductors_transistor]
    explain: >
      Boolean logic can be built from switches. Two switches in series pass current
      only if both are closed (AND); two in parallel if either is closed (OR); a
      relay contact that opens when its coil is energised gives NOT. A relay is an
      electromagnet that works a switch, so the output of one circuit can drive the
      inputs of others. From these gates one builds a binary adder (the sum digit is
      'one or the other but not both', the carry is 'both') and a memory element: two
      relays or valves, each holding the other in its state, stay as they were set
      (flip-flop) and store one binary digit. Any design can be written and
      simplified as Boolean algebra before a single part is wired.
    pitfalls:
      - "Overlooking earlier relay algebra. Nakashima published methods for telephone switching before Shannon’s thesis"
      - "Ignoring timing: contacts bounce and signals arrive at different moments, which gives false pulses unless the design allows for contact bounce and propagation delays"
      - "Loading one output with too many inputs, so that the signal is too weak to switch them"
      - "Thinking the principle depends on the device; relays, valves and transistors only differ in speed, size and reliability"
    history:
      europe: "1918 – Eccles and Jordan's valve flip-flop (London); 1930 Bothe and Rossi describe electronic coincidence circuits. Shestakov recorded his relay algebra in 1935, defended his Moscow thesis in 1938 and published in 1941. In 1941 Zuse completed the relay-based Z3 in Berlin"
      east_asia: "1934–1936 – Akira Nakashima at NEC publishes a theory of relay circuits equivalent to two-valued Boolean algebra"
      americas: "1886 – Peirce's letter describing logic by switches; 1937 Shannon's master's thesis at MIT, published 1938; 1937 Stibitz's relay adder at Bell Labs"
    sources:
      - "Claude E. Shannon, A Symbolic Analysis of Relay and Switching Circuits, Transactions of the AIEE 57 (1938)"
      - "V. I. Shestakov, Algebra of Two-Terminal Circuits Constructed Exclusively of Two-Terminal Components (Algebra of A-Circuits), Avtomatika i Telemekhanika 6(2) (1941), 15–24"
      - "Charles Petzold, Code: The Hidden Language of Computer Hardware and Software (1999)"

  # ------------------------------------------------ machines
  - id: mechanical_calculator
    name: Mechanical calculator
    category: computing
    requires: [gears_gear_trains]
    helps: [arabic_numerals, mechanical_clock, lathe_screw_cutting, interchangeable_parts, logarithms]
    explain: >
      Each decimal place is a wheel with ten positions. Adding a digit turns the
      wheel by that many steps; when a wheel passes from 9 to 0 a tooth or lever
      pushes the next wheel on by one, which is the carry and the hard part.
      Subtraction is done by turning backwards or by adding the nines' complement.
      Multiplication is repeated addition with a shift: Leibniz's stepped drum, a
      cylinder with nine teeth of graded length, lets one set a number once and add
      it with each turn of a crank, and a sliding carriage moves it one place for the
      next digit. A machine that works reliably needs parts as accurate as a good
      clock.
    pitfalls:
      - "A carry that needs the force of the user's hand to ripple through many wheels: 999,999 + 1 jams; the carry must store energy or act one wheel after another"
      - "Wheels without a detent that overshoot or stop between digits"
      - "Thinking that it speeds up all arithmetic; before the 1850s logarithm tables and trained human computers were faster and cheaper"
      - "Calling the Antikythera mechanism or the abacus a calculator of this kind; the first is a geared model of the heavens, the second has no automatic carry"
    history:
      greece: "c. 2nd–1st c. BC – Antikythera mechanism, a geared astronomical calculator"
      europe: "1623 – Schickard's calculating clock (known from letters to Kepler; the machine was lost); 1642–1645 Pascal's adding machine, surviving models include machines with separate wheels for livres, sols and deniers; 1673 Leibniz shows a model of the stepped reckoner, working machine c. 1694; 1820 Thomas de Colmar's arithmometer, in series production from 1851; 1870s Odhner's pinwheel machine"
      americas: "1887 – Felt's key-driven Comptometer; 1888–1892 Burroughs's printing adding machine"
    sources:
      - "Michael R. Williams, A History of Computing Technology (1985)"
      - "Matthew L. Jones, Reckoning with Matter: Calculating Machines, Innovation, and Thinking about Thinking from Pascal to Babbage (2016)"

  - id: punched_card_control
    name: Punched cards for control and data
    category: computing
    requires: []
    helps: [power_loom, paper, electromagnetism, census_vital_registration, binary_numbers]
    explain: >
      A stiff card with holes can steer a machine: where there is a hole a spring
      loaded needle passes through and its hook is lifted, where there is none the
      needle is pushed back. On a loom each needle controls some warp threads, one
      card is one row of the pattern, and a chain of laced cards weaves any design
      and can be reused or copied; to change the pattern, change the cards, not the
      loom. The same cards can hold facts: one card per person, a hole position for
      each answer. Pins dipping through the holes into mercury cups close electric
      circuits that advance counters, so a census can be counted and cross-tabulated
      by machine.
    pitfalls:
      - "Thinking the cards do the weaving; they only select threads, the loom and weaver are still needed"
      - "No agreed layout of columns and codes before punching begins, so that cards cannot be combined later"
      - "Soft or damp card that swells and jams; card stock must be uniform and dry"
      - "Crediting Jacquard with the idea; he combined Bouchon's, Falcon's and Vaucanson's devices into one reliable machine"
    history:
      china: "c. 2nd c. BC – pattern looms with the design stored in heddle rods (models from the Laoguanshan tomb, Chengdu); later the drawloom with a pattern stored in knotted cords, worked by a draw-boy"
      europe: "1725 – Bouchon's perforated paper band for a drawloom (Lyon); 1728 Falcon's chain of cards; c. 1745 Vaucanson's automatic loom; 1804–1805 Jacquard's loom; 1834–1837 Babbage adopts cards for the Analytical Engine"
      americas: "1889 – Hollerith's patent; 1890 United States census tabulated by his electric machines; his firm becomes part of the later IBM"
    sources:
      - "James Essinger, Jacquard's Web: How a Hand-Loom Led to the Birth of the Information Age (2004)"
      - "Geoffrey D. Austrian, Herman Hollerith: Forgotten Giant of Information Processing (1982)"

  - id: programmable_computer
    name: Programmable computer (stored program)
    category: computing
    requires: [algorithm_concept]
    helps: [binary_numbers, logic_gates_switching, punched_card_control, mechanical_calculator, vacuum_tube, computer_memory, turing_machine_computability, semiconductors_transistor]
    explain: >
      A general computer has five parts: an arithmetic unit, a memory of numbered
      cells, a control unit, input and output. The work is laid down as a program, a
      list of very simple instructions such as 'add the number in cell 17 to the
      accumulator' or 'store the result in cell 40', which the control unit fetches
      and carries out one after another. A useful control instruction is the conditional
      jump: 'if the result is negative, continue at instruction 12',
      which allows decisions and loops. In a stored-program design, instructions are
      themselves encoded in memory, so a new task needs only a new
      program, not rewiring, and programs can be loaded, altered and produced by
      other programs.
    pitfalls:
      - "Describing a fast calculator; the essence is automatic sequencing with conditional branching, not speed of arithmetic"
      - "Programming by plugboards and switches as on ENIAC, where each new problem took days of rewiring"
      - "Assuming a programmable machine must use binary. ENIAC counted in decimal, and the Analytical Engine design used decimal wheels"
      - "Underestimating memory and reliability: the logic was within reach in 1945, a memory of a few thousand reliable binary digits was the real obstacle"
      - "Naming one inventor: Babbage, Zuse, Atanasoff, Turing, Eckert and Mauchly, von Neumann, Williams and Kilburn, and Wilkes each have a real but partial claim"
    history:
      islamic: "9th c. – the Banu Musa's flute player with a pinned cylinder; 1206 al-Jazari's automata with peg drums, early machines whose sequence can be changed"
      europe: "1834–1837 – Babbage designs the Analytical Engine with store, mill, cards and conditional branching (never built); 1843 Lovelace's notes; 1936 Turing's universal machine; 1941 Zuse's Z3, a program-controlled relay computer (Berlin); 1943–1944 Colossus, electronic and special-purpose (Bletchley Park); June 1948 Manchester 'Baby' runs the first stored program; 1949 EDSAC in regular use (Cambridge)"
      americas: "1939–1942 – Atanasoff and Berry's electronic equation solver (not programmable); 1944 Harvard Mark I; 1945–1946 ENIAC; 1945 von Neumann's First Draft of a Report on the EDVAC sets out the stored-program design (the share of Eckert and Mauchly is disputed); 1951 UNIVAC I"
    sources:
      - "L. F. Menabrea & Ada Lovelace, Sketch of the Analytical Engine Invented by Charles Babbage, Scientific Memoirs 3 (1843)"
      - "John von Neumann, First Draft of a Report on the EDVAC (1945)"
      - "Martin Campbell-Kelly & William Aspray, Computer: A History of the Information Machine (1996)"

  - id: turing_machine_computability
    name: Universal machine and the limits of computation
    category: computing
    requires: [algorithm_concept]
    helps: [formal_logic, boolean_logic]
    explain: >
      Everything that can be calculated by rule can be calculated by an extremely
      simple device: a tape of squares, a head that reads and writes one symbol at a
      time and moves one square left or right, and a finite table that says what to
      do for each combination of internal state and symbol read. Such a table can
      itself be written on the tape as symbols, and one fixed machine, the universal
      machine, can read any table and imitate it; this is the idea of software.
      There are also exactly stated problems that no machine can ever solve: no
      procedure can decide for every program and input whether it will eventually
      stop. The proof assumes such a tester exists and feeds it a program built to
      do the opposite of what the tester predicts about it.
    pitfalls:
      - "Taking the tape machine for a design to be built; it is a yardstick for what can be computed at all"
      - "Concluding that computers can therefore solve everything given enough time and memory"
      - "Concluding the opposite, that undecidability makes program testing pointless; it only rules out a method that works for all programs"
      - "Confusing what cannot be computed at all with what merely takes too long"
    history:
      europe: "1928 – Hilbert and Ackermann formulate the decision problem for first-order logic; 1931 Gödel's incompleteness theorems (Vienna); 1936 Turing, On Computable Numbers (Cambridge)"
      americas: "1936 – Church's lambda calculus and unsolvable problem, and Post's similar machine, both independent of Turing (Princeton, New York)"
    sources:
      - "Alan M. Turing, On Computable Numbers, with an Application to the Entscheidungsproblem, Proceedings of the London Mathematical Society 42 (1936–1937)"
      - "Charles Petzold, The Annotated Turing (2008)"

  - id: computer_memory
    name: Computer memory (delay line, magnetic core, disc, semiconductor)
    category: computing
    requires: []
    helps: [binary_numbers, electromagnetism, vacuum_tube, sound_recording, semiconductors_transistor, integrated_circuit]
    explain: >
      A working memory holds instructions or data long enough to use them again. Capacity,
      access time and retention depend on the storage medium.
      Early answers were pulses of sound circulating in a tube of mercury and spots
      of charge on the screen of a cathode-ray tube, both slow or fickle. The
      reliable answer was the magnetic core: a ring of ferrite about a millimetre
      across, magnetised clockwise or anticlockwise, threaded on a grid of wires. A
      core flips only when both its row wire and its column wire carry half the
      switching current at once, so a thousand cores need about sixty wires, and the
      core keeps its state without power. For bulk storage, binary digits are
      written as magnetised spots on a rotating drum or disc or on tape. Later each
      digit becomes a tiny capacitor and transistor on a silicon chip.
    pitfalls:
      - "Giving every memory cell its own flip-flop of two valves; a useful memory then needs tens of thousands of valves"
      - "Forgetting that reading a core erases it, so every read must be followed by a rewrite"
      - "Core material without a sharp switching threshold, so that half-currents slowly disturb the stored digits"
      - "Assuming one kind of memory serves every purpose; fast small memory and slow large storage are always combined"
    history:
      europe: "1932 – Tauschek's magnetic drum patent (Vienna); 1946–1948 Williams and Kilburn's cathode-ray tube store (Manchester); 1949 mercury delay lines in EDSAC (Cambridge)"
      americas: "1944–1947 – Eckert's mercury delay line; 1949–1951 magnetic core memory (An Wang at Harvard, Forrester at MIT, Rajchman at RCA), in the Whirlwind computer from 1953; 1956 IBM's disc store (RAMAC); 1966–1968 Dennard's one-transistor memory cell; 1970 Intel's 1103 memory chip"
    sources:
      - "Emerson W. Pugh, Memories That Shaped an Industry: Decisions Leading to IBM System/360 (1984)"
      - "Martin Campbell-Kelly & William Aspray, Computer: A History of the Information Machine (1996)"

  - id: programming_languages_compilers
    name: Programming languages, subroutines and compilers
    category: computing
    requires: [programmable_computer]
    helps: [symbolic_algebra, algorithm_concept, turing_machine_computability]
    explain: >
      Writing programs as the numbers a machine obeys is slow and full of errors.
      Since a program is only data, let the computer translate: the programmer
      writes in a notation close to algebra and plain words, such as x = (a + b) / 2
      or 'repeat for i from 1 to 100', and a translating program (compiler) turns
      this into machine instructions, assigns the memory cells and reports mistakes.
      Pieces used often, such as a square root, are written once as subroutines,
      kept in a library and called by name. With a compatible compiler and the same
      language facilities, the same source text can run on different makes of machine, and
      a good compiler produces code almost as fast
      as that of a skilled hand coder.
    pitfalls:
      - "Assuming that machine time is too precious to spend on translation; this was the main objection in the early 1950s, and programmers' time soon cost more than machines"
      - "Believing that a language close to English removes the need to think exactly"
      - "Expecting programs to be right when first written; testing and finding errors take most of the time, as Wilkes noticed in 1949"
      - "Too many incompatible languages and dialects, which destroys the gain of portability"
    history:
      europe: "1942–1945 – Zuse's Plankalkül (not implemented, published much later); 1949–1951 subroutine library and initial orders for EDSAC (Wheeler, Wilkes, Gill, Cambridge); 1958–1960 ALGOL, a joint European and American design"
      americas: "1952 – Grace Hopper's A-0 system; 1954–1957 FORTRAN (Backus, IBM); 1958 LISP (McCarthy); 1959–1960 COBOL; 1972 C (Ritchie, Bell Labs)"
    sources:
      - "Maurice V. Wilkes, David J. Wheeler & Stanley Gill, The Preparation of Programs for an Electronic Digital Computer (1951)"
      - "Richard L. Wexelblat (ed.), History of Programming Languages (1981)"

  - id: operating_system_time_sharing
    name: Operating system and time-sharing (Unix)
    category: computing
    requires: [programmable_computer, computer_memory]
    helps: [programming_languages_compilers]
    explain: >
      An operating system is the program that is always running and manages the
      machine for all other programs: it starts and stops them, shares out memory,
      and hides the details of discs, tapes and terminals. By switching the processor
      among programs many times a second it lets dozens of people use one computer at
      once from typewriter terminals, each as if alone, and it keeps them from
      damaging each other's work. The Unix design keeps this simple: ordinary files are
      sequences of bytes in a tree of named directories; devices are treated as files;
      programs are small tools that each
      do one job and can be joined so that the output of one feeds the next; and the
      system is written in a high-level language so that it can be moved to new
      machines.
    pitfalls:
      - "Running one job at a time while an expensive machine waits for a human or a card reader"
      - "Building one huge system that tries to do everything; Multics was years late, and Unix began as the reaction to it"
      - "No protection between users and the system, so that one faulty program stops the machine for everyone"
      - "Writing the system in the machine language of one computer, so that it dies with that model"
    history:
      europe: "1959 – Strachey's paper on time-sharing in large computers; 1962 Atlas supervisor with virtual memory (Manchester)"
      americas: "1956 – GM-NAA I/O batch monitor for the IBM 704; 1961 CTSS time-sharing system (Corbató, MIT); 1964–1969 Multics (MIT, General Electric, Bell Labs); 1969 Unix (Thompson and Ritchie, Bell Labs), rewritten in C in 1973, described publicly in 1974"
    sources:
      - "Dennis M. Ritchie & Ken Thompson, The UNIX Time-Sharing System, Communications of the ACM 17 (1974)"
      - "Brian W. Kernighan, UNIX: A History and a Memoir (2019)"

  # ------------------------------------------------ information and communication
  - id: information_theory
    name: Information theory (bit, entropy, channel capacity)
    category: computing
    requires: [probability_statistics, logarithms]
    helps: [binary_numbers, electric_telegraph, telephone, cryptography]
    explain: >
      Information can be measured, whatever its meaning. The unit is the bit, one choice
      between two equally likely alternatives; picking one of eight equally likely
      messages is three bits. A source that prefers some messages to others carries less:
      on average the sum over all messages of p times log2(1/p) bits, its entropy, and
      lossless coding of long independent blocks can approach that average per message
      (English text needs only about one bit per letter, against nearly five if all
      letters were equally likely). Every channel has a capacity in bits per second, for
      an ideal band-limited channel with additive white Gaussian noise, bandwidth B and
      average signal-to-noise power ratio S/N, the capacity is B times log2(1 + S/N).
      Below that rate, messages can be sent with as few errors as one likes, by coding in
      long blocks with well chosen redundancy; above it they cannot. Noise limits the rate
      of a channel, not its accuracy.
    pitfalls:
      - "Confusing information with meaning or value; the measure concerns only how many alternatives a message rules out"
      - "Believing that noise can only be fought with more power or by repeating the message; coding does far better"
      - "Reading the theorem as a recipe; Shannon proved that good codes exist, finding practical ones took fifty years"
      - "Using 'entropy' loosely for disorder, or applying the formulas to psychology and art, which Shannon himself warned against in 1956"
    history:
      europe: "1915, 1933 – sampling theorem (Whittaker in Edinburgh, Kotelnikov in Moscow); 1946 Gabor's theory of communication (London)"
      americas: "1924–1928 – Nyquist and Hartley at Bell Labs relate telegraph speed and bandwidth and propose a logarithmic measure; 1948 Shannon, A Mathematical Theory of Communication (Bell Labs), where Shannon credits the contraction ‘bit’ to Tukey; 1948 Wiener's Cybernetics treats the same measure independently; 1952 Huffman's optimal codes"
    sources:
      - "Claude E. Shannon, A Mathematical Theory of Communication, Bell System Technical Journal 27 (1948)"
      - "John R. Pierce, Symbols, Signals and Noise: The Nature and Process of Communication (1961)"
      - "James Gleick, The Information: A History, a Theory, a Flood (2011)"

  - id: sampling_pcm
    name: Sampling and digital transmission (pulse-code modulation)
    category: computing
    requires: []
    helps: [binary_numbers, vacuum_tube, information_theory, telephone, sound_recording, semiconductors_transistor, error_correcting_codes]
    explain: >
      A continuous signal such as speech can be turned into numbers without loss
      that matters. Measure it at regular instants more than twice as often as its
      highest frequency (8,000 times a second for telephone speech up to 3,400
      vibrations per second) and the original can be rebuilt exactly from the
      samples. Round each sample to one of a fixed number of levels, for example 256,
      which is eight binary digits, and send the digits as on/off pulses. A repeater
      then only has to decide whether a pulse is present and send a fresh clean one,
      so noise and distortion do not add up along the line as they do with
      amplifiers, and the stream can be stored, switched, enciphered and combined
      with others. The price is bandwidth: 64,000 bits per second for one uncompressed
      telephone channel.
    pitfalls:
      - "Sampling too slowly or without first filtering off the higher frequencies: they reappear as false low tones"
      - "Too few levels, which gives a harsh background noise; and equal steps for speech, where finer steps for quiet sounds work much better"
      - "Judging it wasteful because of the bandwidth; the gain is that a poor, noisy line can regenerate pulses while they are still distinguishable, though errors remain possible"
      - "Attempting it with valves on a large scale; it became economic only with transistors"
    history:
      europe: "1915 – Whittaker's interpolation theorem; 1933 Kotelnikov states the sampling theorem for communication; 1937–1938 Alec Reeves invents pulse-code modulation at the ITT laboratory in Paris"
      americas: "1928 – Nyquist's result on pulses and bandwidth; 1943 SIGSALY, an enciphered digital speech link for the Allied leaders (Bell Labs); 1948 Oliver, Pierce and Shannon, The Philosophy of PCM; 1962 T1 digital telephone carrier"
      east_asia: "1949 – Someya's independent statement of the sampling theorem in Japan"
    sources:
      - "B. M. Oliver, J. R. Pierce & C. E. Shannon, The Philosophy of PCM, Proceedings of the IRE 36 (1948)"
      - "Claude E. Shannon, Communication in the Presence of Noise, Proceedings of the IRE 37 (1949)"

  - id: error_correcting_codes
    name: Error-detecting and error-correcting codes
    category: computing
    requires: []
    helps: [binary_numbers, information_theory, combinatorics_permutations, logic_gates_switching]
    explain: >
      Add extra digits calculated from the message so that mistakes show up and can
      be repaired without asking again. One parity digit, chosen so that the number
      of ones in a group is even, reveals any single wrong digit but not where it is.
      Hamming's code locates it: to four data digits add three parity digits, each
      checking a different overlapping group of positions (1,3,5,7; 2,3,6,7;
      4,5,6,7). The pattern of failed checks, read as a binary number, is the
      position of the wrong digit, which is then simply inverted. In general, if any
      two valid code words differ in at least d places, the code detects d-1 errors
      or corrects up to half of that, rounded down.
    pitfalls:
      - "Sending everything three times and taking a majority; it works but triples the cost where a good code adds a small fraction"
      - "Expecting a code to cope with more errors than it was designed for; it then 'corrects' to a wrong word without warning"
      - "Forgetting that errors often come in bursts, which need interleaving or codes designed for bursts"
      - "Confusing these codes with secret codes; they add redundancy for reliability and hide nothing"
    history:
      americas: "1940s – parity checks in Bell Labs relay computers stop the machine on an error; 1947–1948 Hamming devises single-error-correcting codes at Bell Labs, cited by Shannon in 1948 and published in 1950 after patent delays; 1949 Golay's codes; 1954 Reed–Muller codes; 1960 Reed–Solomon codes; 1962 Gallager's low-density parity-check codes; 1967 Viterbi's decoding algorithm"
      europe: "1993 – turbo codes (Berrou, Glavieux and Thitimajshima, presented at Geneva) come close to Shannon's limit"
    sources:
      - "Richard W. Hamming, Error Detecting and Error Correcting Codes, Bell System Technical Journal 29 (1950)"
      - "Thomas M. Thompson, From Error-Correcting Codes through Sphere Packings to Simple Groups (1983)"

  - id: packet_switching_networks
    name: Packet switching and computer networks
    category: computing
    requires: [programmable_computer]
    helps: [sampling_pcm, error_correcting_codes, information_theory, operating_system_time_sharing]
    explain: >
      Instead of reserving a whole line between two parties for the length of a
      call, cut every message into short blocks (packets), each carrying information that
      lets the network forward it. Small computers at the junctions of
      the network pass each packet on using routing tables. Where reliable ordered
      delivery is needed, a transport protocol can number the data, detect gaps and
      arrange retransmission. Lines are then shared efficiently by many bursty
      users, and the network keeps working when links or junctions fail, because
      packets flow round the damage. Networks of different kinds are joined by an
      agreed common packet format and addressing scheme, with reliability left to
      the computers at the two ends.
    pitfalls:
      - "A central exchange through which everything must pass; it is a single point of failure and a bottleneck"
      - "Demanding that the network itself never loses a packet; simple junctions and checking at the ends work better"
      - "Saying the ARPANET was built to survive nuclear war; that was Baran's motive at RAND, the ARPANET was built to share scarce computers"
      - "No thought for trust: the early protocols assumed friendly users, and security had to be added painfully later"
    history:
      americas: "1960–1964 – Baran's studies of distributed networks at RAND; 1961–1964 Kleinrock's queueing theory of message networks; October 1969 first ARPANET link; 1973 Ethernet (Metcalfe, Xerox); 1974 Cerf and Kahn publish their internetwork protocol. The later TCP and IP protocols replace NCP on the ARPANET in January 1983"
      europe: "1965–1966 – Donald Davies at the National Physical Laboratory designs the same scheme independently and coins 'packet'; 1972–1973 Pouzin's CYCLADES network (France) puts reliability in the end computers; 1989–1991 World Wide Web (Berners-Lee, CERN)"
    sources:
      - "Vinton G. Cerf & Robert E. Kahn, A Protocol for Packet Network Intercommunication, IEEE Transactions on Communications 22 (1974)"
      - "Janet Abbate, Inventing the Internet (1999)"

  # ------------------------------------------------ control
  - id: feedback_control
    name: Feedback control (governor, negative feedback)
    category: computing
    requires: []
    helps: [differential_equations, piston_pump, windmill, vacuum_tube]
    explain: >
      A machine can regulate itself if it measures its own result, compares it with the
      wanted value and uses the difference to act against the error. A float in a cistern
      closes the inlet valve as the water rises. Two weights spinning with an engine fly
      outwards when it runs too fast and close the steam valve (centrifugal governor). A
      rod that expands with heat closes the damper of a furnace (thermostat). The danger
      is overcorrection: if the action is too strong or comes too late, the system swings
      to and fro ever more violently (hunting), so strength and delay of the correction
      must be matched. In amplifiers, feeding a fraction of the output back in opposition
      to the input gives up some amplification and makes the rest steady and less
      distorted within the amplifier’s operating range.
    pitfalls:
      - "Too strong or too delayed a correction, which produces oscillation instead of steadiness"
      - "Connecting it the wrong way round: positive feedback drives the machine to its limit or makes an amplifier howl"
      - "Expecting a simple governor to hold speed exactly; with proportional action alone a small error always remains under load"
      - "Crediting Watt with the centrifugal governor; he took it in 1788 from windmills, where millwrights already used it"
    history:
      greece: "c. 270 BC – Ktesibios of Alexandria's float valve keeps the inflow of a water clock constant; 1st c. AD Hero's float regulators"
      islamic: "9th c. – the Banu Musa's Book of Ingenious Devices uses float valves and level controls; 1206 al-Jazari"
      europe: "c. 1620 – Drebbel's thermostat for a furnace and incubator; 1745 Edmund Lee's windmill fantail; 1787 Mead's centrifugal regulator for mills; 1788 Watt's engine governor; 1868 Maxwell, On Governors; 1877 Routh's stability criterion"
      americas: "1922 – Minorsky's three-term (PID) ship steering; 1927 Harold Black's negative-feedback amplifier at Bell Labs, published 1934; 1932 Nyquist's stability criterion; 1940–1945 Bode's design methods; 1948 Wiener's Cybernetics"
    sources:
      - "Otto Mayr, The Origins of Feedback Control (1970)"
      - "James Clerk Maxwell, On Governors, Proceedings of the Royal Society 16 (1868)"
      - "David A. Mindell, Between Human and Machine: Feedback, Control, and Computing before Cybernetics (2002)"

  # ------------------------------------------------ secrecy
  - id: cryptography
    name: Cryptography and codebreaking (ciphers, frequency analysis, one-time pad)
    category: computing
    requires: []
    helps: [alphabet_writing, probability_statistics, combinatorics_permutations, information_theory, military_intelligence_codebreaking]
    explain: >
      A cipher changes a message by a rule that depends on a secret key. Replacing
      each letter by another fixed letter looks safe, since there are more keys than
      anyone could try, but it is broken in minutes by counting: in any language some
      letters and pairs are much more frequent than others (in English, e is about
      one letter in eight), and the counts survive the substitution. Changing the
      substitution alphabet from letter to letter according to a keyword hides the
      counts, until the length of the keyword is found from repeated fragments and
      each alphabet is counted separately. The one-time pad gives perfect secrecy with a
      key of truly random letters as long as the message, known only to sender
      and receiver and never used twice (one-time pad). A sound system must stay
      safe even when the enemy knows everything about it except the key.
    pitfalls:
      - "Trusting a simple substitution, or any scheme, because the number of possible keys is huge"
      - "Relying on the method being secret; it leaks, and only the key should need protecting"
      - "Reusing a one-time pad or making its key by a rule or by a person 'typing at random'; Soviet reuse of pads in the 1940s let the Americans read the Venona messages"
      - "Stereotyped openings, repeated messages and lazy operators, which broke more ciphers, including Enigma, than mathematics alone"
      - "Inventing one's own cipher and judging it secure because one cannot break it oneself"
    history:
      mesopotamia: "c. 1500 BC – a cuneiform tablet hides a pottery glaze recipe behind unusual sign values"
      greece: "5th c. BC – the Spartan scytale (whether it was a cipher device is disputed); 4th c. BC Aeneas Tacticus on secret messages"
      rome: "1st c. BC – Caesar's shift of the alphabet by three places, reported by Suetonius"
      india: "c. 3rd c. AD – the Kamasutra lists secret writing by letter substitution among the arts"
      islamic: "9th c. – al-Kindi's treatise on deciphering describes frequency analysis (manuscript rediscovered in Istanbul in 1987); 14th c. Ibn al-Durayhim, al-Qalqashandi"
      europe: "c. 1467 – Alberti's cipher disc and polyalphabetic substitution; 1553 Bellaso's keyword cipher, later misnamed after Vigenère (1586); c. 1854 Babbage and 1863 Kasiski break it; 1883 Kerckhoffs's principles; 1932 Rejewski reconstructs the Enigma wiring (Warsaw); 1939–1945 Bletchley Park"
      americas: "1882 – Frank Miller describes a one-time key for telegrams; 1917–1919 Vernam's teleprinter cipher and Mauborgne's random non-repeating key; 1945–1949 Shannon proves the one-time pad perfect and founds the theory of secrecy systems"
    sources:
      - "David Kahn, The Codebreakers: The Story of Secret Writing (1967)"
      - "Claude E. Shannon, Communication Theory of Secrecy Systems, Bell System Technical Journal 28 (1949)"
      - "Simon Singh, The Code Book (1999)"

  - id: public_key_cryptography
    name: Public-key cryptography and digital signatures
    category: computing
    requires: [cryptography]
    helps: [programmable_computer, algorithm_concept, prime_numbers_number_theory]
    explain: >
      Two people with authenticated public information can agree on a secret over a line that everyone
      can hear. Diffie–Hellman lets both parties derive the same key from their private
      choices and public messages. RSA uses a different asymmetry: multiplying two large
      primes is easy, while recovering them from their product can be prohibitively costly
      at a suitable key size.
      Each person makes a pair of keys, publishes one and keeps the other. Anyone
      can encipher with the public key, but only the owner of the private key can
      decipher. A signature algorithm uses a private signing key to sign a message and a
      public verification key to check it. These methods reduce the need for secret
      couriers, but the recipient still needs an authentic public key.
    pitfalls:
      - "Assuming that sender and receiver must always share a secret beforehand; this was held to be self-evident until the 1970s"
      - "Keys that are too short, or primes produced by a poor random source, which can be recovered"
      - "Accepting a public key without checking whose it is; an attacker in the middle can substitute his own"
      - "Claiming it is proven unbreakable; unlike the one-time pad its safety rests on problems believed, not proven, to be hard"
    history:
      europe: "1874 – Jevons remarks how hard it is to undo a multiplication of two primes; 1970–1974 Ellis, Cocks and Williamson at GCHQ find the idea, the prime-product scheme and the key exchange in secret (made public in 1997)"
      americas: "1974 – Merkle's puzzles; 1976 Diffie and Hellman, New Directions in Cryptography; 1977 Rivest, Shamir and Adleman's RSA system, published 1978"
    sources:
      - "Whitfield Diffie & Martin E. Hellman, New Directions in Cryptography, IEEE Transactions on Information Theory 22 (1976)"
      - "Steven Levy, Crypto: How the Code Rebels Beat the Government (2001)"
      - "Simon Singh, The Code Book (1999)"
