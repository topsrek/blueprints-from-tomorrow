# Blueprints from Tomorrow – era file: Vienna / Lower Austria, June 1683.
#
# Status of each entry from techtree/core/*.yaml in this era and region.
#   knowledge      0 unknown · 1 idea/rumour · 2 described in theory · 3 used by
#                  specialists · 4 widespread
#   use            none | wrong | partial | correct   (is it used, and used right?)
#   producibility  easy | medium | hard | very-hard | impossible  (with local means,
#                  if someone explains it well; the city is cut off from 14 July to
#                  12 September 1683)
#   acceptance     low | medium | high  (how readily people adopt it)
#   note           what the player should know / what the world believes
#   local          people, places, materials to connect to
#   elsewhere      where it already exists in 1683 (quest material)
# Entries not listed default to knowledge 0, use none.

era: europe-1683-vienna
title: Vienna 1683
region: Vienna, Lower Austria, Habsburg monarchy
year: 1683
core_version: 2

worldview: >
  Vienna is the residence of Emperor Leopold I and a city of the Counter-Reformation:
  the university is run by the Jesuits, books are censored, the Jews were expelled in
  1670 and Protestants are barely tolerated. Learned medicine is still Galenic, with
  chemical remedies and the circulation of the blood accepted by some; plague (the
  city lost many thousands in 1679) is explained by corrupted air, contagion through
  goods and persons, and God's punishment for sin. Astronomy is taught after Tycho,
  not Copernicus. The new experimental philosophy of London, Paris and the Dutch
  towns (air pump, barometer, microscope, pendulum clock) is known here from Latin
  books and Jesuit compendia rather than practised. Craft knowledge is strong:
  gun founders, clockmakers, apothecaries, miners from the Habsburg lands. In June
  1683 an Ottoman army is marching on the city, whose fortifications have been
  neglected.

status:
  # ---- Medicine & hygiene
  contagion_theory:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: low
    note: Sorbait recognised an infection in 1678 and was not believed. Plague rules treat goods and people
      as catching, yet bad air and God's wrath remain the stated causes.
    local:
    - Paul de Sorbait
    - Pest-Ordnung (1680, Sorbait's revision of Mannagetta's ordinance)
    - Kircher's Scrutinium pestis (Rome 1658) in Jesuit libraries
    elsewhere:
    - 'Delft: Leeuwenhoek sees animalcules but links none to disease'
  bloodletting_harm:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: low
    note: Physicians prescribe bleeding, purges and emetics, also for plague and dysentery patients; barber-surgeons
      carry it out. Van Helmont's printed attack on bleeding is read as Paracelsian polemic.
    local:
    - medical faculty of the university
    - Bader and Wundärzte (barber-surgeons)
  epidemiology_mapping:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: The city records deaths with a cause after inspection of each corpse, but nobody tabulates them
      by street, well or parish.
    local:
    - Totenbeschauprotokolle (death-inspection registers)
    - parish burial registers
    elsewhere:
    - 'London: Graunt''s Observations on the Bills of Mortality (1662)'
  hand_hygiene:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Washing hands is table manners. Surgeons, Feldschere and midwives go from one patient to the next
      without washing; soap and lye are at hand.
  boiled_water:
    knowledge: 1
    use: partial
    producibility: easy
    acceptance: medium
    note: Wine and beer are the daily drink. Water comes mostly from house wells sunk near cesspits. The
      Ottomans cut a suburban conduit on 18 July; firewood runs short.
    local:
    - house wells (Hausbrunnen)
    - Hernalser Wasserleitung (1565)
    - Siebenbrunner Hofwasserleitung (1553) to the Hofburg
    - fountain on the Neuer Markt
  water_filtration_chlorination:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: A sand filter bed is ordinary masonry and gravel work, but nobody sees a reason for it. Chlorination
      is out of reach.
  sanitation_sewerage:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: medium
    note: Old drains (Mörungen) and cesspits empty into the Danube arm, the Wien, the Als and the Ottakringer
      Bach; no network. In the siege refuse and carcasses stay inside the walls.
    local:
    - Unterkammeramt (maintains the Mörungen)
    - cesspits (Senkgruben) in house yards
  food_hygiene:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: low
    note: Spoiled meat is judged by smell and market inspection. Flies and cooks' hands are not suspected;
      the Ruhr is blamed on bad air, unripe fruit and poor food.
  quarantine:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: In 1679 gatherings went on until July and closures came too late. The lazaretto lies outside the
      walls on the Als, among the suburbs burned on 13 July.
    local:
    - Pestlazarett St. Johannes in der Siechenals (run by the Bürgerspital)
    - Bäckenhäusel on the Währinger Straße
    - Sorbait as Generalinquisitor in plague matters (1679)
    elsewhere:
    - 'Venice and Ragusa: permanent lazarettos and health magistracies'
  nursing_hospital_hygiene:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: Hospitals are houses of charity for the poor, old and sick, with beds shared. During the siege
      Bishop Kollonitsch sets up emergency hospitals in monasteries.
    local:
    - Bürgerspital (former convent of St. Clara)
    - Barmherzige Brüder in the Leopoldstadt (lost to the Ottomans in mid-July)
    - Leopold Karl von Kollonitsch
  cholera_waterborne:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Cholera is unknown in Europe. The same reasoning applies to the rote Ruhr, which breaks out around
      8 August and is not connected with wells or latrines.
  oral_rehydration:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: medium
    note: Ruhr patients get rhubarb purges, astringents, opiates and bleeding. Salt, honey and clean boiled
      water exist in the city; sugar is an apothecary's ware and dear.
    local:
    - apothecaries
    - Starhemberg, ill with dysentery 11–20 August
  plague_vectors:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: The plague of 1679 is explained by corrupted air, infected goods and sin. Rats and fleas are not
      suspected. Infected bedding is burned or buried, which helps by accident.
    local:
    - Paul de Sorbait
    - Pestsäule vowed by Leopold I on the Graben (1679)
  typhus_lice:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: low
    note: Camp fever is known to imperial army physicians as the Hungarian disease (morbus Hungaricus) and
      blamed on air, water and food. Lice are ordinary. Epidemic follows the siege in autumn.
  malaria_mosquito:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: Tertian and quartan fevers are common along the Danube wetlands and in Hungary and are blamed
      on marsh air. Avoiding marshes is the only defence.
  quinine:
    knowledge: 3
    use: partial
    producibility: hard
    acceptance: medium
    note: 'Jesuits'' bark comes through the Society and Italian drug trade: dear, often adulterated, dosed
      too low. Galenists distrust it. None can be bought once the city is cut off.'
    local:
    - Jesuit college and its apothecary
    - city apothecaries
    elsewhere:
    - 'Rome: Jesuit distribution since the 1640s'
    - 'London and Paris: Talbor''s remedy, the recipe published in 1682'
  tuberculosis_control:
    knowledge: 2
    use: none
    producibility: easy
    acceptance: low
    note: Fracastoro's listing of phthisis among contagions is in print, but physicians treat consumption
      as an inherited constitution with catarrh falling on the lungs.
  parasitic_worms:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Worms are seen and treated with wormseed and bitter herbs, but held to arise from putrid humours
      in the gut. Itch mites and trichinae are unknown.
    elsewhere:
    - 'Florence: Redi, whose book on animals living inside animals appears in 1684'
  scurvy_citrus:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Scharbock is a named disease of garrisons and winter; scurvy grass, cress and sauerkraut are the
      accepted remedies. Lemons come from Italy and are a luxury.
    local:
    - apothecaries (Löffelkraut preparations)
    - noble and monastery orangeries
  vitamins_deficiency:
    knowledge: 1
    use: none
    producibility: medium
    acceptance: low
    note: Goitre and cretinism are familiar from the Alpine valleys of Styria and Carinthia and blamed on
      water. Rickets is in print (Glisson 1650). Nobody thinks a food can lack something.
  variolation:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Smallpox (Blattern) is endemic; it killed Leopold's elder brother Ferdinand IV in 1654. Giving
      it on purpose would be judged tempting God, and a death would be the inoculator's.
    elsewhere:
    - 'China: nasal insufflation'
    - folk practice in parts of the Ottoman lands and Africa, not yet reported in Europe
  smallpox_vaccination:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: Cowpox would have to be found on a dairy herd and recognised, with no way to send to anyone for
      it.
  vaccines_attenuated:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  antitoxin_serum:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  wound_care:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Feldschere tie vessels and amputate after Paré, but probe shot wounds with fingers, close them
      early and welcome pus. The engineer Rimpler dies of an arm wound of 25 July.
    local:
    - regimental Feldschere
    - guild of Bader and Wundärzte
    - emergency hospitals in monasteries
    elsewhere:
    - 'Halberstadt: Purmann, Der rechte und wahrhafftige Feldscher (1680)'
    - 'Ulm: Scultetus, Armamentarium chirurgicum (1655)'
  antiseptics:
    knowledge: 1
    use: partial
    producibility: easy
    acceptance: medium
    note: Wine, vinegar, brandy and turpentine go on wounds by habit, not by rule. Against plague, rooms
      and letters are smoked with juniper and sulphur and washed with vinegar.
  heat_sterilisation:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Instruments are wiped, lint (Charpie) is plucked from old linen by any hands. Boiling them would
      cost only firewood, scarce in the siege.
  childbirth_care:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: medium
    note: Births belong to sworn midwives; a surgeon is called only to extract a dead child with hooks.
      The forceps is a family secret in England.
    elsewhere:
    - 'London: Chamberlen family''s forceps'
    - 'Paris: Mauriceau''s treatise (1668)'
    - 'Berlin: Justine Siegemund, court midwife'
  first_aid_resuscitation:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: The drowned and suffocated are taken for dead. The wounded are carried from the bastions by comrades
      without any sorting by urgency.
  ether_anaesthesia:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: medium
    note: Apothecaries have oil of vitriol and spirit of wine, and Cordus's sweet oil of vitriol is in print.
      Nobody inhales it. Amputations are done fast, on brandy and opium.
  opium_analgesia:
    knowledge: 4
    use: partial
    producibility: easy
    acceptance: high
    note: Opium is in theriac and in laudanum pills at every apothecary, of uncertain strength; stocks are
      finite in the siege. Willow bark is not used against fever or pain.
    elsewhere:
    - 'London: Sydenham''s liquid laudanum'
  blood_groups_transfusion:
    knowledge: 2
    use: none
    producibility: very-hard
    acceptance: low
    note: The lamb's-blood transfusions of the 1660s and the Paris ban are known from journals. Without
      blood groups any attempt is a lottery.
    elsewhere:
    - Purmann, army surgeon, tried lamb's blood on men 1668–1678 and gave it up
  anatomy_dissection:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Vesalian anatomy is taught from books; dissections at the university are rare. Ambitious physicians
      train at Padua, as Sorbait did (doctorate 1652).
    local:
    - Paul de Sorbait, professor of anatomy and practice since 1666
    elsewhere:
    - Padua, Leiden, Paris, Bologna (Malpighi)
  blood_circulation:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: 'A student of Sorbait defended the circulation at Vienna in 1669. It is accepted in theory and
      changes nothing in practice: bleeding goes on.'
    local:
    - Paul de Sorbait
  clinical_thermometer_stethoscope:
    knowledge: 1
    use: none
    producibility: medium
    acceptance: low
    note: Diagnosis is by pulse quality, urine glass and the patient's account. Sealed spirit thermometers
      exist as philosophical instruments without a fixed scale.
    elsewhere:
    - 'Florence: sealed spirit thermometers of the Accademia del Cimento'
    - 'Padua: Santorio''s printed methods'
  dental_care:
    knowledge: 1
    use: wrong
    producibility: easy
    acceptance: medium
    note: Toothache is blamed on the tooth worm and humours; teeth are pulled by barbers and market tooth-drawers.
      Sugar is a growing court fashion.
    elsewhere:
    - 'Delft: Leeuwenhoek''s letter on animalcules in tooth scrapings, 17 September 1683'
  sulphonamides:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  penicillin:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium

  # ---- Life sciences
  microorganisms:
    knowledge: 2
    use: none
    producibility: medium
    acceptance: medium
    note: Leeuwenhoek's letters reach scholars through the Philosophical Transactions and learned journals.
      Nobody in Vienna has repeated them; he keeps his lens-making secret. A fused glass bead would do.
    local:
    - Jesuit college (Kircher's claim of worms in plague blood)
    - spectacle makers
    - Sorbait, member of the Leopoldina
    elsewhere:
    - 'Delft: Leeuwenhoek'
    - 'London: Royal Society, Hooke'
  spontaneous_generation_refuted:
    knowledge: 2
    use: none
    producibility: easy
    acceptance: low
    note: Redi's covered-jar experiment (1668) is in print, but Aristotle and the Jesuit Kircher teach that
      vermin arise from decay. The test costs meat, jars and gauze.
    elsewhere:
    - 'Florence: Francesco Redi'
  fermentation_yeast:
    knowledge: 1
    use: partial
    producibility: easy
    acceptance: medium
    note: Brewers and bakers pass on yeast as a substance and vintners rely on the must itself. Fermentation
      is explained as an inner motion of particles.
    local:
    - Bürgerspital brewery (holds the city's beer monopoly)
    - vintners of the suburbs and Lower Austria
    elsewhere:
    - 'Delft: Leeuwenhoek describes yeast globules in 1680'
  cell_theory:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: low
    note: Hooke's cork 'cells' and the plant anatomy of Malpighi and Grew are curiosities in books; nobody
      thinks of them as units of life.
    elsewhere:
    - 'London: Hooke, Grew'
    - 'Bologna: Malpighi'
  viruses:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  taxonomy:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Plants are known from herbals and Bauhin's Pinax, ordered for the apothecary. Clusius described
      the Austrian and Pannonian flora while in Vienna (1573–1588).
    local:
    - medical faculty (botany taught with medicine)
    - apothecaries' herb gardens
    elsewhere:
    - 'England: John Ray'
    - Leiden and Padua botanical gardens
  reproduction_fertilisation:
    knowledge: 2
    use: none
    producibility: hard
    acceptance: low
    note: Harvey's 'everything from the egg', de Graaf's follicles and Leeuwenhoek's seed animalcules are
      in print and feed a quarrel over preformation. Teaching still follows Aristotle and Galen.
  heredity_genetics:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Breeders and gardeners know that like begets like. Counting ratios over generations of peas takes
      several summers and a garden outside a besieged city.
  evolution_natural_selection:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Species are fixed since Creation; fossils are sports of nature or relics of the Flood. Saying
      otherwise in a Jesuit university town invites a charge of impiety.
  dna_structure:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  respiration_metabolism:
    knowledge: 2
    use: none
    producibility: hard
    acceptance: medium
    note: 'The air-pump deaths of animals and Lower''s reddening of blood by air are known from books. The
      usual doctrine: breathing cools the heart and vents sooty vapours.'
    elsewhere:
    - 'London and Oxford: Boyle, Hooke, Lower; Mayow''s Tractatus (1674)'
  photosynthesis_plant_nutrition:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: low
    note: Van Helmont's willow is read as proof that plants are made of water. Farmers hold that plants
      eat the fat of the soil.
  nitrogen_fixation_biology:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: That peas, beans and vetch leave land in better heart is farmers' and Columella's knowledge. Nobody
      has looked at the root nodules.
  nervous_system_brain:
    knowledge: 2
    use: partial
    producibility: hard
    acceptance: medium
    note: Willis's anatomy of the brain (1664) is on the shelves. Nerves are thought to carry animal spirits;
      epilepsy and melancholy may still be read as possession.

  # ---- Chemistry
  soap:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Soap boilers make soft tallow-and-potash soap for laundry; hard Venetian soap is imported. In
      the siege tallow is wanted for candles.
    local:
    - Seifensieder (soap boilers, also chandlers)
  distillation:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    local:
    - apothecaries
    - brandy distillers (Branntweiner)
    - monastery pharmacies
  sulphuric_acid:
    knowledge: 3
    use: correct
    producibility: medium
    acceptance: high
    note: Oil of vitriol is distilled in small glass retorts from green vitriol or made under a glass bell
      from burning sulphur. Quantities are ounces, not barrels.
    local:
    - apothecaries
    - imperial mint
    - vitriol from the Hungarian mining towns
  oxygen_combustion:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: low
    note: 'The learned account is Becher''s: bodies burn by losing a fatty earth (terra pinguis). Becher
      served Leopold I in Vienna in the 1670s and died in 1682.'
    elsewhere:
    - 'Oxford: Mayow''s nitro-aerial spirit (1674), little noticed'
  nitric_acid:
    knowledge: 3
    use: correct
    producibility: medium
    acceptance: high
    note: Scheidewasser is routine for parting gold from silver. It competes with gunpowder for saltpetre,
      which the arsenal claims first in a siege.
    local:
    - imperial mint
    - goldsmiths and assayers
  saltpetre_production:
    knowledge: 3
    use: correct
    producibility: medium
    acceptance: high
    note: Privileged saltpetre men scrape stables, cellars and old walls and refine with wood ash. Beds
      take a year or more to ripen. A powder store burns on 31 August.
    local:
    - Saliterer (saltpetre men)
    - imperial and civic arsenals
  chemical_elements:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: low
    note: Chymists reason with salt, sulphur and mercury, the schools with four elements. Boyle's Sceptical
      Chymist exists in Latin. Nobody weighs everything before and after.
  atomic_theory:
    knowledge: 1
    use: none
    producibility: very-hard
    acceptance: low
    note: Gassendi's and Boyle's corpuscles are known. Jesuit censors watch atomism because of the Eucharist.
      Proof by combining weights needs purer reagents and better balances than exist.
  molecules_mole_concept:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  periodic_table:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
  gas_laws:
    knowledge: 2
    use: none
    producibility: medium
    acceptance: medium
    note: Guericke showed his pump at Regensburg in 1654, and the Jesuit Schott printed the experiments.
      Boyle's and Mariotte's rule is in books; nobody here has built a pump.
    elsewhere:
    - 'Hamburg: Otto von Guericke (dies 1686)'
    - 'London: Boyle, Hooke'
    - 'Paris: Mariotte, Huygens, Papin''s work'
  pneumatic_chemistry_gases:
    knowledge: 1
    use: none
    producibility: medium
    acceptance: medium
    note: Van Helmont's word 'gas' is known; airs are thought to be one air more or less tainted. Vintners
      know that fermenting cellars kill and test them with a candle.
  acids_bases_ph:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Apothecaries know that acids fizz with alkalis, and syrup of violets changing colour is in Boyle
      (1664). Physicians of the new school explain all disease by acid and alkali.
  hydrochloric_acid_aqua_regia:
    knowledge: 3
    use: correct
    producibility: medium
    acceptance: high
    note: Spirit of salt is made by Glauber's method from salt and oil of vitriol; aqua regia from aqua
      fortis and sal ammoniac dissolves gold for assayers and gilders.
    local:
    - apothecaries
    - imperial mint
    - goldsmiths
  alkali_soda:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Potash is leached from wood ash of the surrounding forests; soda ash comes through Venice. The
      two are not told apart as substances.
  lime_burning:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Kilns and limestone lie outside the walls toward the Wienerwald. During the siege repairs to the
      bastions use stored lime, earth, timber and woolsacks.
  salt_production:
    knowledge: 4
    use: correct
    producibility: hard
    acceptance: high
    note: No brine near Vienna. Salt is a sovereign monopoly and comes down the Danube from the Salzkammergut;
      the besieged city lives on its stock.
    local:
    - Salzamt and the landing on the Salzgries
    elsewhere:
    - Hallstatt, Ischl, Aussee, Hallein, Hall in Tirol
  mordant_dyeing:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Dyers work with alum, madder and woad; indigo and cochineal are bought through Venice and the
      Dutch.
  chlorine_bleach:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Spirit of salt at the apothecary and the glassmakers' Braunstein are both obtainable; nobody has
      heated them together. Plague goods are smoked with sulphur and juniper instead.
  electrolysis:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
    note: No current source exists; metallic zinc is an Asian rarity. Gilders use mercury amalgam.
  organic_structure_theory:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  phosphorus_matches:
    knowledge: 2
    use: none
    producibility: hard
    acceptance: medium
    note: The cold fire from urine has been shown at German courts and described by Kunckel (1678); the
      recipe is a traded secret. It needs barrels of urine and fierce fire.
    elsewhere:
    - 'Hamburg: Hennig Brand'
    - 'Potsdam and Berlin: Johann Kunckel'
    - 'London: Boyle'
    - 'Hanover: Leibniz, who dealt with Brand'
  rubber_vulcanisation:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  synthetic_dyes:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  nitroglycerin_dynamite:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
    note: The acids exist only weak and by the ounce, and glycerine is unrecognised in the soap boiler's
      waste lye. Miners and the arsenal would want it at once.
  petroleum_refining:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: medium
    note: Rock oil is an apothecary's remedy sold in small flasks. Lamps burn tallow, rape oil and wax.
    elsewhere:
    - 'Galicia and Modena: natural seeps'
  polymers_plastics:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  ammonia_synthesis:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low

  # ---- Metallurgy & materials
  copper_bronze:
    knowledge: 4
    use: correct
    producibility: medium
    acceptance: high
    note: Founders cast guns and bells in the city. Copper comes from Upper Hungary, where Thököly's uprising
      disturbs supply, and from Tyrol; tin is imported.
    local:
    - imperial arsenal and gun foundry
    - bell founders
    elsewhere:
    - Neusohl (Banská Bystrica)
    - Schwaz
  bloomery_iron:
    knowledge: 4
    use: correct
    producibility: medium
    acceptance: high
    note: Bar iron and steel arrive from the Styrian Erzberg through Steyr. City smiths forge; they do not
      smelt. Stock in the arsenal must last the siege.
    local:
    - smiths, locksmiths, armourers
    - imperial and civic arsenals
    elsewhere:
    - Eisenerz and Vordernberg (Innerberger Hauptgewerkschaft, 1625)
    - Steyr
  steel_heat_treatment:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Smiths harden and temper by colour and guard their quenching recipes. No theory of carbon.
  cementation_steel:
    knowledge: 3
    use: correct
    producibility: medium
    acceptance: high
    note: Armourers and file cutters case-harden in bone and horn charcoal. Styrian natural steel is cheap
      and good enough that cementation furnaces are not wanted.
    elsewhere:
    - 'Nuremberg: cementation furnaces'
  blast_furnace_cast_iron:
    knowledge: 3
    use: correct
    producibility: hard
    acceptance: high
    note: Cast-iron shot and bomb shells are bought in from the Alpine ironworks. None can be cast inside
      the walls; the garrison collects spent Ottoman balls.
    elsewhere:
    - Carinthian and Styrian ironworks
    - Walloon and Swedish furnaces for iron guns
  coke_iron:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: No coal is mined near Vienna and charcoal from the Alpine forests is plentiful, so nobody has
      a motive.
  puddling_wrought_iron:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
  crucible_steel:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: high
    note: Damascus blades on Ottoman sabres are admired and not understood. Graphite crucibles from the
      Passau area come down the Danube, but no furnace here reaches the heat.
    elsewhere:
    - 'Persia and India: wootz ingots'
    - 'Obernzell near Passau: graphite crucibles'
  bessemer_steel:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  open_hearth_steel:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  alloy_stainless_steel:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  refractories_fireclay:
    knowledge: 3
    use: correct
    producibility: medium
    acceptance: high
    note: The mint, assayers and founders buy Passau graphite crucibles and Hessian crucibles. Local potters'
      clay does not stand a steel-melting heat.
    elsewhere:
    - Obernzell near Passau
    - Großalmerode (Hesse)
  zinc_brass:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: high
    note: Brass is made by cementing copper with calamine and mostly bought as sheet and wire from Nuremberg.
      Zinc as a metal is a curiosity from the Indies trade.
  cupellation_assaying:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Assaying after Ercker is court routine. During the siege Kollonitsch has church plate and confiscated
      silver coined to pay the troops.
    local:
    - imperial mint in Vienna
    - Leopold Karl von Kollonitsch
    elsewhere:
    - Kremnitz and Schemnitz (Lower Hungarian mining towns)
  mercury_amalgam:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Mercury from Idria is a Habsburg monopoly. Gilders fire-gild with amalgam and physicians salivate
      syphilis patients with it; tremor and loose teeth count as part of trade or cure.
    elsewhere:
    - Idria (Carniola)
  lead_hazard:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: low
    note: Lead glazes, pewter and lead water pipes are everyday. Sour wine is sweetened with litharge in
      the German lands; the colic it causes is blamed on the wine's acidity.
    local:
    - vintners and wine taverns
    - potters (lead glaze)
    - pewterers
  soldering_tinning:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
  fired_brick_ceramics:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: The bastions are brick-faced earth. Brick kilns lie in the suburbs outside the walls, so siege repairs
      use rubble, timber, earth and gabions.
    local:
    - suburban brick kilns (Laimgrube, Ziegelofengrund)
    - Hafner (potters and stove makers)
  porcelain:
    knowledge: 1
    use: none
    producibility: very-hard
    acceptance: high
    note: Chinese porcelain is a court treasure and its making a mystery; many think it is a kind of glass
      or shell paste. Kaolin and kiln heat are both lacking.
    local:
    - Habaner faience from western and Upper Hungary (the Habaner left Moravia in 1622) as the local fine ware
    elsewhere:
    - Jingdezhen
    - 'Delft: tin-glazed imitations'
    - 'Saxony: Tschirnhaus experimenting with burning mirrors and lenses'
  glassmaking:
    knowledge: 4
    use: correct
    producibility: medium
    acceptance: high
    note: Green potash forest glass comes from huts in Bohemia and the northern forests; glaziers and lamp
      workers in the city only rework it.
  clear_glass:
    knowledge: 3
    use: partial
    producibility: hard
    acceptance: high
    note: Venetian cristallo is imported; Bohemian huts are just learning a clear potash-chalk glass for
      engraving. Glass free of streaks for lenses is luck.
    elsewhere:
    - Murano
    - 'London: Ravenscroft''s lead crystal (1674–1676)'
    - 'Potsdam: Kunckel, Ars Vitraria Experimentalis (1679)'
  glass_mirrors:
    knowledge: 3
    use: correct
    producibility: hard
    acceptance: high
    note: Flat tin-amalgam mirrors come from Venice and Nuremberg at high prices. Tin foil and Idrian mercury
      are available; flat clear plate is the bottleneck.
  hydraulic_cement:
    knowledge: 2
    use: partial
    producibility: hard
    acceptance: medium
    note: Builders read of pozzolana in Vitruvius and add crushed brick to lime for cisterns and wells.
      That clayey limestone burns to a water-setting lime is not understood.
    elsewhere:
    - 'Dutch waterworks: trass from the Rhine'
  reinforced_concrete:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
  paper:
    knowledge: 4
    use: correct
    producibility: medium
    acceptance: high
    note: Rag paper comes from water-powered mills in Lower Austria and from abroad. The city's presses
      print orders and newssheets through the siege on stock in hand.
  textile_fibres:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Linen and wool are local; cotton and raw silk come through Venice and the Levant trade. Old linen
      is the only source of bandages and lint.
  leather_tanning:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Tanners work by the watercourses of the suburbs, such as the Weißgerber quarter, all burned on
      13 July. Bark tanning takes many months.
  aluminium:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  wood_tar_pitch:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Pitch from the black pine woods south of Vienna is boiled for barrels and boats, and in the siege
      for pitch wreaths and fire pots thrown from the walls.

  # ---- Physics, optics & astronomy
  lenses:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Spectacle makers grind ordinary lenses. Clear, streak-free glass and long-focus objectives are
      the bottleneck; the best come from Rome and Augsburg.
    local:
    - Vienna spectacle makers
    - Bohemian and Venetian glass on the market
    elsewhere:
    - 'Rome: Giuseppe Campani, Eustachio Divini'
    - 'Augsburg: optical workshops in the tradition of Johann Wiesel'
    - 'The Hague: Christiaan and Constantijn Huygens'
  spectacles:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
  refraction_optics:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Kepler's Dioptrice and the sine law are in the Jesuit mathematicians' books. Lens makers work
      by trial; nobody computes a lens before grinding it.
    local:
    - Jesuit professors of mathematics at the university
    - Kepler's Dioptrice (1611), written in Prague as imperial mathematician
  camera_obscura:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Known from Scheiner and Kircher as a way to watch sunspots and eclipses and as a painter's aid.
      Portable box versions are described in books.
    local:
    - Kircher, Ars magna lucis et umbrae (1646, 2nd ed. 1671)
  microscope:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: Compound 'flea glasses' are cabinet curiosities. Kircher claimed to see 'worms' in plague blood
      (1658). Leeuwenhoek's tiny single lens and its method are unknown here.
    local:
    - Kircher, Scrutinium pestis (1658), read after the plague of 1679
    - physicians of the medical faculty
    elsewhere:
    - 'Delft: Leeuwenhoek, single-lens microscopes, method kept secret'
    - 'London: Hooke, Micrographia (1665)'
    - 'Rome: Campani and Divini'
    - 'Augsburg: instrument makers'
  telescope:
    knowledge: 3
    use: correct
    producibility: medium
    acceptance: high
    note: 'Officers carry draw-tube spyglasses; a lookout watches from St Stephen''s tower. Astronomical
      use is rare: Vienna has no observatory and no maker of long objectives.'
    local:
    - lookout in the tower of St Stephen's
    - Jesuit college and university
    elsewhere:
    - 'Rome: Campani''s long telescopes'
    - 'Paris Observatory: Cassini'
    - 'Danzig: Hevelius'
    - 'Augsburg: telescope makers'
    - 'The Hague: Huygens''s aerial telescope (published 1684)'
  reflecting_telescope:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: medium
    note: Newton's small reflector (1668, reported 1672) is hearsay. Bell founders can cast speculum metal;
      figuring and polishing the mirror, which also tarnishes, is the difficulty.
    local:
    - bell and gun founders (tin-rich bronze)
    elsewhere:
    - 'Cambridge and London: Newton, Royal Society'
  achromatic_lens:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
    note: Coloured fringes are fought with very long focal lengths. No dense lead glass of optical quality
      exists here; Ravenscroft's lead crystal is new in London.
    elsewhere:
    - 'London: George Ravenscroft''s lead glass (1670s), not yet used for optics'
  spectrum_colour:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: medium
    note: Colours are held to be white light weakened or mixed with darkness (Aristotle, Kircher). Newton's
      1672 paper is disputed even in London. Glass prisms are sold as toys.
    local:
    - Marcus Marci's prism experiments, Thaumantias (Prague 1648)
    elsewhere:
    - 'Cambridge: Newton'
  spectroscopy:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
  wave_nature_light_sound:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Sound as motion of air is accepted (bell in a vacuum, in Schott). Light is a quality or Cartesian
      pressure; Grimaldi's diffraction (1665) is known, Huygens's waves are unpublished.
    local:
    - Kircher, Musurgia (1650) and Phonurgia nova (1673)
    elsewhere:
    - 'The Hague: Huygens, wave theory presented in Paris 1678, printed 1690'
  speed_of_light:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: low
    note: Rømer's delay of Jupiter's moon (Paris 1676) is contested by Cassini himself. Cartesians and scholastics
      hold light to be instantaneous.
    elsewhere:
    - 'Paris Observatory: Rømer until 1681, then Copenhagen'
  photography:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Apothecaries sell silver dissolved in aqua fortis (lunar caustic) and know it blackens skin; the
      cause is put down to air or heat. No fixing agent is known.
    local:
    - apothecaries
    - mint assayers (aqua fortis, silver)
  lever_mechanics_statics:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
  buoyancy_hydrostatics:
    knowledge: 3
    use: correct
    producibility: easy
    acceptance: high
    note: Archimedes, Stevin and Pascal are in the textbooks; assayers and brewers use the balance and floats.
      A press built on Pascal's principle does not exist.
    local:
    - mint assayers
    - Schott, Mechanica hydraulico-pneumatica (1657)
  falling_bodies:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Galileo's law of fall was confirmed by the Jesuit Riccioli (1651) and is taught. Gunners still
      lay pieces by quadrant and experience tables; air resistance is ignored.
    local:
    - imperial gunners (Büchsenmeister) of the arsenal
    elsewhere:
    - 'Paris: Blondel, L''art de jetter les bombes (1683)'
  laws_of_motion:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: The university teaches Aristotelian motion with impetus. Descartes's inertia is known but his
      works are on the Index (1663). Force equals mass times acceleration is stated nowhere.
    elsewhere:
    - 'Cambridge: Newton (unpublished until 1687)'
    - 'The Hague: Huygens, laws of collision and centrifugal force'
  universal_gravitation:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Weight is a tendency towards the Earth's centre; planets move by vortices or angels. Hooke has
      guessed an inverse-square pull; Newton has the proof in a drawer.
    elsewhere:
    - 'London: Hooke, Halley, Wren discuss the inverse square (1684)'
    - 'Cambridge: Newton'
  strength_of_materials:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: high
    note: Master builders and fortress engineers size beams, vaults and gun carriages by rules of proportion.
      Galileo's beam theory (1638) is read by few; nobody tests samples.
    local:
    - fortress engineers
    - master masons and carpenters
    elsewhere:
    - 'London: Hooke''s law of the spring (1678)'
    - 'Paris: Mariotte''s bending and pipe-bursting tests'
  sundial_water_clock:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
  mechanical_clock:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Tower clocks, table clocks and watches are made in town. The spiral balance spring for watches
      (Huygens 1675) is only just arriving from Paris and London.
    local:
    - Vienna clockmakers
    - tower clock of St Stephen's
    elsewhere:
    - 'Augsburg: the leading German clock and automaton trade'
    - 'London: Thomas Tompion'
    - 'Paris: Isaac Thuret'
  pendulum_clock:
    knowledge: 3
    use: correct
    producibility: medium
    acceptance: high
    note: Pendulum clocks have reached German and Austrian workshops since the 1660s, mostly with verge
      escapement and short pendulum. Anchor escapement and seconds pendulum are English novelties.
    local:
    - Vienna clockmakers
    elsewhere:
    - 'The Hague: Huygens'
    - 'London: anchor escapement, long-case clocks'
    - Augsburg
    - 'Sobieski''s court: the Jesuit clockmaker Adam Kochański'
  atmospheric_pressure:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Torricelli's tube and Guericke's shows are known from Schott's books. Many Jesuit philosophers
      still deny a true void and speak of subtle matter. Mercury is plentiful.
    local:
    - mercury from the imperial mine at Idrija
    - glassmakers for tubes
    - Schott, Mechanica hydraulico-pneumatica (1657), Technica curiosa (1664)
    elsewhere:
    - 'Hamburg: Otto von Guericke (aged 80)'
    - 'London: Boyle'
    - 'Florence: Viviani, Torricelli''s pupil'
  air_pump_vacuum:
    knowledge: 2
    use: none
    producibility: medium
    acceptance: medium
    note: Guericke showed his pump to the Imperial Diet at Regensburg in 1654; it went to the Würzburg Jesuits.
      Brass founders can cast a barrel; seals and valves are the craft.
    local:
    - arsenal brass founders
    - coppersmiths (hemispheres)
    - Guericke, Experimenta nova Magdeburgica (1672)
    elsewhere:
    - 'Hamburg: Guericke'
    - 'London: Boyle and Hooke''s pump with glass receiver'
    - 'Würzburg Jesuit college: Guericke''s Regensburg pump'
    - 'Altdorf: J. C. Sturm''s experimental college'
  thermometer_temperature:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: medium
    note: Sealed Florentine spirit thermometers are known; each maker's degrees differ and no fixed points
      are agreed. Physicians judge fever by hand and pulse.
    local:
    - glassblowers
    - apothecaries (spirit of wine)
    - Idrija mercury
    elsewhere:
    - 'Florence: Medici instruments; their observer network (1654–1667) had a station at Innsbruck'
    - 'London: Boyle, Hooke'
  latent_specific_heat:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: Heat and temperature are not told apart; without comparable thermometers nobody can measure either.
  heat_energy_conservation:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: low
    note: Fire is an element or a subtle matter; Bacon's and Boyle's 'heat is motion' is a minority view.
      Court alchemists and projectors still sell perpetual motion.
  weather_instruments:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: Printed calendars forecast weather from the stars. Guericke's water barometer with a floating
      manikin and his storm warning of 1660 are in his book; nobody here keeps daily readings.
    local:
    - Vienna calendar printers
    - Guericke, Experimenta nova (1672)
    elsewhere:
    - 'London: Hooke''s wheel barometer and weather journal scheme'
  round_earth_size:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Picard's degree measured with telescopic sights (1669–1670) is known from French books; maps here
      still use older, rougher values.
    elsewhere:
    - 'Paris: Académie, Picard''s measurement'
  seasons_axial_tilt:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
  eclipse_prediction:
    knowledge: 3
    use: correct
    producibility: medium
    acceptance: high
    note: Calendar makers compute eclipses from the Rudolphine Tables. Educated people know the cause; the
      street still reads an eclipse as a sign of war.
    local:
    - Kepler's Rudolphine Tables (1627), dedicated to the emperor
    - Jesuit mathematicians
    - calendar makers
  heliocentrism:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: low
    note: Copernicus is on the Index since 1616; it may be used as a calculating hypothesis only. The Jesuits
      teach Tycho's system after Riccioli. Arguing it as truth risks a denunciation.
    local:
    - Jesuit faculty of philosophy
    - Riccioli, Almagestum novum (1651)
    elsewhere:
    - 'Protestant universities, Holland, England: taught openly'
  keplers_laws:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: medium
    note: Kepler served three emperors and his tables are in use, so the ellipse is accepted as a computing
      device. The area law is often replaced by easier approximations.
    local:
    - Rudolphine Tables
    - Kepler's years in Prague and Linz as imperial mathematician
  astronomical_distances:
    knowledge: 2
    use: partial
    producibility: hard
    acceptance: medium
    note: The Moon's distance is known; for the Sun old values twenty times too small still circulate. Cassini
      and Richer's Mars parallax (1672) is recent Paris news.
    elsewhere:
    - 'Paris Observatory: Cassini'
  comets_orbits:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: The great comet of 1680 and that of 1682 were preached as heralds of the Turk. Scholars accept
      comets are beyond the Moon; a returning orbit is nobody's idea yet.
    local:
    - comet pamphlets and sermons of 1680–1682
    elsewhere:
    - 'Plauen: Dörffel''s parabola for the comet of 1680 (1681)'
    - 'London: Halley observed the comet of 1682'
    - 'Danzig: Hevelius, Cometographia (1668)'
  tides:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: An inland city knows tides from books only. The Moon's influence is accepted as a fact; Galileo's
      sloshing theory and Descartes's vortex pressure compete as causes.
  terrestrial_magnetism:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Gilbert's Earth-magnet is known through Kircher's Magnes. Mine surveyors work with the compass
      and know declination, less that it changes over the years.
    local:
    - Kircher, Magnes (1641)
    - mine surveyors (Markscheider) of Schemnitz and Idrija
  deep_time_geology:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: low
    note: The world is under 6,000 years old by Scripture. Fossils are sports of nature or relics of the
      Flood (Kircher). Steno's strata (1669) are barely known. Theologians will object.
    local:
    - Kircher, Mundus subterraneus (1665)
    - miners' knowledge of veins and strata
    elsewhere:
    - 'Florence: Steno''s Prodromus (1669)'
  plate_tectonics:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
  stars_galaxies_cosmology:
    knowledge: 2
    use: partial
    producibility: hard
    acceptance: low
    note: That the Milky Way is stars is known since Galileo. Stars as suns with worlds is Bruno's heresy
      and Descartes's vortices; a firm sphere of fixed stars is still taught.
  xrays:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  radioactivity:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  atomic_structure:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  quantum_mechanics:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  relativity:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  nuclear_fission:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low

  # ---- Electricity & electronics
  static_electricity:
    knowledge: 2
    use: none
    producibility: medium
    acceptance: medium
    note: Gilbert's 'electrics' and Guericke's rubbed sulphur globe (attraction, repulsion, crackling glow)
      are in print as curiosities. No conduction, no two kinds of charge, no storage jar.
    local:
    - apothecaries (sulphur, amber, resin)
    - glassmakers
    - goldbeaters (foil)
    - Guericke, Experimenta nova (1672), book IV
    elsewhere:
    - 'Hamburg: Guericke'
    - 'London: Boyle repeated the globe experiments (1672–1673)'
  lightning_rod:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Lightning is a sulphurous exhalation or God's hand; bells are rung against storms. A rod on a
      church invites the charge of tempting Providence. Any smith can make it.
    local:
    - spire of St Stephen's
    - powder magazines in the bastions
  electric_battery:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Copper and silver are plentiful, but zinc metal is a rare East India import (tutenag, 'spelter')
      via Amsterdam. Brass is made with calamine, never with the metal.
    local:
    - mint and coppersmiths
    - brass founders (calamine)
    - apothecaries (vitriol, salt)
  practical_batteries:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
  electromagnetism:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Electric and magnetic attraction are held to be separate since Gilbert. Wire drawers supply copper
      and iron wire; silk for insulation is at hand. It waits on the battery.
  ohms_law_circuits:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
  electric_telegraph:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: high
    note: A besieged commander who signals the relief army with rockets from St Stephen's would pay anything
      for it. A year is not enough to get from battery to working line.
  submarine_cable:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  dynamo_electric_motor:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
  electric_light:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: high
  alternating_current_grid:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  telephone:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
  sound_recording:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: 'Needs no electricity: a clockmaker''s screw, a foil-wrapped cylinder and a membrane. The nearest
      ideas are Kircher''s speaking tubes and talking statues. A voice from a machine smells of sorcery.'
    local:
    - clock and instrument makers
