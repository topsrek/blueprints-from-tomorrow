# Blueprints from Tomorrow – era file: Florence / Tuscany, 1490.
#
# Status of each technology from techtree/core/ in this era and region.
#   knowledge      0 unknown · 1 idea/rumour · 2 described in theory · 3 used by
#                  specialists · 4 widespread
#   use            none | wrong | partial | correct   (is it used, and used right?)
#   producibility  easy | medium | hard | very-hard | impossible  (with local means,
#                  within about a year if explained well)
#   acceptance     low | medium | high  (how readily people adopt it)
#   note           what the player should know / what the world believes
#   local          people, places, materials to connect to
#   elsewhere      where it already exists in 1490 (quest material)
# Technologies not listed default to knowledge 0, use none.

era: europe-1490-florence
title: Florence 1490
region: Tuscany, Italian peninsula
year: 1490
core_version: 2

worldview: >
  Medicine follows Galen and Avicenna: disease as imbalance of the four humours,
  plague from corrupted air (miasma) and unfavourable planetary conjunctions.
  Natural philosophy follows Aristotle (nature abhors a vacuum, four elements).
  Neoplatonism is fashionable at the Medici court (Ficino). Astrology is
  respected science. Workshops (botteghe), guilds, hospitals and the Studio at Pisa
  all train specialists. Florence is a republic in name, ruled in practice by Lorenzo
  de' Medici. Savonarola returns to San Marco in 1490.

status:
  # ---- Medicine & hygiene
  contagion_theory:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: low
    note: Ficino describes plague passing between people while also invoking corrupted air. Varro's account
      of invisible creatures is in print. Neither identifies a specific organism.
    local:
    - Marsilio Ficino
    - Antonio Benivieni
  bloodletting_harm:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Patients expect bleeding, purging and cupping. Physicians prescribe bleeding and barbers perform
      it, including when further blood loss can harm the patient.
    local:
    - Arte dei Medici e Speziali
    - barbers who perform bloodletting
  epidemiology_mapping:
    knowledge: 1
    use: partial
    producibility: easy
    acceptance: medium
    note: Surviving burial series start in 1385 for the Grascia and 1450 for the medical guild. The Grascia
      records burial places and gravediggers.
    local:
    - Libri dei morti of the Grascia and of the Arte dei Medici e Speziali
    elsewhere:
    - Milan, surviving civic death register for 1452 with causes of death
  hand_hygiene:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Handwashing before meals is familiar, and soap and basins are available. Routine cleaning between
      patients to prevent transmission would require a change in practice.
    local:
    - Arte dei Medici e Speziali (guild of physicians and apothecaries)
  boiled_water:
    knowledge: 2
    use: none
    producibility: easy
    acceptance: medium
    note: Avicenna's Canon recommends boiling suspect water. Florence draws on wells and the Arno. Fuel
      costs matter if households are to boil water routinely.
    elsewhere:
    - China, habitual tea drinking
  water_filtration_chlorination:
    knowledge: 1
    use: none
    producibility: medium
    acceptance: medium
    note: Venice uses sand-filtered rainwater cisterns. Tuscan masons could build a filter. Reliable chlorination
      would require a chemical supply and controlled dosing.
    elsewhere:
    - Venice, rainwater cisterns that filter through a bed of sand
  sanitation_sewerage:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: medium
    note: Cesspits (pozzi neri) are emptied at night and sold to gardeners; they leak into the well water.
      Dyers, tanners and butchers discharge into the Arno.
    local:
    - cesspit emptiers (votapozzi)
    - Arno
    - Ufficiali della Grascia
  food_hygiene:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Market officers inspect meat and fish and condemn spoiled goods. Smell and visible decay guide
      inspection.
    local:
    - Mercato Vecchio
    - Ufficiali della Grascia
    - butchers' guild (Beccai)
  quarantine:
    knowledge: 4
    use: partial
    producibility: easy
    acceptance: high
    note: Florence appoints officials during epidemics. Isolation and restrictions on travel are familiar
      measures. Merchants have reason to contest a closure.
    local:
    - Florentine plague officials
    - San Bastiano outside the walls (under construction)
    elsewhere:
    - Venice, island lazaretto
    - Milan, health office
    - Ragusa, isolation of arrivals
  nursing_hospital_hygiene:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Santa Maria Nuova provides nursing, meals and clean linen, with separate accommodation for men
      and women. Its staff and accounts offer a starting point for reform.
    local:
    - Ospedale di Santa Maria Nuova
    - Ospedale degli Innocenti (foundlings)
  cholera_waterborne:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Epidemic Asiatic cholera is outside contemporary Florentine experience. Summer diarrhoeal illnesses
      are familiar, but chronicles seldom distinguish modern diagnoses.
  oral_rehydration:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: medium
    note: Salt is taxed and apothecaries sell costly sugar. Clean water and accurate proportions matter
      more than costly drugs for replacing losses from diarrhoea.
  plague_vectors:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Rats and fleas are everywhere and unremarkable. Dogs and cats are sometimes killed in epidemics
      (wrong). Cloth and bedding are rightly suspected.
  typhus_lice:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Lice are familiar, but their role in epidemic fever is unknown. Historical descriptions of camp
      fevers do not always distinguish the infections involved.
  malaria_mosquito:
    knowledge: 1
    use: partial
    producibility: medium
    acceptance: medium
    note: Marsh fevers (tertian, quartan) are blamed on bad air. Avoiding marshes in summer works for the
      wrong reason. Drainage is costly; gauze nets are cheap.
    local:
    - Maremma
    - Pisan plain
    - Val di Chiana
    - Padule di Fucecchio
  quinine:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: high
    note: Cinchona grows in the Andes. Florentine apothecaries have no source for its bark.
    elsewhere:
    - Andean forests, source of cinchona bark
  tuberculosis_control:
    knowledge: 2
    use: none
    producibility: easy
    acceptance: low
    note: Avicenna's Canon, the standard textbook, lists phthisis as catching, but physicians treat it as
      an inherited constitution. Families nurse the sick at home.
  parasitic_worms:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Worms are seen and treated with wormseed and bitter herbs. They are thought to breed from rotting
      humours; eggs, soil and undercooked pork are not suspected.
    local:
    - apothecaries (wormseed, santonica)
  scurvy_citrus:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: medium
    note: Preserved shipboard provisions can leave crews short of fresh food. Citrus is available in Mediterranean
      ports and in Medici gardens.
  vitamins_deficiency:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Disease from a missing food is an alien idea. Goitre is common in Alpine and Apennine valleys
      and blamed on the water. Liver for night blindness is in ancient authors.
  variolation:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Smallpox is familiar. Deliberate exposure entails severe disease and risks spreading an outbreak.
      A dependable and acceptable local practice would be difficult to establish.
  smallpox_vaccination:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: Smallpox is endemic, mostly a children's disease. Cowpox must be found on cattle in the contado;
      finding it is a quest.
  vaccines_attenuated:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  antitoxin_serum:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  wound_care:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Italian surgical traditions differ on pus and cautery. Theodoric recommended wine dressings. Celsus
      on tying bleeding vessels was printed in Florence in 1478.
    local:
    - Surgeons at Santa Maria Nuova
    - Florentine surgeons trained by apprenticeship or university study
  antiseptics:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Wine, vinegar and sometimes aqua vitae are put on wounds without a theory. Strong spirit is easy
      to make; chlorinated lime and carbolic acid are not.
    local:
    - apothecaries
    - monastery stills
  heat_sterilisation:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: medium
    note: Boiling instruments and laundering linen are within a hospital's means. Systematic heat treatment
      between patients would require fuel and a change in routine.
  childbirth_care:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: low
    note: Midwives and female relatives attend most births at home. Ancient texts describe turning a child
      in difficult labour. Obstetric forceps are unavailable.
    local:
    - midwives (levatrici)
    - Ospedale degli Innocenti
  first_aid_resuscitation:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: medium
    note: Bystanders lack a standard method for recognising cardiac arrest or resuscitating an apparently
      lifeless casualty.
  ether_anaesthesia:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: Both ingredients (strong aqua vitae, oil of vitriol) are available to alchemists and apothecaries.
      Dangerous near fire. Surgeons know the unreliable opium-mandrake sleeping sponge.
    local:
    - apothecaries
    - alchemists
  opium_analgesia:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Apothecaries stock opium, mostly inside theriac at unknown strength; mandrake and henbane too.
      Willow bark is in Dioscorides but unused for fever. Dosing is guesswork.
    local:
    - apothecaries (speziali)
    - Venice (theriac, opium imports from Egypt)
  blood_groups_transfusion:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: Blood is thought to be made in the liver and consumed. No hollow needles, no way to test compatibility;
      an attempt will probably kill.
  anatomy_dissection:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Florentine physicians sometimes seek family permission for an autopsy. Dissections also serve
      medical teaching. Benivieni's case histories offer local examples.
    local:
    - Antonio Benivieni
    - Santa Maria Nuova
    - Studio at Pisa
    elsewhere:
    - Bologna and Padua, anatomy teaching
    - Milan, Leonardo's skull drawings of 1489
    - Rome, Florentine artist Antonio del Pollaiuolo
  blood_circulation:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: 'Galen: blood ebbs and flows, passes through pores in the heart wall. The arm-ligature demonstration
      of vein valves needs no equipment. Ibn al-Nafis is unknown here.'
  clinical_thermometer_stethoscope:
    knowledge: 1
    use: none
    producibility: medium
    acceptance: medium
    note: Physicians assess pulse by touch. In 1450 Cusanus proposed weighing water discharged during a
      counted run of pulse beats. Glassworkers could attempt a thermometer.
    local:
    - glassblowers
    - physicians' uroscopy
  dental_care:
    knowledge: 1
    use: wrong
    producibility: easy
    acceptance: medium
    note: Toothache is blamed on a tooth worm, treated with henbane smoke; barbers and fairground tooth-drawers
      extract. Sugar is still a luxury, so decay is moderate.
  sulphonamides:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  penicillin:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
    note: Apothecaries have no way to identify penicillin or supply a preparation of predictable purity
      and strength.

  # ---- Life sciences
  microorganisms:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: Needs the single-lens microscope first. What is seen will be read as spontaneously generated worms,
      a sign of putrefaction rather than its cause.
  spontaneous_generation_refuted:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: medium
    note: 'Aristotle and everyone else: maggots come from rotting meat, eels from mud, bees from ox carcasses
      (Virgil). Covered-jar experiment is cheap and convincing.'
  fermentation_yeast:
    knowledge: 0
    use: partial
    producibility: medium
    acceptance: medium
    note: Bakers preserve sourdough and vintners work with fermenting must. They use living cultures without
      recognising yeast as the organism responsible.
    local:
    - vintners
    - bakers
  cell_theory:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Bodies are made of humours and uniform parts (flesh, bone). Needs a good microscope and thin sections;
      no practical use people can see.
  viruses:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  taxonomy:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Plants are known through Dioscorides, Pliny and Theophrastus (Latin 1483); humanists argue about
      which local herb matches which ancient name. Apothecaries substitute freely. No botanical garden yet.
    local:
    - apothecaries
    - monastery herb gardens
    - Medici villa gardens (Careggi)
    elsewhere:
    - Ferrara, Niccolò Leoniceno
  reproduction_fertilisation:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: 'Aristotle: male seed gives form to menstrual blood; Galen: both sexes give seed. Mammal eggs
      and sperm are invisible without a microscope. Touches theology (ensoulment).'
  heredity_genetics:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Farmers and breeders recognise inherited traits. Testing ratios across multiple generations takes
      careful records. Annual crops limit the evidence a garden can yield in one year.
  evolution_natural_selection:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: A breeder can show inherited variation and selection. Extending the argument to the origin of
      species challenges familiar accounts of Creation.
  dna_structure:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  respiration_metabolism:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: 'Galen: breathing cools the heart''s innate heat and feeds vital spirit. A mouse and a candle
      under a bell jar both die: easy to show, hard to explain.'
  photosynthesis_plant_nutrition:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: In 1450 Cusanus proposed weighing soil before and after growing plants and attributed their gain
      to water. The role of carbon dioxide remains unknown.
  nitrogen_fixation_biology:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: That lupins and beans 'fatten' the soil is read in Columella and Crescenzi and done by good farmers.
      Why is unknown; the nodules are taken for a disease.
    local:
    - Pier de' Crescenzi's Ruralia commoda (Florence edition in Italian, 1478)
  nervous_system_brain:
    knowledge: 2
    use: partial
    producibility: hard
    acceptance: medium
    note: 'Galen''s view holds: brain and nerves, with animal spirits flowing through hollow nerves; faculties
      sit in the ventricles. Aristotelians still favour the heart. Electrical signalling is unprovable here.'

  # ---- Chemistry
  soap:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Fine soaps from Venice, Savona and Castile are traded; used for laundry, wool scouring and baths,
      not for medicine.
  distillation:
    knowledge: 3
    use: correct
    producibility: easy
    acceptance: high
    note: Aqua vitae is made by apothecaries and monasteries as a medicine. Strength is variable; repeated
      distillation gives spirit that burns.
    local:
    - Taddeo Alderotti's writings
    - monasteries
    - Arte dei Medici e Speziali
  sulphuric_acid:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: medium
    note: Alchemists distil oil of vitriol from green vitriol in small, weak batches. Vitriol and sulphur
      are local. Bulk production is unknown.
    local:
    - alchemists
    - vitriol and sulphur from the Colline Metallifere and Volterra district
  oxygen_combustion:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Fire is an element. Demonstration (candle under a glass over water) is easy, explaining it is
      hard. Isolating the gas needs mercury calx or saltpetre and gas handling.
  nitric_acid:
    knowledge: 3
    use: correct
    producibility: medium
    acceptance: high
    note: Aqua fortis is distilled from saltpetre with vitriol or alum by goldsmiths and the mint to part
      gold from silver. Glass and clay retorts break often.
    local:
    - Zecca (mint)
    - goldsmiths of Por Santa Maria
  saltpetre_production:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Saltpetre is scraped from stable and cellar walls or imported through Venice; purity varies. Planned
      nitre beds are a German practice. Every state wants more powder.
    local:
    - gunpowder makers of the Signoria
    elsewhere:
    - Germany, nitre plantations
    - India and the Levant, exports via Venice
  chemical_elements:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: Four elements; metals grow from sulphur and mercury, so transmutation is plausible. Assayers have
      good balances and already rely on weight in practice.
    local:
    - assayers of the Zecca
  atomic_theory:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: low
    note: 'Lucretius is back in circulation (found 1417, printed 1473) and read by humanists. Atoms mean
      Epicurus: godless and suspect. Proof by weight ratios needs pure reagents.'
    local:
    - humanists of the Medici circle
  molecules_mole_concept:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
  periodic_table:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: Only about a dozen of the elements are known as substances here, and none as elements. A table
      from memory would be unverifiable.
  gas_laws:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Scholastics debate the weight of air. Measuring how pressure varies with volume needs a sealed
      tube, mercury and a quantitative account of pressure.
  pneumatic_chemistry_gases:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: Different airs are not imagined; fumes are 'spirits'. Miners know choke-damp and fire-damp. Bladders,
      glass flasks, a water trough and acids are all at hand.
  acids_bases_ph:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Dyers know that lye and urine turn orchil purple and sour liquors redden it. The Rucellai fortune
      comes from this lichen dye. No general concept of neutralising.
    local:
    - Rucellai family (oricello)
    - dyers (tintori)
  hydrochloric_acid_aqua_regia:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: medium
    note: Aqua regia (aqua fortis with sal ammoniac) is known to alchemists and some goldsmiths for dissolving
      gold. Spirit of salt by itself is not made.
    local:
    - goldsmiths
    - alchemists
  alkali_soda:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Soda ash from Syria and Egypt (allume catina) and Spain feeds glass and soap; wood-ash lye is
      in every laundry. Soda and potash are not told apart.
    elsewhere:
    - Syria and Egypt, plant ash exports through Venice
  lime_burning:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
  salt_production:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: State monopoly with a hated tax (gabella del sale). Brine is boiled at Volterra; sea salt comes
      from coastal pans.
    local:
    - Volterra salt springs (moie)
    - salt pans near Pisa and in the Maremma
  mordant_dyeing:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Florentine dyers use alum with many dyes, including madder and kermes. Woad uses a vat process.
      Control of alum helped provoke the 1472 sack of Volterra.
    local:
    - Arte della Lana
    - Arte di Por Santa Maria (silk)
    - Arte di Calimala
    - alum of Tolfa and Volterra
  chlorine_bleach:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Linen is bleached with lye, sour milk and months of sun. Chlorine needs spirit of salt plus manganese,
      which glassmakers stock as a decolouriser. The gas maims.
  electrolysis:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: 'Needs a battery, and batteries are weak without zinc. Gilders would want plating: it replaces
      deadly mercury gilding.'
  organic_structure_theory:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  phosphorus_matches:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Fire is struck with steel, flint and tinder; sulphur-tipped spills only take a flame from an ember.
      Phosphorus from boiled-down urine is foul, slow and looks like sorcery.
  rubber_vulcanisation:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
    elsewhere:
    - Mesoamerica, rubber balls and waterproofing
  synthetic_dyes:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
    note: No coal tar, no coal gas works. The dyers' guilds would see cheap purple as ruin or as a fortune.
  nitroglycerin_dynamite:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
    note: Needs concentrated acids in quantity, glycerine (unrecognised in soap-boilers' waste lye) and
      cooling. The likeliest result is a dead alchemist.
  petroleum_refining:
    knowledge: 2
    use: none
    producibility: medium
    acceptance: medium
    note: Francesco Ariosto described Montegibbio rock oil in a 1460 manuscript. It is traded as a medicine.
      Olive oil and tallow supply ordinary lighting.
    local:
    - apothecaries (olio di sasso)
    elsewhere:
    - Montegibbio near Modena, oil seeps
    - Baku, lamp oil
  polymers_plastics:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  ammonia_synthesis:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low

  # ---- Metallurgy & materials
  copper_bronze:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Florentine founders cast bells, guns and large statues by lost wax. Copper comes from Tuscan mines
      and Germany; tin is imported from Cornwall via Flanders.
    local:
    - Bertoldo di Giovanni
    - the late Verrocchio's workshop (Lorenzo di Credi)
    - copper mines of Montecatini Val di Cecina and Massa Marittima
  bloomery_iron:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Elba ore, owned by the Appiani lords of Piombino, is smelted with charcoal in water-powered ironworks
      on the Maremma coast and in the Pistoia hills.
    local:
    - Elba (Rio mines)
    - ferriere of the Maremma and Pistoia mountains
    - Arte dei Fabbri
  steel_heat_treatment:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Armourers and cutlers harden and temper by colour and by secret quenching recipes (urine, radish
      juice). That carbon makes steel is unknown.
    local:
    - Arte dei Corazzai e Spadai (armourers and swordsmiths)
    elsewhere:
    - Milan, the leading armourers (Missaglia)
  cementation_steel:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: high
    note: Smiths case-harden files and tools in charcoal, horn and salt. Converting whole bars in sealed
      chests is not done; good steel is bought from Brescia and Styria.
    elsewhere:
    - Brescia and Bergamo valleys, natural steel
    - Styria
  blast_furnace_cast_iron:
    knowledge: 3
    use: partial
    producibility: hard
    acceptance: medium
    note: Brescian masters ran a casting furnace at Este-held Fornovolasco by 1480 with mixed results. Waterworks
      continued in 1490. The rebuilt ducal furnace produced in 1497.
    elsewhere:
    - Brescia and Bergamo valleys
    - Liège and the Rhineland
    local:
    - Fornovolasco ironworks, Este Garfagnana
  coke_iron:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
    note: Tuscan ironworks depend on charcoal. A coke furnace would need suitable coking coal, a reliable
      supply and experience running a blast furnace.
    elsewhere:
    - China, coal in iron smelting since the 11th c.
  puddling_wrought_iron:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
    note: Lombard finers already convert pig iron with charcoal. Puddling would require a supply of pig
      iron and a different furnace and fuel system.
    elsewhere:
    - Lombard valleys and Liège, charcoal finery forges
  crucible_steel:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: high
    note: Watered 'Damascus' blades reach Italy through Venice and are admired; how they are made is a mystery.
      Local crucibles and furnaces fail below the heat needed.
    elsewhere:
    - India and Persia, crucible steel ingots
  bessemer_steel:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  open_hearth_steel:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  alloy_stainless_steel:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
    note: Chromium, nickel, tungsten and manganese are unknown as metals.
  refractories_fireclay:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: high
    note: Glassmakers and goldsmiths make their own pots and crucibles from selected clays; these limit
      furnace heat. Finding a good fireclay is a prospecting job.
    local:
    - glass furnaces of the Valdelsa
    - potters of Montelupo and Impruneta
    elsewhere:
    - Hesse (Großalmerode), the best crucibles in Europe
  zinc_brass:
    knowledge: 3
    use: partial
    producibility: hard
    acceptance: high
    note: Brass is made by heating copper with calamine, and mostly imported as sheet and wire. Nobody knows
      calamine holds a metal; zinc boils away unless condensed in a closed retort.
    elsewhere:
    - Milan and Nuremberg, brass goods
    - Zawar in India, metallic zinc
  cupellation_assaying:
    knowledge: 3
    use: correct
    producibility: easy
    acceptance: high
    note: The mint guards the florin's fineness by touchstone, cupellation and parting with aqua fortis
      or salt cementation. The most quantitative craft in the city.
    local:
    - Zecca (mint)
    - goldsmiths' section of the Arte di Por Santa Maria
    - silver-lead mines of the Colline Metallifere
  mercury_amalgam:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Goldsmiths fire-gild bronze with gold amalgam and breathe the fumes. Mercury is not yet used to
      win silver from ore. Quicksilver ointments treat skin diseases.
    local:
    - goldsmiths and gilders
    - apothecaries (mercury)
    elsewhere:
    - Almadén (Spain)
    - Idrija (found 1490)
  lead_hazard:
    knowledge: 2
    use: none
    producibility: easy
    acceptance: low
    note: Vitruvius' warning is in print (c. 1486) and ignored. Lead white is the standard face paint and
      pigment; lead glazes, pewter and litharge-sweetened wine are everyday.
    local:
    - potters
    - painters' workshops
    - apothecaries (biacca)
  soldering_tinning:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Goldsmiths, plumbers and coppersmiths solder, braze with borax and tin copper pots. Tinplate is
      imported from Germany.
  fired_brick_ceramics:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Brick, tile and terracotta are a major local industry; tin-glazed maiolica and the Della Robbia
      glazed sculpture are at their height.
    local:
    - Impruneta (brick, terracotta)
    - Montelupo (maiolica)
    - Andrea della Robbia's workshop
  porcelain:
    knowledge: 1
    use: none
    producibility: very-hard
    acceptance: high
    note: Chinese porcelain can be examined in the Medici collection. Sultan Qaitbay of Egypt sent Lorenzo
      porcelain vases in 1487. Local potters lack the manufacturing recipe.
    local:
    - Medici collection in the Palazzo Medici
    elsewhere:
    - Jingdezhen (China)
  glassmaking:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Tuscan glassmakers come from the Valdelsa and make drinking glasses, flasks and apothecary ware.
      Fine work is bought from Murano.
    local:
    - glassmakers (bicchierai) of Gambassi and Montaione
    - Florentine glass shops
    elsewhere:
    - Murano
  clear_glass:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: high
    note: Cristallo is Murano's secret (purified soda ash, quartz pebbles, manganese); Venice forbids its
      masters to leave. Even cristallo has bubbles and streaks that limit lenses.
    local:
    - Florentine spectacle makers
    elsewhere:
    - Murano, Barovier workshop
  glass_mirrors:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: high
    note: Polished metal and small backed glass mirrors are available. Producing a large, flat, evenly backed
      glass plate would challenge local makers.
    elsewhere:
    - Nuremberg, convex glass mirrors
  hydraulic_cement:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Masons line cisterns with lime and crushed brick; Vitruvius and Alberti (printed Florence 1485)
      describe pozzolana from Naples and Lazio. Burning true cement clinker is hard.
    local:
    - architects (Giuliano da Sangallo)
    - Vitruvius and Alberti in print
  reinforced_concrete:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Iron tie rods and chains in masonry are familiar (Brunelleschi's dome). Iron is hand-forged and
      dear; Roman-style concrete without iron is the realistic step.
  paper:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Rag paper from water-powered mills is plentiful and feeds the presses. Rags are the bottleneck.
    local:
    - paper mills of Colle di Val d'Elsa
    - Fabriano
    - cartolai (stationers) of Florence
  textile_fibres:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Merchant firms organise wool production across town and countryside. Spinners work by hand, and
      water-powered fulling mills serve the cloth trade.
    local:
    - Arte della Lana
    - fulling mills on the Arno
    - wool from Spain and the Abruzzi
  leather_tanning:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Tanners work by the Arno with oak bark, myrtle and sumac; alum-tawed white leather too. A stinking,
      low-status trade.
    local:
    - tanners (conciatori) near Santa Croce
    - Arte dei Cuoiai e Galigai
  aluminium:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
    note: Alum is traded by the shipload, but nobody suspects a metal in it.
  wood_tar_pitch:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Pitch for the galleys comes through Pisa.
    local:
    - Casentino and Apennine forests
    - Maremma woods

  # ---- Physics, optics & astronomy
  lenses:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Florence is a centre of spectacle making; convex and concave lenses are sold. Clear glass (cristallo)
      comes from Murano.
    local:
    - Florentine spectacle makers
    - Murano glassmakers
  spectacles:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Florentine makers export them by the hundred, graded by the buyer's age. Frames of bone, horn
      or leather sit on the nose; no side arms.
    local:
    - Florentine spectacle makers
  refraction_optics:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Perspectiva (Alhazen, Witelo, Pecham) is taught; Ptolemy's refraction tables are known, no sine
      law. The eye's crystalline lens is held to be the seat of vision.
    local:
    - university of Pisa
    - painters and perspectivists
  camera_obscura:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: high
    note: Known from Alhazen and Pecham for watching eclipses. Nobody puts a lens in the hole or uses it
      for drawing.
    local:
    - Toscanelli's gnomon hole in the dome of the Duomo (1475)
  microscope:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: A single bead lens (Leeuwenhoek style) can be made by a glassblower; spectacle lenses are too
      weak. The hard part is forming tiny lenses and good lighting.
  telescope:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: high
    note: Workshops stock weak convex lenses, but strong concave ones are rare and must be ordered. Lens
      quality limits magnification to about 3-10x.
    local:
    - Florentine spectacle makers
  reflecting_telescope:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Concave burning mirrors and cast metal mirrors exist. Figuring and polishing a high-tin bronze
      mirror accurately is the bottleneck.
    local:
    - bronze founders
    - mirror makers
  achromatic_lens:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
    note: Needs two glasses of different dispersion; lead glass is made only for imitation gems and enamel,
      never in clear optical blanks.
  spectrum_colour:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: medium
    note: Colours are held to be white light weakened by darkness (Aristotle). Crystals and glass are known
      to throw rainbow colours; a prism is easy to have made.
    local:
    - Murano glassmakers
  spectroscopy:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Needs a good prism, a slit and a nearly colourless flame; a spirit lamp with strong aqua vitae
      serves.
  wave_nature_light_sound:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Vitruvius likens sound to water ripples; string ratios are taught as musica. Light as a wave is
      unknown.
    local:
    - organ builders
    - lute makers
  speed_of_light:
    knowledge: 2
    use: none
    producibility: very-hard
    acceptance: low
    note: Aristotle treats illumination as instantaneous. Alhazen argues that light takes time to travel.
      A measurable astronomical delay requires a telescope and sustained observations.
  photography:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Goldsmiths can dissolve silver in aqua fortis. Fixing is the problem (no hypo; strong brine or
      ammonia only partly works). Images made by light smell of sorcery.
    local:
    - goldsmiths
    - apothecaries
  lever_mechanics_statics:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Builders work by rule of thumb; the steelyard is everywhere. Theory (pseudo-Aristotle's Mechanica,
      Jordanus, Archimedes) sits in manuscripts few craftsmen read.
    local:
    - Opera del Duomo
    - Giuliano da Sangallo
  buoyancy_hydrostatics:
    knowledge: 2
    use: none
    producibility: easy
    acceptance: high
    note: The crown story is known from Vitruvius; On Floating Bodies exists only in rare Latin manuscripts.
      Gold is assayed by touchstone and fire, not by density.
    local:
    - goldsmiths
    - the Zecca (mint)
  falling_bodies:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: low
    note: Aristotelian accounts relate speed to weight and the resisting medium. Scholars discuss uniformly
      accelerated motion. Comparing actual falls would put competing claims to a test.
  laws_of_motion:
    knowledge: 1
    use: none
    producibility: medium
    acceptance: low
    note: 'Buridan''s impetus is taught: a thrown body carries an impressed force that fades. Rest is the
      natural state; the heavens obey other rules.'
  universal_gravitation:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: Heavy things seek the centre of the world, which is the Earth. A force acting across empty space
      sounds like astrology or magic.
  strength_of_materials:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: high
    note: Builders trust proportion rules and scale models, and assume a model's strength carries over to
      full size. Loading wires and beams to breaking is cheap.
    local:
    - Opera del Duomo
    - Leonardo da Vinci (in Milan)
  sundial_water_clock:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: 'Italian hours: 24 equal hours counted from sunset, so noon shifts through the year.'
  mechanical_clock:
    knowledge: 3
    use: correct
    producibility: medium
    acceptance: high
    note: Weight-driven verge-and-foliot tower clocks, reset by sundial, drift a quarter hour a day. Spring-driven
      chamber clocks are princely luxuries.
    local:
    - Lorenzo della Volpaia
    - Palazzo della Signoria tower clock
    - Duomo clock (24-hour dial painted by Uccello)
  pendulum_clock:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: high
    note: Clockmakers could attempt a pendulum regulator. At small swings its period depends chiefly on
      length. The escapement must sustain the swing without disturbing it.
    local:
    - Lorenzo della Volpaia
  atmospheric_pressure:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: Nature abhors a vacuum (Aristotle); air is thought weightless in its own place. Needs a long sealed
      glass tube and mercury, which apothecaries sell.
    local:
    - apothecaries (mercury)
    - Murano glassmakers
    - mining and well engineers
    elsewhere:
    - Almaden (Spain) mercury mines
    - Idrija, mercury found c. 1490
  air_pump_vacuum:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: A void is impossible for Aristotelians. Needs a tightly fitted bronze syringe with leather packing
      and valves, plus thick glass vessels.
    local:
    - bronze founders
    - Murano glassmakers
  thermometer_temperature:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: Physicians judge fever by touch and pulse; Galenic pharmacy counts four degrees of hot and cold.
      A sealed spirit tube is glassblower's work.
    local:
    - Murano glassmakers
    - apothecaries (aqua vitae)
  latent_specific_heat:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: Heat and cold are qualities, not quantities. Needs a thermometer first.
  heat_energy_conservation:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Engineers seriously draw perpetual-motion wheels and self-driving mills. Heat is the element fire.
  weather_instruments:
    knowledge: 2
    use: none
    producibility: medium
    acceptance: medium
    note: Alberti described a wind-pressure plate. Cusanus proposed balancing dry wool against a fixed weight
      to follow changes in humidity.
  round_earth_size:
    knowledge: 4
    use: partial
    producibility: easy
    acceptance: high
    note: Learned geography treats Earth as spherical. Estimates of its circumference and of Asia's eastward
      extent differ, with large consequences for a westward voyage.
    local:
    - Toscanelli's papers and pupils
    - Berlinghieri's printed Ptolemy (Florence 1482)
  seasons_axial_tilt:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Taught correctly as the obliquity of the Sun's path (Sacrobosco), but with the Sun circling a
      fixed Earth.
    local:
    - Toscanelli's gnomon in the Duomo
  eclipse_prediction:
    knowledge: 3
    use: correct
    producibility: medium
    acceptance: high
    note: Causes are understood. Predictions from the Alfonsine Tables and Regiomontanus' printed Ephemerides
      can be off by an hour or more.
    local:
    - astrologers
    - university of Pisa
    elsewhere:
    - Nuremberg, Regiomontanus' successors (Bernhard Walther)
  heliocentrism:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: low
    note: Aristarchus is known to a few humanists through Archimedes and Plutarch. Copernicus, aged 17,
      enters Krakow university in 1491. Absurd rather than heretical in 1490.
  keplers_laws:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: Astronomers have planetary tables, but testing elliptical orbits needs long, accurate observations
      and extensive calculation. A drawn ellipse alone would establish little.
  astronomical_distances:
    knowledge: 2
    use: partial
    producibility: hard
    acceptance: low
    note: Ptolemy's lunar distance is fairly close. His solar distance is about twenty times too small.
      The fixed stars belong to a sphere beyond Saturn.
  comets_orbits:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: low
    note: Comets are fiery vapours below the Moon and omens of deaths and wars. Toscanelli recorded positions
      of several, including the comet of 1456.
  tides:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: The link to the Moon is accepted and explained astrologically. Tuscan tides are too small to matter;
      Venice and the Atlantic ports care.
    elsewhere:
    - Venice
    - Atlantic ports of Portugal and Flanders
  terrestrial_magnetism:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: The needle is thought to seek the Pole Star or a magnetic mountain. Peregrinus' letter on the
      magnet circulates in manuscript.
    local:
    - Elba lodestone (Monte Calamita)
    elsewhere:
    - Nuremberg compass-sundial makers mark the needle's deviation
  deep_time_geology:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: low
    note: Biblical chronologies count thousands of years. Tuscan shell beds offer evidence of former seas,
      although scholars differ over how shells came to lie inland.
    local:
    - shell beds and fossil bones of the upper Valdarno
  plate_tectonics:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
  stars_galaxies_cosmology:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: low
    note: Cusanus wrote of a universe without centre and of other inhabited worlds; humanists know it as
      speculation. The stars are lights on one sphere.
  xrays:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  radioactivity:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  atomic_structure:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  quantum_mechanics:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  relativity:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  nuclear_fission:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low

  # ---- Electricity & electronics
  static_electricity:
    knowledge: 2
    use: none
    producibility: medium
    acceptance: medium
    note: Rubbed amber drawing chaff is a curiosity from Pliny, lumped together with the lodestone. Sulphur,
      glass, silk, tin foil and gold leaf are all on sale.
    local:
    - apothecaries (sulphur
    - amber)
    - goldbeaters (battiloro)
  lightning_rod:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Lightning is a sign of God; church bells are rung against storms. A rod on a tower is cheap but
      theologically suspicious.
    local:
    - the lantern of the Duomo (struck repeatedly; badly damaged 5 April 1492)
  electric_battery:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: Metallic zinc is unknown in Europe (only calamine, for brass). Copper-iron or silver-iron piles
      in brine or vinegar work, but weakly.
    local:
    - coppersmiths
    - goldsmiths
    elsewhere:
    - Zawar in India, metallic zinc
  practical_batteries:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Blue vitriol, oil of vitriol, lead and unglazed pots are available; zinc is not. A lead-acid cell
      needs another current source to charge it.
    local:
    - apothecaries
    - alchemists
  electromagnetism:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Compasses are common. Copper wire must be drawn and silk-wrapped by hand, and zincless cells give
      little current.
    local:
    - goldsmiths (wire drawing)
    - silk workers
  ohms_law_circuits:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
  electric_telegraph:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: high
    note: A line across a palace is conceivable; Florence to Pisa needs some 80 km of hand-drawn insulated
      wire and far stronger cells.
  submarine_cable:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  dynamo_electric_motor:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
    note: Lodestones are weak; a useful machine needs electromagnets, soft iron and hundreds of metres of
      insulated copper wire.
  electric_light:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: high
  alternating_current_grid:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  telephone:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
  sound_recording:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: 'A tinfoil phonograph is purely mechanical: hand-cut screw, parchment diaphragm, needle, beaten
      tin foil. A machine that speaks invites talk of demons.'
    local:
    - clockmakers
    - tin-foil beaters
    - instrument makers
  electromagnetic_waves_radio:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  crystal_detector:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  vacuum_tube:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  television_crt:
    knowledge: 0
    use: none
