# Blueprints from Tomorrow – era file: Florence / Tuscany, autumn 1347.
#
# Status of each entry from techtree/core/*.yaml in this era and region.
#   knowledge      0 unknown · 1 idea/rumour · 2 described in theory · 3 used by
#                  specialists · 4 widespread
#   use            none | wrong | partial | correct   (is it used, and used right?)
#   producibility  easy | medium | hard | very-hard | impossible  (with local means,
#                  if someone explains it well)
#   acceptance     low | medium | high  (how readily people adopt it)
#   note           what the player should know / what the world believes
#   local          people, places, materials to connect to
#   elsewhere      where it already exists in 1347 (quest material)
# Entries not listed default to knowledge 0, use none.

era: europe-1347-florence
title: Florence 1347
region: Tuscany, Italian peninsula
year: 1347
core_version: 2

worldview: >
  Medicine follows Galen and Avicenna as taught at Bologna, Padua and Montpellier:
  disease is an imbalance of the four humours; pestilence comes from corrupted air
  (miasma) stirred up by planetary conjunctions, earthquakes and God's anger at sin.
  Natural philosophy is scholastic Aristotle. Astrology is respected science. There
  is no printing: knowledge travels by sermon, council decree, notary, letter and
  copyist, and most people cannot read Latin. Florence is a guild republic of perhaps
  90,000 to 100,000 people, governed since 1343 by priors drawn by lot from the
  guilds, shaken by the collapse of the Bardi and Peruzzi banks and by the famine of
  1346–47. The pope sits at Avignon. Practical knowledge lives in workshops and
  guilds; merchants reckon with Arabic numerals in abacus schools but keep formal
  ledgers in Roman numerals.

status:
  # ---- Medicine & hygiene
  contagion_theory:
    knowledge: 1
    use: partial
    producibility: medium
    acceptance: low
    note: Plague is corrupted, poisonous air from conjunctions and rot. Physicians add that the sick 'infect'
      others by breath and belongings. Varro's tiny animals are in a rare, unread manuscript.
    local:
    - Arte dei Medici e Speziali
    - physicians trained at Bologna
    elsewhere:
    - Perugia, Gentile da Foligno (poisonous vapour reaching heart and lungs)
    - Granada and Almería, Ibn al-Khatib and Ibn Khatima (their contagion tracts follow in 1349 and after)
  bloodletting_harm:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Bleeding, purging and cupping are standard, also as plague prevention; the plague consilia of
      1348 prescribe them. Patients expect it and barbers live from it.
    local:
    - Arte dei Medici e Speziali
    - barbers who perform bloodletting
  epidemiology_mapping:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: medium
    note: No death registers exist. Giovanni Villani reports baptisms counted with beans at the Baptistery,
      and counts of mouths, schools and hospital beds. Parishes and gravediggers could supply tallies.
    local:
    - Giovanni Villani
    - Baptistery of San Giovanni (bean count of baptisms)
    - parish priests and gravediggers (beccamorti)
  hand_hygiene:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Hands are washed before meals for manners. Soap and basins exist. Washing between patients has
      no rationale in a medicine of bad air and humours.
    local:
    - Arte dei Medici e Speziali
    - Santa Maria Nuova
  boiled_water:
    knowledge: 2
    use: none
    producibility: easy
    acceptance: medium
    note: Avicenna advises boiling suspect water. Wells and the Arno supply the city. Talk of something
      unseen in wells can feed poisoning rumours; Jews are murdered on that charge in 1348–49.
    elsewhere:
    - China, habitual tea drinking
  water_filtration_chlorination:
    knowledge: 1
    use: none
    producibility: medium
    acceptance: medium
    note: Masons could build a sand filter like the Venetian cisterns. Chlorination is out of reach; no
      one can make the chemical.
    elsewhere:
    - Venice, rainwater cisterns that filter through a bed of sand
  sanitation_sewerage:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: medium
    note: Statutes forbid dumping filth in streets. Cesspits leak into wells; dyers, tanners and butchers
      foul the Arno. In early 1348 the commune has the city cleaned against the stench.
    local:
    - cesspit emptiers
    - Arno
    - commune's street and market officials
  food_hygiene:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Officials and the butchers' guild inspect meat and fish by smell and look. Stinking meat counts
      as a source of corrupt air, so rules tighten in 1348.
    local:
    - Mercato Vecchio
    - butchers' guild (Arte dei Beccai)
    elsewhere:
    - Pistoia, ordinances of May 1348 regulate butchers
  quarantine:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Lepers are segregated; a waiting period for arrivals exists nowhere yet. In 1348 Florence refuses
      entry to the sick. Closing gates to goods means hunger after the famine; merchants resist.
    local:
    - leper hospital of San Jacopo a Sant'Eusebio outside the walls
    - city gates and their gabelle officials
    - Signoria (priors of the guilds)
    elsewhere:
    - Pistoia, May 1348 ban on people and cloth from Pisa and Lucca
    - Milan, Visconti restrictions in 1348
    - Islamic lands, tradition against entering or leaving a plague land
  nursing_hospital_hygiene:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Villani counts thirty hospitals, over a thousand beds. Santa Maria Nuova nurses with lay sisters,
      food and linen; beds are shared. The Misericordia carries the sick and buries the dead.
    local:
    - Ospedale di Santa Maria Nuova (founded 1288)
    - Compagnia della Misericordia
    - Ospedale di San Gallo (foundlings)
    - Ospedale di San Paolo
    elsewhere:
    - Cairo, Mansuri hospital with wards by disease
    - Siena, Santa Maria della Scala
  cholera_waterborne:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Asiatic cholera does not exist here. Summer fluxes are common, worst after the famine, and blamed
      on bad food, fruit and air.
  oral_rehydration:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: medium
    note: Salt is taxed and sugar is an apothecary's luxury; honey is the cheap substitute. Physicians restrict
      drink in fluxes.
  plague_vectors:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: 'Rats and fleas are unremarkable. Clothes and bedding of the dead are suspected, rightly. Cheap
      and possible: flee early, shun coughing patients, boil or burn bedding, keep rats from grain.'
    local:
    - grain stores at Orsanmichele
    - second-hand clothes dealers (rigattieri)
    - wool and cloth warehouses
  typhus_lice:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Lice are universal and thought to breed from sweat and humours. Famine fevers of 1347 are not
      told apart. Boiling or baking clothes is possible wherever there is fuel.
  malaria_mosquito:
    knowledge: 1
    use: partial
    producibility: medium
    acceptance: medium
    note: Marsh fevers (tertian, quartan) are blamed on bad air. Avoiding marshes in summer works for the
      wrong reason. Drainage is costly; fine cloth nets are cheap.
    local:
    - Maremma
    - Pisan plain
    - Val di Chiana
    - Padule di Fucecchio
  quinine:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: high
    note: Cinchona grows in the Andes, on a continent nobody here knows exists.
    elsewhere:
    - Andean forests, source of cinchona bark
  tuberculosis_control:
    knowledge: 2
    use: none
    producibility: easy
    acceptance: low
    note: Avicenna's Canon, the university textbook, lists phthisis as catching, but physicians treat it
      as a constitution. Families nurse the sick at home.
  parasitic_worms:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Worms are seen and treated with wormseed and bitter herbs. They are thought to breed from rotting
      humours; eggs, soil and undercooked pork are not suspected.
    local:
    - apothecaries (wormseed)
  scurvy_citrus:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: medium
    note: Galleys coast from port to port, so sea scurvy is rare; it appears in sieges and famine. Lemons,
      citrons and bitter oranges come from Sicily, Amalfi and Liguria.
  vitamins_deficiency:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Disease from a missing food is an alien idea. Goitre in Alpine and Apennine valleys is blamed
      on the water. Liver for night blindness is in the medical authorities.
  variolation:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Smallpox is familiar and described by Rhazes. Deliberate infection is unknown anywhere in writing
      and would look like poisoning, most of all in a plague year.
  smallpox_vaccination:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: Smallpox is endemic, mostly a children's disease. Cowpox must be found on cattle in the contado;
      finding it is a quest. It does nothing against plague.
  vaccines_attenuated:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  antitoxin_serum:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  wound_care:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: 'Surgeons split over pus: Theodoric of Lucca taught clean healing with wine dressings, most still
      provoke ''laudable pus''. Plague buboes are cut or cauterised. Bleeding is stopped mainly by cautery.'
    local:
    - surgeons of the Arte dei Medici e Speziali
    - surgeons at Santa Maria Nuova
    elsewhere:
    - Bologna, surgical tradition of Theodoric and William of Saliceto
    - Avignon, Guy de Chauliac
  antiseptics:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Wine and vinegar go on wounds without a theory. Vinegar is the plague year's all-purpose wash
      for hands, face, coins and rooms. Strong spirit can be made; chlorinated lime cannot.
    local:
    - apothecaries
    - monastery stills
  heat_sterilisation:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: medium
    note: Boiling instruments and linen is within any hospital's means. It needs fuel and a new routine;
      fire is already trusted to purify air.
  childbirth_care:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: low
    note: Midwives and female relatives attend births at home; physicians stay out. Turning the child is
      in the Arabic authors. No forceps.
    local:
    - midwives
    - Ospedale di San Gallo and Santa Maria della Scala (foundlings)
  first_aid_resuscitation:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: medium
    note: No method exists for reviving the apparently dead. The drowned are hung head down or rolled. A
      revival may be called a miracle or sorcery.
  ether_anaesthesia:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Aqua vitae is at hand, but oil of vitriol is a rare, weak alchemist's distillate. Surgeons know
      the unreliable opium and mandrake sleeping sponge.
    local:
    - apothecaries
    - alchemists
  opium_analgesia:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Opium is sold mostly inside theriac, the leading plague remedy, at unknown strength; mandrake
      and henbane too. Willow bark is unused for fever. Dosing is guesswork.
    local:
    - apothecaries (speziali)
    - theriac from Venice, Genoa and Montpellier
  blood_groups_transfusion:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: Blood is thought to be made in the liver and consumed. No hollow needles, no way to test compatibility;
      an attempt will probably kill.
  anatomy_dissection:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Bologna teaches from Mondino's Anathomia (1316), which mostly confirms Galen. Florence has no
      anatomy teaching; legal post-mortems, as at Bologna in 1302, are rare but known.
    local:
    - physicians of the Arte dei Medici e Speziali
    - Santa Maria Nuova
    elsewhere:
    - Bologna and Padua, anatomy teaching on executed criminals
    - Paris, Guido da Vigevano's illustrated Anathomia (1345)
  blood_circulation:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: 'Galen: blood ebbs and flows, passes through pores in the heart wall. The arm-ligature demonstration
      of vein valves needs no equipment. Ibn al-Nafis is unknown here.'
    elsewhere:
    - Cairo and Damascus, Ibn al-Nafis's account of the passage through the lungs (c. 1242)
  clinical_thermometer_stethoscope:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: medium
    note: Physicians judge pulse by touch and inspect urine in a flask; fever is felt by hand. No small
      timekeeper exists; a sandglass or counted prayers must serve.
    local:
    - glassmakers
    - physicians' uroscopy
  dental_care:
    knowledge: 1
    use: wrong
    producibility: easy
    acceptance: medium
    note: Toothache is blamed on a tooth worm, treated with henbane smoke; barbers and travelling tooth-drawers
      extract. Sugar is a luxury, so decay is moderate.
  sulphonamides:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  penicillin:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
    note: No way to identify the mould, grow it clean or dose it. Mouldy bread on wounds is folk practice
      without reliable effect.

  # ---- Life sciences
  microorganisms:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: Needs the single-lens microscope first; spectacle makers grind only weak convex lenses. What is
      seen will be read as worms bred by putrefaction, not its cause.
    local:
    - spectacle makers
    - glassmakers
  spontaneous_generation_refuted:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: medium
    note: 'Aristotle and everyone else: maggots come from rotting meat, eels from mud, bees from ox carcasses
      (Virgil). Covered-jar experiment is cheap and convincing.'
  fermentation_yeast:
    knowledge: 0
    use: partial
    producibility: medium
    acceptance: medium
    note: Bakers keep sourdough and vintners work with fermenting must. Fermentation is understood as a
      kind of boiling or digestion, not the work of a living thing.
    local:
    - vintners (Arte dei Vinattieri)
    - bakers (Arte dei Fornai)
  cell_theory:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Bodies are made of humours and uniform parts (flesh, bone). Needs a good microscope and thin sections;
      no practical use people can see.
  viruses:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  taxonomy:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Plants are known from Latin Dioscorides, Pliny, the Circa instans and alphabetical synonym lists.
      Apothecaries substitute freely. Theophrastus is unknown; no botanical garden.
    local:
    - apothecaries
    - monastery herb gardens
    elsewhere:
    - Salerno, physic garden and Pandectae (1317) of Matthaeus Silvaticus
  reproduction_fertilisation:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: 'Aristotle: male seed gives form to menstrual blood; Galen: both sexes give seed. Mammal eggs
      and sperm are invisible without a microscope. Touches theology (ensoulment).'
  heredity_genetics:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Breeders know like begets like. Counting ratios over generations takes records and several years;
      one season in a garden proves little.
  evolution_natural_selection:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: A breeder can show variation and selection. Species are fixed since Creation; saying otherwise
      before the Dominican and Franciscan inquisitors is a risk.
  dna_structure:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  respiration_metabolism:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: 'Galen: breathing cools the heart''s innate heat and feeds vital spirit. A mouse and a candle
      under a glass both die: easy to show, hard to explain.'
  photosynthesis_plant_nutrition:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Plants are thought to eat the fat of the soil through their roots. A weighed pot experiment takes
      years; the role of air cannot be shown.
  nitrogen_fixation_biology:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: That lupins and beans 'fatten' the soil is read in Palladius and Crescenzi and done by good farmers.
      Why is unknown; the nodules are taken for a disease.
    local:
    - Pier de' Crescenzi's Ruralia commoda (manuscript, c. 1305)
  nervous_system_brain:
    knowledge: 2
    use: partial
    producibility: hard
    acceptance: medium
    note: 'Galen''s view holds: animal spirits flow through hollow nerves; faculties sit in the brain''s
      ventricles. Aristotelians favour the heart. Electrical signalling is unprovable here.'

  # ---- Chemistry
  soap:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Hard olive-oil soap from Venice, the Adriatic coast and Spain is traded; soft lye soap is made
      at home. Used for laundry and wool scouring, not for medicine.
    local:
    - wool scourers of the Arte della Lana
    - apothecaries
  distillation:
    knowledge: 3
    use: correct
    producibility: easy
    acceptance: high
    note: Aqua vitae is made by apothecaries and monasteries as a medicine and is recommended against plague.
      Strength varies; repeated distillation gives spirit that burns.
    local:
    - Taddeo Alderotti's consilia (Bologna, d. 1295)
    - monasteries
    - Arte dei Medici e Speziali
  sulphuric_acid:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: The Latin Geber texts describe distilling vitriol; few alchemists do it, in small weak batches.
      Vitriol and sulphur are local. Glass and clay vessels crack.
    local:
    - alchemists
    - vitriol and sulphur from the Colline Metallifere and Volterra district
  oxygen_combustion:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Fire is an element. Demonstration (candle under a glass over water) is easy, explaining it is
      hard. Isolating the gas needs mercury calx or saltpetre and gas handling.
  nitric_acid:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: high
    note: The recipe is some fifty years old (Latin Geber). Mint and goldsmiths still part gold by salt
      cementation. Saltpetre is scarce and dear; glass and clay retorts break often.
    local:
    - Zecca (mint)
    - goldsmiths of Por Santa Maria
    - alchemists
  saltpetre_production:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Saltpetre is an imported apothecary and alchemist's salt, also scraped from stable and cellar
      walls. Demand is small; guns are a novelty. Nitre beds exist nowhere in Europe.
    local:
    - apothecaries
    - the commune's makers of cannon and powder (first ordered 1326)
    elsewhere:
    - China and India, saltpetre from nitrous earths
  chemical_elements:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: Four elements; metals grow from sulphur and mercury, so transmutation is plausible. Assayers have
      good balances and already rely on weight in practice.
    local:
    - assayers of the Zecca
  atomic_theory:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: low
    note: Atoms are known only through Aristotle's refutation; Lucretius is lost. Atomism threatens the
      doctrine of the Eucharist. Proof by weight ratios needs pure reagents.
    elsewhere:
    - Paris, Nicholas of Autrecourt made to burn his atomist writings (1347)
  molecules_mole_concept:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
  periodic_table:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: Only about a dozen of the elements are known as substances here, and none as elements. A table
      from memory would be unverifiable.
  gas_laws:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Scholastics debate whether air has weight and deny the vacuum. Measuring pressure against volume
      needs a sealed glass tube, much mercury and the idea of air pressure.
  pneumatic_chemistry_gases:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: Different airs are not imagined; fumes are 'spirits' or corrupted air. Miners know choke-damp.
      Bladders, glass flasks, a water trough and vinegar are at hand; strong acids are scarce.
  acids_bases_ph:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Dyers know that lye and stale urine turn orchil purple and sour liquors redden it. No general
      concept of neutralising.
    local:
    - Rucellai (Oricellari) family, orchil dyers
    - dyers (tintori)
  hydrochloric_acid_aqua_regia:
    knowledge: 2
    use: none
    producibility: medium
    acceptance: medium
    note: Aqua fortis sharpened with sal ammoniac to dissolve gold is in the Latin Geber texts; few have
      made it. Spirit of salt by itself is unknown.
    local:
    - goldsmiths
    - alchemists
  alkali_soda:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Soda ash from Syria and Egypt feeds glass and soap; wood-ash lye is in every laundry and dye shop.
      Soda and potash are not told apart.
    elsewhere:
    - Syria and Egypt, plant ash exports through Venice
  lime_burning:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Quicklime is cheap and plentiful from the building trade. Liming graves and cesspits is practicable
      and fits the fear of stench.
    local:
    - lime kilns supplying the cathedral and wall works
  salt_production:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: The commune sells salt under a hated tax (gabella del sale). Brine is boiled at Volterra; sea
      salt comes from coastal pans held by Pisa and Siena.
    local:
    - Volterra salt springs (moie)
    - salt pans of the Pisan coast and the Maremma
  mordant_dyeing:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Dyers use alum with madder, kermes and brazilwood; woad is a vat dye. Alum comes from Phocaea
      through the Genoese, who took Chios and Phocaea in 1346.
    local:
    - Arte della Lana
    - Arte di Calimala
    - Arte di Por Santa Maria (silk)
    - dyers (tintori), subordinate to the wool guild
    elsewhere:
    - Phocaea (Asia Minor), alum
    - Lombardy and the upper Tiber valley, woad
  chlorine_bleach:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
    note: Linen is bleached with lye, sour milk and sun. Chlorine needs spirit of salt, which nobody makes,
      plus the manganese glassmakers use. The gas maims.
  electrolysis:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: 'Needs a battery, and batteries are weak without zinc. Gilders would want plating: it replaces
      deadly mercury gilding.'
  organic_structure_theory:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  phosphorus_matches:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Fire is struck with steel, flint and tinder. Phosphorus from boiled-down urine is foul, slow and
      looks like sorcery.
  rubber_vulcanisation:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
    elsewhere:
    - Mesoamerica, rubber balls and waterproofing
  synthetic_dyes:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
    note: No coal tar and no strong acids in bulk. The wool and Calimala guilds would see cheap purple as
      ruin or as a fortune.
  nitroglycerin_dynamite:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
    note: Concentrated acids cannot be made in quantity; even black powder is a novelty.
  petroleum_refining:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: medium
    note: Rock oil is a rare apothecary's drug; Marco Polo's book tells of the oil spring near Baku. Olive
      oil and tallow light the city.
    local:
    - apothecaries
    elsewhere:
    - Baku, oil spring burnt in lamps
    - Emilian Apennines, small oil seeps
  polymers_plastics:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  ammonia_synthesis:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low

  # ---- Metallurgy & materials
  copper_bronze:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Founders cast bells and, since 1326, a few small cannon. For Andrea Pisano's Baptistery doors
      (1330s) Venetian founders were brought in. Tin comes from Cornwall.
    local:
    - bell founders
    - Baptistery south doors (Andrea Pisano, cast 1330–36)
    - copper and silver mines of Massa Marittima
    elsewhere:
    - Venice, bronze founders
  bloomery_iron:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Elba ore, under Pisan control, is smelted with charcoal in water-powered ironworks on the Maremma
      coast and in the Pistoia hills.
    local:
    - Elba (Rio mines)
    - ironworks of the Maremma and Pistoia mountains
    - Arte dei Fabbri
  steel_heat_treatment:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Armourers and cutlers harden and temper by colour and by secret quenching recipes (urine, radish
      juice). That carbon makes steel is unknown.
    local:
    - Arte dei Corazzai e Spadai (armourers and swordsmiths)
    elsewhere:
    - Milan, the leading armourers
  cementation_steel:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: high
    note: Smiths case-harden files and tools in charcoal, horn and salt. Converting whole bars in sealed
      chests is not done; good steel is bought from Lombardy.
    elsewhere:
    - Brescia and Bergamo valleys, natural steel
    - Styria
  blast_furnace_cast_iron:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
    note: Iron that runs liquid is a spoiled smelt to a Tuscan ironmaster. It needs a taller shaft, stronger
      water-driven bellows and a use for the brittle metal.
    elsewhere:
    - Sweden (Lapphyttan) and the Mark in Westphalia, early blast furnaces
    - China, cast iron for eighteen centuries
  coke_iron:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
    note: No blast furnace and no coking coal in Tuscany; ironworks run on charcoal.
    elsewhere:
    - China, coal in iron smelting since the 11th c.
  puddling_wrought_iron:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
    note: There is no pig iron to convert; the bloomery makes wrought iron directly.
  crucible_steel:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: high
    note: Watered 'Damascus' blades reach Italy through Venice and are admired; how they are made is a mystery.
      Local crucibles and furnaces fail below the heat needed.
    elsewhere:
    - India and Persia, crucible steel ingots
  bessemer_steel:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  open_hearth_steel:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  alloy_stainless_steel:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
    note: Chromium, nickel, tungsten and manganese are unknown as metals.
  refractories_fireclay:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: high
    note: Glassmakers and goldsmiths make their own pots and crucibles from selected clays; these limit
      furnace heat. Finding a good fireclay is a prospecting job.
    local:
    - glass furnaces of the Valdelsa
    - potters of Impruneta and Montelupo
  zinc_brass:
    knowledge: 3
    use: partial
    producibility: hard
    acceptance: high
    note: Brass is made by heating copper with calamine and mostly imported as sheet, wire and basins. Nobody
      knows calamine holds a metal; zinc boils away unless condensed.
    elsewhere:
    - Dinant and the Meuse valley, brass goods
    - Zawar in India, metallic zinc
  cupellation_assaying:
    knowledge: 3
    use: correct
    producibility: easy
    acceptance: high
    note: The mint guards the florin's fineness by touchstone, cupellation and salt cementation; Pegolotti's
      handbook gives the recipes. The most quantitative craft in the city.
    local:
    - Zecca (mint)
    - goldsmiths, members of the Arte di Por Santa Maria
    - silver-lead mines of the Colline Metallifere
  mercury_amalgam:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Goldsmiths fire-gild with gold amalgam and breathe the fumes. Mercury is not used to win silver
      from ore. Quicksilver ointments treat skin diseases and lice.
    local:
    - goldsmiths and gilders
    - apothecaries (mercury)
    - cinnabar of Monte Amiata
    elsewhere:
    - Almadén (Spain)
  lead_hazard:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: low
    note: Avicenna describes colic from litharge, but no one applies it. Lead white is face paint and pigment;
      lead glazes, pewter and lead-sweetened wine are everyday. Vitruvius is barely read.
    local:
    - potters
    - painters' workshops
    - apothecaries (biacca)
  soldering_tinning:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Goldsmiths, plumbers and coppersmiths solder, braze with borax and tin copper pots. Tinned iron
      sheet is a rare German import.
  fired_brick_ceramics:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Brick, roof tile and terracotta are a major local industry. Tableware is 'archaic maiolica', tin-glazed
      and painted in green and brown.
    local:
    - Impruneta (brick, tile, terracotta)
    - potters of Montelupo and Bacchereto
  porcelain:
    knowledge: 1
    use: none
    producibility: very-hard
    acceptance: high
    note: Marco Polo's book mentions it and a few pieces reach Italy as treasures. Nobody knows the clay,
      the stone or the kiln heat.
    elsewhere:
    - Jingdezhen (China), blue-and-white under the Yuan
  glassmaking:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Tuscan glassmakers come from the Valdelsa and make beakers, flasks, urine glasses and apothecary
      ware. Fine work is bought from Murano.
    local:
    - glassmakers (bicchierai) of Gambassi and Montaione
    - Florentine glass shops
    elsewhere:
    - Murano
  clear_glass:
    knowledge: 2
    use: partial
    producibility: hard
    acceptance: high
    note: Cristallo does not exist yet. Glass is greenish or decolourised with manganese; spectacle lenses
      are ground from the clearest glass or rock crystal. Purifying soda ash is the missing step.
    local:
    - spectacle makers of Florence and Pisa
    elsewhere:
    - Venice, guild rules on spectacle lenses and rock-crystal workers
  glass_mirrors:
    knowledge: 2
    use: partial
    producibility: hard
    acceptance: high
    note: Mirrors are polished metal or small convex glass backed with lead. Flat, clear, evenly backed
      plates are beyond any glasshouse.
    elsewhere:
    - Germany and Venice, small convex glass mirrors
  hydraulic_cement:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Masons line cisterns and found bridge piers with lime and crushed brick. Vitruvius on pozzolana
      survives in rare manuscripts. Burning true cement clinker is hard.
    local:
    - builders of the new Ponte Vecchio (1345)
    - Opera del Duomo (campanile works)
    elsewhere:
    - Bay of Naples and Lazio, pozzolana
  reinforced_concrete:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Iron tie rods across vaults and arches are familiar. Iron is hand-forged and dear; Roman-style
      concrete without iron is the realistic step.
  paper:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Rag paper serves merchants' ledgers, letters and notaries; books of standing are on parchment.
      Every copy is written by hand. Rags are the bottleneck.
    local:
    - Fabriano (watermarked paper)
    - paper mills of Colle di Val d'Elsa
    - cartolai (stationers) of Florence
  textile_fibres:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Villani counts over 200 wool workshops feeding some 30,000 people, working fine English wool.
      Raw wool, cloth and rags move through every quarter of the city.
    local:
    - Arte della Lana
    - Arte di Calimala (finishing of imported cloth)
    - fulling mills on the Arno
    elsewhere:
    - England, the best wool
    - Flanders, rival cloth towns
  leather_tanning:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Tanners work by the Arno with oak bark, myrtle and sumac; alum-tawed white leather too. A stinking
      trade, blamed for corrupting the air in plague time.
    local:
    - tanners by the Arno
    - Arte dei Cuoiai e Galigai
  aluminium:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
    note: Alum is traded by the shipload, but nobody suspects a metal in it.
  wood_tar_pitch:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Pitch seals casks, roofs and boats; Pisa and Genoa use it for galleys. Burning pitch and resin
      is a trusted way to cleanse plague air.
    local:
    - Casentino and Apennine forests
    - Maremma woods

  # ---- Physics, optics & astronomy
  lenses:
    knowledge: 3
    use: correct
    producibility: easy
    acceptance: high
    note: Only convex lenses, ground from rock crystal, beryl or greenish glass full of bubbles. Concave
      lenses and clear cristallo glass do not exist.
    local:
    - spectacle makers (the craft began in Pisa or Florence c. 1286; no named Florentine workshop is documented
      for 1347)
    - glassmakers of Gambassi and the Valdelsa
    elsewhere:
    - Venice, rock-crystal workers (cristallieri) with guild rules on reading glasses since 1300-1301
    - Murano glassmakers
  spectacles:
    knowledge: 3
    use: correct
    producibility: easy
    acceptance: high
    note: 'About sixty years old and still a marvel: riveted pairs with convex lenses for ageing readers
      only. Nothing helps the short-sighted.'
    local:
    - Dominicans of Santa Maria Novella (Giordano da Pisa praised the invention there in 1306)
    - convent of Santa Caterina in Pisa (friar Alessandro della Spina made them, died 1313)
    elsewhere:
    - Venice, cristallieri
  refraction_optics:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Perspectiva (Alhazen, Witelo, Pecham, Bacon) is read in the friars' schools; no sine law. The
      crystalline humour is held to be the seat of vision.
    local:
    - convent schools of Santa Maria Novella and Santa Croce
    elsewhere:
    - Paris and Oxford arts faculties
    - papal court at Avignon
  camera_obscura:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: high
    note: Known from Alhazen and Pecham as a way to watch solar eclipses through a small hole. Nobody uses
      a lens in the hole or draws with it.
    elsewhere:
    - Provence, Levi ben Gerson (died 1344) observed with a dark chamber
    - Paris astronomers
  microscope:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: A fused glass bead held in a pierced plate magnifies strongly; spectacle lenses are too weak.
      Common glass is tinted but a tiny bead is clear enough.
    local:
    - glassmakers of Gambassi and the Valdelsa
  telescope:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: high
    note: No concave lenses exist. Two convex lenses give an inverted image; the strong eyepiece must be
      ground specially and the glass is streaky.
    local:
    - lens grinders
  reflecting_telescope:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
    note: Bell founders know hard high-tin bronze and burning mirrors are described in perspectiva texts.
      Nobody can figure a mirror accurately.
    local:
    - bell founders
  achromatic_lens:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  spectrum_colour:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: medium
    note: Colours are light mixed with darkness (Aristotle). A physician's water-filled urine flask shows
      the rainbow as Theodoric of Freiberg did; six-sided rock crystals throw colours.
    local:
    - physicians' urine flasks
    - Dominican friars (Theodoric of Freiberg's order)
  spectroscopy:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
  wave_nature_light_sound:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Boethius teaches sound as struck air spreading like ripples from a stone in water; string ratios
      are taught as musica. Light as a wave is unknown.
    local:
    - organ builders
    - lute makers
    elsewhere:
    - Paris, Jean de Murs writes on musical proportion
  speed_of_light:
    knowledge: 2
    use: none
    producibility: very-hard
    acceptance: low
    note: Aristotle treats illumination as instantaneous; Alhazen and Bacon argue that light takes time.
      No experiment within reach could decide it.
  photography:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: Aqua fortis to dissolve silver is a rarity of a few alchemists. An image made by light alone smells
      of sorcery.
  lever_mechanics_statics:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Builders work by rule of thumb; the steelyard is everywhere. Jordanus' science of weights and
      Moerbeke's Archimedes sit in Latin manuscripts no craftsman reads.
    local:
    - Opera del Duomo (campanile works)
    - merchants' steelyards
  buoyancy_hydrostatics:
    knowledge: 2
    use: none
    producibility: easy
    acceptance: high
    note: The crown story is known from a Latin poem on weights; Moerbeke's translation of On Floating Bodies
      (1269) is very rare. The mint assays by touchstone and fire.
    local:
    - the Zecca (mint of the gold florin)
    - goldsmiths
  falling_bodies:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: low
    note: 'Aristotle: heavier falls faster, in proportion. Bradwardine''s rule (1328) and Heytesbury''s
      mean-speed theorem (1335) are new Oxford arguments, barely known in Italy and never tested.'
    elsewhere:
    - Oxford, Merton College (Heytesbury, Dumbleton, Swineshead)
    - Paris, Jean Buridan
  laws_of_motion:
    knowledge: 1
    use: none
    producibility: medium
    acceptance: low
    note: 'Italian schools follow Aristotle and Averroes: the air pushes a thrown stone on. Buridan is teaching
      impetus in Paris right now. Rest is the natural state.'
    elsewhere:
    - Paris, Jean Buridan lectures on impetus
  universal_gravitation:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: Heavy things seek the centre of the world, which is the Earth's centre. A force acting across
      empty space sounds like astrology or magic.
  strength_of_materials:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: high
    note: Masons trust proportion rules and precedent. The new cathedral and bell tower are being built
      without calculation; breaking test beams and cords is cheap.
    local:
    - Opera del Duomo
  sundial_water_clock:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: The day runs by bells for the canonical hours, which stretch and shrink with the season. Equal
      hours belong to astronomers; dials have no pole-pointing gnomon.
    local:
    - bell of the Badia (rings terce and nones)
    - sundials on churches
  mechanical_clock:
    knowledge: 2
    use: partial
    producibility: hard
    acceptance: high
    note: Florence has no public clock (first in 1353). Weight-driven striking clocks in Milan and Padua
      are admired novelties; a smith needs the verge escapement explained.
    local:
    - smiths and bell founders
    - tower of the Palazzo dei Priori (no clock yet)
    elsewhere:
    - Padua, Jacopo Dondi's tower clock (1344)
    - Milan, striking clock of San Gottardo (1336)
    - St Albans, Richard of Wallingford's astronomical clock
  pendulum_clock:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: high
    note: Needs a working verge clock first, and no clockmaker lives in the city. A pendulum on a tower
      clock would outdo every clock in Europe.
  atmospheric_pressure:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: Nature abhors a vacuum, though since 1277 Paris masters allow that God could make one. Needs a
      yard-long sealed glass tube and mercury.
    local:
    - apothecaries (quicksilver)
    - glassmakers of Gambassi
    - cinnabar mines of Monte Amiata
    elsewhere:
    - Almaden (Spain) mercury mines
    - Murano glassmakers
  air_pump_vacuum:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: No piston pumps exist to start from; only clyster syringes. A fitted bronze barrel with valves
      and thick glass vessels are all new work.
  thermometer_temperature:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: Physicians judge fever by touch and pulse; Galenic pharmacy counts four degrees of hot and cold.
      An open air-and-water thermoscope is easy, a sealed spirit tube harder.
    local:
    - glassmakers of Gambassi
    - apothecaries (aqua vitae)
  latent_specific_heat:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: Heat and cold are qualities, not quantities. Needs a thermometer first.
  heat_energy_conservation:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Heat is the element fire. Perpetual-motion wheels are taken seriously (Villard de Honnecourt's
      drawing, Peregrinus' magnet wheel).
  weather_instruments:
    knowledge: 1
    use: none
    producibility: medium
    acceptance: medium
    note: Weather is foretold from stars, almanacs and country signs. Weathercocks show wind; nobody measures
      humidity, rain or wind strength.
    elsewhere:
    - Oxford, William Merle's daily weather record (1337-1344)
    - China, rain and snow gauges
  round_earth_size:
    knowledge: 4
    use: partial
    producibility: easy
    acceptance: high
    note: Every educated Florentine knows the sphere from Sacrobosco and Dante. The size follows Alfraganus
      (20,400 miles); Ptolemy's Geography is unknown in Latin.
    local:
    - Dante's Commedia and Convivio
    - Restoro d'Arezzo's vernacular Composizione del mondo (1282)
  seasons_axial_tilt:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Taught correctly as the obliquity of the Sun's path (Sacrobosco), but with the Sun circling a
      fixed Earth.
  eclipse_prediction:
    knowledge: 3
    use: correct
    producibility: medium
    acceptance: high
    note: Causes are understood. Predictions from the Toledan Tables or the new Alfonsine Tables can be
      off by an hour or more; astrologers compute them.
    local:
    - Paolo dell'Abbaco
    - astrologers
    elsewhere:
    - Paris, John of Saxony and Jean de Murs (Alfonsine Tables)
    - Oxford, Merton astronomers
  heliocentrism:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Unheard of; schoolmen at most debate whether the Earth could turn daily. The Inquisition burned
      the astrologer Cecco d'Ascoli in Florence in 1327.
    local:
    - Franciscan inquisitor at Santa Croce
  keplers_laws:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
  astronomical_distances:
    knowledge: 2
    use: partial
    producibility: hard
    acceptance: low
    note: 'Alfraganus'' figures, quoted by Dante: the Moon''s distance is fairly right, the Sun''s about
      twenty times too small. The stars sit on one sphere beyond Saturn.'
  comets_orbits:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: low
    note: Comets are fiery vapours below the Moon and omens of deaths and wars. Villani's chronicle records
      them with the calamities that followed.
    local:
    - Giovanni Villani's chronicle
    elsewhere:
    - China, systematic comet records
  tides:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: The link to the Moon is accepted and explained astrologically. Tuscan tides are too small to matter;
      Venice and the Atlantic ports care.
    elsewhere:
    - Venice
    - Bruges and the Atlantic ports
    - London Bridge tide table
  terrestrial_magnetism:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: The needle is thought to seek the Pole Star or lodestone mountains. Peregrinus' letter on the
      magnet (1269) circulates; declination is unknown in Europe.
    local:
    - Elba lodestone (the island is Pisan)
    - Pisan and Genoese pilots
    elsewhere:
    - China, declination recorded since Shen Kuo (1088)
  deep_time_geology:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: low
    note: The world is some 6,500 years old. Restoro d'Arezzo described shells on Tuscan hills and credited
      the Flood; giant bones are taken for giants.
    local:
    - shell beds and fossil bones of the upper Valdarno
  plate_tectonics:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
  stars_galaxies_cosmology:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: The stars are lights on one sphere, as in Dante's Paradiso. Since 1277 Paris allows that God could
      make other worlds, but nobody says he did.
  xrays:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  radioactivity:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  atomic_structure:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  quantum_mechanics:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  relativity:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  nuclear_fission:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low

  # ---- Electricity & electronics
  static_electricity:
    knowledge: 2
    use: none
    producibility: medium
    acceptance: medium
    note: Rubbed amber and jet drawing chaff is a curiosity from Pliny and Albertus Magnus, lumped with
      the lodestone. Sulphur, glass, silk and beaten gold are on sale.
    local:
    - apothecaries (sulphur)
    - makers of amber rosary beads
    - goldbeaters
  lightning_rod:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Lightning is God's sign or the work of demons in the air; church bells are rung against storms.
      A rod on a tower is cheap but suspicious.
    local:
    - tower of the Palazzo dei Priori
    - the unfinished campanile
  electric_battery:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: Metallic zinc is unknown in Europe (only calamine, for brass). Copper-iron or silver-iron piles
      in brine or vinegar work, but weakly.
    local:
    - coppersmiths
    - goldsmiths
    elsewhere:
    - India (Zawar), zinc smelting
  practical_batteries:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
    note: Blue vitriol, lead and unglazed pots are available; zinc is not, and oil of vitriol is a rarity
      of alchemists.
  electromagnetism:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Compass needles are at hand in Pisa. Copper wire must be drawn and silk-wrapped by hand, and zincless
      cells give little current.
    local:
    - goldsmiths (wire drawing)
    - silk workers
  ohms_law_circuits:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
  electric_telegraph:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: high
  submarine_cable:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  dynamo_electric_motor:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
  electric_light:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: high
  alternating_current_grid:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  telephone:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
  sound_recording:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: A tinfoil phonograph is purely mechanical, but nobody here cuts a true metal screw. A machine
      that speaks invites talk of demons.
  electromagnetic_waves_radio:
