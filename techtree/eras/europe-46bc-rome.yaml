    note: 'Soldiers follow the commander who pays and settles them: Sulla, Pompey, Caesar. Everyone sees
      the problem. The remedy on offer is one man holding every army.'
  conscription_mass_army:
    knowledge: 4
    use: partial
    producibility: easy
    acceptance: low
    note: The levy is in force and was used hard in the civil war; otherwise poor volunteers and provincials
      fill the ranks. Italians hate it.
  military_camp_hygiene:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Camps follow a fixed plan with latrines and a chosen water supply; the wounded are tended in tents
      or lodged in towns. No hospitals, no medical corps.
  military_engineering_roads_bridges:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Caesar's timber bridge over the Rhine in ten days (55 BC, again 53 BC). Legionaries build roads,
      bridges and siege works under the praefecti fabrum.
  strategy_theory:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Polybius, Xenophon and Greek tactical handbooks are read; Caesar's commentaries on the Gallic
      war circulate. Generals learn on a kinsman's staff.
    elsewhere:
    - China, Sunzi's Art of War
  general_staff_war_college:
    knowledge: 0
