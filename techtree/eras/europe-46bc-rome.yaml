  # ---- Metallurgy & materials
  copper_bronze:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Copper from Cyprus, Spain and Etruria, tin from Spain and beyond Gaul. Lost-wax statues, vessels,
      fittings and water valves are routine work.
    local:
    - bronze workshops of Capua
    - Etruscan bronze founders
  bloomery_iron:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Elba ore is smelted in bloomeries at Populonia; smiths forge blooms into tools and weapons. Iron
      is never melted and stays dearer than a modern person expects.
    local:
    - Populonia and Elba
    - Puteoli (iron working and trade)
  steel_heat_treatment:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Smiths quench and judge by eye and file; results vary from blade to blade. Deliberate tempering
      by colour and the role of carbon are unknown.
    elsewhere:
    - Noricum, steel of the Magdalensberg region
    - Spain, Celtiberian sword smiths
  cementation_steel:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: high
    note: Good steel comes from good ore (Noricum, Spain), not from a process. Smiths harden edges in charcoal
      without knowing why. Packing bars in charcoal in sealed clay boxes is new.
    elsewhere:
    - kingdom of Noricum (allied, trading through Aquileia)
  blast_furnace_cast_iron:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Iron that runs liquid is unknown and would be called spoiled. Needs a tall shaft, continuous strong
      blast and refractory lining; water-driven bellows do not exist.
    elsewhere:
    - Han China, state ironworks casting iron tools
  coke_iron:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: Needs the blast furnace first. Italy has charcoal and almost no coal.
  puddling_wrought_iron:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    elsewhere:
    - Han China, 'stir-frying' cast iron into wrought iron
  crucible_steel:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Needs crucibles and a furnace that hold steel-melting heat for hours; Roman crucibles are for
      bronze and silver.
    elsewhere:
    - South India and Sri Lanka, crucible steel
  bessemer_steel:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  open_hearth_steel:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  alloy_stainless_steel:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  refractories_fireclay:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: medium
    note: Bronze founders, glassworkers and potters make crucibles and kiln linings from tempered clay,
      good to bronze and glass heat. Clays for steel heat must be found by trial.
  zinc_brass:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: high
    note: Brass (orichalcum) is made in Asia Minor by heating copper with calamine and is prized. Caesar's
      prefect Clovius strikes brass coins in 45 BC. Metallic zinc is unknown.
    elsewhere:
    - Asia Minor (Phrygia, Bithynia), cementation brass
  cupellation_assaying:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Silver is cupelled from lead ore in the Spanish mines; gold is parted from silver with salt; the
      touchstone tests purity. Lead is the cheap by-product that fills Rome's pipes.
    local:
    - mint at the temple of Juno Moneta
    - Spanish silver mines near Carthago Nova
  mercury_amalgam:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Cinnabar from Sisapo in Spain is the costly red pigment, and quicksilver is roasted from it. Gilders
      lay gold leaf, and quicksilver serves to gild bronze. Fumes are not feared.
    elsewhere:
    - Sisapo (Almaden), Spain
  lead_hazard:
    knowledge: 2
    use: wrong
    producibility: easy
    acceptance: low
    note: 'Nicander''s poem describes white-lead poisoning, yet lead is everywhere: pipes, pans, cosmetics.
      Cato has must boiled to syrup ''in a copper or lead vessel''. The syrup sweetens and preserves wine.'
    local:
    - plumbarii (lead-pipe makers)
    - Cato, De agri cultura 105 and 107
    - wine growers and merchants
  soldering_tinning:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Tin-lead solder joins lead pipes and bronze vessels; goldsmiths braze. Tinning copper cookware
      is uncommon here.
  fired_brick_ceramics:
    knowledge: 4
    use: partial
    producibility: easy
    acceptance: high
    note: Roof tiles, amphorae and storage jars are fired by the million, and Arretium has just begun its
      red-gloss tableware. Walls are tufa, rubble concrete and sun-dried brick, not fired brick.
    local:
    - potteries of Arretium
  porcelain:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
    note: No known kaolin source and no kiln reaching 1300 degrees. Fine tableware is silver, glass or red-gloss
      pottery.
    elsewhere:
    - Han China, high-fired glazed stoneware (true porcelain comes later)
  glassmaking:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: 'Glass is a luxury: core-formed flasks and cast or slumped bowls, mostly eastern imports. Blowing
      is just being tried on the Syro-Palestinian coast. An iron tube is the missing tool.'
    local:
    - imported Hellenistic cast bowls and mosaic glass
    - eastern traders at Puteoli
    elsewhere:
    - Syro-Palestinian coast and Jerusalem, first blown glass
    - Alexandria, luxury cast and mosaic glass
  clear_glass:
    knowledge: 3
    use: partial
    producibility: hard
    acceptance: high
    note: Colourless glass decolourised with antimony exists as cast luxury bowls, thick and seedy. Clear,
      bubble-free glass fit for lenses needs better furnaces, purer sand and stirring.
    elsewhere:
    - eastern Mediterranean glasshouses
  glass_mirrors:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: high
    note: Mirrors are polished bronze or silver and a profitable trade. Glass mirrors need thin blown glass
      first; tin, lead and mercury for the backing are available.
  hydraulic_cement:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Lime with volcanic ash from Puteoli (pozzolana) sets under water and is standard for vaults, foundations
      and harbour moles. Portland cement would add little except early strength.
    local:
    - Puteoli (pulvis Puteolanus)
    - Theatre of Pompey (concrete vaults, 55 BC)
    - Caesar's builders at the Forum Iulium
  reinforced_concrete:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Builders trust mass and the arch; concrete in tension is not a concept. Hand-forged iron bar by
      the ton is ruinously dear and rusts in lime-ash concrete.
  paper:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: Writing is on papyrus from Egypt, wax tablets and some parchment. Linen rags, hemp rope, mortars
      and screens exist. Papyrus is adequate and its importers will not welcome a rival.
    local:
    - papyrus dealers and booksellers
    - Atticus' copying slaves
    elsewhere:
    - Egypt, papyrus making in the Nile Delta
    - Han China, coarse hemp paper used for wrapping
  textile_fibres:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Wool and linen are spun by hand and woven on upright looms, largely in the household. Cotton and
      silk arrive as rare cloth from the East.
    elsewhere:
    - India, cotton
    - Cos, wild silk
    - China, silk reaching Rome through Parthia
  leather_tanning:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Vegetable tanning with oak bark and galls, alum tawing for fine skins. The army consumes huge
      quantities for tents, shields and boots; tanners work across the Tiber.
    local:
    - tanners in Transtiberim
  aluminium:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  wood_tar_pitch:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Pitch from the Sila forest in Bruttium, let to contractors by the state, seals ships, wine jars
      and roofs and is used in medicine.
    local:
    - Sila forest pitch works, Bruttium

  # ---- Physics, optics & astronomy
  lenses:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: Burning crystals are a known curiosity (Aristophanes). Gem cutters polish rock crystal; glass
      is cast or core-formed, tinted and bubbly. Nobody grinds a lens to see with.
    local:
    - gem engravers and rock-crystal workers
    - Alpine rock crystal
  spectacles:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: The rich have slaves read aloud and take dictation, which blunts demand. A gem cutter can grind
      convex lenses from rock crystal; clear glass is the bottleneck.
  refraction_optics:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: 'Euclid''s Optics: rays leave the eye. Epicureans (Lucretius, book 4) say thin films fly off things
      into it. The bent oar is a stock puzzle; no angles are measured.'
    local:
    - Lucretius, De rerum natura (book 4)
    - Euclid's Optics in Greek
  camera_obscura:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: medium
    note: The Aristotelian Problems note crescent suns under trees during an eclipse. A dark room with a
      small hole is an afternoon's work; nobody has made one.
  microscope:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: A fused bead of very clear glass magnifies strongly, but glass here is tinted and bubbly and rock
      crystal cannot be fused. Physicians would scoff until shown.
  telescope:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: high
    note: Needs two well-ground lenses of clear material; small rock-crystal ones are possible. No concave
      lens exists anywhere. Generals, ship captains and astronomers would pay.
  reflecting_telescope:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
    note: High-tin bronze mirrors polish brightly, but an accurately figured concave mirror plus an eyepiece
      lens is beyond any workshop.
  achromatic_lens:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  spectrum_colour:
    knowledge: 1
    use: none
    producibility: medium
    acceptance: low
    note: 'Aristotle: colours are mixtures of light and dark, the rainbow a reflection from cloud. A natural
      six-sided rock crystal serves as a prism.'
  spectroscopy:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
  wave_nature_light_sound:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Pythagorean string ratios are school knowledge; Stoics compare sound to ripples in a pond. Light
      as a wave is unheard of.
  speed_of_light:
    knowledge: 1
    use: none
    producibility: very-hard
    acceptance: low
    note: Empedocles said light takes time, Aristotle denied it. No measurement is possible without a telescope
      and a good clock.
  photography:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: No mineral acids exist to dissolve silver.
  lever_mechanics_statics:
    knowledge: 3
    use: correct
    producibility: easy
    acceptance: high
    note: Archimedes' law of the lever is in Greek books; builders, artillerymen and steelyard makers work
      by rule and experience. Architects and military engineers are the audience.
    local:
    - steelyards (staterae) in every market
    - building contractors (redemptores)
    - Caesar's military engineers (fabri)
  buoyancy_hydrostatics:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Archimedes' On Floating Bodies exists in Greek, read by few. Shipwrights load by experience; nobody
      assays coin or bullion by weighing in water.
    local:
    - mint at the temple of Juno Moneta
    - money-changers (nummularii) who test coin by touch and sound
  falling_bodies:
    knowledge: 1
    use: wrong
    producibility: easy
    acceptance: low
    note: 'Aristotle: heavier falls faster. Lucretius (book 2) says all bodies would fall equally fast in
      a void, air and water alone slowing them. Nobody drops two weights to see.'
    local:
    - Lucretius, De rerum natura (book 2)
  laws_of_motion:
    knowledge: 1
    use: wrong
    producibility: medium
    acceptance: low
    note: 'Aristotle: motion needs a mover, the air pushes a thrown stone on. Epicurean atoms move forever
      through the void, a bridge to inertia.'
  universal_gravitation:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: Heavy things seek the centre of the cosmos (Aristotle, Stoics). Needs laws of motion, elliptical
      orbits and algebra first.
  strength_of_materials:
    knowledge: 1
    use: partial
    producibility: medium
    acceptance: medium
    note: Beams, arches and the new concrete vaults are sized by rule and experience. Catapult makers scale
      every part from the spring-hole diameter by Philo's formula.
    local:
    - Caesar's artillery engineers
  sundial_water_clock:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Hours are twelfths of daylight, long in summer, short in winter. Courts time speeches by water
      clock. Rome's first public dial, booty from Catania, ran wrong for 99 years.
    local:
    - sundials by the Rostra in the Forum (Marcius Philippus' corrected dial, 164 BC)
    - public water clock set up by Scipio Nasica (159 BC)
    elsewhere:
    - 'Athens: Tower of the Winds of Andronicus of Cyrrhus, sundials and a water clock'
    - 'Alexandria: Ctesibius'' regulated water clock (c. 270 BC)'
  mechanical_clock:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Bronze gear trains exist in Greek planetary devices, but no escapement. Equal hours clash with
      the seasonal hours everyone lives by.
  pendulum_clock:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
    note: Needs a working escapement clock first. A bare pendulum for counting short times is easy and would
      serve physicians and astronomers.
  atmospheric_pressure:
    knowledge: 1
    use: wrong
    producibility: hard
    acceptance: low
    note: 'Aristotelians deny any void; Epicureans and Strato''s followers accept it. Mercury is at hand
      (Spanish cinnabar), but nobody can make a yard-long glass tube: glassblowing is only beginning in
      Syria.'
    elsewhere:
    - 'Syria-Palestine: first blown glass tubes and bottles (c. 50 BC)'
  air_pump_vacuum:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: Ctesibian bronze pump cylinders are the starting point; leather seals, tight valves and a transparent
      vessel are the obstacles.
  thermometer_temperature:
    knowledge: 1
    use: none
    producibility: medium
    acceptance: medium
    note: Philo of Byzantium's book shows air swelling when warmed, with a lead globe and a bent tube dipping
      in water. A sealed, graduated glass tube cannot be made.
  latent_specific_heat:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
  heat_energy_conservation:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: Hot is one of four qualities or a fine fiery stuff. Atomists (Lucretius) speak of small fast particles,
      a partial bridge.
  weather_instruments:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: Weather is read from star risings on peg calendars (parapegmata), birds and sky signs, as in Aratus.
      Rain gauge and wind vane are easy, a barometer is not.
    local:
    - Cicero's Latin Aratus (Aratea)
    - farmers' and sailors' star calendars
    elsewhere:
    - 'Athens: Tower of the Winds with a bronze Triton wind vane'
  round_earth_size:
    knowledge: 3
    use: correct
    producibility: easy
    acceptance: high
    note: Educated Romans accept a globe with climate zones (Cicero's Dream of Scipio). Eratosthenes' 252,000
      stadia competes with smaller figures from Posidonius. Nobody has sailed around it.
    local:
    - Cicero, De re publica (book 6)
    elsewhere:
    - 'Alexandria: Eratosthenes'' Geography and measurement (c. 240 BC)'
    - 'Rhodes: school of Posidonius (died c. 51 BC)'
  seasons_axial_tilt:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Greek astronomy explains seasons by the Sun's tilted yearly circle around a resting Earth, obliquity
      about 24 degrees (Eratosthenes). A tilted, moving Earth is the new part.
  eclipse_prediction:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: 'The educated know the cause: Gallus explained the lunar eclipse before Pydna (168 BC). For soldiers
      and plebs it is a prodigy. Prediction by cycles is Babylonian and Greek work.'
    elsewhere:
    - 'Babylon: astronomical diaries and saros-cycle prediction'
    - 'Rhodes and Alexandria: Hipparchus'' lunar theory'
  heliocentrism:
    knowledge: 2
    use: none
    producibility: medium
    acceptance: low
    note: 'Aristarchus'' hypothesis is known through Archimedes'' Sand-Reckoner and rejected: no star shift
      is seen, and Cleanthes the Stoic called it impious. Only Seleucus defended it.'
    local:
    - Greek copies of Archimedes' Sand-Reckoner
  keplers_laws:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: Apollonius' Conics describes the ellipse, but no planetary positions are accurate enough to need
      it; circles on circles suffice.
  astronomical_distances:
    knowledge: 2
    use: partial
    producibility: hard
    acceptance: medium
    note: 'Aristarchus: Sun about 19 times farther than the Moon (far too near). Hipparchus: Moon about
      60 Earth radii, nearly right. Stars sit on one sphere.'
  comets_orbits:
    knowledge: 1
    use: wrong
    producibility: very-hard
    acceptance: low
    note: 'Aristotle: comets are fires in the upper air. Romans see omens; the comet at Octavian''s games
      for Caesar''s victories in July 44 BC will be read as his soul.'
  tides:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Posidonius, observing at Gades, tied daily, monthly and yearly tides to the Moon and Sun. Caesar
      lost ships to a full-moon tide in Britain in 55 BC.
    local:
    - Lucius Cornelius Balbus, Caesar's agent, a native of Gades
  terrestrial_magnetism:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: That lodestone draws iron is well known (Lucretius, book 6); that it points north is not. Needs
      the compass first.
  deep_time_geology:
    knowledge: 1
    use: none
    producibility: medium
    acceptance: medium
    note: Seashells found inland are taken as proof of former seas (Xenophanes, Eratosthenes). Aristotle's
      world is eternal, the Stoics' burns and returns; no scripture fixes an age.
  plate_tectonics:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
  stars_galaxies_cosmology:
    knowledge: 1
    use: none
    producibility: very-hard
    acceptance: low
    note: Epicureans (Lucretius) teach infinitely many worlds; Democritus made the Milky Way a crowd of
      faint stars. Stoics and Aristotelians keep one finite cosmos.
  xrays:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  radioactivity:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  atomic_structure:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  quantum_mechanics:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  relativity:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  nuclear_fission:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low

  # ---- Electricity & electronics
  static_electricity:
    knowledge: 2
    use: none
    producibility: medium
    acceptance: medium
    note: Rubbed amber drawing chaff is a curiosity classed with the lodestone. Amber, sulphur, wool, fur
      and gold leaf are on sale; glass vessels are small and thick.
  lightning_rod:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Lightning is Jupiter's sign. Augurs and Etruscan haruspices interpret every strike, and struck
      ground is fenced off as sacred (bidental). A rod trespasses on their office.
    local:
    - college of augurs
    - Etruscan haruspices with their lightning books
  electric_battery:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: No metallic zinc; brass is made with calamine ore. Copper-iron or silver-iron piles in vinegar
      or brine work weakly, and nobody sees a use.
  practical_batteries:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
  electromagnetism:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: 'No compass needle, no drawn wire, only weak zincless cells: every part must be invented first.'
