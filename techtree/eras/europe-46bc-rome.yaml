  security_dilemma_arms_race:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Thucydides is read. Romans frame each war as defence of allies; Carthage was destroyed on that
      logic. Parthia since Carrhae is the one feared equal.
  deterrence:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: 'Rome relies on certain retaliation and remembered sacks (Carthage, Corinth). Carrhae broke the
      spell in the East: Crassus'' eagles are in Parthian hands; Caesar will prepare war for 44 BC.'
  balance_of_power:
    knowledge: 2
    use: none
    producibility: medium
    acceptance: low
    note: Polybius praised Hiero for not letting one power grow too great. Rome has since removed every
      counterweight but Parthia; at home the balance died with Crassus and Julia.
