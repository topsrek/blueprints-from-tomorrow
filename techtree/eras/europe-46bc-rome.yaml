# Blueprints from Tomorrow – era file: Rome, autumn 46 BC.
#
# Status of each entry from techtree/core/*.yaml in this era and region.
#   knowledge      0 unknown · 1 idea/rumour · 2 described in theory · 3 used by
#                  specialists · 4 widespread
#   use            none | wrong | partial | correct   (is it used, and used right?)
#   producibility  easy | medium | hard | very-hard | impossible  (with local means,
#                  if someone explains it well)
#   acceptance     low | medium | high  (how readily people adopt it)
#   note           what the player should know / what the world believes
#   local          people, places, materials to connect to
#   elsewhere      where it already exists in 46 BC (quest material)
# Entries not listed default to knowledge 0, use none.

era: europe-46bc-rome
title: Rome 46 BC
region: City of Rome, Italy, Roman Republic
year: 46 BC
core_version: 2

worldview: >
  Rome is a city of perhaps 700,000 to a million people and the capital of the
  Mediterranean, ruled in fact by one man: Caesar, dictator for ten years, back from
  the civil war in Africa. The Republic's forms survive, the Senate, the assemblies,
  the magistrates, and everyone wonders for how long. The gods are part of the
  state: augurs and haruspices read birds and entrails before public business, and
  prodigies are expiated. Educated Romans read Greek and choose among Stoics,
  Epicureans (who teach atoms and natural causes) and Academic sceptics, without
  experiment as a method. Medicine is Greek and practised mostly by Greek freedmen
  and slaves; disease comes from bad air, imbalance or the gods. Engineering is
  superb and empirical: aqueducts, sewers, roads, concrete, cranes. Labour is cheap
  because much of it is enslaved, so nobody looks for machines to save it. Numbers
  are Roman numerals, reckoned on the counting board; books are papyrus rolls copied
  by hand.

status:
  # ---- Medicine & hygiene
  contagion_theory:
    knowledge: 1
    use: none
    producibility: medium
    acceptance: low
    note: Fevers come from marsh air, epidemics from gods. Lucretius writes of seeds of disease in the
      air; Varro will write (37 BC) of invisible marsh creatures. Nobody acts on it.
    local:
    - Marcus Terentius Varro
    - Lucretius, De rerum natura, book 6
  bloodletting_harm:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: medium
    note: Greek physicians bleed, purge and give emetics. The fashionable school of Asclepiades prefers
      diet, wine, baths and massage, but still bleeds. Old Roman households trust cabbage and charms.
    local:
    - followers of Asclepiades of Bithynia in Rome
    - Cato, De agri cultura 156-157 (cabbage as a cure-all)
  epidemiology_mapping:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: medium
    note: The state counts citizens, not deaths or causes. Caesar's clerks have just recounted grain recipients
      street by street through tenement landlords; the same method would work for the sick.
    local:
    - Caesar's recount of grain recipients by district (46 BC)
    - undertakers at the grove of Libitina on the Esquiline
  hand_hygiene:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: People clean themselves with oil and a strigil at the baths and rinse hands at table. No soap.
      Physicians and midwives see no link between hands and fever.
  boiled_water:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: The Hippocratic Airs, Waters, Places advises boiling some waters. Romans judge water by taste
      and clarity and drink it mixed with wine. Fuel is dear for tenement dwellers.
    local:
    - Aqua Marcia (the best water)
    - Tiber water and wells in the low quarters
  water_filtration_chlorination:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: 'Four aqueducts: Appia, Anio Vetus, Marcia, Tepula. The Anio Vetus takes river water and runs
      muddy after rain. Masons could build sand filter beds; chlorination is out of reach.'
    local:
    - Aqua Appia, Anio Vetus, Aqua Marcia, Aqua Tepula
    - aediles and censors, who oversee the water
  sanitation_sewerage:
    knowledge: 4
    use: partial
    producibility: easy
    acceptance: high
    note: The Cloaca Maxima and street drains were built to drain land and carry off rain; they empty into
      the Tiber. Tenements use cesspits and chamber pots. Fullers collect urine.
    local:
    - Cloaca Maxima
    - aediles (street cleaning)
    - fullers' urine jars at street corners
  food_hygiene:
    knowledge: 1
    use: partial
    producibility: easy
    acceptance: medium
    note: Aediles police the markets and bad smell is the test of food. Cookshops feed the tenement population.
      Flies, cooks' hands and carriers are no one's concern.
    local:
    - Macellum (food market north of the Forum)
    - aediles
    - popinae (cookshops)
  quarantine:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: An epidemic is a prodigy, answered by consulting the Sibylline books, processions and banquets
      for the gods. Thucydides' remark that carers caught the Athenian plague is known to readers.
    local:
    - quindecimviri sacris faciundis (keepers of the Sibylline books)
    - temple of Aesculapius on the Tiber Island
  nursing_hospital_hygiene:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: No hospitals. The sick lie at home, tended by family or slaves; the poor sleep in the temple of
      Aesculapius hoping for a dream. Legions have no fixed infirmaries yet.
    local:
    - temple of Aesculapius on the Tiber Island (founded 291 BC)
    elsewhere:
    - India, Ashoka's 3rd-century BC edicts on medical care (rumour at best)
  cholera_waterborne:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: Asiatic cholera is confined to India. Greek 'cholera' means any violent vomiting and flux. Typhoid
      and dysentery are common, worst in army camps and late summer.
  oral_rehydration:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: medium
    note: No sugar, but honey and salt in boiled water serve. Physicians give barley water or honey water,
      and some deliberately withhold drink in fever.
  plague_vectors:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: Bubonic plague is not in Italy; 'pestilentia' means any epidemic. Rats infest the granaries and
      ships. The knowledge has no visible use here for six centuries.
  typhus_lice:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: medium
    note: Lice are ordinary, in camps and tenements alike. No epidemic of this period can be identified
      as typhus. Baking or boiling clothes is cheap; the reason would be new.
  malaria_mosquito:
    knowledge: 1
    use: partial
    producibility: medium
    acceptance: medium
    note: Tertian and quartan fevers return each late summer; Fever has a shrine. Blamed on marsh
      air, so villas sit on hills. Caesar will plan draining the Pomptine marshes (44 BC).
    local:
    - Marcus Terentius Varro
    - shrine of Febris on the Palatine
    - Pomptine marshes and the Campagna
    - conopeum (Egyptian-style gnat net)
    elsewhere:
    - Egypt, marsh dwellers sleeping under nets (Herodotus)
  quinine:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: high
    note: Cinchona grows only in the Andes. Quartan fever is met with diet, emetics, amulets and vows to
      Febris.
    elsewhere:
    - Andean forests, source of cinchona bark
  tuberculosis_control:
    knowledge: 1
    use: none
    producibility: medium
    acceptance: low
    note: Phthisis is well described since Hippocrates and blamed on constitution and family. The Aristotelian
      Problems ask why it passes to those nearby. Sea voyages and milk are prescribed.
  parasitic_worms:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Flat and round worms are distinguished and thought to breed from gut decay. Pomegranate (Cato
      126-127) and male fern are real remedies. Transmission by soil, pork and water is unknown.
  scurvy_citrus:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: medium
    note: Rare, since voyages are short and people eat greens; it appears in sieges. The citron is an exotic,
      lemons and oranges absent. Cabbage and cress do the job.
    elsewhere:
    - Media and Persia, citron (Theophrastus' 'Median apple')
  vitamins_deficiency:
    knowledge: 1
    use: partial
    producibility: medium
    acceptance: medium
    note: 'Greek physicians give liver for night blindness without knowing why. No idea of a missing substance:
      disease is excess, blockage or bad air. The poor live on dole wheat.'
  variolation:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: Smallpox is not clearly present in Italy; the first epidemic usually read as smallpox comes in
      AD 165. No material to inoculate with, no fear to motivate it.
  smallpox_vaccination:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: No smallpox to fear and no known cowpox to use.
  vaccines_attenuated:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  antitoxin_serum:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  wound_care:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Greek surgeons suture, splint, cauterise and dress with wine, vinegar, honey and resin; tying
      vessels is in Alexandrian books. Pus is expected. Legions rely on comrades and a few physicians.
    local:
    - Greek surgeons attending Caesar's officers
    - gladiator schools at Capua and Rome
    elsewhere:
    - Alexandria, surgical tradition
  antiseptics:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: medium
    note: Wine, vinegar, honey, pitch and verdigris go on wounds by tradition, not theory. Strong spirit
      needs distillation first. Surgeons do not clean hands or instruments.
  heat_sterilisation:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: medium
    note: Bronze and iron instruments and linen can be boiled in any kitchen; cautery irons are heated anyway.
      Nobody sees a reason to.
  childbirth_care:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: medium
    note: Midwives (obstetrices), often Greek freedwomen, deliver on a birthing chair. Herophilus wrote
      on midwifery. Childbed fever is common; Cicero's daughter dies a month after giving birth in 45 BC.
    local:
    - obstetrices
    - Tullia, daughter of Cicero
  first_aid_resuscitation:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: medium
    note: Not breathing means dead. Asclepiades was famous for noticing life in a man on his bier and proposed
      opening the windpipe in choking. Revival looks like magic.
  ether_anaesthesia:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Needs both strong spirit and oil of vitriol, and neither exists. Surgeons give mandrake wine or
      poppy juice and rely on speed and strong assistants.
  opium_analgesia:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Poppy juice, mandrake and henbane are standard Greek drugs, dosed by guess. Compound antidotes
      after Mithridates are in fashion. Willow bark is not used for fever or pain.
    local:
    - Greek drug sellers (pharmacopolae)
    - Pompeius Lenaeus, translator of Mithridates' drug notes
  blood_groups_transfusion:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
  anatomy_dissection:
    knowledge: 2
    use: none
    producibility: medium
    acceptance: low
    note: Human dissection stopped in Alexandria two centuries ago; Herophilus' and Erasistratus' books
      circulate. Opening a corpse offends Roman religion, and Empiricist physicians call anatomy useless.
      Animals and wounds remain.
    elsewhere:
    - Alexandria, medical school and the books of Herophilus and Erasistratus
  blood_circulation:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: 'After Erasistratus: veins carry blood, made in the liver, out to be consumed; arteries carry pneuma. The
      arm-ligature demonstration of vein valves costs nothing.'
  clinical_thermometer_stethoscope:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: Pulse lore after Herophilus, who timed it with a water clock; Hippocratic texts listen to the
      chest. A listening tube and percussion are easy. A thermometer needs blown glass tubes.
    elsewhere:
    - Alexandria, Herophilean physicians
  dental_care:
    knowledge: 1
    use: partial
    producibility: easy
    acceptance: medium
    note: Tooth powders and toothpicks are used; Catullus mocked a Spaniard who rinsed with urine. Gold-wired
      teeth are old (Twelve Tables). No sugar, so honey and bread starch are the culprits.
  sulphonamides:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  penicillin:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium

  # ---- Life sciences
  microorganisms:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: medium
    note: 'Varro''s invisible marsh animals are a guess, not an observation. No lenses: glass is cast, coloured
      and bubbly. A tiny clear bead of glass or rock crystal is the route.'
    local:
    - Marcus Terentius Varro
    - gem engravers working rock crystal
  spontaneous_generation_refuted:
    knowledge: 0
    use: wrong
    producibility: easy
    acceptance: medium
    note: 'Aristotle and every farmer: maggots from rotting meat, eels from mud, bees from an ox carcass
      (in Mago''s farming book too). The covered-jar experiment is cheap.'
  fermentation_yeast:
    knowledge: 0
    use: partial
    producibility: medium
    acceptance: medium
    note: Must ferments by itself in the dolium; bread rises with kept leaven. It is called a boiling (fervere).
      Showing that yeast is alive needs a microscope.
  cell_theory:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
  viruses:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  taxonomy:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: Aristotle's animal books and Theophrastus' plant books exist in Greek, as does Crateuas' illustrated
      herbal. Romans name plants by use. No fixed species names or ranks.
    local:
    - Greek libraries of Roman nobles (that of the Luculli at Tusculum)
    elsewhere:
    - Athens and Alexandria, Peripatetic natural history
  reproduction_fertilisation:
    knowledge: 1
    use: wrong
    producibility: hard
    acceptance: low
    note: 'Two rival theories: Aristotle''s (male seed gives form, female only matter) and the Hippocratic
      and Epicurean two-seed view. Egg and sperm cannot be shown without a microscope.'
  heredity_genetics:
    knowledge: 1
    use: none
    producibility: medium
    acceptance: medium
    note: Likeness to parents and grandparents is noticed (Lucretius book 4) and explained by mixed seed.
      Counting pea crosses takes several seasons and a patient villa owner.
  evolution_natural_selection:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: low
    note: Lucretius (book 5) has earth produce many creatures of which the unfit died out, but species do
      not change. Epicureans may listen; Stoics see design and providence.
    local:
    - Lucretius, De rerum natura, book 5
    - Epicurean circles in Rome and at Herculaneum
  dna_structure:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  respiration_metabolism:
    knowledge: 0
    use: wrong
    producibility: hard
    acceptance: low
    note: Breath cools the innate heat of the heart (Aristotle) or supplies pneuma to the arteries (Erasistratus).
      A mouse and a lamp under a jar is a demonstration anyone can see.
  photosynthesis_plant_nutrition:
    knowledge: 0
    use: wrong
    producibility: hard
    acceptance: low
    note: Plants eat soil through their roots (Aristotle), so soil 'tires'. The weighed-pot willow experiment
      is easy and takes years; the gas part needs chemistry that is absent.
  nitrogen_fixation_biology:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: medium
    note: Farmers know that lupins, beans and vetch 'dung the land' (Cato 37) and plough them in. Why is
      unknown; nodules on the roots are visible to anyone who looks.
    local:
    - Cato, De agri cultura
    - Mago's farming books in Latin and Greek
  nervous_system_brain:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: low
    note: Herophilus and Erasistratus traced nerves to the brain, and physicians follow them. Aristotelians,
      Stoics and Epicureans (Lucretius) keep the mind in the chest. Electrical signalling is unreachable.
    elsewhere:
    - Alexandria, anatomical books of Herophilus and Erasistratus

  # ---- Chemistry
  soap:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: medium
    note: Bodies are cleaned with oil and strigil, cloth with stale urine and fuller's earth. Tallow, olive
      oil, wood ash and lime are cheap. Fullers and bath keepers are the buyers.
    local:
    - fullers (fullones)
    - bath keepers (balneatores)
    elsewhere:
    - Gaul, a tallow-and-ash hair pomade (reported by later Roman writers)
  distillation:
    knowledge: 1
    use: none
    producibility: medium
    acceptance: high
    note: Aristotle notes that vapour from boiled sea water condenses fresh. No still exists. Coppersmiths
      and potters can build pot, head and tube; tight joints and cooling are the craft problems.
    local:
    - perfumers of the Seplasia at Capua
    - coppersmiths (aerarii)
    - wine from Campania and Latium
  sulphuric_acid:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Green and blue vitriol (shoemakers' black, chalcanthum) and alum are traded goods; no one has
      distilled them. Needs retorts that survive red heat.
  oxygen_combustion:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Fire is an element, or for Epicureans a swarm of fine atoms. A lamp dying under a jar is easily
      shown. Isolating the gas needs mercury calx and blown glass.
  nitric_acid:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: Needs saltpetre, vitriol and a still, none of which exist here. Gold and silver are parted by
      salt cementation instead.
  saltpetre_production:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: 'Trap: Latin nitrum means natron (soda), not saltpetre. The white crust on stable and cellar walls
      is unrecognised. Nitre beds need over a year; no known use creates demand.'
  chemical_elements:
    knowledge: 0
    use: wrong
    producibility: medium
    acceptance: low
    note: Four elements (Empedocles, Aristotle, the Stoics) or Epicurean atoms without chemistry. Goldsmiths
      and the mint weigh well, but nobody weighs before and after burning.
    local:
    - mint at the temple of Juno Moneta
    - goldsmiths and assayers
  atomic_theory:
    knowledge: 2
    use: none
    producibility: hard
    acceptance: medium
    note: 'Atoms are respectable Epicurean philosophy: Lucretius'' poem is recent and Asclepiades built
      his medicine on particles and pores. Nobody links atoms to fixed weight ratios; that needs pure substances.'
    local:
    - Lucretius, De rerum natura
    - Philodemus at Herculaneum
    - Roman Epicureans (Atticus, Cassius)
  molecules_mole_concept:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
  periodic_table:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: Seven metals, sulphur and carbon are known as substances, none as elements. A table from memory
      cannot be checked.
  gas_laws:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Ctesibius' and Philo's books on pneumatics show that air is a body and can be compressed. No barometer
      and no sealed glass tubes.
    elsewhere:
    - Alexandria, books of Ctesibius; Philo of Byzantium's Pneumatica
  pneumatic_chemistry_gases:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Deadly vapours at volcanic vents near Puteoli and at Ampsanctus are known as breath of the underworld.
      There is one air; kinds of air is a new thought.
  acids_bases_ph:
    knowledge: 1
    use: partial
    producibility: easy
    acceptance: medium
    note: Vinegar is the only acid, natron and ash lye the alkalis; they are known to fizz together. Plant
      juices that change colour (violets, red cabbage) are an easy demonstration.
  hydrochloric_acid_aqua_regia:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
  alkali_soda:
    knowledge: 4
    use: partial
    producibility: easy
    acceptance: high
    note: Natron (nitrum) comes from Egypt for glass, cleaning and medicine; wood-ash lye is a household
      thing. Making lye caustic with quicklime is not practised.
    elsewhere:
    - Egypt, Wadi Natrun
  lime_burning:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Cato (De agri cultura 38) gives the dimensions of a lime kiln. Lime burnt from limestone and travertine
      is the basis of all building mortar.
    local:
    - lime burners (calcarii)
    - Cato, De agri cultura 38
  salt_production:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Sea salt from evaporation pans at the Tiber mouth, carried inland on the Via Salaria. Salt is
      a state concern and cheap.
    local:
    - salt pans at Ostia
    - Via Salaria
  mordant_dyeing:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Dyers use alum and iron mordants with madder, weld, woad and shellfish purple. Indigo arrives
      only as a costly Indian pigment. Caesar's new law restricts purple garments.
    local:
    - alum from Lipari
    - dyers (infectores) and purple sellers (purpurarii)
    elsewhere:
    - Tyre, shellfish purple
    - India, indigo and mordant-dyed cotton
  chlorine_bleach:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
    note: Fullers whiten wool with burning sulphur and fuller's earth. Chlorine needs spirit of salt, which
      needs oil of vitriol.
  electrolysis:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Copper, iron, silver, lead, vinegar and brine exist, so a weak pile can be stacked; no metallic
      zinc, no drawn wire. Twitching frog legs would be an omen.
  organic_structure_theory:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  phosphorus_matches:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Fire is carried as embers or struck with steel and flint. Sicilian sulphur is cheap, so sulphur-tipped
      splints are easy; phosphorus from urine needs retorts at white heat.
  rubber_vulcanisation:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  synthetic_dyes:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
  nitroglycerin_dynamite:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  petroleum_refining:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: low
    note: Bitumen and burning naphtha are known from Babylonia and the Dead Sea; an oily spring at Agrigentum
      in Sicily feeds lamps. Olive oil is cheap. Needs a still.
    elsewhere:
    - Babylonia, naphtha springs
    - Dead Sea, bitumen
  polymers_plastics:
