      50 BC the Senate voted 370 to 22 that Caesar and Pompey both disarm; it was blocked.'
  laws_of_war:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: low
    note: Just-war forms through the fetial priests; envoys are sacred. Caesar's clemency to citizens is
      policy. In Gaul he sold whole peoples and cut off hands at Uxellodunum (51 BC).

people:
- name: Marcus Terentius Varro
  role: scholar, former Pompeian officer pardoned by Caesar, charged with organising Rome's first public
    library
  knows: Roman antiquities, Latin language, farming and stock breeding, the liberal arts including medicine;
    suspects that invisible animals from marshes cause disease
  note: Aged about 70, in Rome and on his estates (Reate, Casinum). Proscribed by Antony in 43 BC, loses
    his library but survives; writes De re rustica in 37 BC.
- name: Themison of Laodicea
  role: Greek physician, the best-known pupil of Asclepiades, founder of the Methodic school
  knows: Asclepiades' medicine of particles and pores, treatment by diet, baths and regimen; said to be
    the first to use leeches
  note: Dates poorly known (c. 123–43 BC). Where he is in 46 BC is not recorded; he travelled widely
    (Crete, Milan) and may never have practised in Rome. Reachable only by search and letter.
- name: Antistius
  role: physician in Caesar's circle
  knows: wound surgery
  note: Presumably in Rome in 46 BC. Known only from March 44 BC, when he examines Caesar's body and judges that of 23 wounds only
    the second, in the chest, was fatal.
- name: Alexio
  role: Greek physician and friend of Cicero
  knows: Greek clinical medicine
  note: Practises in Rome in Cicero's circle. Dies suddenly in May 44 BC; Cicero mourns him as an excellent doctor.
- name: Craterus
  role: fashionable Greek physician in Rome
  knows: Greek clinical medicine
  note: In Rome. Treats Attica, the young daughter of Atticus, in 45 BC (Cicero's letters to Atticus).
- name: Asclapo of Patrae
  role: Greek physician in Achaea
  knows: Greek clinical medicine
  note: Nursed Cicero's secretary Tiro through an illness at Patrae; Cicero recommends him to the governor
    Servius Sulpicius Rufus about now. A voyage away.
- name: Pompeius Lenaeus
  role: freedman of Pompey, grammarian and teacher in Rome
  knows: Greek and Latin; translated the pharmacological notes of Mithridates VI into Latin at Pompey's
    order
  note: In Rome in 46 BC, teaching after Pompey's death and loyal to his patron's memory.
- name: Philodemus of Gadara
  role: Epicurean philosopher and poet, client of Calpurnius Piso (Caesar's father-in-law)
  knows: Epicurean atomism, logic of inference from signs, a large Greek library
  note: Lives on the Bay of Naples; his library was probably the one found at Herculaneum. Dies around 40-35 BC.
- name: Diodorus Siculus
  role: Greek historian from Agyrium in Sicily, working in Rome on his universal history
  knows: Egypt (visited about 60-56 BC), mines of Spain and Egypt, bitumen of the Dead Sea, alum of Lipari,
    geography from books
  note: In Rome through these years, an observer without office or patron of note.
- name: Gaius Hirrius
  role: wealthy owner of sea-water fish ponds
  knows: breeding and keeping morays in salt-water ponds
  note: In or near Rome for the triumphs of 46 BC; where his ponds lie is not recorded. Lends Caesar morays for the triumphal banquets, by weight
    rather than for sale (2,000 in Varro, 6,000 in Pliny).
- name: Sosigenes
  role: Astronomer who advised Caesar on the calendar
  knows: 'Greek and Egyptian calendar astronomy: the 365 1/4-day year, risings and settings of stars;
    Pliny also cites him on Mercury''s greatest distance from the Sun'
  note: Known almost only from Pliny the Elder; 'of Alexandria' is a later inference from the reform's
    Egyptian model. Presumably in Rome in 46 BC. Nothing is recorded of his later life.
- name: Marcus Flavius
  role: Scribe (scriba) who assisted Caesar in drawing up the new calendar
  knows: The old pontifical calendar, the festival days and how the added days were placed so as not to
    move them
  note: Named only by Macrobius (Saturnalia 1.14). In Rome in 46 BC; nothing else is known of him.
- name: Marcus Tullius Cicero
  role: Consular, orator, writer on philosophy
  knows: Translated Aratus' star poem into Latin; heard Posidonius on Rhodes; found Archimedes' tomb at
    Syracuse as quaestor in 75 BC; describes Archimedes' and Posidonius' planetary spheres; Stoic logic
  note: In Rome and at Tusculum in 46 BC, pardoned and politically idle; jokes that the stars now rise
    by edict. Writes his philosophical works in 45-44 BC. Killed in the proscriptions, 7 December 43 BC.
- name: Vitruvius
  role: Military engineer serving under Caesar (artillery and siege machines)
  knows: Cranes and tackles, catapult proportions, water clocks, sundials, pumps and water wheels as an
    engineer meets them; reads Greek mechanics
  note: Where he is in autumn 46 BC is not recorded, probably with the army. His ten books on architecture
    are twenty years in the future.
- name: Publius Nigidius Figulus
  role: Senator, Pythagorean, astrologer and grammarian
  knows: Two books on the celestial sphere (Greek and non-Greek constellations), Egyptian astrology, divination,
    winds
  note: A Pompeian, in exile and reachable only by letter; where is not recorded. Cicero fails to win
    his pardon and he dies in exile in 45 BC.
- name: Titus Pomponius Atticus
  role: Eques, financier, Cicero's friend and publisher
  knows: Lending at interest across Greece and Asia, bookkeeping, book production with trained slave copyists,
    Roman chronology (his Liber annalis)
  note: In Rome in 46 BC, on good terms with every party. Survives the proscriptions of 43 BC; dies in
    32 BC.
- name: Lucius Cornelius Balbus
  role: Caesar's confidential agent in Rome, with Gaius Oppius; formerly his chief of engineers (praefectus
    fabrum)
  knows: Caesar's finances and correspondence, including the ciphered letters; a native of Gades on the
    tidal Atlantic
  note: In Rome in 46 BC; with Oppius the way to Caesar's ear while Caesar is in Spain. Sides with Octavian
    after the murder; consul in 40 BC.
- name: Gaius Oppius
  role: eques, Caesar's confidential agent in Rome with Balbus
  knows: Caesar's finances, correspondence (including the cipher) and intentions
  note: In Rome in 46 BC, running Caesar's affairs with Balbus while Caesar is in Spain. Later wrote on
    Caesar's life.
- name: Marcus Tullius Tiro
  role: Cicero's freedman secretary (freed 53 BC)
  knows: shorthand, dictation, editing and archiving letters and speeches
  note: With Cicero in Rome and at the villas. Outlives him and edits his papers.
- name: Servius Sulpicius Rufus
  role: consul of 51 BC, the foremost jurist of the day
  knows: civil law treated as a system, the praetor's edict, legal opinions
  note: Governs Achaea for Caesar in 46 BC, reachable by letter or at Athens. Dies early in 43 BC on a
    Senate embassy to Antony at Mutina.
- name: Aulus Ofilius
  role: jurist of equestrian rank, pupil of Servius, close to Caesar
  knows: civil law, the edict
  note: In Rome. The obvious man for Caesar's planned codification. Stays an eques and out of office.
- name: Gaius Trebatius Testa
  role: jurist, protégé of Cicero, served on Caesar's staff in Gaul
  knows: civil law, Caesar's circle
  note: In Rome in 46 BC. Cicero dedicates the Topica to him in 44 BC. Lives on into Augustus' time.
- name: Cratippus of Pergamon
  role: Peripatetic philosopher
  knows: Aristotelian philosophy, divination by dreams and frenzy (which he defends)
  note: At Mytilene, then Athens. Cicero obtains Roman citizenship for him from Caesar; he teaches Cicero's
    son in 45–44 BC.
- name: Gaius Cassius Longinus
  role: senator, pardoned Pompeian, saved the remnant of Crassus' army after Carrhae
  knows: Parthian tactics and the Syrian frontier at first hand, naval command, Epicurean philosophy
  note: In Italy in 46 BC (Rome, then Brundisium by January 45), pardoned; served Caesar against Pharnaces
    in 47 but kept out of the African war. Praetor in 44 BC and a leader of the murder; by
    43 BC he holds Syria with an army.

events:
- 'Every August to October (by the sun, not the drifting calendar): the fever season in Rome and the Campagna;
  those who can leave for the hills.'
- '46 BC Feb: the regular intercalary month of 23 days is inserted (Caesar as pontifex maximus), bringing
  the year to 378 days.'
- '46 BC Sep: Caesar''s four triumphs (Gaul, Egypt, Pontus, Africa) on four days, with games and public
  feasts; awnings over the spectators are said to be silk, and Hirrius lends morays for the banquets. On
  26 Sep, the last day, he dedicates the temple of Venus Genetrix and the unfinished Forum Iulium.'
- '46 BC autumn: Caesar pardons M. Claudius Marcellus at the Senate''s plea; Cicero breaks his silence
  with a speech of thanks (Pro Marcello).'
- '46 BC: the free-grain list is recounted street by street through the landlords and cut from 320,000
  to 150,000; juries limited to senators and equites; a sumptuary law (litters, purple, pearls, delicacies
  seized in the market); all but the ancient collegia dissolved; citizenship for physicians and teachers
  of the liberal arts in Rome.'
- '46 BC, between November and December: two extra months totalling 67 days (intercalaris prior and posterior)
  are inserted; the year has 445 days.'
- '46 BC late: Caesar leaves for Spain. Lepidus, consul and master of horse, runs Rome with six or eight
  prefects; Balbus and Oppius handle Caesar''s business.'
- '46–44 BC: in Syria the Pompeian Q. Caecilius Bassus holds Apamea against Caesar''s generals and deals
  with the Parthians.'
- '45 BC 1 Jan: the Julian calendar begins: 365 days, an extra day in February every fourth year, ten
  days spread over seven months. Told that Lyra rises tomorrow, Cicero answers: yes, by edict.'
- '45 BC Jan–Feb: Cicero''s daughter Tullia gives birth to a son and dies about a month later at Tusculum.'
- '45 BC: Caesar''s prefect Gaius Clovius issues coins of brass (orichalcum), a metal new to Roman coinage.
  Nigidius Figulus dies in exile.'
- '45 BC: Cicero writes the Hortensius, Academica, De finibus and Tusculan Disputations, and begins On
  the Nature of the Gods, with Archimedes'' tomb and the planetary spheres of Archimedes and Posidonius.'
- '45 BC 17 Mar: battle of Munda. Caesar returns in the autumn and triumphs over Spain.'
- '45–44 BC: Caesar plans to drain the Pomptine marshes, let out the Fucine Lake, build a harbour at Ostia
  and cut a canal through the Isthmus of Corinth.'
- '45 BC 31 Dec: a consul dies on the last day of the year; Caesar has Caninius Rebilus elected consul
  for the remaining hours.'
- '44 BC Jan–Feb: tribunes Flavus and Marullus deposed; Caesar named dictator for life; 15 Feb he refuses
  the diadem at the Lupercalia. Senate now about 900; colonies decreed at Carthage and Corinth; two aediles
  (ceriales) created for the grain supply. Quintilis is renamed Iulius among his honours.'
- '44 BC 15 Mar: Caesar is killed at a Senate meeting in Pompey''s theatre complex, three days before his
  planned departure for the Parthian war; the physician Antistius examines the body. The pontiffs, counting
  inclusively, will then add a leap day every third year until Augustus corrects it.'

quest_hooks:
- A senator's household is sick with colic, pallor and weak wrists; the cellar master sweetens the wine
  with must boiled in lead pans
- Varro wants proof of his invisible marsh animals and has no instrument to see them
- Caesar will want the Pomptine marshes drained (44 BC); autumn fever empties every work camp there
- 'The newly enfranchised Greek physicians quarrel over a noble patient: bleed him or bathe him'
- A glass merchant from Sidon shows a thin bubble of glass on the end of a tube and asks what it is good
  for
- Grain rots and heats in the Tiber warehouses while the dole list has just been halved
- A daughter of a great house lies in childbed fever days after the midwife left
- A perfumer from Capua would pay well for a way to capture the 'spirit' of wine or roses
- Veterans back from Africa have festering wounds and no physician who will touch them without a fee
- A swordsmith wants to know why Noric blades hold an edge and his own do not
- 'Get to Sosigenes or the scribe Flavius before the edict is final: the year is not 365 1/4 days but
  about 11 minutes shorter. Offer the rule of dropping three leap days in four centuries, and say how
  you know.'
- The leap-year rule will be miscounted after Caesar's death, because Romans count inclusively. Have it
  written unambiguously into the edict or carved on a public calendar, against pontiffs who resent losing
  the calendar.
- Teach a banker's slave clerk place-value numerals with a sign for the empty column, on wax tablets,
  and race him against a master of the counting board in front of the Forum's money tables.
- Sail to Rhodes or Alexandria to find an instrument maker who can file bronze gear wheels, and bring
  back a geared planetary model, or a man able to build something new.
- Have a bronze founder and a turner build Ctesibius' twin-cylinder force pump from the Greek description
  and offer it for a city with no fire brigade and wooden tenements.
- Build a water-driven grain mill on a stream outside the city. The gearing is the hard part; a bakery
  owner with forty donkeys and slaves must be shown why he should care.
- A steam engine is wanted by nobody and lacks air pressure, a true cylinder and a sealed boiler. Show
  the weight of air with a pump and mercury first, and see who listens.
- 'Varro has a commission and no plan: what should Rome''s first public library contain, how is it catalogued,
  who may read, and can anything be copied faster than a slave writes?'
- The acta diurna are posted on a board and copied by whoever cares. Regular copies for the towns of Italy
  need a relay of riders that does not exist yet.
- Caesar wants the civil law reduced to order. Ofilius and Trebatius can draft; whoever shapes the plan
  decides what a citizen may claim against a magistrate.
- Debtors and creditors both curse the settlement of 49 BC, and the bankers at the Forum hoard coin. Anyone
  who can explain why coin disappeared has an audience among the equites.
- Caesar will march on Parthia in March 44 BC. Cassius knows what the arrows did at Carrhae; the army's cavalry
  rides without stirrups.
- Cicero is an augur who does not believe in augury and is about to say so in a book. A stranger who predicts
  something the augurs cannot will interest him and alarm the college.
- A banker at Puteoli lends on ships bound for Alexandria and hears of Greek pilots who cross from the
  Red Sea to India on one wind. Nobody in Rome has asked how.
- Caesar's cipher is a fixed shift of the alphabet; counting letters breaks it. Telling Balbus is either
  a great service or proof that the stranger reads Caesar's mail; Cicero would also love to know.
- 'Ostia has no harbour and Caesar wants one. Moles in the sea, a light, dredging: the engineers are at
  hand, the decision is his, and he leaves for Spain within weeks.'
