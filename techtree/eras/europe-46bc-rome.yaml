  # ---- Computing, control & information theory
  algorithm_concept:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Euclid's procedure for the greatest common measure and Eratosthenes' sieve exist in Greek. Reckoning
      is taught as hand practice on the board, not as written rules.
  binary_numbers:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Needs place value first. Looks like a philosopher's game; Roman money and weights run in twelfths.
  boolean_logic:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Stoic logic (Chrysippus) already treats 'and', 'or' and 'if' between whole statements, and Cicero
      knows it. Turning it into calculation with symbols is new.
    local:
    - Cicero and the Stoic teachers in Roman households
  logic_gates_switching:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  mechanical_calculator:
    knowledge: 2
    use: none
    producibility: very-hard
    acceptance: medium
    note: Geared planetary models exist and Cicero describes them. Teeth are filed by hand as small triangles.
      An adding machine with a carry is new and presupposes place-value numbers.
    local:
    - Archimedes' geared sphere, booty of Marcellus from Syracuse (212 BC), kept in his family's house
      (Cicero, De re publica I); whether it survives in 46 BC is not recorded
    elsewhere:
    - 'Rhodes: Posidonius'' planetary sphere (Cicero heard him there on his journey of 79–77 BC)'
    - Greek workshops that built the device lost off Antikythera c. 70-60 BC (at least 30 bronze gears)
  punched_card_control:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Roman looms are upright and plain; figured silks arrive from the East as finished luxury cloth.
      There is no drawloom to control.
  programmable_computer:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  turing_machine_computability:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
  computer_memory:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  programming_languages_compilers:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  operating_system_time_sharing:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  information_theory:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
  sampling_pcm:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  error_correcting_codes:
    knowledge: 1
    use: partial
    producibility: medium
    acceptance: medium
    note: Books are copied by slaves from dictation and Cicero complains of faulty Latin copies. Counting
      lines (stichometry) is the only check; check sums need place-value arithmetic.
    local:
    - Atticus' trained copyists
  packet_switching_networks:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  feedback_control:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: Ctesibius' float valve keeps a water clock's inflow steady; such clocks are rare luxuries in Rome.
      The general idea of a self-correcting machine has not been drawn.
    elsewhere:
    - 'Alexandria: Ctesibius'' tradition of water clocks and pneumatic devices'
  cryptography:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Caesar writes confidential letters with the alphabet shifted three places. Nobody counts letter
      frequencies. A breaker or a better cipher interests him and his enemies.
    local:
    - Caesar
    - Lucius Cornelius Balbus and Gaius Oppius, who run his affairs in Rome
  public_key_cryptography:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low

  # ---- Energy & engines
  animal_power_gin:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Donkeys and slaves turn hourglass-shaped lava mills in the bakeries; men tread wheels for cranes
      and drainage. Horses pull poorly in the throat-and-girth harness.
    local:
    - bakeries (pistrina) with donkey mills (mola asinaria, already in Cato)
  water_wheel:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: Rivers turning wheels with scoops are a familiar sight (Lucretius, book 5). A grain mill stood
      at Mithridates' palace; none is attested at Rome. Bakers have donkeys and slaves.
    local:
    - Tiber and Anio
    - Vitruvius, who will describe the geared mill in the 20s BC
    elsewhere:
    - 'Cabeira in Pontus: water mill at Mithridates'' palace, in Roman hands since the 60s BC (Strabo)'
  windmill:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: Unknown anywhere. Sailcloth, carpenters and right-angle gearing exist. Winds at Rome are weak
      and fickle; coasts and hilltops suit better.
  water_turbine:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
  crank_connecting_rod:
    knowledge: 1
    use: partial
    producibility: easy
    acceptance: medium
    note: The rotary hand quern has an upright handle at its rim, a crank in all but name. Crank with connecting
      rod and flywheel is built nowhere.
    local:
    - hand querns in every legionary tent group
  piston_pump:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: high
    note: Ctesibius' twin-cylinder bronze force pump is described in Greek mechanics; founders and turners
      here could build one. Rome has no fire brigade, only buckets and private slave gangs.
    local:
    - bronze founders and turners
    - the fire-prone tenements (insulae) of the Subura
    elsewhere:
    - 'Alexandria: Ctesibius'' pumps and water organ (3rd c. BC)'
  hydraulic_ram:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Lead pipe and bronze valves are at hand, but pipes are folded sheet with a soldered seam and burst
      under water hammer. Hillside villas would want it.
  charcoal_burning:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Charcoal feeds smiths, founders and house braziers; wood and charcoal come down the Tiber from
      Apennine forests. Nobody collects the tar and vinegar from the smoke.
  coal_mining:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: low
    note: Theophrastus (On Stones) reports earthy coals burnt by smiths in Liguria and Elis. Central Italy
      has no good seams; those of Gaul and Britain lie unworked.
    elsewhere:
    - 'Han China: coal burnt as fuel'
  gas_lighting:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  argand_lamp:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Olive-oil lamps of clay and bronze with a solid wick light every house. A tubular wick and bronze
      burner are possible; a thin glass chimney is not.
  oil_drilling:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: low
    note: Bitumen and naphtha from natural seeps are known and traded as caulk, drug and curiosity. Wells
      are dug, never drilled.
    elsewhere:
    - 'Han China, Sichuan: percussion-drilled brine wells'
  steam_aeolipile:
    knowledge: 2
    use: none
    producibility: easy
    acceptance: low
    note: Bronze balls that blow steam from a pinhole are a curiosity used to explain wind; Vitruvius names
      them about 25 BC. A spinning version is easy, a toy.
  safety_valve_boiler:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Bath boilers are open bronze cauldrons over a furnace. Riveted or soft-soldered sheet holds little
      pressure; brazed seams and a weighted valve must be taught.
    local:
    - bath furnaces and hypocausts (Sergius Orata's raised-floor 'hanging' baths, before 91 BC)
  savery_steam_pump:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
  atmospheric_engine:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: 'Missing: the idea of air pressure, a true cylinder wider than a pump barrel, a sealed boiler,
      and a motive. Mines are drained by slaves treading screws and wheels.'
  separate_condenser:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  rotative_steam_engine:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  high_pressure_steam:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  steam_turbine:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  hot_air_engine:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  internal_combustion_engine:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  gas_turbine_jet:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  refrigeration:
    knowledge: 2
    use: partial
    producibility: hard
    acceptance: high
    note: Snow kept in pits cools drinks, a Greek luxury; at Rome the trade is attested only from Seneca's
      day. Freezing with snow and salt is unknown but easy.
  nuclear_reactor:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low

  # ---- Tools, machines & manufacturing
  block_and_tackle:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Contractors lift multi-ton blocks with shear-legs, compound tackles and capstans, probably already
      with the man-trodden great wheel. Caesar's forum and basilica are building sites now.
    local:
    - Forum Iulium and Basilica Iulia building sites
    - building contractors (redemptores)
  wheelbarrow:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: medium
    note: Loads go in baskets, on two-man handbarrows or carts. One wheel under a handbarrow frees a man;
      slave owners see little gain, legionaries digging camps might.
    elsewhere:
    - Han China (Sichuan), where it is just appearing
  archimedes_screw:
    knowledge: 3
    use: correct
    producibility: easy
    acceptance: high
    note: Wooden screws turned by treading drain Spanish silver mines and water the Nile delta. Diodorus,
      writing in Rome, calls it the Egyptian screw and credits Archimedes.
    local:
    - Diodorus Siculus
    elsewhere:
    - 'Spain: mines of the south-east and the Sierra Morena'
    - 'Egypt: Nile delta irrigation'
  gears_gear_trains:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: medium
    note: Wooden peg-and-lantern gears on water-lifting wheels; fine bronze wheels with hand-filed triangular
      teeth in Greek astronomical devices. No theory of tooth form, no cutting engine.
    elsewhere:
    - 'Rhodes and Alexandria: instrument makers'
  cam_camshaft:
    knowledge: 2
    use: none
    producibility: medium
    acceptance: medium
    note: Cams move the figures of Alexandrian automata (Philo of Byzantium). No cam-lifted hammers or stamps
      are in use.
  screw_nut_bolt:
    knowledge: 2
    use: partial
    producibility: hard
    acceptance: medium
    note: The screw is known from the water screw and Greek mechanics. Oil and wine presses still work by
      lever and windlass, as in Cato. Threads are hand-carved; no bolts.
  belt_drive:
    knowledge: 1
    use: partial
    producibility: easy
    acceptance: medium
    note: Cord drives exist only as the bow and strap that spin drills and lathes. An endless belt between
      two wheels is new and easy.
  ball_bearings:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Axles and pivots run in greased wood, iron or bronze sockets. Bronze balls can be cast and turned;
      hardened steel balls cannot.
  bellows_piston_blower:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: medium
    note: Smiths and founders use paired leather bag bellows worked by a slave. A wooden box bellows with
      a double-acting piston is unknown and plain carpentry.
  trip_hammer_water_powered:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: Needs water wheel and cam, both known in principle. Grain is pounded and ore crushed by hand;
      fullers tread cloth in tubs.
  lost_wax_casting:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Greek and Italian founders cast life-size hollow bronzes in sections by indirect lost wax and
      join them. Founders make statues, fittings and pump parts, not machines.
    local:
    - bronze founders supplying statues for Caesar's forum and triumphs
    - Arcesilaus, sculptor of the Venus Genetrix cult statue (material not recorded), famed for his clay
      models
  sand_loam_casting:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: 'Bronze is cast in clay and stone moulds. Iron is never cast: smiths forge spongy blooms, and
      liquid iron is unknown west of China. No big bells exist.'
    elsewhere:
    - 'Han China: blast furnaces and cast iron in moulds'
  wire_drawing:
    knowledge: 1
    use: partial
    producibility: medium
    acceptance: medium
    note: Gold and silver wire is twisted from strip and rolled smooth; iron for mail rings is hammered
      rod. A hard steel draw plate with tapered holes is new.
    local:
    - goldsmiths
    - mail (lorica hamata) makers for the legions
  rolling_mill:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Sheet lead, bronze and gold are hammered or cast flat. Small rolls for lead or gold are makeable;
      true iron rolls in a stiff frame are not.
  boring_machine:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: Pump barrels a few inches wide are cast and then turned or lapped by hand. Wooden pipes are augered.
      No guided boring bar, and nothing to drive one.
  lathe_screw_cutting:
    knowledge: 1
    use: partial
    producibility: hard
    acceptance: medium
    note: Turners use bow and strap lathes that spin back and forth, tool held by hand, for wood, ivory,
      bronze and soft stone. No continuous drive, slide rest or lead screw.
    local:
    - turners (tornatores)
  precision_measurement:
    knowledge: 2
    use: partial
    producibility: hard
    acceptance: medium
    note: Bronze foot rules in 12 unciae or 16 digits, compasses, calipers, squares; standard measures are
      kept on the Capitol. Parts are fitted by trial, not gauged.
    local:
    - the Capitol, where standards are kept (the foot is called pes monetalis, after Juno Moneta)
  machine_tools:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  interchangeable_parts:
    knowledge: 1
    use: partial
    producibility: hard
    acceptance: low
    note: Army contracts order arms in bulk, sling bullets come from moulds and amphorae in rough standard
      sizes, but every fitted part is finished by hand.
  assembly_line:
    knowledge: 1
    use: partial
    producibility: medium
    acceptance: low
    note: Large slave workshops (potteries, lamp makers, brickyards) already divide work into steps. No
      machines and no interchangeable parts; with cheap slaves, owners see little reason.
  sawmill:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Timber and marble are sawn by pairs of slaves with frame saws and sand. Needs a water wheel plus
      crank and connecting rod, neither yet built.
  spinning_wheel:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: All yarn is spun on spindle and distaff by women of every rank; wool-working is the badge of the
      virtuous matron. Wheel, cord drive and spindle are carpenter's work.
  spinning_machines:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
  treadle_loom:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: Looms are upright and warp-weighted, the weaver standing. A horizontal frame loom with treadles
      and heddle shafts is joinery, unknown west of China.
    elsewhere:
    - 'Han China: treadle looms for silk'
  power_loom:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
  cotton_gin:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: Cotton is an exotic cloth from India and Upper Egypt. Nobody in Italy handles raw cotton; wool
      and linen clothe Rome.
  knitting_frame:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  sewing_machine:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low

  # ---- Mathematics & measurement
  zero_place_value:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: medium
    note: Numerals are additive; an empty column on the counting board is the only 'nothing', never written.
      Nihil is no number. Philosophers will ask how nothing can be a quantity.
    local:
    - bankers (argentarii) in the Forum
    - clerks of the tax companies (publicani)
    - public scribes of the treasury (aerarium)
    elsewhere:
    - 'Babylon (Parthian): astronomer-scribes write base-60 place value with a placeholder sign for an empty
      place'
    - 'Alexandria and Rhodes: Greek astronomers compute in Babylonian sixtieths'
    - 'Han China: counting rods, decimal place value with a blank for zero'
  arabic_numerals:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: medium
    note: Sums are done with pebbles and on the fingers, then recorded in letters. Written column arithmetic
      works on wax tablets; bookkeepers and tax farmers gain, and fear forgery.
    local:
    - wax tablets and stylus, erasable, ideal for written sums
    - household ledgers (codex accepti et expensi)
  abacus_counting_board:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Pebbles (calculi) on a board ruled in columns for I, X, C, M, with fives between and twelfths
      beside; finger signs too. The bronze bead abacus is not yet attested.
    local:
    - schoolmasters who drill reckoning (calculatores)
    - bankers' tables in the Forum
  fractions_rule_of_three:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Fractions are twelfths of the as (unciae) and their parts, drilled in school; Greek reckoners
      use unit fractions, astronomers sixtieths. A general numerator-over-denominator notation is missing.
  decimal_fractions:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Needs place value first. Money, weights and inheritances run in twelfths, which divide by three
      and four; tenths look clumsier to a Roman.
  negative_numbers:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Receipts and outlays stand in separate columns of the ledger. A number less than nothing is absurd;
      calling it a debt helps.
    elsewhere:
    - 'Han China: red and black counting rods for gain and loss (written up by the 1st c. AD)'
  square_roots_irrationals:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: Incommensurable lengths are classified in Euclid, book 10. Surveyors and architects use rough
      rules. Digit-by-digit root extraction needs place value.
  logarithms:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Needs place value and decimal fractions, then months of table work by trained reckoners. Astronomers
      in Alexandria gain most.
  slide_rule:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
  symbolic_algebra:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: Problems are stated and solved in words or as geometry. Greek letters already serve as numerals,
      which makes letters for unknowns confusing.
  quadratic_cubic_equations:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: low
    note: Quadratics are solved as geometry (application of areas, Euclid II and VI). Doubling the cube
      is done with curves and instruments such as Eratosthenes' mesolabe, not by formula.
  linear_equations_matrices:
    knowledge: 1
    use: partial
    producibility: medium
    acceptance: low
    note: One-unknown problems are solved by trial values in the Egyptian manner. Systematic elimination
      for several unknowns is unknown here.
    elsewhere:
    - 'Han China: elimination on the counting board (in the Nine Chapters by the 1st c. AD)'
  complex_numbers:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
  prime_numbers_number_theory:
    knowledge: 2
    use: correct
    producibility: easy
    acceptance: low
    note: Euclid VII-IX and Eratosthenes' sieve exist in Greek. Roman Pythagoreans care for the lore of
      perfect and friendly numbers; nobody sees a use.
  combinatorics_permutations:
    knowledge: 1
    use: partial
    producibility: easy
    acceptance: low
    note: Chrysippus claimed over a million compound statements from ten simple ones; Hipparchus disputed
      it with his own counts. No general rules, no triangle of coefficients.
  compound_interest_exponential_growth:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Interest runs by the month; 1 per cent monthly (centesima) is the ceiling. In 50 BC Cicero fought
      Brutus' agents over a Salamis loan at 48 per cent. No tables.
    local:
    - Titus Pomponius Atticus, financier
    - bankers (argentarii) in the Forum
    - the debt crisis and Caesar's debt-relief measures of 49-47 BC
  geometry_proof:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: 'Euclid, Archimedes and Apollonius are read in Greek by a few. Cicero''s judgement: Romans confine
      geometry to measuring and reckoning. No Latin Euclid exists.'
    local:
    - Greek tutors and libraries in great houses
    - Varro, charged by Caesar with organising a public library
    elsewhere:
    - 'Alexandria: Museum and Library'
    - 'Rhodes and Athens: schools'
  pi_circle_measurement:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: high
    note: Archimedes' bounds 223/71 and 22/7 stand in his Measurement of a Circle. Craftsmen use 3 or 3
      1/8; wheelwrights, pipe makers and vault builders would take a better rule.
  trigonometry:
    knowledge: 2
    use: partial
    producibility: hard
    acceptance: medium
    note: Hipparchus' table of chords belongs to Greek astronomy; nobody in Rome computes with it. Sines
      and a dense table are months of work and want place-value arithmetic.
    elsewhere:
    - 'Alexandria and Rhodes: astronomers using Hipparchus'' chords'
  coordinate_geometry:
    knowledge: 1
    use: partial
    producibility: medium
    acceptance: low
    note: Astronomers fix stars and geographers places by two numbers; surveyors lay land on a grid from
      cardo and decumanus. Plotting a curve from an equation is unknown.
  non_euclidean_geometry:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Euclid's parallel postulate is already felt to want a proof (Posidonius redefined parallels as
      equidistant). Geometry on the sphere is not seen as a rival geometry.
  perspective_technical_drawing:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: medium
    note: Wall painters of the current fashion open walls into deep colonnades with roughly converging lines,
      no single vanishing point. Architects draw plans and elevations; scaled machine drawings are rare.
    local:
    - Second Style wall paintings in houses on the Palatine and in the villas around Vesuvius
  surveying_triangulation:
    knowledge: 4
    use: partial
    producibility: easy
    acceptance: high
    note: Surveyors lay out roads, camps and colony grids with groma and rods and level aqueducts with water
      levels; Caesar is settling veterans now. Angles are not measured; no triangulation.
    local:
    - land surveyors (mensores) for Caesar's veteran colonies
    - army camp surveyors
    elsewhere:
    - Greek astronomers' sighting tube and dioptra
  solar_calendar_leap_years:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: 'Happening now: 46 BC runs 445 days. The new year of 365 1/4 days is 11 minutes too long, a day
      in 128 years; Hipparchus'' shorter value is ignored.'
    local:
    - Caesar, pontifex maximus, who issues the edict
    - Sosigenes, his astronomer (Pliny)
    - Marcus Flavius, scribe named by Macrobius
    - college of pontiffs, who lose control of intercalation
    elsewhere:
    - 'Egypt: 365-day civil year with no leap day; the Canopus decree of 238 BC ordering one was ignored'
    - 'Babylon: 19-year cycle of intercalary months'
  metric_system_units:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: Foot, pound and amphora are standard in Roman territory, divided in twelfths; the amphora is defined
      as a cubic foot. Decimal units want decimal numerals and a dictator's fiat.
    local:
    - standard weights and measures on the Capitol
  probability_statistics:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Dice and knucklebones are everywhere, but the outcome is Fortuna's, and lots are drawn to learn
      the gods' will. Census rolls, grain-dole lists and sea loans offer data.
    local:
    - Caesar's street-by-street recount of grain recipients in 46 BC (320,000 cut to 150,000)
    - lenders of sea loans (faenus nauticum)
  bayes_theorem:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
  normal_distribution_errors:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Astronomers pick the one observation they trust. Averaging repeated measurements is new and easy;
      the theory behind it needs probability and calculus.
  data_graphs:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: medium
    note: Records are lists on wax tablets, papyrus rolls and whitened notice boards. Grain prices or Tiber
      levels drawn as a line over time would be new.
  calculus:
    knowledge: 1
    use: none
    producibility: very-hard
    acceptance: low
    note: Archimedes' exhaustion proofs and his Method (weighing thin slices) exist in Greek, read by a
      handful. No algebra, coordinates or place-value numbers to build on.
  infinite_series_e:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: low
    note: Zeno's paradoxes are a school topic; Archimedes summed 1 + 1/4 + 1/16 and so on in his Quadrature
      of the Parabola. No general notion of a series.
  differential_equations:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  fourier_series:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low

  # ---- Scientific method & philosophical ideas
  scientific_method:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: Greek books hold observation and some experiment (Strato, Archimedes, Alexandrian physicians).
      Romans prize utility and ancestral precedent; a public test reads as spectacle, not proof.
    elsewhere:
    - Alexandria, Museum
  empiricism_over_authority:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Academic sceptics argue both sides and follow no master; Cicero says so openly. In medicine and
      farming, ancestral custom and famous Greek names still decide.
    local:
    - Cicero
  controlled_trial:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: medium
    note: Owners of large slave households and army commanders could compare groups at will; nobody thinks
      to. A single cure or a votive tablet counts as proof.
    local:
    - large slave households (familiae)
    - the legions
  placebo_blinding:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
  correlation_causation_confounding:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Greek logic names the fallacies and Carneades' objections to divination are known. Omens, dreams
      and remedies are still judged by remembered hits.
  selection_bias_sampling:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: medium
    note: The Diagoras retort about the votive tablets of sailors who did not drown circulates in Greek;
      Cicero retells it in 45 BC. Nobody applies it to remedies or omens.
  measurement_quantification:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Standard weights, steelyards, surveyors' groma, sundials and water-clocks. Greek astronomy measures;
      natural philosophy argues in words. Roman numerals make tables clumsy.
    local:
    - Sosigenes, Caesar's calendar astronomer
    - land surveyors (mensores)
    elsewhere:
    - Alexandria and Rhodes, graduated instruments and star catalogues
  mathematical_laws_of_nature:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: Archimedes on the lever and floating bodies, Pythagorean string ratios and Hipparchus are in Greek
      books. Romans treat mathematics as surveying and accounts.
    elsewhere:
    - Alexandria
    - Rhodes
  falsifiability:
    knowledge: 1
    use: none
    producibility: medium
    acceptance: low
    note: 'Refutation by counterexample is courtroom and school routine. Augural rules cannot fail: an omen
      that misleads means a flaw in the ritual.'
  fallibilism_provisional_knowledge:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: The sceptical Academy teaches that nothing is certain and one follows the probable. Cicero professes
      it; his Academica comes in 45 BC.
    local:
    - Cicero
    elsewhere:
    - Athens, the philosophical schools
  bayesian_reasoning:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: low
    note: Carneades' grades of plausibility are known through Cicero's teachers. No numbers attach to chance;
      dice are for gaming, lots for the gods.
  reproducibility_open_publication:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: Books spread by private copying; Greek engineers published their catapult formulae. Craft recipes
      stay inside workshops and slave households. Disclosure earns no priority or reward.
    local:
    - T. Pomponius Atticus and his copyists
  cognitive_biases:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: 'Rhetoric teaches how to exploit them: appeals to fear, hope and party. Nobody treats them as
      errors to guard against in one''s own judgement.'
  formal_logic:
    knowledge: 3
    use: correct
    producibility: easy
    acceptance: medium
    note: Stoic and Aristotelian logic is taught by Greek tutors in great houses. Latin terms are still
      being coined; Cicero's Topica comes in 44 BC.
    elsewhere:
    - Athens
    - Rhodes
  occams_razor:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: medium
    note: 'Epicureans do the opposite on principle: for things in the sky every explanation the senses do
      not contradict is kept (Lucretius V–VI).'
  thought_experiment:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Lucretius' spear thrown from the edge of the universe is in circulation; Zeno's paradoxes and
      Carneades' plank of two shipwrecked men are school pieces.
  source_criticism:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Varro and Atticus (Liber annalis, c. 47 BC) sort chronology; Cicero's Brutus (46 BC) says family
      funeral speeches falsified history. Priestly records and prodigy lists go unquestioned.
    local:
    - Varro
    - Atticus
    - Cornelius Nepos
  informed_consent_research_ethics:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: low
    note: Greek physicians know the Hippocratic oath. Slaves have no say in their treatment and are tortured
      for evidence; condemned men are at the magistrate's disposal.
  natural_causes:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Lucretius and Greek meteorology explain thunder, eclipses and plague without gods. The state still
      expiates prodigies; one senator can hold both views.
    local:
    - Lucretius' De rerum natura (c. 55 BC)
    - Varro
    - Cicero
  scepticism_superstition:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: low
    note: Cicero is an augur and privately doubts divination (De divinatione, 44 BC). Auspices can stop
      an assembly, so augury is constitutional machinery. Astrology is a rising fashion.
    local:
    - college of augurs
    - Etruscan haruspices such as Spurinna
    - Cicero
    elsewhere:
    - Babylon, omen astronomy and horoscopes
  atomism:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: low
    note: 'Epicurean doctrine, widely read: Lucretius in Latin, Philodemus and Siro on the Bay of Naples.
      Opponents call it godless. Nobody can test it.'
    local:
    - Lucretius' De rerum natura
    - Philodemus at Herculaneum
    - Siro at Naples
    - C. Cassius Longinus, recent Epicurean
  universal_physical_laws:
    knowledge: 2
    use: none
    producibility: medium
    acceptance: low
    note: Epicureans hold that sky and earth are the same atoms. Stoics and Aristotelians put a finer fire
      or aether above, and most people think the stars divine.
  mechanical_philosophy:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: low
    note: Epicureans reject purposes in nature. Stoic providence is the respectable view and suits state
      religion. Greek machines and planetaria are admired as marvels.
    local:
    - Archimedes' geared planetarium from Syracuse, kept by Marcellus' family; his star globe stood in
      the temple of Virtus (Cicero, De re publica I)
    elsewhere:
    - Alexandria, the mechanics after Ctesibius
    - Rhodes
  idea_of_progress:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: low
    note: 'Lucretius V tells how the arts advanced step by step, yet expects the world to decay. Romans
      measure by ancestors: ''new things'' (res novae) means revolution.'
  systematic_invention:
    knowledge: 1
    use: none
    producibility: medium
    acceptance: low
    note: Alexandrian engineers found the catapult formula by royally funded trials; the account is in Greek.
      Rome pays contractors and generals' engineers, not research. Slaves are cheap.
    local:
    - Caesar's engineers (his praefecti fabrum Balbus and Mamurra; Vitruvius served on artillery)
    elsewhere:
    - Alexandria
  golden_rule_universal_ethics:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Greek maxims and Stoic duties to all mankind are known; Cicero's De officiis comes late in 44
      BC. In practice duty follows rank, kin, patron and client.
  human_equality_dignity:
    knowledge: 2
    use: none
    producibility: easy
    acceptance: low
    note: Stoics teach that all men share reason and one world-city. Rank, citizenship and slavery order
      everything; yet freed slaves become citizens, which astonishes Greeks.
  natural_rights:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: low
    note: 'Cicero''s De re publica (51 BC) calls true law right reason in agreement with nature. Actual
      rights are a citizen''s: appeal to the people, the tribune''s help.'
    local:
    - Cicero
  social_contract:
    knowledge: 2
    use: none
    producibility: easy
    acceptance: low
    note: Epicureans call justice a compact not to harm; Lucretius V has men agree on magistrates and laws.
      Cicero defines the commonwealth as a people joined by agreement on law.
  freedom_of_speech_thought:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Libertas includes frank speech in Senate and public meetings. Under Caesar men speak with care;
      Cicero's praise of Cato (46 BC) is answered by Caesar's Anticato, not by force.
  religious_tolerance:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Foreign cults are admitted or suppressed by Senate decree (Bacchanalia 186 BC; Isis altars pulled
      down in the 50s). Caesar confirms the Jews' worship. Cult is civic duty, belief private.
  secular_state:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: 'Priesthoods are public offices held by politicians: Caesar is pontifex maximus, Cicero an augur.
      There is no separate clergy to separate from.'
  utilitarianism:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: low
    note: Epicurean reckoning of pleasure is for the individual, and Cicero attacks it (De finibus, 45 BC).
      'Public advantage' is a familiar argument but means the citizen body.
  abolition_of_torture:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: low
    note: Citizens are exempt from torture; a slave's testimony is valid only under it. Advocates such as
      Cicero call such evidence worthless when it hurts their client.
  positive_sum_cooperation:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: medium
    note: Wealth means land and plunder, and conquest visibly pays. Senators may not own large ships (law
      of 218 BC) and trade through freedmen and equites.
  game_theory:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: Caesar's clemency and his crossing of the Rubicon are commitment moves made by instinct. There
      are no words for it.
  tragedy_of_the_commons:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: 'Public land: legal limits on holdings and grazing were evaded by the rich, and the Gracchi died
      over it. Aqueduct water is tapped illegally.'

  # ---- Agriculture & food
  three_field_system:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: Italy sows winter grain and fallows every other year; dry summers make a spring-sown third field
      unreliable outside the Po plain. The gain lies north of the Alps.
  legumes_green_manure:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Cato lists lupins, beans and vetch as crops that manure the land, and good farmers plough lupins
      in. Absentee owners with slave gangs often skip it.
    local:
    - Cato, De agri cultura 37
    - Mago's farming books (Latin translation by D. Silanus)
  crop_rotation:
    knowledge: 1
    use: partial
    producibility: medium
    acceptance: medium
    note: Grain after beans is practised, but fallow remains the rule and fodder is scarce. Lucerne (medica)
      and turnips are grown; red clover as a sown field crop is not.
  manure_compost_night_soil:
    knowledge: 4
    use: partial
    producibility: easy
    acceptance: high
    note: Dung heaps and pigeon dung are prized (Cato). The city's excrement mostly goes down the sewers
      into the Tiber; only market gardens near the walls buy it.
    local:
    - market gardens around the city walls
    - Cato, De agri cultura
  liming_marling:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: low
    note: Varro saw Gauls near the Rhine dress fields with dug white earth. Italian soils on limestone and
      volcanic ash seldom need it.
    local:
    - Marcus Terentius Varro
    elsewhere:
    - Transalpine Gaul, marling
  mineral_fertiliser:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: Wood ash is used on fields. Bone meal and ash are within reach; guano, mined phosphate and potash
      are not. The idea that plants eat dissolved minerals contradicts Aristotle.
  terracing_soil_conservation:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Hillside vines and olives stand on dry-stone terraces. Grazing and felling strip the Apennine
      slopes, and the Tiber silts and floods. Nobody connects the two.
  heavy_plough:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: 'The Italian ard scratches light soil crosswise and suits it. A wheeled plough with coulter and
      mouldboard pays only on heavy wet land: the Po plain and Gaul.'
    elsewhere:
    - Han China, cast-iron shares and mouldboards
  horse_collar_harness:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: medium
    note: Oxen plough and haul under the yoke, mules carry and draw carts; horses are for war and racing.
      A saddler can make a padded collar in days.
    elsewhere:
    - Han China, breast-strap harness
  seed_drill:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: Seed is broadcast by hand and ploughed in. Slave labour is cheap; saved seed grain is the argument,
      since a large share of every wheat crop goes back as seed.
    elsewhere:
    - Han China, multi-tube seed drill
    - Mesopotamia, plough with seed funnel
  scythe_cradle:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Hay is mown with a short scythe; grain is cut with the sickle, often high on the stalk. A long
      scythe with a cradle is smith's and carpenter's work.
    elsewhere:
    - Gaul, longer scythes
  reaper_thresher:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Grain is trodden out by animals or a threshing sledge (tribulum) and winnowed in the wind. Harvest
      gangs of slaves and hired men make owners indifferent to machines.
    elsewhere:
    - Han China, rotary winnowing fan
  selective_breeding:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Stock owners choose rams, bulls and stallions by looks and pedigree, and prize Reate donkeys.
      Seed corn is picked from the best ears. No records, no progeny testing.
    local:
    - Marcus Terentius Varro (stock farms at Reate)
    - mule and donkey breeders of Reate
  grafting_fruit_trees:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Cato describes cleft and bud grafting step by step. Lucullus brought the cherry from Pontus a
      generation ago; new fruits are a nobleman's hobby.
    local:
    - Cato, De agri cultura 40-42
    - gardens of Lucullus on the Pincian
  irrigation_water_lifting:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Gardens are watered from channels and by the well sweep; Lucretius mentions river-turned wheels
      with scoops. Archimedes' screw drains Spanish mines. Field crops rely on winter rain.
    elsewhere:
    - Egypt, screw, ox-driven wheel and shaduf
  wet_rice_cultivation:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: low
    note: Rice is known from Greek accounts of India and as an imported invalid's food. Seed would have
      to come from the East; the Po marshes would suit it.
    elsewhere:
    - India
    - China
  windmill_drainage_land_reclamation:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Romans drain by gravity with channels and tunnels (Alban Lake emissary, Etruscan cuniculi). Caesar
      will plan to drain the Pomptine marshes and Fucine Lake (45–44 BC). Windmills are unknown.
    local:
    - Pomptine marshes
    - Fucine Lake
    - emissary of the Alban Lake
  aquaculture_fish_ponds:
    knowledge: 4
    use: partial
    producibility: easy
    acceptance: high
    note: Sea-water fish ponds are a rich man's craze and Lucrine oysters a business since Sergius Orata.
      Hirrius lends Caesar thousands of morays, by weight, for the triumph banquets. Pure luxury.
    local:
    - Gaius Hirrius
    - oyster beds of the Lucrine Lake
    - villa fish ponds on the Bay of Naples
  new_world_crops:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
    elsewhere:
    - Americas
  potato_cultivation:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
    elsewhere:
    - Andes
  maize_beans_squash_milpa:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
    elsewhere:
    - Mesoamerica
  nixtamalisation:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  cassava_detoxification:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  potato_blight_monoculture_risk:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  columbian_exchange:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
    note: The inhabited world ends at the Ocean. Greek geographers accept a sphere and speculate about other
      landmasses; no ship here could make the crossing and return.
  food_preservation:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Salted fish and fish sauce (garum) from Spain and the Black Sea, Cato's salted hams, dried figs,
      raisins, olives in brine, smoked cheese, fruit in honey or boiled must.
    local:
    - Cato, De agri cultura 162 (salting hams)
    - fish-sauce importers at Puteoli and Ostia
  canning:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: Small jars, cork, pitch and wax exist; glass jars are few and tinplate is absent. Boiling sealed
      pottery is workable. Under-heated meat or beans in a sealed jar can kill.
  pasteurisation:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: medium
    note: Wine often turns to vinegar; growers answer with pitch, resin, salt water and boiled must. Gently
      heating sealed jars fits their habits. Milk is drunk fresh or made into cheese.
    local:
    - wine growers of Latium and Campania
  grain_storage_pest_control:
    knowledge: 4
    use: partial
    producibility: easy
    acceptance: high
    note: State and private warehouses hold the dole grain; floors are plastered with olive lees against
      weevils (Cato 92). Losses to damp, heating, weevils and rats are large. Rye is rare.
    local:
    - warehouses of the Sulpicii Galbae (later Horrea Galbana) and the Tiber wharves below the Aventine
    - Puteoli (grain ships unload)
    - aediles in charge of the grain supply
    elsewhere:
    - Han China, 'ever-normal granary' price buffer (54 BC)
    - Egypt, royal granaries at Alexandria
  sea_fisheries_salt_cod:
    knowledge: 3
    use: partial
    producibility: hard
    acceptance: medium
    note: Tuna and mackerel are trapped and salted on a large scale at Gades and in Sicily. Cod and herring
      swim in northern seas no Roman fishing boat reaches.
    elsewhere:
    - Gades and the Spanish coast, salt-fish works
  sugar_cane_beet:
    knowledge: 1
    use: none
    producibility: very-hard
    acceptance: high
    note: Honey and boiled must are the sweeteners. Greeks report an Indian reed giving honey without bees.
      Cane cuttings are a sea voyage beyond Egypt; garden beet holds too little sugar.
    elsewhere:
    - India, cane sugar boiled to solid lumps
  sericulture:
    knowledge: 1
    use: none
    producibility: very-hard
    acceptance: high
    note: Silk is the costliest cloth; awnings at Caesar's games are said to be of it. People think it grows
      on trees. Silkworm eggs and white mulberry exist only in China.
    elsewhere:
    - Han China
    - Cos, wild silk woven into thin cloth
  beekeeping_movable_frame:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: Honey is the only sweetener and wax a necessity; hives are cork bark, wicker, hollow logs or clay
      tubes. The leader is called a king. Frames need boards cut true.
    local:
    - beekeepers of the Sabine country and Tarentum
  coffee_tea_cacao:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: medium
    elsewhere:
    - Han China, tea
    - Ethiopian highlands, wild coffee
    - Mesoamerica, cacao
  hybrid_maize:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  semi_dwarf_wheat_rice:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low

  # ---- Navigation, transport & exploration
  world_geography:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: The earth is a sphere of Eratosthenes' or Posidonius' size. The known world ends at Ocean, the
      Ganges and Thule; the Seres are a rumour. Posidonius thought India reachable westward.
    elsewhere:
    - Alexandria, Eratosthenes' Geography in the library
  wind_systems_ocean_currents:
    knowledge: 1
    use: partial
    producibility: medium
    acceptance: medium
    note: Etesian winds and the March–October sailing season are known. Greek pilots from Egypt cross to
      India with the monsoon since Eudoxus of Cyzicus (c. 118 BC); few ships go.
    elsewhere:
    - Ptolemaic Egypt, Red Sea ports Berenice and Myos Hormos
    - South Arabian and Indian sailors on the monsoon
  magnetic_compass:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: medium
    note: Lodestone attracting iron is described by Lucretius (book VI). That a floating needle points north
      is unknown anywhere. Pilots use sun, stars, winds and landmarks and winter in port.
    local:
    - lodestone (magnes lapis), traded as a curiosity
    - iron needles
  magnetic_declination:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
  dead_reckoning_log_line:
    knowledge: 1
    use: partial
    producibility: medium
    acceptance: medium
    note: Coast-pilot books (periploi) give distances in days' sail and stadia. No log, no sandglass, no
      compass; a water-clock is useless on a moving deck.
  latitude_astrolabe_quadrant:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: Greek astronomers fix latitude on land by gnomon shadow and longest day (Pytheas at Massalia,
      Hipparchus' zones). It is never done aboard ship.
    local:
    - Sosigenes
    elsewhere:
    - Alexandria and Rhodes, dioptra and armillary instruments
  reflecting_octant_sextant:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: Mirrors are polished bronze or silver, not flat glass; no finely divided arcs.
  longitude_lunar_distances:
    knowledge: 1
    use: none
    producibility: impossible
    acceptance: low
    note: Hipparchus proposed finding differences of longitude by timing one lunar eclipse in two places.
      It is almost never done.
  longitude_chronometer:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  map_projection_charts:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: Eratosthenes' map with parallels and meridians and Crates' globe are known from books. Roman practice
      is road itineraries and surveyors' land plans. Sailors carry no charts.
    elsewhere:
    - Alexandria
    - Pergamon, Crates' globe (c. 150 BC)
  sounding_lead_pilotage:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: A lead with a tallow-filled cup is standard gear; periploi list harbours, capes and distances.
    local:
    - pilots at Puteoli and Ostia
  tides_tide_tables:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Posidonius at Gades tied the tides to the moon's daily course and phases. Caesar lost ships to
      a spring tide in Britain in 55 BC. The Mediterranean barely has tides.
    elsewhere:
    - Gades (Cádiz), Atlantic tides observed
  polynesian_wayfinding:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    elsewhere:
    - Western Polynesia (Tonga, Samoa), settled by voyaging canoes
  ship_design_caravel_carrack:
    knowledge: 1
    use: partial
    producibility: hard
    acceptance: medium
    note: Hulls are built shell-first with mortise-and-tenon joints, steered by side oars, driven by one
      square sail and a small foresail. Caesar described the Veneti's oak ocean ships with leather sails.
    local:
    - shipyards at Ostia, Puteoli and Brundisium
    elsewhere:
    - Brittany, the Veneti's heavy Atlantic ships (defeated 56 BC)
  chinese_junk_treasure_ships:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
  watertight_bulkheads:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: Shell-first hulls have no cross walls; amphorae are stacked in one open hold.
  copper_sheathing_shipworm:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Merchant hulls are often sheathed in thin lead against shipworm. Copper sheet
      would work but costs far more than lead, a by-product of silver mining.
  ship_provisioning_long_voyages:
    knowledge: 1
    use: partial
    producibility: easy
    acceptance: medium
    note: Voyages hop from port to port within a season; crews eat grain, oil, wine and salt fish. Scurvy
      has no occasion and no name.
  steamship_screw_propeller:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  lighthouse_buoys:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: high
    note: Caesar saw and described the Pharos in 48 BC. Ostia is an open river mouth with a sandbar; big
      grain ships unload at Puteoli. Caesar will plan an Ostia harbour.
    local:
    - Ostia
    - Puteoli, the main port for Rome
    elsewhere:
    - Alexandria, the Pharos
  diving_bell:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: Breath-hold divers (urinatores) salvage cargo and cut cables. The air-filled cauldron lowered
      to divers is in the Aristotelian Problemata.
  canal_locks:
    knowledge: 1
    use: partial
    producibility: medium
    acceptance: medium
    note: 'Canals without locks exist: Marius'' cut at the Rhône mouth (102 BC), drainage tunnels. Caesar
      will plan a Tiber–Tarracina canal and an Isthmus cut (45–44 BC). Pound locks exist nowhere.'
    elsewhere:
    - Han China, Lingqu canal with navigation weirs
  paved_roads_macadam:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Via Appia to Brundisium, Flaminia, Aurelia, Aemilia, Domitia through Gaul. Built by magistrates
      and the army. A city law (Heraclea tablet, date disputed) bans most daytime wagon traffic in Rome.
  spoked_wheel_suspension_carriage:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: medium
    note: Spoked wheels with iron tyres; the best carriages are Gallic types (raeda, essedum). No springs
      or strap suspension. Throat-and-girth harness limits horses, so oxen and mules haul.
  stirrup_saddle:
    knowledge: 1
    use: partial
    producibility: easy
    acceptance: high
    note: Cavalry ride a four-horned Celtic saddle without stirrups; hooves are unshod. Saddlers and smiths
      could make stirrups in days. The army is the buyer.
    local:
    - Caesar's Gallic and German auxiliary cavalry
    elsewhere:
    - India, toe-loop stirrups
  arch_bridge_truss:
    knowledge: 4
    use: partial
    producibility: easy
    acceptance: high
    note: 'Stone arches cross the Tiber: Pons Aemilius (142 BC), Mulvius (109 BC), Fabricius (62 BC). The
      army builds timber trestle bridges. No truss design, no suspension bridges.'
    local:
    - Pons Fabricius to the Tiber island
    - Pons Sublicius, the old timber bridge
  railway:
    knowledge: 1
    use: none
    producibility: medium
    acceptance: low
    note: The Diolkos at Corinth and wheel-ruts cut into rock roads are the nearest things. A wooden wagonway
      is carpenters' work; mines use slaves with baskets.
    elsewhere:
    - Isthmus of Corinth, the Diolkos trackway
  steam_locomotive:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  bicycle:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: A wooden running-machine is wheelwright's work; chain, bearings and tyres are not. Paving stones
      are rough.
  automobile:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  hot_air_hydrogen_balloon:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: No paper, and silk is a rare import. Fine linen sized with glue might lift a small model. A flying
      thing would be reported as a prodigy and expiated.
  parachute:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: Linen sailcloth, cord and a wooden frame suffice. Nobody has a use for it.
  glider_aeroplane:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
  jet_engine:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
  rocket_spaceflight:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low

  # ---- Communication & information
  writing_invention:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
  alphabet_writing:
    knowledge: 4
    use: partial
    producibility: easy
    acceptance: high
    note: Capitals and a cursive hand, words divided by points, no lower case. Many townsmen read notices
      and scratch graffiti. Schooling is private and paid; most country people cannot read.
  codex_book:
    knowledge: 1
    use: partial
    producibility: easy
    acceptance: medium
    note: Books are papyrus rolls. Wax-tablet codices and parchment notebooks serve for drafts and accounts;
      Caesar sends despatches folded into pages. Nobody publishes literature that way.
    local:
    - Atticus' copyists
    - papyrus imported from Egypt
    - parchment (Pergamene skins)
  woodblock_printing:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: Stamps on bricks, amphorae, lead pipes and seals are everyday; nobody inks one onto a page. Papyrus
      is ribbed and brittle, parchment dear, and slave copyists are cheap.
  printing_press:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Mint die-cutters could cut punches, and lead and tin are plentiful. Missing are paper, an oil-based
      ink and the adjustable type mould. Presses work by lever and windlass.
    local:
    - die-engravers of the mint on the Arx
  lithography_engraving:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: Gem-cutters and die-engravers have the hand skill. Pictures in books are copied freehand and degrade
      with each copy. There is no paper to print on.
  postal_system:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: high
    note: No state post. Letters travel with one's own slave couriers (tabellarii), friends, or the tax
      companies' messengers. Caesar posts relay riders on campaign. Persian relays are known from Herodotus.
    elsewhere:
    - Ptolemaic Egypt, royal relay post
    - Han China, post stations
  newspapers_periodicals:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: 'Since Caesar''s consulship (59 BC) the doings of Senate and people are posted daily (acta diurna).
      Copies go to the provinces by private letter.'
    local:
    - the Forum, where the acta are posted
  scientific_journal:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Greek scholars publish by letter and preface to a named colleague, as Archimedes did. No periodical,
      no printing.
  encyclopedia_reference_works:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Varro's Antiquities (41 books; the part on religion dedicated to Caesar) is new, his De lingua
      Latina in progress. Cato's handbook for his son is old. Nothing is alphabetical.
    local:
    - M. Terentius Varro
  library_catalogue:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Callimachus' Pinakes are the model. Roman libraries are private and arranged by Greek experts
      such as Tyrannion, with title tags glued to each roll.
    local:
    - Tyrannion of Amisus, grammarian in Rome
    - libraries of Atticus, Cicero, Varro and the Luculli
    elsewhere:
    - Alexandria
  pencil_steel_pen:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Reed pen with soot-and-gum ink on papyrus, which sponges off; stylus on wax; a lead disc for ruling
      lines. No graphite, no iron-gall ink, no quill.
  shorthand:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: Tiro, Cicero's freedman secretary, uses a system of signs; clerks took down Cato's Senate speech
      in 63 BC. Few are trained in it.
    local:
    - M. Tullius Tiro
  typewriter:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
  copying_duplicating:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: No paper. A room of slave copyists writing to dictation is the duplicator, and it is cheap.
  braille_tactile_writing:
    knowledge: 0
    use: none
    producibility: easy
    acceptance: low
    note: Raised dots on wood, lead sheet or wax are feasible at once. The blind learn by ear and have others
      read to them.
  sign_languages:
    knowledge: 1
    use: partial
    producibility: easy
    acceptance: low
    note: Deaf people sign within their households. Formal contracts are spoken question and answer, so
      a deaf-mute cannot make them. Nobody teaches the deaf.
  vernacular_translation:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: medium
    note: Science and philosophy are Greek, read untranslated. Lucretius laments Latin's poverty; Cicero
      builds a Latin philosophical vocabulary in 45–44 BC. Mago's Punic farming manual was translated by
      Senate order.
    local:
    - Cicero
    - Varro
  signal_beacons_flag_codes:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: The army uses trumpets, standards, fire and smoke. Polybius describes a torch code spelling letters
      from a five-by-five grid; no actual use of it is recorded.
  optical_telegraph:
    knowledge: 1
    use: none
    producibility: medium
    acceptance: medium
    note: Polybius' torch alphabet is the idea, in a book. Without telescopes stations must stand close.
      The army and the grain supply would gain.
  standard_time_zones:
    knowledge: 0
    use: none
    producibility: impossible
    acceptance: low
    note: Hours are twelfths of daylight, longer in summer. Each town reads its own sundial.

  # ---- Institutions, law & governance
  written_law_code:
    knowledge: 4
    use: partial
    producibility: easy
    acceptance: medium
    note: The Twelve Tables (451–450 BC) are the base; law grows through statutes on bronze, the praetor's
      yearly edict and jurists' opinions. Caesar plans a codification; it dies with him.
    local:
    - A. Ofilius
    - C. Trebatius Testa
    - Servius Sulpicius Rufus (governing Achaea)
  rule_of_law:
    knowledge: 3
    use: partial
    producibility: hard
    acceptance: low
    note: Polybius' mixed constitution is the republic's self-image, and Cicero wrote it up in De re publica.
      In fact a dictator for ten years names magistrates, and armies decided it.
  independent_judiciary_judicial_review:
    knowledge: 2
    use: partial
    producibility: hard
    acceptance: low
    note: Standing jury courts and the tribune's veto exist; Caesar's law of 46 BC limits juries to senators
      and equites. No court can annul a law; augurs can, on ritual grounds.
  habeas_corpus_fair_trial:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: low
    note: A citizen may appeal to the people and may not be flogged or tortured. The Catilinarians were
      strangled untried in 63 BC. Slaves and provincials have none of it.
  representative_government:
    knowledge: 3
    use: partial
    producibility: hard
    acceptance: low
    note: Assemblies elect magistrates and vote laws in person at Rome, in voting groups weighted to the
      rich. Italians, citizens since 89 BC, must travel there. Elected delegates are unknown here.
    elsewhere:
    - Lycian League, cities send delegates in proportion to size
  sortition:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: low
    note: The lot picks which unit votes first and assigns provinces and jurors; its result counts as a
      divine sign. Athenian office by lot is known and thought mob rule.
  citizen_assembly:
    knowledge: 4
    use: partial
    producibility: easy
    acceptance: low
    note: Assemblies vote yes or no on a magistrate's bill without debate; speeches happen in meetings he
      controls. Under Caesar they ratify what he proposes.
    local:
    - Comitium and Forum
    - Campus Martius, the voting enclosure (Saepta)
  secret_ballot:
    knowledge: 4
    use: partial
    producibility: easy
    acceptance: medium
    note: Written ballots on small waxed tablets since 139 BC, voters filing over narrow gangways. Cicero
      thinks it cost the nobles their influence. The elections are now steered by Caesar.
  peaceful_transfer_of_power:
    knowledge: 3
    use: wrong
    producibility: hard
    acceptance: low
    note: Annual magistrates and term rules held for centuries, then Marius, Sulla, Caesar. Leaving office
      can mean prosecution and exile, which is why Caesar crossed the Rubicon.
  written_constitution:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: low
    note: The constitution is ancestral custom plus scattered statutes. Aristotle's collected constitutions
      sit in Greek libraries. A single charter binding the assemblies themselves is unthought.
  federalism_subsidiarity:
    knowledge: 2
    use: partial
    producibility: hard
    acceptance: low
    note: Italian towns run their own affairs under Roman citizenship, and Caesar's municipal law (c. 45
      BC) regulates their councils. Greek federal leagues are known; Rome dismantled them.
  international_law_sovereignty:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: medium
    note: Fetial rites, treaties on bronze on the Capitol, inviolable envoys, client kings. Rome recognises
      no equal. Only Parthia, with the Euphrates as the accepted line, comes close.
  property_rights_land_registry:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: medium
    note: 'Ownership is strong in law. There is no general land register: colonies are surveyed in grids
      with bronze plans, the rest rests on witnesses. Civil-war confiscations make every title nervous.'
    elsewhere:
    - Ptolemaic Egypt, village land surveys and registers
  commercial_law_contract_enforcement:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Good-faith contracts of sale, hire, partnership and mandate are enforced by the praetor; foreigners
      have their own praetor. An action for fraud exists since Aquilius Gallus (c. 66 BC).
  patents:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: No reward for invention. Craft knowledge sits with slaves and freedmen whose owner or patron takes
      the profit. A monopoly would need Caesar's personal favour.
  copyright:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: An author gains fame and patrons, not income. Once a text leaves Atticus' copyists anyone may
      copy it.
  standard_weights_measures:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Roman pound, foot, modius and amphora, checked by the aediles in the markets. Provinces keep their
      own units.
  census_vital_registration:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: medium
    note: The five-yearly census of citizens and property was last completed in 70 BC. In 46 Caesar counts
      grain recipients street by street through landlords. Births and deaths are not registered.
  public_accounts_audit:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: low
    note: Quaestors keep the treasury in the temple of Saturn, with clerks and the archive on the Capitol
      slope. Governors file accounts. No budget; Caesar seized the reserve in 49 BC.
    local:
    - aerarium in the temple of Saturn
    - Tabularium (78 BC)
  merit_civil_service:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Office comes by election, birth and patronage. The paperwork is done by magistrates' own slaves
      and freedmen and a few salaried clerks (scribae).
    elsewhere:
    - Han China, Imperial Academy and examined candidates
  universal_schooling:
    knowledge: 1
    use: partial
    producibility: hard
    acceptance: low
    note: Fee-paying street schools teach letters and counting; grammar and rhetoric are for the rich, often
      from Greek slaves or freedmen. Caesar grants citizenship to teachers settling in Rome.
  university:
    knowledge: 1
    use: none
    producibility: hard
    acceptance: medium
    note: Young Romans finish in Athens, Rhodes or Mytilene under a chosen philosopher or rhetor; Cicero's
      son goes to Athens in 45 BC. A school is a master and his circle.
    elsewhere:
    - Athens
    - Rhodes
  scientific_academy:
    knowledge: 2
    use: none
    producibility: medium
    acceptance: medium
    note: The Museum of Alexandria is known at first hand; Sosigenes comes from that world. In Rome learning
      is private leisure in villas. Caesar's library plan under Varro is the opening.
    elsewhere:
    - Alexandria, Museum and library (damaged in the fire of 48 BC, extent disputed)
  industrial_research_lab:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
  public_library_museum:
    knowledge: 2
    use: none
    producibility: easy
    acceptance: high
    note: Rome has no public library. Caesar has charged Varro with collecting and ordering Greek and Latin
      libraries; nothing is built when he dies. Pollio opens the first after 39 BC.
    local:
    - Varro
    - Lucullus' library at Tusculum, open to scholars
    - temples full of Greek statues and paintings taken as booty
    elsewhere:
    - Alexandria
    - Pergamon
  free_press:
    knowledge: 1
    use: partial
    producibility: medium
    acceptance: low
    note: 'No printing and no licensing: anyone may have a pamphlet copied. The limits are defamation law,
      the dictator''s displeasure and, from late 43 BC, the proscription lists.'
  abolition_of_slavery:
    knowledge: 1
    use: none
    producibility: very-hard
    acceptance: low
    note: Slaves are a large part of Italy's people and nobody proposes ending slavery. Manumission is common
      and makes citizens. Caesar orders that a third of herdsmen be free-born men.
  women_rights_suffrage:
    knowledge: 2
    use: partial
    producibility: hard
    acceptance: low
    note: Women free of father's and husband's power own and bequeath property, formally through a guardian;
      either spouse can divorce. No vote, no office. Servilia, Fulvia and Cleopatra wield power informally.
  charitable_endowment_waqf:
    knowledge: 1
    use: partial
    producibility: medium
    acceptance: medium
    note: Rich men give games, buildings and handouts in their lifetime and bind heirs by will. The law
      knows no perpetual foundation with its own legal person.
  guilds_apprenticeship:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: low
    note: Collegia are trade cult and burial clubs and served Clodius as street gangs. Caesar has dissolved
      all but the ancient ones. Training means owning or hiring out skilled slaves.
  public_health_board:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: Aediles look after streets, markets, sewers and food; four aqueducts (Appia, Anio Vetus, Marcia,
      Tepula) run on contracts. Against epidemics there are rites and the Sibylline books.
  fire_brigade_police_building_codes:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: high
    note: 'No fire brigade and no police: three junior magistrates with a few public slaves watch at night.
      Tall timber-framed tenements burn and collapse; there is no height limit yet.'
  social_insurance:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: medium
    note: Free monthly grain for citizens in Rome since Clodius (58 BC); Caesar has just cut the list from
      320,000 to 150,000 fixed places. Otherwise a patron's handouts and burial clubs.
  trade_unions_collective_bargaining:
    knowledge: 1
    use: none
    producibility: medium
    acceptance: low
    note: The plebeian secessions are civic legend. Free craftsmen compete with slaves and freedmen, and
      associations are suspect as political gangs and newly banned.

  # ---- Economy & finance
  coinage:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Silver denarius of four sesterces, struck at 84 to the pound; Caesar strikes gold aurei in quantity
      from his Gallic and treasury gold. Bronze small change is old and worn.
    local:
    - mint at the temple of Juno Moneta on the Arx
  double_entry:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: medium
    note: Every head of household keeps a daybook and a ledger of receipts and payments; bankers' books
      are evidence in court. Single entry, Roman numerals, no capital account.
  interest_loans_collateral:
    knowledge: 4
    use: partial
    producibility: easy
    acceptance: medium
    note: 'The legal ceiling is 1% a month. Provincials paid far more: Brutus'' agents charged Salamis in
      Cyprus 48%. Debt bondage is abolished; a bankrupt loses property and honour.'
  banking_credit:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: medium
    note: Argentarii at the Forum take deposits, pay on written order and finance auctions. Senators lend
      through agents. Funds move between cities by book transfer (permutatio). No notes or traded bills.
    local:
    - bankers' stalls (tabernae argentariae) on the Forum
    - T. Pomponius Atticus
    elsewhere:
    - Ptolemaic Egypt, royal banks with transfers between accounts
  paper_money:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
    note: No paper. Large sums already pass as book debts (nomina), but money means silver and gold.
  quantity_theory_inflation:
    knowledge: 1
    use: none
    producibility: easy
    acceptance: low
    note: In 49–47 BC coin vanished into hoards and land prices collapsed. Caesar had property valued at
      pre-war prices and limited cash holdings to 60,000 sesterces. Nobody theorises it.
  partnership_commenda:
    knowledge: 3
    use: partial
    producibility: easy
    acceptance: high
    note: In a societas partners share profit and loss as agreed; it ends when a partner dies. Ventures
      also run on sea loans and slaves trading with the master's capital (peculium).
  joint_stock_company:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: low
    note: Companies of publicani farm taxes and public contracts, with shares (partes) held by outside investors,
      senators included through fronts. They outlast a partner's death. Ordinary trade has nothing like
      it.
    local:
    - the equites who run the tax companies
    - C. Rabirius Postumus, financier
  insurance:
    knowledge: 2
    use: partial
    producibility: medium
    acceptance: medium
    note: A sea loan is cancelled if the ship is lost, at high interest. In 215 BC the state took the sea
      risk for army contractors and was cheated. No premiums.
  life_tables_annuities:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: The census records citizens' ages, but nobody tabulates deaths, and chance has no arithmetic.
  public_debt_bonds:
    knowledge: 2
    use: none
    producibility: hard
    acceptance: low
    note: The state borrowed from citizens in the Hannibalic war and repaid in instalments and land. Caesar
      funds himself by booty, confiscated estates and 'loans' demanded from towns.
  stock_exchange:
    knowledge: 1
    use: partial
    producibility: hard
    acceptance: low
    note: Shares in the tax companies change hands informally around the Forum; Cicero mentions their high
      price in 59 BC. No listed market.
  central_bank:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: 'In the credit crisis the remedy was decree: debts settled in property at old valuations, interest
      already paid deducted. Nobody lent into the panic.'
  division_of_labour:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: medium
    note: Large slave households and workshops specialise finely, and Xenophon's remark on city trades is
      known. Practised, not theorised.
  comparative_advantage_free_trade:
    knowledge: 0
    use: none
    producibility: medium
    acceptance: low
    note: Customs are low and for revenue. Italy's harbour dues, abolished in 60 BC, are restored by Caesar
      on foreign goods. Grain supply is politics, not trade theory.
  price_mechanism_supply_demand:
    knowledge: 2
    use: partial
    producibility: easy
    acceptance: medium
    note: Grain rises when ships fail; hoarders get the blame and the state hands out grain. Cicero's De
      officiis (44 BC) debates whether a seller must reveal that more ships come.
  ever_normal_granary:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: high
    note: Tax grain from Sicily, Sardinia and Africa feeds the dole and is stored in warehouses by the Tiber
      wharf. It is distributed, not used to steady prices.
    local:
    - warehouses of the Sulpicii Galbae (later Horrea Galbana) near the Emporium
    - Puteoli
    elsewhere:
    - Han China, ever-normal granaries (from 54 BC)
  progressive_income_tax:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Citizens in Italy have paid no direct tax since 167 BC; the old tributum was a levy on census
      property. Provinces pay tithes and fixed sums.
  cooperatives_savings_banks:
    knowledge: 1
    use: partial
    producibility: medium
    acceptance: low
    note: Burial clubs collect monthly dues and pay for funerals. Most clubs are banned just now.
  economic_growth_productivity:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Wealth is land, slaves and booty; Caesar's Gallic gold lowered the price of gold in Italy. Saving
      labour gains an owner little while captives are cheap.
  national_accounts_gdp:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Census property classes and provincial tax totals are the only aggregates anyone has.
  aggregate_demand_countercyclical_policy:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: low
    note: Caesar's building works, games, rent remission and veterans' bounties put money among the plebs,
      as politics. The crisis is thought of as debt and scarce coin.

  # ---- Warfare, security & deterrence
  close_order_infantry:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: 'The cohort legion at its peak: Caesar''s veterans with pilum and short sword, hard drill, career
      centurions. Caesar doubled the pay to 225 denarii a year.'
  cavalry_chariot:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: medium
    note: Rome's horse are Gallic, German, Spanish and Numidian auxiliaries. At Carrhae (53 BC) Parthian
      horse archers and armoured lancers destroyed Crassus' army. Chariots are for races and triumphs.
    elsewhere:
    - Parthia, horse archers and cataphracts
  crossbow_longbow:
    knowledge: 3
    use: partial
    producibility: medium
    acceptance: medium
    note: Cretan and Syrian archers with composite bows, Balearic slingers. The Greek belly-bow is in the
      artillery books; no hand crossbow is in service.
    elsewhere:
    - Han China, crossbow with bronze trigger as standard weapon
    - Parthia, composite bow from horseback
  torsion_artillery_trebuchet:
    knowledge: 4
    use: partial
    producibility: easy
    acceptance: high
    note: Bolt-shooters (scorpiones) and stone-throwers with sinew springs go with the legions, built to
      Greek formulae. The trebuchet is unknown here; army carpenters could build a traction one.
    elsewhere:
    - China, traction trebuchet
  oared_galley_ram:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: Quinqueremes, triremes and light liburnians, fighting by ram and boarding. Decimus Brutus beat
      Massilia's fleet for Caesar in 49 BC.
  incendiaries_greek_fire:
    knowledge: 3
    use: partial
    producibility: hard
    acceptance: medium
    note: Fire arrows, pitch, sulphur, burning tow and fire-ships, which burned Caesarian squadrons in 48
      BC. Naphtha is an eastern curiosity. No distilled fuel, no pump-and-nozzle weapon.
  field_fortification:
    knowledge: 4
    use: correct
    producibility: easy
    acceptance: high
    note: 'A ditched and palisaded camp every night. Alesia (52 BC): two rings of works with towers, pits
      and stakes; Dyrrhachium (48 BC) on a larger scale.'
  gunpowder:
    knowledge: 0
    use: none
    producibility: hard
    acceptance: medium
    note: Sulphur from Sicily and charcoal are plentiful. Saltpetre is not told apart from other salts ('nitrum'
      means soda). Incendiaries are pitch, sulphur and tow.
  cannon_artillery:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: medium
    note: Bronze founders cast large statues, so a barrel is not beyond them. Powder is the bottleneck.
  ballistics_gunnery:
    knowledge: 0
    use: none
    producibility: very-hard
    acceptance: low
  handguns_muskets:
    knowledge: 0
    use: none
