<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Rome 46 BC architectural blueprint">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#F3EFE4" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="#0E2E69"/>
  <rect width="640" height="360" fill="url(#g)"/>
  <!-- Double-tiered Roman aqueduct -->
  <g stroke="#F3EFE4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="48" y1="116" x2="380" y2="116" stroke-width="2.4"/>
    <line x1="48" y1="128" x2="380" y2="128" stroke-width="1.4"/>
    <line x1="48" y1="190" x2="380" y2="190" stroke-width="2.2"/>
    <line x1="48" y1="296" x2="592" y2="296" stroke-width="2"/>
    <!-- Upper arches -->
    <path d="M68 190 V156 A20 20 0 0 1 108 156 V190" stroke-width="2"/>
    <path d="M128 190 V156 A20 20 0 0 1 168 156 V190" stroke-width="2"/>
    <path d="M188 190 V156 A20 20 0 0 1 228 156 V190" stroke-width="2"/>
    <path d="M248 190 V156 A20 20 0 0 1 288 156 V190" stroke-width="2"/>
    <path d="M308 190 V156 A20 20 0 0 1 348 156 V190" stroke-width="2"/>
    <!-- Lower tall arches -->
    <path d="M74 296 V234 A36 36 0 0 1 146 234 V296" stroke-width="2.4"/>
    <path d="M174 296 V234 A36 36 0 0 1 246 234 V296" stroke-width="2.4"/>
    <path d="M274 296 V234 A36 36 0 0 1 346 234 V296" stroke-width="2.4"/>
  </g>
  <!-- Solar calendar & gnomon sundial (445-day year) -->
  <g stroke="#F3EFE4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="496" cy="176" r="88" stroke-width="2.2"/>
    <circle cx="496" cy="176" r="68" stroke-opacity="0.45" stroke-width="1.3"/>
    <circle cx="496" cy="176" r="42" stroke-dasharray="4 5" stroke-opacity="0.55" stroke-width="1.3"/>
    <!-- Hour / equinox ticks -->
    <line x1="496" y1="88" x2="496" y2="108" stroke-width="2"/>
    <line x1="496" y1="244" x2="496" y2="264" stroke-width="2"/>
    <line x1="408" y1="176" x2="428" y2="176" stroke-width="2"/>
    <line x1="564" y1="176" x2="584" y2="176" stroke-width="2"/>
    <line x1="434" y1="114" x2="448" y2="128" stroke-width="1.6"/>
    <line x1="558" y1="114" x2="544" y2="128" stroke-width="1.6"/>
    <line x1="434" y1="238" x2="448" y2="224" stroke-width="1.6"/>
    <line x1="558" y1="238" x2="544" y2="224" stroke-width="1.6"/>
    <!-- Amber solar gnomon -->
    <path d="M496 176 L546 116" stroke="#F5B83D" stroke-width="3"/>
    <circle cx="496" cy="176" r="7" fill="#F5B83D" stroke="none"/>
  </g>
</svg>
