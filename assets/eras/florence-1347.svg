    <path d="M492 152 C502 168 500 184 492 188 C484 184 482 168 492 152 Z" fill="#F5B83D" stroke="#F5B83D" stroke-width="1.5"/>
    <circle cx="492" cy="172" r="38" stroke="#F5B83D" stroke-opacity="0.32" stroke-dasharray="4 6" stroke-width="1.5"/>
    <circle cx="492" cy="172" r="60" stroke="#F5B83D" stroke-opacity="0.16" stroke-dasharray="3 7" stroke-width="1.2"/>
