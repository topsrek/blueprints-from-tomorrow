<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Baghdad 830 architectural blueprint">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#F3EFE4" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="#0E2E69"/>
  <rect width="640" height="360" fill="url(#g)"/>
  <!-- Abbasid House of Wisdom domes & pointed arches -->
  <g stroke="#F3EFE4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="52" y1="296" x2="588" y2="296" stroke-width="2"/>
    <!-- Central pointed dome -->
    <path d="M126 196 C126 130 174 88 216 68 C258 88 306 130 306 196" stroke-width="2.5"/>
    <path d="M168 196 C172 138 196 102 216 68 C236 102 260 138 264 196" stroke-opacity="0.45" stroke-width="1.3"/>
    <line x1="216" y1="48" x2="216" y2="68" stroke-width="2"/>
    <circle cx="216" cy="44" r="4.5" stroke="#F5B83D" stroke-width="2"/>
    <!-- Side domes -->
    <path d="M74 226 C74 188 98 168 118 158 C138 168 154 188 154 226" stroke-width="2"/>
    <path d="M278 226 C278 188 294 168 314 158 C334 168 358 188 358 226" stroke-width="2"/>
    <!-- Arcade with pointed arches -->
    <path d="M68 296 V226 H364 V296" stroke-width="2.2"/>
    <path d="M92 296 V258 Q112 234 132 258 V296" stroke-width="1.8"/>
    <path d="M162 296 V250 Q190 220 218 250 V296" stroke-width="2"/>
    <path d="M214 296 V250 Q242 220 270 250 V296" stroke-width="2"/>
    <path d="M300 296 V258 Q320 234 340 258 V296" stroke-width="1.8"/>
  </g>
  <!-- Brass Astrolabe on right -->
  <g stroke="#F3EFE4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="496" cy="70" r="14" stroke-width="2.2"/>
    <circle cx="496" cy="182" r="88" stroke-width="2.4"/>
    <circle cx="496" cy="182" r="76" stroke-opacity="0.5" stroke-width="1.3"/>
    <!-- Coordinate arcs -->
    <ellipse cx="496" cy="182" rx="76" ry="30" stroke-opacity="0.45" stroke-width="1.3"/>
    <ellipse cx="496" cy="182" rx="34" ry="76" stroke-opacity="0.45" stroke-width="1.3"/>
    <circle cx="496" cy="162" r="46" stroke-dasharray="4 5" stroke-opacity="0.5" stroke-width="1.3"/>
    <!-- Amber alidade rule -->
    <line x1="428" y1="224" x2="564" y2="140" stroke="#F5B83D" stroke-width="3"/>
    <circle cx="496" cy="182" r="6" fill="#F5B83D" stroke="none"/>
  </g>
</svg>
