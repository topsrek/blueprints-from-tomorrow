<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Any place, any year architectural blueprint">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#F3EFE4" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="#0E2E69"/>
  <rect width="640" height="360" fill="url(#g)"/>
  <!-- Wireframe Armillary Globe (left-center) -->
  <g stroke="#F3EFE4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="230" cy="180" r="108" stroke-width="2.4"/>
    <ellipse cx="230" cy="180" rx="108" ry="36" stroke-width="1.6"/>
