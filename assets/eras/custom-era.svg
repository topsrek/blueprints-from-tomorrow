    <path d="M472 128 H516 C512 148 500 162 494 172 C488 162 476 148 472 128 Z" fill="#F5B83D" fill-opacity="0.28" stroke="#F5B83D" stroke-width="1.5"/>
    <line x1="494" y1="180" x2="494" y2="246" stroke="#F5B83D" stroke-dasharray="3 4" stroke-width="2"/>
    <path d="M466 276 Q494 242 522 276 Z" fill="#F5B83D" fill-opacity="0.35" stroke="#F5B83D" stroke-width="1.5"/>
  </g>
