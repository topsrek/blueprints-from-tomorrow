    <line x1="122" y1="180" x2="338" y2="180" stroke-opacity="0.55" stroke-width="1.3"/>
    <line x1="230" y1="72" x2="230" y2="288" stroke-opacity="0.55" stroke-width="1.3"/>
    <!-- Tilted ecliptic ring -->
    <ellipse cx="230" cy="180" rx="126" ry="26" transform="rotate(-24 230 180)" stroke="#F5B83D" stroke-width="2.2"/>
  </g>
  <!-- Hourglass & Compass Rose (right) -->
